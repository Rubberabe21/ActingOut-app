<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Punch - Revision Killer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #030305;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 440px;
            max-height: 780px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: #090918;
            border: 2px solid #ff0055;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.35);
            border-radius: 14px;
        }
        #canvas-container {
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
            max-height: 560px;
            border: 2px solid #00ffcc;
            box-shadow: inset 0 0 15px rgba(0, 255, 204, 0.2);
            border-radius: 10px;
            background: #060612;
            cursor: pointer;
        }
        .exit-btn {
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            background: #1a1a2e;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }
        .exit-btn:active { transform: scale(0.96); }
    </style>
</head>
<body>

<div id="wrapper">
    <div id="canvas-container">
        <canvas id="game"></canvas>
    </div>
    <button class="exit-btn" onclick="exitGame()">◄ TORNA ALL'HUB ARCADE</button>
</div>

<script>
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
cvs.width = 380; 
cvs.height = 540;

// Caricamento Immagini Personaggi
const imgIris = new Image(); imgIris.src = 'assets/PixelPunch/iris.png';
const imgCristina = new Image(); imgCristina.src = 'assets/PixelPunch/tosatto.png';
const imgRachele = new Image(); imgRachele.src = 'assets/PixelPunch/rache.png';

// Configurazione Personaggi & Abilità Speciali
const CHARACTERS = {
    IRIS: {
        id: 'IRIS',
        name: "IRIS",
        subtitle: "IRIS, maestra dell'AI",
        perkDesc: "BONUS: Auto-Fix AI (20% risolte gratis)",
        primary: "#00ffcc",
        bg: "#06061a",
        padBg: "#120f2e",
        img: imgIris,
        baseTime: 60
    },
    CRISTINA: {
        id: 'CRISTINA',
        name: "CRISTINA",
        subtitle: "Cristina, il producer saggio",
        perkDesc: "BONUS: Caffè x2 & No Penalità Errore",
        primary: "#ffd700",
        bg: "#120e00",
        padBg: "#261a00",
        img: imgCristina,
        baseTime: 60
    },
    RACHELE: {
        id: 'RACHELE',
        name: "RACHELE",
        subtitle: "Rachele, l'inarrestabile lavoratrice",
        perkDesc: "BONUS: +5s Tempo Extra & Combo x5 Rush",
        primary: "#ff33aa",
        bg: "#140018",
        padBg: "#28002b",
        img: imgRachele,
        baseTime: 65
    }
};

let currentTheme = CHARACTERS.IRIS;

// Gestione Record Personale
let highScore = parseInt(localStorage.getItem('pixelPunch_highScore')) || 0;
let isNewRecord = false;

// Audio sintetizzato
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    
    if (type === 'hit') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'coffee') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.08);
        osc.frequency.setValueAtTime(783, audioCtx.currentTime + 0.16);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.24);
    } else if (type === 'fail') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }
}

// Stati: 'TUTORIAL', 'CHAR_SELECT', 'PLAYING', 'GAMEOVER'
let state = 'TUTORIAL';
let score = 0;
let timeLeft = 60;
let combo = 0;
let particles = [];
let floatingTexts = [];

// Notifiche (Senza Emoticon, divise su 2 righe per non uscire dai margini)
const BAD_NOTIFS = [
    { line1: "LOGO PIÙ", line2: "GRANDE!" },
    { line1: "LAVORO PER", line2: "IERI!" },
    { line1: "CAMBIA", line2: "COLORE!" },
    { line1: "ASAP", line2: "URGENTE!" }
];

// Griglia 3x3 Tasti XL
const gridPads = [
    { id: 0, x: 15,  y: 75,  w: 110, h: 140, keyLabel: "1 / Q" },
    { id: 1, x: 135, y: 75,  w: 110, h: 140, keyLabel: "2 / W" },
    { id: 2, x: 255, y: 75,  w: 110, h: 140, keyLabel: "3 / E" },

    { id: 3, x: 15,  y: 225, w: 110, h: 140, keyLabel: "4 / A" },
    { id: 4, x: 135, y: 225, w: 110, h: 140, keyLabel: "5 / S" },
    { id: 5, x: 255, y: 225, w: 110, h: 140, keyLabel: "6 / D" },

    { id: 6, x: 15,  y: 375, w: 110, h: 140, keyLabel: "7 / Z" },
    { id: 7, x: 135, y: 375, w: 110, h: 140, keyLabel: "8 / X" },
    { id: 8, x: 255, y: 375, w: 110, h: 140, keyLabel: "9 / C" }
].map(p => ({
    ...p,
    active: false,
    type: 'BAD',
    line1: '',
    line2: '',
    timer: 0,
    maxTimer: 100,
    pressAnim: 0
}));

let lastSpawnTime = 0;
let gameTimerInterval = null;

function selectCharacter(charKey) {
    currentTheme = CHARACTERS[charKey];
    cvs.style.borderColor = currentTheme.primary;
    cvs.style.boxShadow = `inset 0 0 15px ${currentTheme.primary}`;
    startMatch();
}

function startMatch() {
    state = 'PLAYING';
    score = 0;
    timeLeft = currentTheme.baseTime;
    combo = 0;
    isNewRecord = false;
    gridPads.forEach(p => p.active = false);

    if (gameTimerInterval) clearInterval(gameTimerInterval);
    gameTimerInterval = setInterval(() => {
        if (state === 'PLAYING') {
            timeLeft--;
            if (timeLeft <= 0) {
                state = 'GAMEOVER';
                playSound('coffee');
                saveScore();
                clearInterval(gameTimerInterval);
            }
        }
    }, 1000);
}

function spawnTicket() {
    let inactive = gridPads.filter(p => !p.active);
    if (inactive.length === 0) return;

    let target = inactive[Math.floor(Math.random() * inactive.length)];
    target.active = true;

    let rand = Math.random();
    let duration = 90;

    // Perk Iris: 20% di probabilità di risolvere gratis all'istante
    if (currentTheme.id === 'IRIS' && rand < 0.20 && rand >= 0.05) {
        score += 100;
        addParticles(target.x + target.w/2, target.y + target.h/2, currentTheme.primary, 8);
        addFloatText(target.x + target.w/2, target.y + target.h/2, "AI AUTO-FIX! +100", currentTheme.primary);
        target.active = false;
        return;
    }

    if (rand < 0.18) { // CAFFÈ
        target.type = 'COFFEE';
        target.line1 = "CAFFÈ";
        target.line2 = "BONUS";
    } else if (rand < 0.35) { // TRAPPOLA
        target.type = 'TRAP';
        target.line1 = "FEEDBACK";
        target.line2 = "APPROVATO";
    } else { // REVISIONE STANDARD
        target.type = 'BAD';
        let b = BAD_NOTIFS[Math.floor(Math.random() * BAD_NOTIFS.length)];
        target.line1 = b.line1;
        target.line2 = b.line2;
    }

    target.timer = duration;
    target.maxTimer = duration;
}

function hitPad(pad) {
    pad.pressAnim = 6;
    if (!pad.active) return;

    if (pad.type === 'TRAP') {
        pad.active = false;
        combo = 0;
        // Perk Cristina: Nessuna penalità sui Feedback Approvati
        let pen = (currentTheme.id === 'CRISTINA') ? 0 : 50;
        score = Math.max(0, score - pen);
        playSound('fail');
        addParticles(pad.x + pad.w/2, pad.y + pad.h/2, '#ff0055');
        addFloatText(pad.x + pad.w/2, pad.y + pad.h/2, (pen === 0 ? "SHIELD! 0 PTS" : "-50 PTS"), "#ff0055");
    } 
    else if (pad.type === 'COFFEE') {
        pad.active = false;
        combo++;
        // Perk Cristina: Caffè vale il doppio (+600)
        let pts = (currentTheme.id === 'CRISTINA') ? 600 : 300;
        score += pts;
        playSound('coffee');
        addParticles(pad.x + pad.w/2, pad.y + pad.h/2, '#ffcc00');
        addFloatText(pad.x + pad.w/2, pad.y + pad.h/2, `+${pts} CAFFÈ!`, "#ffcc00");
    } 
    else {
        pad.active = false;
        combo++;
        // Perk Rachele: Multiplicatori combo aumentati
        let comboBonus = (currentTheme.id === 'RACHELE') ? (combo * 25) : (combo > 3 ? 50 : 0);
        let pts = 100 + comboBonus;
        score += pts;
        playSound('hit');
        addParticles(pad.x + pad.w/2, pad.y + pad.h/2, currentTheme.primary);
        addFloatText(pad.x + pad.w/2, pad.y + pad.h/2, `+${pts}`, "#ffff00");
    }
}

function addParticles(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 18,
            color
        });
    }
}

function addFloatText(x, y, text, color) {
    floatingTexts.push({ x, y, text, color, alpha: 1, vy: -1.8 });
}

function update() {
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
    particles = particles.filter(p => p.life > 0);

    floatingTexts.forEach(ft => { ft.y += ft.vy; ft.alpha -= 0.025; });
    floatingTexts = floatingTexts.filter(ft => ft.alpha > 0);

    gridPads.forEach(p => { if (p.pressAnim > 0) p.pressAnim--; });

    if (state !== 'PLAYING') return;

    if (Date.now() - lastSpawnTime > 650) {
        spawnTicket();
        lastSpawnTime = Date.now();
    }

    gridPads.forEach(p => {
        if (p.active) {
            p.timer--;
            if (p.timer <= 0) {
                p.active = false;
                if (p.type === 'BAD') {
                    combo = 0;
                }
            }
        }
    });
}

function draw() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);

    ctx.fillStyle = currentTheme.bg;
    ctx.fillRect(0, 0, cvs.width, cvs.height);

    // --- SCHERMATA 1: TUTORIAL ---
    if (state === 'TUTORIAL') {
        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';
        ctx.fillText('COME SI GIOCA 🎮', cvs.width / 2, 45);

        // Card 1: Revisioni
        ctx.beginPath();
        ctx.fillStyle = '#101226';
        ctx.roundRect(20, 70, 340, 75, 10); ctx.fill();
        ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 2; ctx.stroke();
        
        ctx.fillStyle = '#ff0055'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'left';
        ctx.fillText('REVISIONI ROSSE', 35, 95);
        ctx.fillStyle = '#ffffff'; ctx.font = '11px monospace';
        ctx.fillText('Toccale SUBITO per distruggerle!', 35, 115);
        ctx.fillStyle = '#ffff00'; ctx.font = 'bold 11px monospace';
        ctx.fillText('+100 PUNTI', 35, 132);

        // Card 2: Caffè
        ctx.beginPath();
        ctx.fillStyle = '#101226';
        ctx.roundRect(20, 160, 340, 75, 10); ctx.fill();
        ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 2; ctx.stroke();
        
        ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'left';
        ctx.fillText('CAFFÈ DOPPIO', 35, 185);
        ctx.fillStyle = '#ffffff'; ctx.font = '11px monospace';
        ctx.fillText('Bevi il caffè per Punti Extra!', 35, 205);
        ctx.fillStyle = '#ffff00'; ctx.font = 'bold 11px monospace';
        ctx.fillText('+300 PUNTI', 35, 222);

        // Card 3: Trappola
        ctx.beginPath();
        ctx.fillStyle = '#101226';
        ctx.roundRect(20, 250, 340, 75, 10); ctx.fill();
        ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 2; ctx.stroke();
        
        ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'left';
        ctx.fillText('FEEDBACK OK (TRAPPOLA)', 35, 275);
        ctx.fillStyle = '#ffffff'; ctx.font = '11px monospace';
        ctx.fillText('NON TOCCARLE! Sono già approvati.', 35, 295);
        ctx.fillStyle = '#ff0055'; ctx.font = 'bold 11px monospace';
        ctx.fillText('-50 PUNTI SE LE TOCCHI', 35, 312);

        // Record
        ctx.fillStyle = '#ffff00'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
        ctx.fillText(`⏱️ TURNO 60 SECONDI | RECORD: ${highScore}`, cvs.width / 2, 360);

        // Tasto Avanti
        ctx.beginPath();
        ctx.fillStyle = '#ff0055';
        ctx.roundRect(30, 420, 320, 50, 10); ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 13px monospace';
        ctx.fillText('AVANTI: SCEGLI PERSONAGGIO ►', cvs.width / 2, 450);
        return;
    }

    // --- SCHERMATA 2: SELEZIONE PERSONAGGIO CON IMMAGINE A DESTRA ---
    if (state === 'CHAR_SELECT') {
        ctx.fillStyle = '#ffff00';
        ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
        ctx.fillText('Scegli il tuo creativo in ACTING OUT', cvs.width / 2, 40);

        const chars = [
            { key: 'IRIS', y: 70, col: '#00ffcc' },
            { key: 'CRISTINA', y: 205, col: '#ffd700' },
            { key: 'RACHELE', y: 340, col: '#ff33aa' }
        ];

        chars.forEach(b => {
            let c = CHARACTERS[b.key];
            ctx.beginPath();
            ctx.fillStyle = '#101226';
            ctx.roundRect(15, b.y, 350, 120, 12); ctx.fill();
            ctx.strokeStyle = b.col; ctx.lineWidth = 2.5; ctx.stroke();

            // Testi Personaggio (Sulla Sinistra)
            ctx.fillStyle = b.col; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'left';
            ctx.fillText(c.name, 30, b.y + 32);

            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 10px monospace';
            ctx.fillText(c.subtitle, 30, b.y + 55);

            ctx.fillStyle = '#ffff00'; ctx.font = '9px monospace';
            ctx.fillText(c.perkDesc, 30, b.y + 75);

            ctx.fillStyle = b.col; ctx.font = 'bold 11px monospace';
            ctx.fillText('SELEZIONA ►', 30, b.y + 100);

            // Immagine Personaggio (POSIZIONATA A DESTRA DELLA TAB)
            if (c.img && c.img.complete && c.img.naturalWidth !== 0) {
                ctx.save();
                ctx.beginPath();
                ctx.roundRect(255, b.y + 12, 95, 96, 10);
                ctx.clip();
                ctx.drawImage(c.img, 255, b.y + 12, 95, 96);
                ctx.restore();
                ctx.beginPath();
                ctx.roundRect(255, b.y + 12, 95, 96, 10);
                ctx.strokeStyle = b.col; ctx.lineWidth = 1.5; ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.fillStyle = b.col;
                ctx.roundRect(255, b.y + 12, 95, 96, 10); ctx.fill();
            }
        });
        return;
    }

    // --- GRIGLIA GIOCO 3x3 ---
    gridPads.forEach(p => {
        let padX = p.x;
        let padY = p.y + (p.pressAnim > 0 ? 3 : 0);

        ctx.beginPath();
        ctx.fillStyle = currentTheme.padBg;
        ctx.roundRect(padX, padY, p.w, p.h, 10); ctx.fill();
        ctx.strokeStyle = p.active ? '#ffffff' : '#2a2a50';
        ctx.lineWidth = 2; ctx.stroke();

        ctx.fillStyle = '#7777aa';
        ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
        ctx.fillText(p.keyLabel, padX + 8, padY + 16);

        if (p.active) {
            let bgCol = '#ff0055';
            let txtCol = '#ffffff';

            if (p.type === 'TRAP') { bgCol = '#00ffcc'; txtCol = '#000000'; }
            else if (p.type === 'COFFEE') { bgCol = '#ffcc00'; txtCol = '#000000'; }

            ctx.beginPath();
            ctx.fillStyle = bgCol;
            ctx.roundRect(padX + 5, padY + 22, p.w - 10, p.h - 28, 8); ctx.fill();

            let timerPct = p.timer / p.maxTimer;
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(padX + 5, padY + p.h - 10, (p.w - 10) * (1 - timerPct), 4);

            // Testo Notifica su 2 Righe (Senza Emoticon)
            ctx.fillStyle = txtCol;
            ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
            ctx.fillText(p.line1, padX + p.w / 2, padY + 68);
            ctx.fillText(p.line2, padX + p.w / 2, padY + 88);
        }
    });

    particles.forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4); });
    floatingTexts.forEach(ft => {
        ctx.save(); ctx.globalAlpha = Math.max(0, ft.alpha); ctx.fillStyle = ft.color;
        ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y); ctx.restore();
    });

    // --- HUD HEADER CON RECORD ---
    ctx.fillStyle = '#0a0a22'; ctx.fillRect(0, 0, cvs.width, 55);
    ctx.strokeStyle = currentTheme.primary; ctx.lineWidth = 1.5; ctx.strokeRect(0, 0, cvs.width, 55);

    ctx.fillStyle = currentTheme.primary; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'left';
    ctx.fillText(`${currentTheme.name}`, 10, 18);
    ctx.fillStyle = '#ffff00'; ctx.fillText(`PTS: ${score}`, 10, 34);
    ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 10px monospace';
    ctx.fillText(`REC: ${highScore}`, 10, 48);

    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'center';
    ctx.fillText(`⏱️ ${timeLeft}s`, cvs.width / 2, 33);

    if (combo > 1) {
        ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'right';
        ctx.fillText(`COMBO x${combo}!`, cvs.width - 10, 33);
    }

    // --- OVERLAY GAMEOVER & RISULTATI ---
    if (state === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(5, 5, 18, 0.95)'; ctx.fillRect(0, 0, cvs.width, cvs.height);
        
        ctx.fillStyle = currentTheme.primary; ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center';
        ctx.fillText('TURNO FINITO! ⏰', cvs.width / 2, 170);

        ctx.fillStyle = '#ffff00'; ctx.font = 'bold 18px monospace';
        ctx.fillText(`PUNTEGGIO: ${score}`, cvs.width / 2, 220);

        if (isNewRecord) {
            ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 16px monospace';
            ctx.fillText('👑 NUOVO RECORD! 👑', cvs.width / 2, 260);
        } else {
            ctx.fillStyle = '#8888aa'; ctx.font = '12px monospace';
            ctx.fillText(`RECORD ATTUALE: ${highScore}`, cvs.width / 2, 260);
        }

        ctx.fillStyle = '#ffffff'; ctx.font = '11px monospace';
        ctx.fillText('Punti registrati nel tuo Profilo!', cvs.width / 2, 295);

        ctx.fillStyle = Math.floor(Date.now() / 400) % 2 === 0 ? '#ffffff' : currentTheme.primary;
        ctx.font = 'bold 13px monospace';
        ctx.fillText('► TOCCA PER GIOCARE ANCORA ◄', cvs.width / 2, 370);
    }
}

// Touch / Pointer
cvs.addEventListener('pointerdown', (e) => {
    let rect = cvs.getBoundingClientRect();
    let x = (e.clientX - rect.left) * (cvs.width / rect.width);
    let y = (e.clientY - rect.top) * (cvs.height / rect.height);

    if (state === 'TUTORIAL') {
        if (y >= 410 && y <= 480) {
            state = 'CHAR_SELECT';
            playSound('coffee');
        }
        return;
    }

    if (state === 'CHAR_SELECT') {
        if (y >= 70 && y <= 190) selectCharacter('IRIS');
        else if (y >= 205 && y <= 325) selectCharacter('CRISTINA');
        else if (y >= 340 && y <= 460) selectCharacter('RACHELE');
        return;
    }

    if (state === 'GAMEOVER') {
        state = 'CHAR_SELECT';
        return;
    }

    gridPads.forEach(p => {
        if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) {
            hitPad(p);
        }
    });
});

// Tastiera PC
const KEY_MAP = {
    '1': 0, 'q': 0, 'Q': 0, 'Numpad7': 0,
    '2': 1, 'w': 1, 'W': 1, 'Numpad8': 1,
    '3': 2, 'e': 2, 'E': 2, 'Numpad9': 2,

    '4': 3, 'a': 3, 'A': 3, 'Numpad4': 3,
    '5': 4, 's': 4, 'S': 4, 'Numpad5': 4,
    '6': 5, 'd': 5, 'D': 5, 'Numpad6': 5,

    '7': 6, 'z': 6, 'Z': 6, 'Numpad1': 6,
    '8': 7, 'x': 7, 'X': 7, 'Numpad2': 7,
    '9': 8, 'c': 8, 'C': 8, 'Numpad3': 8
};

window.addEventListener('keydown', (e) => {
    if (state === 'TUTORIAL') {
        if (e.code === 'Space' || e.code === 'Enter') {
            state = 'CHAR_SELECT';
            playSound('coffee');
        }
        return;
    }

    if (state === 'CHAR_SELECT') {
        if (e.key === '1') selectCharacter('IRIS');
        if (e.key === '2') selectCharacter('CRISTINA');
        if (e.key === '3') selectCharacter('RACHELE');
        return;
    }

    if (state === 'GAMEOVER') {
        if (e.code === 'Space' || e.code === 'Enter') state = 'CHAR_SELECT';
        return;
    }

    let padIndex = KEY_MAP[e.key] !== undefined ? KEY_MAP[e.key] : KEY_MAP[e.code];
    if (padIndex !== undefined && gridPads[padIndex]) {
        hitPad(gridPads[padIndex]);
    }
});

function saveScore() {
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('pixelPunch_highScore', highScore);
        isNewRecord = true;
    } else {
        isNewRecord = false;
    }

    if (score <= 0) return;
    let u = JSON.parse(localStorage.getItem('arcade_current_user'));
    if (u) {
        u.stats.pixelPunch = (u.stats.pixelPunch || 0) + score;
        u.stats.gamesPlayed = (u.stats.gamesPlayed || 0) + 1;
        localStorage.setItem('arcade_current_user', JSON.stringify(u));

        if (!u.username.startsWith("GUEST_")) {
            let users = JSON.parse(localStorage.getItem('arcade_users')) || {};
            if (users[u.username]) {
                users[u.username].stats = u.stats;
                localStorage.setItem('arcade_users', JSON.stringify(users));
            }
        }
    }
}

function exitGame() {
    if (gameTimerInterval) clearInterval(gameTimerInterval);
    saveScore();
    window.location.href = 'index.html';
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
