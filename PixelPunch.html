<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060212">
<title>Pixel Punch - Revision Killer - Agency Arcade</title>
<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent !important;
    -webkit-focus-ring-color: transparent !important;
    outline: none !important;
    touch-action: manipulation;
    font-family: 'Courier New', Courier, monospace;
  }
  html {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #060212 !important;
    overflow: hidden;
  }
  body {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #060212 !important;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #wrapper {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100vw;
    height: 100svh;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: max(env(safe-area-inset-top), 6px) 8px max(env(safe-area-inset-bottom), 8px) 8px;
    background: #060212 !important;
    overflow: hidden;
  }

  .top-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 6px;
    margin-bottom: 2px;
    flex-shrink: 0;
  }
  .header-title {
    color: #ff0055 !important;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 0 6px #ff0055 !important;
    letter-spacing: 1px;
    flex: 1;
  }
  .header-btns-right {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .opt-btn {
    background: #1a0836;
    border: 1.5px solid #ffea00 !important;
    color: #ffea00 !important;
    padding: 5px 10px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(255, 234, 0, 0.4) !important;
  }
  .opt-btn:active { transform: scale(0.92); }

  #btnExitTop {
    border-color: #ff007f !important;
    color: #ff007f !important;
    box-shadow: 0 0 8px rgba(255, 0, 127, 0.3) !important;
  }

  #canvas-container {
    width: 100%;
    flex: 1 1 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    min-height: 0;
    margin: 2px 0;
  }
  canvas {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    aspect-ratio: 380 / 540;
    border: 2px solid #00ffcc !important;
    box-shadow: 0 0 15px rgba(0, 255, 204, 0.3) !important;
    border-radius: 10px;
    background: #060612;
    cursor: pointer;
  }

  .modal-overlay {
    display: none;
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(6, 2, 18, 0.95);
    z-index: 200;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }
  .modal-box {
    width: 100%;
    max-width: 320px;
    background: #0e051b;
    border: 3px solid #ff0055 !important;
    box-shadow: 0 0 25px rgba(255, 0, 85, 0.5) !important;
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    color: #ffffff;
    text-align: center;
  }
  .modal-title {
    color: #ffea00;
    font-size: 16px;
    font-weight: 900;
    text-shadow: 0 0 8px #ffea00;
  }
  .option-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: #160a2c;
    padding: 10px;
    border: 1px solid rgba(0, 255, 204, 0.4);
    border-radius: 8px;
  }
  .option-label {
    font-size: 11px;
    font-weight: bold;
    color: #00ffcc !important;
  }
  .toggle-btn {
    width: 100%;
    padding: 8px;
    background: #2a144a;
    border: 2px solid #ff0055;
    color: #ffffff;
    font-weight: bold;
    font-size: 13px;
    border-radius: 6px;
    cursor: pointer;
  }
  .toggle-btn.active {
    border-color: #00ff66;
    color: #00ff66;
    background: #082814;
    box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
  }
  .close-modal-btn {
    padding: 10px;
    background: linear-gradient(180deg, #ff0055, #a3003b);
    border: 2px solid #ffffff;
    color: #ffffff;
    font-weight: bold;
    font-size: 12px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(255, 0, 85, 0.5);
  }
</style>
</head>
<body>

<audio id="bgMusic" src="assets/PixelPunch/music_punch.mp3" loop autoplay playsinline style="display:none;"></audio>

<div id="wrapper">
  <div class="top-header">
    <span class="header-title">PIXEL PUNCH</span>
    <div class="header-btns-right">
      <button class="opt-btn" id="btnExitTop">◄ ESCI</button>
      <button class="opt-btn" id="btnOpenSettings">⚙️ OPZIONI</button>
    </div>

    <canvas id="game"></canvas>
  </div>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box">
      <div class="modal-title">⚙️ OPZIONI GIOCO</div>

      <div class="option-item">
        <span class="option-label">MUSICA DI SOTTOFONDO</span>
        <button class="toggle-btn active" id="btnToggleMusic">ON 🎵</button>
      </div>

      <div class="option-item">
        <span class="option-label">EFFETTI SONORI (SFX)</span>
        <button class="toggle-btn active" id="btnToggleSfx">ON 🔊</button>
      </div>

      <button class="close-modal-btn" id="btnCloseSettings">SALVA E CHIUDI ►</button>
    </div>
  </div>
</div>

<script>
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
cvs.width = 380; 
cvs.height = 540;

function drawRoundRect(c, x, y, w, h, r) {
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// AUDIO AUTOPLAY CONFIGURATION
let musicEnabled = localStorage.getItem('pixelPunch_music') !== 'false';
let sfxEnabled = localStorage.getItem('pixelPunch_sfx') !== 'false';

const bgMusic = document.getElementById('bgMusic');
bgMusic.volume = 0.4;

function playBgMusic() {
  if (musicEnabled && bgMusic.paused) {
    let p = bgMusic.play();
    if (p !== undefined) p.catch(() => {});
  }
}

playBgMusic();
window.addEventListener('DOMContentLoaded', playBgMusic);
window.addEventListener('load', playBgMusic);
['pointerdown', 'touchstart', 'mousedown', 'keydown', 'click'].forEach(evt => {
  window.addEventListener(evt, playBgMusic, { once: true, capture: true });
});

function updateMusicState() {
  if (musicEnabled) {
    playBgMusic();
  } else {
    bgMusic.pause();
  }
}

const settingsModal = document.getElementById('settingsModal');
const btnOpenSettings = document.getElementById('btnOpenSettings');
const btnCloseSettings = document.getElementById('btnCloseSettings');
const btnExitTop = document.getElementById('btnExitTop');
const btnToggleMusic = document.getElementById('btnToggleMusic');
const btnToggleSfx = document.getElementById('btnToggleSfx');

function renderOptionButtons() {
  btnToggleMusic.className = `toggle-btn ${musicEnabled ? 'active' : ''}`;
  btnToggleMusic.innerText = musicEnabled ? 'ON 🎵' : 'OFF 🔇';

  btnToggleSfx.className = `toggle-btn ${sfxEnabled ? 'active' : ''}`;
  btnToggleSfx.innerText = sfxEnabled ? 'ON 🔊' : 'OFF 🔇';
}
renderOptionButtons();

btnToggleMusic.onclick = () => {
  musicEnabled = !musicEnabled;
  localStorage.setItem('pixelPunch_music', musicEnabled);
  renderOptionButtons();
  updateMusicState();
};

btnToggleSfx.onclick = () => {
  sfxEnabled = !sfxEnabled;
  localStorage.setItem('pixelPunch_sfx', sfxEnabled);
  renderOptionButtons();
};

btnOpenSettings.onclick = () => {
  if (state === 'PLAYING') {
    state = 'PAUSE';
    updateMusicState();
  }
  settingsModal.style.display = 'flex';
};

btnCloseSettings.onclick = () => {
  settingsModal.style.display = 'none';
  getAC();
  if (state === 'PAUSE') {
    state = 'PLAYING';
  }
  updateMusicState();
};

btnExitTop.onclick = () => {
  getAC();
  exitGame();
};

// PRELOAD ASSETS
const ASSETS = {
  COVER: new Image(),
  IRIS: new Image(),
  CRISTINA: new Image(),
  RACHELE: new Image(),
  BOMBA: new Image(),
  FUOCO: new Image(),
  SCARPA: new Image(),
  CAFFE: new Image()
};

ASSETS.COVER.src = 'assets/PixelPunch/copertina.png';
ASSETS.IRIS.src = 'assets/PixelPunch/Iris.png';
ASSETS.CRISTINA.src = 'assets/PixelPunch/tosatto.png';
ASSETS.RACHELE.src = 'assets/PixelPunch/rache.png';

ASSETS.BOMBA.src = 'assets/pacman/bomba.png';
ASSETS.FUOCO.src = 'assets/pacman/fuoco.png';
ASSETS.SCARPA.src = 'assets/pacman/scarpa.png';
ASSETS.CAFFE.src = 'assets/pacman/caffe.png';

// PRODUCER CHARACTERS
const CHARACTERS = {
    IRIS: {
        id: 'IRIS',
        name: "IRIS",
        subtitle: "Iris, la maestra dell'AI",
        perkBonusTitle: "BONUS: Auto-Fix AI",
        perkBonusDesc: "Auto-Risoluzione & Ferie 7s",
        primary: "#00ffcc",
        bg: "#06061a",
        padBg: "#120f2e",
        img: ASSETS.IRIS,
        ferieSec: 7
    },
    CRISTINA: {
        id: 'CRISTINA',
        name: "CRISTINA",
        subtitle: "Cristina, la producer sagace",
        perkBonusTitle: "BONUS: Caffè x2 Extra",
        perkBonusDesc: "Punti Doppi & Ferie 10s",
        primary: "#ffd700",
        bg: "#120e00",
        padBg: "#261a00",
        img: ASSETS.CRISTINA,
        ferieSec: 10
    },
    RACHELE: {
        id: 'RACHELE',
        name: "RACHELE",
        subtitle: "Rachele, l'inarrestabile",
        perkBonusTitle: "BONUS: Super Ferie & Rush",
        perkBonusDesc: "15s Relax & Combo Boost",
        primary: "#ff33aa",
        bg: "#140018",
        padBg: "#28002b",
        img: ASSETS.RACHELE,
        ferieSec: 15
    }
};

const charList = ['IRIS', 'CRISTINA', 'RACHELE'];
let charSelectIndex = 0;
let currentTheme = CHARACTERS.IRIS;
let highScore = parseInt(localStorage.getItem('pixelPunch_highScore')) || 0;
let isNewRecord = false;

// SYNTHESIZED SFX
let audioCtx = null;
function getAC() {
    try {
        if (!audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    } catch(e) {}
    playBgMusic();
    return audioCtx;
}

function playSound(type) {
    if (!sfxEnabled) return;
    try {
        const ac = getAC();
        if (!ac) return;
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.connect(gain); gain.connect(ac.destination);
        
        if (type === 'hit') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, ac.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, ac.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, ac.currentTime);
            osc.start(); osc.stop(ac.currentTime + 0.1);
        } else if (type === 'hit_double') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, ac.currentTime);
            osc.frequency.exponentialRampToValueAtTime(250, ac.currentTime + 0.12);
            gain.gain.setValueAtTime(0.25, ac.currentTime);
            osc.start(); osc.stop(ac.currentTime + 0.12);
        } else if (type === 'coffee') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523, ac.currentTime);
            osc.frequency.setValueAtTime(659, ac.currentTime + 0.08);
            osc.frequency.setValueAtTime(783, ac.currentTime + 0.16);
            gain.gain.setValueAtTime(0.2, ac.currentTime);
            osc.start(); osc.stop(ac.currentTime + 0.24);
        } else if (type === 'golden') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(659, ac.currentTime);
            osc.frequency.setValueAtTime(880, ac.currentTime + 0.1);
            osc.frequency.setValueAtTime(1046, ac.currentTime + 0.2);
            gain.gain.setValueAtTime(0.25, ac.currentTime);
            osc.start(); osc.stop(ac.currentTime + 0.3);
        } else if (type === 'fail') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, ac.currentTime);
            osc.frequency.linearRampToValueAtTime(60, ac.currentTime + 0.2);
            gain.gain.setValueAtTime(0.25, ac.currentTime);
            osc.start(); osc.stop(ac.currentTime + 0.2);
        }
    } catch(e) {}
}

// GAME MECHANICS & STATES
let state = 'COVER'; 
let score = 0;
let combo = 0;
let stress = 0;
let elapsedMatchTime = 0;
let frame = 0;

let ferieActive = false;
let ferieTimer = 0;

let particles = [];
let floatingTexts = [];

const BAD_NOTIFS = [
    { line1: "LOGO PIÙ", line2: "GRANDE!" },
    { line1: "LAVORO PER", line2: "IERI!" },
    { line1: "CAMBIA", line2: "COLORE!" },
    { line1: "ASAP", line2: "URGENTE!" },
    { line1: "PROVA CON", line2: "VERDE!" },
    { line1: "FONTS PIÙ", line2: "LEGGIBILE!" }
];

const gridPads = [
    { id: 0, x: 15,  y: 85,  w: 110, h: 135, keyLabel: "1 / Q" },
    { id: 1, x: 135, y: 85,  w: 110, h: 135, keyLabel: "2 / W" },
    { id: 2, x: 255, y: 85,  w: 110, h: 135, keyLabel: "3 / E" },

    { id: 3, x: 15,  y: 230, w: 110, h: 135, keyLabel: "4 / A" },
    { id: 4, x: 135, y: 230, w: 110, h: 135, keyLabel: "5 / S" },
    { id: 5, x: 255, y: 230, w: 110, h: 135, keyLabel: "6 / D" },

    { id: 6, x: 15,  y: 375, w: 110, h: 135, keyLabel: "7 / Z" },
    { id: 7, x: 135, y: 375, w: 110, h: 135, keyLabel: "8 / X" },
    { id: 8, x: 255, y: 375, w: 110, h: 135, keyLabel: "9 / C" }
].map(p => ({
    ...p,
    active: false,
    type: 'BAD',
    hp: 1,
    line1: '',
    line2: '',
    timer: 0,
    maxTimer: 100,
    pressAnim: 0
}));

let lastSpawnTime = 0;
let gameTimerInterval = null;

function selectCharacter(charKey) {
    currentTheme = CHARACTERS[charKey];
    cvs.style.borderColor = currentTheme.primary;
    cvs.style.boxShadow = `inset 0 0 15px ${currentTheme.primary}`;
    startMatch();
}

function startMatch() {
    state = 'PLAYING';
    score = 0;
    stress = 0;
    combo = 0;
    elapsedMatchTime = 0;
    
    ferieActive = false;
    ferieTimer = 0;

    isNewRecord = false;
    gridPads.forEach(p => p.active = false);

    if (gameTimerInterval) clearInterval(gameTimerInterval);
    gameTimerInterval = setInterval(() => {
        if (state === 'PLAYING') {
            elapsedMatchTime++;

            if (ferieActive) {
                ferieTimer--;
                stress = Math.max(0, stress - 1.5);
                if (ferieTimer <= 0) {
                    ferieActive = false;
                }
            } else {
                stress = Math.min(100, stress + 0.3 + (elapsedMatchTime * 0.012));
            }

            if (stress >= 100) {
                state = 'GAMEOVER';
                playSound('fail');
                saveScore();
                clearInterval(gameTimerInterval);
            }
        }
    }, 1000);
}

function spawnTicket() {
    if (ferieActive) return;

    let inactive = gridPads.filter(p => !p.active);
    if (inactive.length === 0) return;

    let activeCount = gridPads.filter(p => p.active).length;
    let maxAllowed = 1;
    if (elapsedMatchTime > 12) maxAllowed = 2;
    if (elapsedMatchTime > 30) maxAllowed = 3;
    if (elapsedMatchTime > 55) maxAllowed = 4;

    if (activeCount >= maxAllowed) return;

    let target = inactive[Math.floor(Math.random() * inactive.length)];
    target.active = true;

    let rand = Math.random();
    let duration = Math.max(60, 150 - Math.floor(elapsedMatchTime * 1.5));

    if (currentTheme.id === 'IRIS' && rand < 0.20 && rand >= 0.05) {
        score += 100;
        stress = Math.max(0, stress - 2);
        addParticles(target.x + target.w/2, target.y + target.h/2, currentTheme.primary, 8);
        addFloatText(target.x + target.w/2, target.y + target.h/2, "AI AUTO-FIX! +100", currentTheme.primary);
        target.active = false;
        return;
    }

    if (rand < 0.10) {
        target.type = 'FERIE';
        target.hp = 1;
        target.line1 = "FERIE 🌴";
        target.line2 = "RELAX!";
    } else if (rand < 0.22) {
        target.type = 'COFFEE';
        target.hp = 1;
        target.line1 = "CAFFÈ";
        target.line2 = "BONUS";
    } else if (rand < 0.32) {
        target.type = 'GOLDEN';
        target.hp = 1;
        target.line1 = "CLIENTE VIP";
        target.line2 = "SPECIALE";
    } else if (rand < 0.46) {
        target.type = 'TRAP';
        target.hp = 1;
        target.line1 = "FEEDBACK";
        target.line2 = "APPROVATO";
    } else if (rand < 0.55) {
        target.type = 'GLITCH';
        target.hp = 1;
        target.line1 = "FILE";
        target.line2 = "CORROTTO";
    } else if (rand < 0.72) {
        target.type = 'DOUBLE';
        target.hp = 2;
        target.line1 = "REVISIONE";
        target.line2 = "DOPPIA (2x)";
    } else {
        target.type = 'BAD';
        target.hp = 1;
        let b = BAD_NOTIFS[Math.floor(Math.random() * BAD_NOTIFS.length)];
        target.line1 = b.line1;
        target.line2 = b.line2;
    }

    target.timer = duration;
    target.maxTimer = duration;
}

function hitPad(pad) {
    pad.pressAnim = 6;
    if (!pad.active) return;

    if (pad.type === 'FERIE') {
        pad.active = false;
        ferieActive = true;
        ferieTimer = currentTheme.ferieSec;
        stress = Math.max(0, stress - 20);
        playSound('golden');
        
        gridPads.forEach(p => p.active = false);
        addParticles(pad.x + pad.w/2, pad.y + pad.h/2, '#00ffcc', 18);
        addFloatText(pad.x + pad.w/2, pad.y + pad.h/2, `🌴 FERIE RELAX (${currentTheme.ferieSec}s)!`, "#00ffcc");
    }
    else if (pad.type === 'TRAP') {
        pad.active = false;
        combo = 0;
        let pen = (currentTheme.id === 'CRISTINA') ? 0 : 50;
        score = Math.max(0, score - pen);
        if (currentTheme.id !== 'CRISTINA') stress = Math.min(100, stress + 8);
        playSound('fail');
        addParticles(pad.x + pad.w/2, pad.y + pad.h/2, '#00ffcc');
        addFloatText(pad.x + pad.w/2, pad.y + pad.h/2, (pen === 0 ? "NO PENALTY!" : "-50 PTS"), "#00ffcc");
    } 
    else if (pad.type === 'GLITCH') {
        pad.active = false;
        combo = 0;
        score = Math.max(0, score - 100);
        stress = Math.min(100, stress + 12);
        playSound('fail');
        addParticles(pad.x + pad.w/2, pad.y + pad.h/2, '#ff0055');
        addFloatText(pad.x + pad.w/2, pad.y + pad.h/2, "GLITCH! +12% STRESS", "#ff0055");
    }
    else if (pad.type === 'COFFEE') {
        pad.active = false;
        combo++;
        let pts = (currentTheme.id === 'CRISTINA') ? 600 : 300;
        score += pts;
        stress = Math.max(0, stress - (currentTheme.id === 'CRISTINA' ? 12 : 8));
        playSound('coffee');
        addParticles(pad.x + pad.w/2, pad.y + pad.h/2, '#ffcc00');
        addFloatText(pad.x + pad.w/2, pad.y + pad.h/2, `+${pts} CAFFÈ!`, "#ffcc00");
    } 
    else if (pad.type === 'GOLDEN') {
        pad.active = false;
        combo++;
        score += 500;
        stress = Math.max(0, stress - 15);
        playSound('golden');
        addParticles(pad.x + pad.w/2, pad.y + pad.h/2, '#ffd700', 16);
        addFloatText(pad.x + pad.w/2, pad.y + pad.h/2, "+500 PTS VIP!", "#ffd700");
    }
    else if (pad.type === 'DOUBLE') {
        pad.hp--;
        playSound('hit_double');
        if (pad.hp <= 0) {
            pad.active = false;
            combo++;
            let pts = 250;
            score += pts;
            stress = Math.max(0, stress - 4);
            addParticles(pad.x + pad.w/2, pad.y + pad.h/2, '#aa00ff', 12);
            addFloatText(pad.x + pad.w/2, pad.y + pad.h/2, `+${pts} RISOLTA!`, "#aa00ff");
        } else {
            addParticles(pad.x + pad.w/2, pad.y + pad.h/2, '#ffaa00', 6);
            addFloatText(pad.x + pad.w/2, pad.y + pad.h/2, "1 ANCORA!", "#ffaa00");
        }
    }
    else {
        pad.active = false;
        combo++;
        let comboBonus = (currentTheme.id === 'RACHELE') ? (combo * 25) : (combo > 3 ? 50 : 0);
        let pts = 100 + comboBonus;
        score += pts;
        stress = Math.max(0, stress - 2);
        playSound('hit');
        addParticles(pad.x + pad.w/2, pad.y + pad.h/2, currentTheme.primary);
        addFloatText(pad.x + pad.w/2, pad.y + pad.h/2, `+${pts}`, "#ffff00");
    }
}

function addParticles(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 18,
            color
        });
    }
}

function addFloatText(x, y, text, color) {
    floatingTexts.push({ x, y, text, color, alpha: 1, vy: -1.8 });
}

function update() {
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
    particles = particles.filter(p => p.life > 0);

    floatingTexts.forEach(ft => { ft.y += ft.vy; ft.alpha -= 0.025; });
    floatingTexts = floatingTexts.filter(ft => ft.alpha > 0);

    gridPads.forEach(p => { if (p.pressAnim > 0) p.pressAnim--; });

    if (state !== 'PLAYING') return;

    let spawnDelay = Math.max(400, 1150 - Math.floor(elapsedMatchTime * 12));
    if (Date.now() - lastSpawnTime > spawnDelay) {
        spawnTicket();
        lastSpawnTime = Date.now();
    }

    gridPads.forEach(p => {
        if (p.active) {
            p.timer--;
            if (p.timer <= 0) {
                p.active = false;
                if (p.type === 'BAD' || p.type === 'DOUBLE') {
                    combo = 0;
                    stress = Math.min(100, stress + 7);
                }
            }
        }
    });
}

function draw() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);

    ctx.fillStyle = currentTheme.bg;
    ctx.fillRect(0, 0, cvs.width, cvs.height);

    const W = cvs.width, H = cvs.height;

    // --- PAGINA 1: COPERTINA ---
    if (state === 'COVER') {
        if (ASSETS.COVER && ASSETS.COVER.complete && ASSETS.COVER.naturalWidth !== 0) {
            ctx.drawImage(ASSETS.COVER, 0, 0, W, H);
        } else {
            ctx.fillStyle = '#060212'; ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#ff0055'; ctx.font = '900 28px Courier New'; ctx.textAlign = 'center';
            ctx.fillText('PIXEL PUNCH', W / 2, 200);
            ctx.fillStyle = '#ffea00'; ctx.font = 'bold 16px Courier New';
            ctx.fillText('REVISION KILLER', W / 2, 240);
        }

        if (Math.floor(frame / 45) % 2 === 0) {
            ctx.fillStyle = '#00ffcc'; ctx.font = '900 16px Courier New'; ctx.textAlign = 'center';
            ctx.fillText('TOCCA PER INIZIARE ►', W / 2, H - 35);
        }
        return;
    }

    // --- PAGINA 2: STORIA AVVINCENTE DELLE PRODUCER ---
    if (state === 'STORY') {
        ctx.fillStyle = 'rgba(6, 6, 20, 0.98)'; ctx.fillRect(0, 0, W, H);
        
        ctx.fillStyle = '#ffea00'; ctx.font = '900 26px Courier New'; ctx.textAlign = 'center';
        ctx.fillText('LA STORIA', W / 2, 48);

        ctx.beginPath(); ctx.fillStyle = '#120a28'; ctx.roundRect(10, 15, W - 20, H - 30, 12); ctx.fill();
        ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 2.5; ctx.stroke();

        ctx.fillStyle = '#ff0055'; ctx.font = 'bold 16px Courier New'; ctx.textAlign = 'center';
        ctx.fillText('Iris, Cristina e Rachele:', W / 2, 85);
        ctx.fillText('Le inarrestabili Producer!', W / 2, 107);
        
        ctx.fillStyle = '#ffffff'; ctx.font = '13px Courier New';
        ctx.fillText('Tra clienti esigenti che chiedono', W / 2, 142);
        ctx.fillText('"il logo più grande", mail urgenti,', W / 2, 162);
        ctx.fillText('e modifiche dell\'ultimo secondo,', W / 2, 182);
        ctx.fillText('lo stress nello studio sta per', W / 2, 202);
        ctx.fillText('esplodere in un Burnout totale!', W / 2, 222);

        ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 15px Courier New';
        ctx.fillText('Metti K.O. le revisioni,', W / 2, 260);
        ctx.fillText('gestisci il flusso dei ticket', W / 2, 282);
        ctx.fillText('e conquista le meritate FERIE!', W / 2, 304);

        if (Math.floor(frame / 40) % 2 === 0) {
            ctx.fillStyle = '#ffea00'; ctx.font = '900 18px Courier New'; ctx.textAlign = 'center';
            ctx.fillText('CONTINUA ►', W / 2, 388);
        }
        return;
    }

    // --- PAGINA 3: REGOLE E TUTORIAL MOLTO CHIARO CON ESEMPI ---
    if (state === 'RULES') {
        ctx.fillStyle = 'rgba(6, 6, 20, 0.98)'; ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = '#00ffcc'; ctx.font = '900 24px Courier New'; ctx.textAlign = 'center';
        ctx.fillText('REGOLE DI GIOCO 🥊', W / 2, 45);

        ctx.beginPath(); ctx.fillStyle = '#101228'; ctx.roundRect(10, 15, W - 20, H - 30, 12); ctx.fill();
        ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2.5; ctx.stroke();

        ctx.textAlign = 'center';

        // 1. OBIETTIVO
        ctx.fillStyle = '#ff0055'; ctx.font = '900 15px Courier New';
        ctx.fillText('1. OBIETTIVO: EVITA IL BURNOUT!', W / 2, 76);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px Courier New';
        ctx.fillText('• Risolvi i ticket prima che scadano.', W / 2, 95);
        ctx.fillText('• Ogni ticket scaduto fa salire lo STRESS.', W / 2, 112);
        ctx.fillStyle = '#ffff00'; ctx.font = 'bold 12px Courier New';
        ctx.fillText('• Al 100% di Stress hai PERSO!', W / 2, 129);

        // 2. TICKET BUONI
        ctx.fillStyle = '#00ffcc'; ctx.font = '900 15px Courier New';
        ctx.fillText('2. TICKET BUONI (DA PREMERE)', W / 2, 160);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px Courier New';
        ctx.fillText('• 🔴 ROSSI: 1 Tap (+100 PTS, es. "LOGO GRANDE")', W / 2, 178);
        ctx.fillText('• 🟣 VIOLA: 2 Tap veloci (+250 PTS)', W / 2, 195);
        ctx.fillText('• ☕ CAFFÈ / 🌟 VIP: +300/500 PTS e -Stress', W / 2, 212);
        ctx.fillText('• 🌴 FERIE: Blocca il gioco e dà RELAX!', W / 2, 229);

        // 3. TRAPPOLE
        ctx.fillStyle = '#ff0055'; ctx.font = '900 15px Courier New';
        ctx.fillText('3. ATTENTO ALLE TRAPPOLE! ⚠️', W / 2, 260);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px Courier New';
        ctx.fillText('• 🟢 VERDE ("APPROVATO") & 🖤 NERO ("CORROTTO")', W / 2, 278);
        ctx.fillText('• NON toccarli! Tolgono punti e +Stress!', W / 2, 295);

        // 4. CONTROLLI GUIDA
        ctx.fillStyle = '#ffd700'; ctx.font = '900 14px Courier New';
        ctx.fillText('4. CONTROLLI GUIDA', W / 2, 325);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px Courier New';
        ctx.fillText('• Touch (1-9) oppure Tastiera (QWE / 1-9)', W / 2, 342);

        if (Math.floor(Date.now() / 400) % 2 === 0) {
            ctx.fillStyle = '#ffea00'; ctx.font = '900 18px Courier New';
            ctx.fillText('CONTINUA ►', W / 2, 388);
        }
        return;
    }

    // --- PAGINA 4: SELEZIONE PERSONAGGIO ---
    if (state === 'CHAR_SELECT') {
        ctx.fillStyle = 'rgba(6, 6, 20, 0.98)'; ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = '#ffff00'; ctx.font = '900 20px Courier New'; ctx.textAlign = 'center';
        ctx.fillText('SCEGLI LA TUA PRODUCER 🥊', W / 2, 42);

        let key = charList[charSelectIndex];
        let c = CHARACTERS[key];

        ctx.beginPath(); ctx.fillStyle = '#101228'; ctx.roundRect(10, 15, W - 20, H - 30, 14); ctx.fill();
        ctx.strokeStyle = c.primary; ctx.lineWidth = 3; ctx.stroke();

        if (c.img && c.img.complete && c.img.naturalWidth > 0) {
            ctx.save();
            ctx.beginPath(); ctx.roundRect(W / 2 - 70, 58, 140, 125, 12); ctx.clip();
            ctx.drawImage(c.img, W / 2 - 70, 58, 140, 125);
            ctx.restore();
            ctx.beginPath(); ctx.roundRect(W / 2 - 70, 58, 140, 125, 12);
            ctx.strokeStyle = c.primary; ctx.lineWidth = 2.5; ctx.stroke();
        }

        ctx.fillStyle = c.primary; ctx.font = '900 26px Courier New'; ctx.textAlign = 'center';
        ctx.fillText(c.name, W / 2, 210);

        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 13px Courier New';
        ctx.fillText(c.subtitle, W / 2, 232);

        ctx.fillStyle = '#ffff00'; ctx.font = '900 15px Courier New';
        ctx.fillText(c.perkBonusTitle, W / 2, 268);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 13px Courier New';
        ctx.fillText(c.perkBonusDesc, W / 2, 288);

        ctx.fillStyle = '#ffea00'; ctx.font = '900 36px Courier New';
        ctx.fillText('◄', 28, 175);
        ctx.fillText('►', W - 28, 175);

        if (Math.floor(Date.now() / 400) % 2 === 0) {
            ctx.fillStyle = c.primary; ctx.font = '900 18px Courier New';
            ctx.fillText('INIZIA PARTITA ►', W / 2, 388);
        }
        return;
    }

    // --- GRIGLIA GIOCO 3x3 ---
    gridPads.forEach(p => {
        let padX = p.x;
        let padY = p.y + (p.pressAnim > 0 ? 3 : 0);

        ctx.beginPath();
        ctx.fillStyle = currentTheme.padBg;
        drawRoundRect(ctx, padX, padY, p.w, p.h, 10); ctx.fill();
        ctx.strokeStyle = p.active ? '#ffffff' : '#2a2a50';
        ctx.lineWidth = 2; ctx.stroke();

        ctx.fillStyle = '#7777aa';
        ctx.font = 'bold 10px Courier New'; ctx.textAlign = 'left';
        ctx.fillText(p.keyLabel, padX + 8, padY + 16);

        if (p.active) {
            let bgCol = '#ff0055';
            let txtCol = '#ffffff';

            if (p.type === 'FERIE') { bgCol = '#00ffcc'; txtCol = '#000000'; }
            else if (p.type === 'TRAP') { bgCol = '#00ffcc'; txtCol = '#000000'; }
            else if (p.type === 'GLITCH') { bgCol = '#1a0008'; txtCol = '#ff0055'; }
            else if (p.type === 'COFFEE') { bgCol = '#ffcc00'; txtCol = '#000000'; }
            else if (p.type === 'GOLDEN') { bgCol = '#ffd700'; txtCol = '#000000'; }
            else if (p.type === 'DOUBLE') { bgCol = '#aa00ff'; txtCol = '#ffffff'; }

            drawRoundRect(ctx, padX + 5, padY + 22, p.w - 10, p.h - 28, 8);
            ctx.fillStyle = bgCol; ctx.fill();
            if (p.type === 'GOLDEN' || p.type === 'GLITCH' || p.type === 'FERIE') {
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
            }

            let timerPct = p.timer / p.maxTimer;
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(padX + 5, padY + p.h - 10, (p.w - 10) * (1 - timerPct), 4);

            ctx.fillStyle = txtCol;
            ctx.font = 'bold 11px Courier New'; ctx.textAlign = 'center';
            ctx.fillText(p.line1, padX + p.w / 2, padY + 68);
            ctx.fillText(p.line2, padX + p.w / 2, padY + 86);
        }
    });

    particles.forEach(p => { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4); });
    floatingTexts.forEach(ft => {
        ctx.save(); ctx.globalAlpha = Math.max(0, ft.alpha); ctx.fillStyle = ft.color;
        ctx.font = 'bold 13px Courier New'; ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y); ctx.restore();
    });

    // BANNER FERIE RELAX
    if (ferieActive) {
        drawRoundRect(ctx, 30, 240, 320, 60, 12);
        ctx.fillStyle = 'rgba(0, 255, 204, 0.92)'; ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#000000'; ctx.font = 'bold 15px Courier New'; ctx.textAlign = 'center';
        ctx.fillText('🌴 IN FERIE RELAX... 🌴', cvs.width / 2, 266);
        ctx.font = 'bold 12px Courier New';
        ctx.fillText(`PAUSA REVISIONI (${ferieTimer}s)`, cvs.width / 2, 286);
    }

    // --- HUD HEADER CON BARRA STRESS ---
    ctx.fillStyle = '#0a0a22'; ctx.fillRect(0, 0, cvs.width, 74);
    ctx.strokeStyle = currentTheme.primary; ctx.lineWidth = 1.5; ctx.strokeRect(0, 0, cvs.width, 74);

    ctx.fillStyle = currentTheme.primary; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'left';
    ctx.fillText(`${currentTheme.name}`, 10, 18);
    ctx.fillStyle = '#ffff00'; ctx.font = 'bold 12px Courier New';
    ctx.fillText(`PTS: ${score}`, 10, 34);
    ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 10px Courier New';
    ctx.fillText(`REC: ${highScore}`, 10, 48);

    if (combo > 1) {
        ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 11px Courier New'; ctx.textAlign = 'right';
        ctx.fillText(`COMBO x${combo}!`, cvs.width - 10, 18);
    }

    let stressWidth = 360;
    let stressX = 10;
    let stressY = 52;
    ctx.fillStyle = '#101028';
    ctx.fillRect(stressX, stressY, stressWidth, 16);
    
    let currentStressPct = Math.min(100, Math.max(0, stress)) / 100;
    let stressCol = currentStressPct < 0.4 ? '#00ffcc' : (currentStressPct < 0.75 ? '#ffcc00' : '#ff0055');
    
    if (currentStressPct >= 0.75 && Math.floor(Date.now() / 200) % 2 === 0) {
        stressCol = '#ffffff';
    }

    ctx.fillStyle = stressCol;
    ctx.fillRect(stressX + 1, stressY + 1, (stressWidth - 2) * currentStressPct, 14);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
    ctx.strokeRect(stressX, stressY, stressWidth, 16);

    ctx.fillStyle = '#000000'; ctx.font = 'bold 10px Courier New'; ctx.textAlign = 'center';
    ctx.fillText(`⚡ LIVELLO STRESS: ${Math.floor(stress)}%`, cvs.width / 2, stressY + 12);

    // --- SCHERMATA PAUSA ---
    if (state === 'PAUSE') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillRect(0, 0, cvs.width, cvs.height);
        ctx.fillStyle = '#ffea00'; ctx.font = '900 32px Courier New'; ctx.textAlign = 'center';
        ctx.fillText('IN PAUSA', cvs.width / 2, cvs.height / 2 - 15);
        ctx.fillStyle = '#00f0ff'; ctx.font = 'bold 13px Courier New';
        ctx.fillText('TOCCA IL GIOCO PER RIPRENDERE', cvs.width / 2, cvs.height / 2 + 20);
    }

    // --- OVERLAY GAMEOVER ---
    if (state === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(5, 5, 18, 0.95)'; ctx.fillRect(0, 0, cvs.width, cvs.height);
        
        ctx.fillStyle = '#ff0055'; ctx.font = '900 32px Courier New'; ctx.textAlign = 'center';
        ctx.fillText('BURNOUT! 💀', cvs.width / 2, cvs.height / 2 - 35);

        ctx.fillStyle = '#ffff00'; ctx.font = 'bold 18px Courier New';
        ctx.fillText(`PUNTEGGIO: ${score}`, cvs.width / 2, cvs.height / 2 + 10);

        if (isNewRecord) {
            ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 16px Courier New';
            ctx.fillText('👑 NUOVO RECORD! 👑', cvs.width / 2, cvs.height / 2 + 40);
        } else {
            ctx.fillStyle = '#8888aa'; ctx.font = '14px Courier New';
            ctx.fillText(`RECORD ATTUALE: ${highScore}`, cvs.width / 2, cvs.height / 2 + 40);
        }

        ctx.fillStyle = Math.floor(Date.now() / 300) % 2 === 0 ? '#fff' : currentTheme.primary;
        ctx.font = '900 16px Courier New';
        ctx.fillText('TOCCA PER RIPROVARE', cvs.width / 2, cvs.height / 2 + 90);
    }
}

function advanceMenuState() {
    getAC();
    if (state === 'COVER') {
        state = 'STORY';
    } else if (state === 'STORY') {
        state = 'RULES';
    } else if (state === 'RULES') {
        state = 'CHAR_SELECT';
    } else if (state === 'CHAR_SELECT') {
        selectCharacter(charList[charSelectIndex || 0]);
    } else if (state === 'GAMEOVER') {
        state = 'CHAR_SELECT';
    }
}

// Touch / Pointer Event Handler
cvs.addEventListener('pointerdown', (e) => {
    getAC();
    let rect = cvs.getBoundingClientRect();
    let x = (e.clientX - rect.left) * (cvs.width / rect.width);
    let y = (e.clientY - rect.top) * (cvs.height / rect.height);

    if (['COVER', 'STORY', 'RULES'].includes(state)) {
        advanceMenuState();
        return;
    }

    if (state === 'CHAR_SELECT') {
        if (x < 60) {
            charSelectIndex = (charSelectIndex - 1 + 3) % 3;
            return;
        }
        if (x > cvs.width - 60) {
            charSelectIndex = (charSelectIndex + 1) % 3;
            return;
        }
        advanceMenuState();
        return;
    }

    if (state === 'PLAYING') {
        let hitAny = false;
        gridPads.forEach(p => {
            if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) {
                hitPad(p);
                hitAny = true;
            }
        });
        if (!hitAny && y < 74) {
            state = 'PAUSE';
            updateMusicState();
        }
        return;
    }

    if (state === 'PAUSE') {
        state = 'PLAYING';
        updateMusicState();
        return;
    }

    if (state === 'GAMEOVER') {
        state = 'CHAR_SELECT';
        return;
    }
});

// Tastiera PC
const KEY_MAP = {
    '1': 0, 'q': 0, 'Q': 0, 'Numpad7': 0,
    '2': 1, 'w': 1, 'W': 1, 'Numpad8': 1,
    '3': 2, 'e': 2, 'E': 2, 'Numpad9': 2,

    '4': 3, 'a': 3, 'A': 3, 'Numpad4': 3,
    '5': 4, 's': 4, 'S': 4, 'Numpad5': 4,
    '6': 5, 'd': 5, 'D': 5, 'Numpad6': 5,

    '7': 6, 'z': 6, 'Z': 6, 'Numpad1': 6,
    '8': 7, 'x': 7, 'X': 7, 'Numpad2': 7,
    '9': 8, 'c': 8, 'C': 8, 'Numpad3': 8
};

window.addEventListener('keydown', (e) => {
    getAC();
    if (['COVER', 'STORY', 'RULES'].includes(state)) {
        if (e.code === 'Space' || e.code === 'Enter') advanceMenuState();
        return;
    }

    if (state === 'CHAR_SELECT') {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') charSelectIndex = (charSelectIndex - 1 + 3) % 3;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') charSelectIndex = (charSelectIndex + 1) % 3;
        if (e.code === 'Space' || e.code === 'Enter') advanceMenuState();
        return;
    }

    if (state === 'GAMEOVER') {
        if (e.code === 'Space' || e.code === 'Enter') state = 'CHAR_SELECT';
        return;
    }

    let padIndex = KEY_MAP[e.key] !== undefined ? KEY_MAP[e.key] : KEY_MAP[e.code];
    if (padIndex !== undefined && gridPads[padIndex] && state === 'PLAYING') {
        hitPad(gridPads[padIndex]);
    }
});

function saveScore() {
    try {
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('pixelPunch_highScore', highScore.toString());
            isNewRecord = true;
        } else {
            isNewRecord = false;
        }

        if (score <= 0) return;
        let rawUser = localStorage.getItem('arcade_current_user');
        if (!rawUser) return;
        let u = JSON.parse(rawUser);
        if (u && u.stats) {
            u.stats.pixelPunch = (u.stats.pixelPunch || 0) + score;
            u.stats.gamesPlayed = (u.stats.gamesPlayed || 0) + 1;
            localStorage.setItem('arcade_current_user', JSON.stringify(u));

            if (u.username && !u.username.startsWith("GUEST_")) {
                let rawUsers = localStorage.getItem('arcade_users');
                let users = rawUsers ? JSON.parse(rawUsers) : {};
                if (users[u.username]) {
                    users[u.username].stats = u.stats;
                    localStorage.setItem('arcade_users', JSON.stringify(users));
                }
            }
        }
    } catch(e) {}
}

function exitGame() {
    if (gameTimerInterval) clearInterval(gameTimerInterval);
    saveScore();
    bgMusic.pause();
    window.location.href = 'index.html';
}

function loop() {
    frame++;
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
