<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060212">
<title>Pixel Punch - Revision Killer - Agency Arcade</title>
<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent !important;
    -webkit-focus-ring-color: transparent !important;
    outline: none !important;
    touch-action: manipulation;
    font-family: 'Courier New', Courier, monospace;
  }
  html {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #060212 !important;
    overflow: hidden;
  }
  body {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #060212 !important;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #wrapper {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100vw;
    height: 100svh;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: max(env(safe-area-inset-top), 6px) 8px max(env(safe-area-inset-bottom), 8px) 8px;
    background: #060212 !important;
    overflow: hidden;
  }

  /* TOP HEADER BAR */
  .top-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 6px;
    margin-bottom: 2px;
    flex-shrink: 0;
  }
  .header-title {
    color: #ffcc00 !important;
    font-size: 13px;
    font-weight: 900;
    text-shadow: 2px 2px 0px #ff0044;
    letter-spacing: 1.5px;
    flex: 1;
  }
  .header-btns-right {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .opt-btn {
    background: #10101c;
    border: 2px solid #ffcc00 !important;
    color: #ffcc00 !important;
    padding: 5px 10px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 2px 2px 0px #000000;
  }
  .opt-btn:active { transform: translate(1px, 1px); }

  #btnExitTop {
    border-color: #ff0055 !important;
    color: #ff0055 !important;
  }

  #canvas-container {
    width: 100%;
    flex: 1 1 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    min-height: 0;
    margin: 2px 0;
  }
  canvas {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    aspect-ratio: 380 / 540;
    border: 4px solid #333344 !important;
    box-shadow: 0 0 20px #000000, inset 0 0 10px #000000;
    border-radius: 8px;
    background: #08080c;
    cursor: pointer;
  }

  /* MODALE OPZIONI */
  .modal-overlay {
    display: none;
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(4, 4, 8, 0.96);
    z-index: 200;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }
  .modal-box {
    width: 100%;
    max-width: 320px;
    background: #0c0c18;
    border: 4px solid #ff0055 !important;
    box-shadow: 4px 4px 0px #000000;
    border-radius: 8px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    color: #ffffff;
    text-align: center;
  }
  .modal-title {
    color: #ffcc00;
    font-size: 16px;
    font-weight: 900;
    text-shadow: 2px 2px 0px #000;
  }
  .option-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: #141424;
    padding: 10px;
    border: 2px solid #00e5ff;
    border-radius: 6px;
  }
  .option-label {
    font-size: 11px;
    font-weight: bold;
    color: #00e5ff !important;
  }
  .toggle-btn {
    width: 100%;
    padding: 8px;
    background: #201438;
    border: 2px solid #ff0055;
    color: #ffffff;
    font-weight: bold;
    font-size: 13px;
    border-radius: 4px;
    cursor: pointer;
  }
  .toggle-btn.active {
    border-color: #00ff44;
    color: #00ff44;
    background: #082810;
  }
  .close-modal-btn {
    padding: 10px;
    background: #ff0055;
    border: 2px solid #ffffff;
    color: #ffffff;
    font-weight: bold;
    font-size: 12px;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 3px 3px 0px #000;
  }
</style>
</head>
<body>

<audio id="bgMusic" src="assets/PixelPunch/music_punch.mp3" loop autoplay playsinline style="display:none;"></audio>

<div id="wrapper">
  <div class="top-header">
    <span class="header-title">PIXEL PUNCH '84</span>
    <div class="header-btns-right">
      <button class="opt-btn" id="btnExitTop">◄ ESCI</button>
      <button class="opt-btn" id="btnOpenSettings">⚙️ OPZIONI</button>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="game"></canvas>
  </div>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box">
      <div class="modal-title">⚙️ OPZIONI CABINET</div>

      <div class="option-item">
        <span class="option-label">MUSICA DI SOTTOFONDO</span>
        <button class="toggle-btn active" id="btnToggleMusic">ON 🎵</button>
      </div>

      <div class="option-item">
        <span class="option-label">EFFETTI SONORI (SFX)</span>
        <button class="toggle-btn active" id="btnToggleSfx">ON 🔊</button>
      </div>

      <button class="close-modal-btn" id="btnCloseSettings">SALVA E CHIUDI ►</button>
    </div>
  </div>
</div>

<script>
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
cvs.width = 380; 
cvs.height = 540;

// HELPER: 80s CABINET BEVELLED PANEL
function draw80sBox(c, x, y, w, h, borderColor, bgCol, borderWidth = 3) {
  c.fillStyle = bgCol;
  c.fillRect(x, y, w, h);
  c.lineWidth = borderWidth;
  c.strokeStyle = borderColor;
  c.strokeRect(x, y, w, h);
  
  // Inner bevel highlights
  c.fillStyle = 'rgba(255, 255, 255, 0.12)';
  c.fillRect(x, y, w, 2);
  c.fillRect(x, y, 2, h);
  c.fillStyle = 'rgba(0, 0, 0, 0.4)';
  c.fillRect(x, y + h - 2, w, 2);
  c.fillRect(x + w - 2, y, 2, h);
}

// AUDIO AUTOPLAY CONFIGURATION
let musicEnabled = localStorage.getItem('pixelPunch_music') !== 'false';
let sfxEnabled = localStorage.getItem('pixelPunch_sfx') !== 'false';

const bgMusic = document.getElementById('bgMusic');
bgMusic.volume = 0.4;

function playBgMusic() {
  if (musicEnabled && bgMusic.paused) {
    let p = bgMusic.play();
    if (p !== undefined) p.catch(() => {});
  }
}

playBgMusic();
window.addEventListener('DOMContentLoaded', playBgMusic);
window.addEventListener('load', playBgMusic);
['pointerdown', 'touchstart', 'mousedown', 'keydown', 'click'].forEach(evt => {
  window.addEventListener(evt, playBgMusic, { once: true, capture: true });
});

function updateMusicState() {
  if (musicEnabled) {
    playBgMusic();
  } else {
    bgMusic.pause();
  }
}

const settingsModal = document.getElementById('settingsModal');
const btnOpenSettings = document.getElementById('btnOpenSettings');
const btnCloseSettings = document.getElementById('btnCloseSettings');
const btnExitTop = document.getElementById('btnExitTop');
const btnToggleMusic = document.getElementById('btnToggleMusic');
const btnToggleSfx = document.getElementById('btnToggleSfx');

function renderOptionButtons() {
  btnToggleMusic.className = `toggle-btn ${musicEnabled ? 'active' : ''}`;
  btnToggleMusic.innerText = musicEnabled ? 'ON 🎵' : 'OFF 🔇';

  btnToggleSfx.className = `toggle-btn ${sfxEnabled ? 'active' : ''}`;
  btnToggleSfx.innerText = sfxEnabled ? 'ON 🔊' : 'OFF 🔇';
}
renderOptionButtons();

btnToggleMusic.onclick = () => {
  musicEnabled = !musicEnabled;
  localStorage.setItem('pixelPunch_music', musicEnabled);
  renderOptionButtons();
  updateMusicState();
};

btnToggleSfx.onclick = () => {
  sfxEnabled = !sfxEnabled;
  localStorage.setItem('pixelPunch_sfx', sfxEnabled);
  renderOptionButtons();
};

btnOpenSettings.onclick = () => {
  if (state === 'PLAYING') {
    state = 'PAUSE';
    updateMusicState();
  }
  settingsModal.style.display = 'flex';
};

btnCloseSettings.onclick = () => {
  settingsModal.style.display = 'none';
  getAC();
  if (state === 'PAUSE') {
    state = 'PLAYING';
  }
  updateMusicState();
};

btnExitTop.onclick = () => {
  getAC();
  exitGame();
};

// PRELOAD ASSETS
const ASSETS = {
  COVER: new Image(),
  IRIS: new Image(),
  CRISTINA: new Image(),
  RACHELE: new Image(),
  BOMBA: new Image(),
  FUOCO: new Image(),
  SCARPA: new Image(),
  CAFFE: new Image()
};

ASSETS.COVER.src = 'assets/PixelPunch/copertina.png';
ASSETS.IRIS.src = 'assets/PixelPunch/Iris.png';
ASSETS.CRISTINA.src = 'assets/PixelPunch/tosatto.png';
ASSETS.RACHELE.src = 'assets/PixelPunch/rache.png';

ASSETS.BOMBA.src = 'assets/pacman/bomba.png';
ASSETS.FUOCO.src = 'assets/pacman/fuoco.png';
ASSETS.SCARPA.src = 'assets/pacman/scarpa.png';
ASSETS.CAFFE.src = 'assets/pacman/caffe.png';

// PRODUCER CHARACTERS
const CHARACTERS = {
    IRIS: {
        id: 'IRIS',
        name: "IRIS",
        subtitle: "AI Producer Specialist",
        perkBonusTitle: "PERK: AUTO-FIX AI",
        perkBonusDesc: "Fix automatico & Ferie 7s",
        primary: "#00e5ff",
        bg: "#060814",
        padBg: "#101026",
        img: ASSETS.IRIS,
        ferieSec: 7
    },
    CRISTINA: {
        id: 'CRISTINA',
        name: "CRISTINA",
        subtitle: "Senior Producer Exec",
        perkBonusTitle: "PERK: DOUBLE ESPRESSO",
        perkBonusDesc: "Punti Caffè x2 & Ferie 10s",
        primary: "#ffcc00",
        bg: "#100c02",
        padBg: "#221a04",
        img: ASSETS.CRISTINA,
        ferieSec: 10
    },
    RACHELE: {
        id: 'RACHELE',
        name: "RACHELE",
        subtitle: "Lead Field Producer",
        perkBonusTitle: "PERK: VACATION RUSH",
        perkBonusDesc: "15s Super Relax & Combo Boost",
        primary: "#ff0055",
        bg: "#140410",
        padBg: "#280820",
        img: ASSETS.RACHELE,
        ferieSec: 15
    }
};

const charList = ['IRIS', 'CRISTINA', 'RACHELE'];
let charSelectIndex = 0;
let currentTheme = CHARACTERS.IRIS;
let highScore = parseInt(localStorage.getItem('pixelPunch_highScore')) || 0;
let isNewRecord = false;

// SYNTHESIZED SFX (80S SYNTH CHIP)
let audioCtx = null;
function getAC() {
    try {
        if (!audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    } catch(e) {}
    playBgMusic();
    return audioCtx;
}

function playSound(type) {
    if (!sfxEnabled) return;
    try {
        const ac = getAC();
        if (!ac) return;
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.connect(gain); gain.connect(ac.destination);
        
        if (type === 'hit') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(320, ac.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, ac.currentTime + 0.08);
            gain.gain.setValueAtTime(0.3, ac.currentTime);
            osc.start(); osc.stop(ac.currentTime + 0.08);
        } else if (type === 'hit_double') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(580, ac.currentTime);
            osc.frequency.exponentialRampToValueAtTime(220, ac.currentTime + 0.12);
            gain.gain.setValueAtTime(0.35, ac.currentTime);
            osc.start(); osc.stop(ac.currentTime + 0.12);
        } else if (type === 'coffee') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, ac.currentTime);
            osc.frequency.setValueAtTime(554, ac.currentTime + 0.06);
            osc.frequency.setValueAtTime(659, ac.currentTime + 0.12);
            gain.gain.setValueAtTime(0.3, ac.currentTime);
            osc.start(); osc.stop(ac.currentTime + 0.2);
        } else if (type === 'golden') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523, ac.currentTime);
            osc.frequency.setValueAtTime(659, ac.currentTime + 0.08);
            osc.frequency.setValueAtTime(783, ac.currentTime + 0.16);
            osc.frequency.setValueAtTime(1046, ac.currentTime + 0.24);
            gain.gain.setValueAtTime(0.35, ac.currentTime);
            osc.start(); osc.stop(ac.currentTime + 0.32);
        } else if (type === 'fail') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, ac.currentTime);
            osc.frequency.linearRampToValueAtTime(40, ac.currentTime + 0.25);
            gain.gain.setValueAtTime(0.35, ac.currentTime);
            osc.start(); osc.stop(ac.currentTime + 0.25);
        }
    } catch(e) {}
}

// GAME MECHANICS & STATES
let state = 'COVER'; 
let score = 0;
let combo = 0;
let stress = 0;
let elapsedMatchTime = 0;
let frame = 0;
let shakeTime = 0;
let shakeMag = 0;

function triggerShake(time = 10, mag = 5) {
    shakeTime = time;
    shakeMag = mag;
}

let ferieActive = false;
let ferieTimer = 0;

let particles = [];
let floatingTexts = [];
let impactBursts = [];

const BAD_NOTIFS = [
    { line1: "LOGO PIÙ", line2: "GRANDE!" },
    { line1: "LAVORO PER", line2: "IERI!" },
    { line1: "CAMBIA", line2: "COLORE!" },
    { line1: "ASAP", line2: "URGENTE!" },
    { line1: "PROVA CON", line2: "VERDE!" },
    { line1: "FONTS PIÙ", line2: "LEGGIBILI!" }
];

const gridPads = [
    { id: 0, x: 15,  y: 85,  w: 110, h: 135, keyLabel: "1 / Q" },
    { id: 1, x: 135, y: 85,  w: 110, h: 135, keyLabel: "2 / W" },
    { id: 2, x: 255, y: 85,  w: 110, h: 135, keyLabel: "3 / E" },

    { id: 3, x: 15,  y: 230, w: 110, h: 135, keyLabel: "4 / A" },
    { id: 4, x: 135, y: 230, w: 110, h: 135, keyLabel: "5 / S" },
    { id: 5, x: 255, y: 230, w: 110, h: 135, keyLabel: "6 / D" },

    { id: 6, x: 15,  y: 375, w: 110, h: 135, keyLabel: "7 / Z" },
    { id: 7, x: 135, y: 375, w: 110, h: 135, keyLabel: "8 / X" },
    { id: 8, x: 255, y: 375, w: 110, h: 135, keyLabel: "9 / C" }
].map(p => ({
    ...p,
    active: false,
    type: 'BAD',
    hp: 1,
    line1: '',
    line2: '',
    timer: 0,
    maxTimer: 100,
    pressAnim: 0
}));

let lastSpawnTime = 0;
let gameTimerInterval = null;

function selectCharacter(charKey) {
    currentTheme = CHARACTERS[charKey];
    cvs.style.borderColor = currentTheme.primary;
    cvs.style.boxShadow = `0 0 20px ${currentTheme.primary}`;
    startMatch();
}

function startMatch() {
    state = 'PLAYING';
    score = 0;
    stress = 0;
    combo = 0;
    elapsedMatchTime = 0;
    
    ferieActive = false;
    ferieTimer = 0;

    isNewRecord = false;
    gridPads.forEach(p => p.active = false);

    if (gameTimerInterval) clearInterval(gameTimerInterval);
    gameTimerInterval = setInterval(() => {
        if (state === 'PLAYING') {
            elapsedMatchTime++;

            if (ferieActive) {
                ferieTimer--;
                stress = Math.max(0, stress - 1.8);
                if (ferieTimer <= 0) {
                    ferieActive = false;
                }
            } else {
                stress = Math.min(100, stress + 0.35 + (elapsedMatchTime * 0.012));
            }

            if (stress >= 100) {
                state = 'GAMEOVER';
                playSound('fail');
                triggerShake(20, 10);
                saveScore();
                clearInterval(gameTimerInterval);
            }
        }
    }, 1000);
}

function spawnTicket() {
    if (ferieActive) return;

    let inactive = gridPads.filter(p => !p.active);
    if (inactive.length === 0) return;

    let activeCount = gridPads.filter(p => p.active).length;
    let maxAllowed = 1;
    if (elapsedMatchTime > 12) maxAllowed = 2;
    if (elapsedMatchTime > 30) maxAllowed = 3;
    if (elapsedMatchTime > 55) maxAllowed = 4;

    if (activeCount >= maxAllowed) return;

    let target = inactive[Math.floor(Math.random() * inactive.length)];
    target.active = true;

    let rand = Math.random();
    let duration = Math.max(55, 145 - Math.floor(elapsedMatchTime * 1.5));

    if (currentTheme.id === 'IRIS' && rand < 0.20 && rand >= 0.05) {
        score += 100;
        stress = Math.max(0, stress - 2);
        addParticles(target.x + target.w/2, target.y + target.h/2, currentTheme.primary, 12);
        addFloatText(target.x + target.w/2, target.y + target.h/2, "AI AUTO-FIX!", currentTheme.primary);
        addImpactBurst(target.x + target.w/2, target.y + target.h/2, "AUTO-FIX!", currentTheme.primary);
        target.active = false;
        return;
    }

    if (rand < 0.10) {
        target.type = 'FERIE';
        target.hp = 1;
        target.line1 = "FERIE 🌴";
        target.line2 = "RELAX!";
    } else if (rand < 0.22) {
        target.type = 'COFFEE';
        target.hp = 1;
        target.line1 = "CAFFÈ";
        target.line2 = "BONUS";
    } else if (rand < 0.32) {
        target.type = 'GOLDEN';
        target.hp = 1;
        target.line1 = "CLIENTE VIP";
        target.line2 = "SPECIALE";
    } else if (rand < 0.46) {
        target.type = 'TRAP';
        target.hp = 1;
        target.line1 = "FEEDBACK";
        target.line2 = "APPROVATO";
    } else if (rand < 0.55) {
        target.type = 'GLITCH';
        target.hp = 1;
        target.line1 = "FILE";
        target.line2 = "CORROTTO";
    } else if (rand < 0.72) {
        target.type = 'DOUBLE';
        target.hp = 2;
        target.line1 = "REVISIONE";
        target.line2 = "DOPPIA (2x)";
    } else {
        target.type = 'BAD';
        target.hp = 1;
        let b = BAD_NOTIFS[Math.floor(Math.random() * BAD_NOTIFS.length)];
        target.line1 = b.line1;
        target.line2 = b.line2;
    }

    target.timer = duration;
    target.maxTimer = duration;
}

function hitPad(pad) {
    pad.pressAnim = 6;
    let cx = pad.x + pad.w / 2;
    let cy = pad.y + pad.h / 2;

    if (!pad.active) {
        triggerShake(3, 2);
        return;
    }

    if (pad.type === 'FERIE') {
        pad.active = false;
        ferieActive = true;
        ferieTimer = currentTheme.ferieSec;
        stress = Math.max(0, stress - 20);
        playSound('golden');
        triggerShake(12, 6);
        
        gridPads.forEach(p => p.active = false);
        addParticles(cx, cy, '#00e5ff', 22);
        addFloatText(cx, cy, `🌴 VACATION! (${currentTheme.ferieSec}s)`, "#00e5ff");
        addImpactBurst(cx, cy, "RELAX!", "#00e5ff");
    }
    else if (pad.type === 'TRAP') {
        pad.active = false;
        combo = 0;
        let pen = (currentTheme.id === 'CRISTINA') ? 0 : 50;
        score = Math.max(0, score - pen);
        if (currentTheme.id !== 'CRISTINA') stress = Math.min(100, stress + 8);
        playSound('fail');
        triggerShake(10, 6);
        addParticles(cx, cy, '#00ff44', 12);
        addFloatText(cx, cy, (pen === 0 ? "NO PENALTY!" : "-50 PTS"), "#00ff44");
        addImpactBurst(cx, cy, "TRAP!", "#00ff44");
    } 
    else if (pad.type === 'GLITCH') {
        pad.active = false;
        combo = 0;
        score = Math.max(0, score - 100);
        stress = Math.min(100, stress + 12);
        playSound('fail');
        triggerShake(14, 8);
        addParticles(cx, cy, '#ff0055', 16);
        addFloatText(cx, cy, "GLITCH! +12% STRESS", "#ff0055");
        addImpactBurst(cx, cy, "ERROR!", "#ff0055");
    }
    else if (pad.type === 'COFFEE') {
        pad.active = false;
        combo++;
        let pts = (currentTheme.id === 'CRISTINA') ? 600 : 300;
        score += pts;
        stress = Math.max(0, stress - (currentTheme.id === 'CRISTINA' ? 12 : 8));
        playSound('coffee');
        triggerShake(6, 4);
        addParticles(cx, cy, '#ffcc00', 14);
        addFloatText(cx, cy, `+${pts} CAFFÈ!`, "#ffcc00");
        addImpactBurst(cx, cy, "BOOST!", "#ffcc00");
    } 
    else if (pad.type === 'GOLDEN') {
        pad.active = false;
        combo++;
        score += 500;
        stress = Math.max(0, stress - 15);
        playSound('golden');
        triggerShake(12, 7);
        addParticles(cx, cy, '#ffcc00', 20);
        addFloatText(cx, cy, "+500 PTS VIP!", "#ffcc00");
        addImpactBurst(cx, cy, "VIP K.O.!", "#ffcc00");
    }
    else if (pad.type === 'DOUBLE') {
        pad.hp--;
        playSound('hit_double');
        triggerShake(6, 4);
        if (pad.hp <= 0) {
            pad.active = false;
            combo++;
            let pts = 250;
            score += pts;
            stress = Math.max(0, stress - 4);
            addParticles(cx, cy, '#aa00ff', 16);
            addFloatText(cx, cy, `+${pts} RISOLTA!`, "#aa00ff");
            addImpactBurst(cx, cy, "SMASH!", "#aa00ff");
        } else {
            addParticles(cx, cy, '#ff8800', 8);
            addFloatText(cx, cy, "1 ANCORA!", "#ff8800");
            addImpactBurst(cx, cy, "HIT!", "#ff8800");
        }
    }
    else { // BAD
        pad.active = false;
        combo++;
        let comboBonus = (currentTheme.id === 'RACHELE') ? (combo * 25) : (combo > 3 ? 50 : 0);
        let pts = 100 + comboBonus;
        score += pts;
        stress = Math.max(0, stress - 2);
        playSound('hit');
        triggerShake(7, 5);
        addParticles(cx, cy, currentTheme.primary, 14);
        addFloatText(cx, cy, `+${pts}`, "#ffcc00");
        addImpactBurst(cx, cy, combo > 3 ? "CRITICAL!" : "PUNCH!", currentTheme.primary);
    }
}

function addParticles(x, y, color, count = 12) {
    for (let i = 0; i < count; i++) {
        let angle = Math.random() * Math.PI * 2;
        let spd = 2 + Math.random() * 6;
        particles.push({
            x, y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            life: 18 + Math.random() * 10,
            maxLife: 28,
            color,
            size: 3 + Math.random() * 3
        });
    }
}

function addFloatText(x, y, text, color) {
    floatingTexts.push({ x, y, text, color, alpha: 1, vy: -2.0 });
}

function addImpactBurst(x, y, label, color) {
    impactBursts.push({
        x, y,
        label,
        color,
        radius: 8,
        maxRadius: 40,
        alpha: 1
    });
}

function update() {
    if (shakeTime > 0) shakeTime--;

    particles.forEach(p => { 
        p.x += p.vx; 
        p.y += p.vy; 
        p.life--; 
    });
    particles = particles.filter(p => p.life > 0);

    floatingTexts.forEach(ft => { ft.y += ft.vy; ft.alpha -= 0.028; });
    floatingTexts = floatingTexts.filter(ft => ft.alpha > 0);

    impactBursts.forEach(ib => {
        ib.radius += 3.8;
        ib.alpha -= 0.045;
    });
    impactBursts = impactBursts.filter(ib => ib.alpha > 0);

    gridPads.forEach(p => { if (p.pressAnim > 0) p.pressAnim--; });

    if (state !== 'PLAYING') return;

    let spawnDelay = Math.max(400, 1150 - Math.floor(elapsedMatchTime * 12));
    if (Date.now() - lastSpawnTime > spawnDelay) {
        spawnTicket();
        lastSpawnTime = Date.now();
    }

    gridPads.forEach(p => {
        if (p.active) {
            p.timer--;
            if (p.timer <= 0) {
                p.active = false;
                if (p.type === 'BAD' || p.type === 'DOUBLE') {
                    combo = 0;
                    stress = Math.min(100, stress + 7);
                    triggerShake(8, 4);
                }
            }
        }
    });
}

// CRT SCANLINE NATIVE HELPER
function drawCRTOverlay() {
  ctx.save();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
  for (let y = 0; y < cvs.height; y += 3) {
    ctx.fillRect(0, y, cvs.width, 1);
  }
  // Subtle glass vignette corners
  let gradient = ctx.createRadialGradient(cvs.width/2, cvs.height/2, 180, cvs.width/2, cvs.height/2, 280);
  gradient.addColorStop(0, 'rgba(0,0,0,0)');
  gradient.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.restore();
}

    let totalSegments = 20;

        }
    }

    drawCRTOverlay();
    ctx.restore();
}

function advanceMenuState() {
    getAC();
    if (state === 'COVER') {
        state = 'STORY';
    } else if (state === 'STORY') {
        state = 'RULES';
    } else if (state === 'RULES') {
        state = 'CHAR_SELECT';
    } else if (state === 'CHAR_SELECT') {
        selectCharacter(charList[charSelectIndex || 0]);
    } else if (state === 'GAMEOVER') {
        state = 'CHAR_SELECT';
    }
}

// Touch / Pointer Event Handler
cvs.addEventListener('pointerdown', (e) => {
    getAC();
    let rect = cvs.getBoundingClientRect();
    let x = (e.clientX - rect.left) * (cvs.width / rect.width);
    let y = (e.clientY - rect.top) * (cvs.height / rect.height);

    if (['COVER', 'STORY', 'RULES'].includes(state)) {
        advanceMenuState();
        return;
    }

    if (state === 'CHAR_SELECT') {
        if (x < 60) {
            charSelectIndex = (charSelectIndex - 1 + 3) % 3;
            return;
        }
        if (x > cvs.width - 60) {
            charSelectIndex = (charSelectIndex + 1) % 3;
            return;
        }
        advanceMenuState();
        return;
    }

    if (state === 'PLAYING') {
        let hitAny = false;
        gridPads.forEach(p => {
            if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h) {
                hitPad(p);
                hitAny = true;
            }
        });
        if (!hitAny && y < 74) {
            state = 'PAUSE';
            updateMusicState();
        }
        return;
    }

    if (state === 'PAUSE') {
        state = 'PLAYING';
        updateMusicState();
        return;
    }

    if (state === 'GAMEOVER') {
        state = 'CHAR_SELECT';
        return;
    }
});

// Tastiera PC
const KEY_MAP = {
    '1': 0, 'q': 0, 'Q': 0, 'Numpad7': 0,
    '2': 1, 'w': 1, 'W': 1, 'Numpad8': 1,
    '3': 2, 'e': 2, 'E': 2, 'Numpad9': 2,

    '4': 3, 'a': 3, 'A': 3, 'Numpad4': 3,
    '5': 4, 's': 4, 'S': 4, 'Numpad5': 4,
    '6': 5, 'd': 5, 'D': 5, 'Numpad6': 5,

    '7': 6, 'z': 6, 'Z': 6, 'Numpad1': 6,
    '8': 7, 'x': 7, 'X': 7, 'Numpad2': 7,
    '9': 8, 'c': 8, 'C': 8, 'Numpad3': 8
};

window.addEventListener('keydown', (e) => {
    getAC();
    if (['COVER', 'STORY', 'RULES'].includes(state)) {
        if (e.code === 'Space' || e.code === 'Enter') advanceMenuState();
        return;
    }

    if (state === 'CHAR_SELECT') {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') charSelectIndex = (charSelectIndex - 1 + 3) % 3;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') charSelectIndex = (charSelectIndex + 1) % 3;
        if (e.code === 'Space' || e.code === 'Enter') advanceMenuState();
        return;
    }

    if (state === 'GAMEOVER') {
        if (e.code === 'Space' || e.code === 'Enter') state = 'CHAR_SELECT';
        return;
    }

    let padIndex = KEY_MAP[e.key] !== undefined ? KEY_MAP[e.key] : KEY_MAP[e.code];
    if (padIndex !== undefined && gridPads[padIndex] && state === 'PLAYING') {
        hitPad(gridPads[padIndex]);
    }
});

function saveScore() {
    try {
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('pixelPunch_highScore', highScore.toString());
            isNewRecord = true;
        } else {
            isNewRecord = false;
        }

        if (score <= 0) return;
        let rawUser = localStorage.getItem('arcade_current_user');
        if (!rawUser) return;
        let u = JSON.parse(rawUser);
        if (u && u.stats) {
            u.stats.pixelPunch = (u.stats.pixelPunch || 0) + score;
            u.stats.gamesPlayed = (u.stats.gamesPlayed || 0) + 1;
            localStorage.setItem('arcade_current_user', JSON.stringify(u));

            if (u.username && !u.username.startsWith("GUEST_")) {
                let rawUsers = localStorage.getItem('arcade_users');
                let users = rawUsers ? JSON.parse(rawUsers) : {};
                if (users[u.username]) {
                    users[u.username].stats = u.stats;
                    localStorage.setItem('arcade_users', JSON.stringify(users));
                }
            }
        }
    } catch(e) {}
}

function exitGame() {
    if (gameTimerInterval) clearInterval(gameTimerInterval);
    saveScore();
    bgMusic.pause();
    window.location.href = 'index.html';
}

function loop() {
    frame++;
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
