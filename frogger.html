<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Deadline Drive - Studio Cross</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent !important;
  -webkit-focus-ring-color: transparent !important;
  outline: none !important;
  touch-action: manipulation;
  font-family: 'Courier New', Courier, monospace;
}
body {
  background-color: #030305 !important;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
}
#game-wrapper {
  position: relative;
  width: 100vw;
  height: 100vh;
  max-width: 360px;
  max-height: 740px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 6px;
  background: #080816 !important;
  border: none !important;
  box-shadow: none !important;
  border-radius: 14px;
}
#canvas-container {
  position: relative;
  width: 100%;
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  overflow: hidden;
  margin-bottom: 2px;
}
canvas {
  width: 100%;
  height: auto;
  aspect-ratio: 338 / 486;
  object-fit: contain;
  border: 2px solid #ff0055 !important;
  box-shadow: inset 0 0 15px rgba(255, 0, 85, 0.2) !important;
  border-radius: 10px;
  background: #04040c;
  cursor: pointer;
}

.control-deck {
  width: 100%;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 8px;
  background: linear-gradient(180deg, #121428 0%, #050610 100%);
  border: 2px solid #ff0055 !important;
  box-shadow: inset 0 0 15px rgba(255,0,85,0.15) !important;
  border-radius: 12px;
}
.joystick-container {
  display: flex;
  justify-content: center;
  align-items: center;
}
.dpad-grid {
  display: grid;
  grid-template-columns: repeat(3, 44px);
  grid-template-rows: repeat(3, 38px);
  gap: 3px;
}
.ctrl-btn {
  background: linear-gradient(180deg, #252a54 0%, #0e1028 100%);
  border: 1.5px solid #ff0055 !important;
  color: #ff0055 !important;
  font-size: 18px;
  font-weight: bold;
  border-radius: 8px;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  box-shadow: 0 3px 0 #88002d, inset 0 1px 0 rgba(255,255,255,0.3) !important;
  text-shadow: 0 0 6px #ff0055 !important;
}
.ctrl-btn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #88002d !important;
  background: #ff0055 !important;
  color: #000 !important;
  text-shadow: none !important;
}
.ctrl-btn-center {
  display: flex;
  justify-content: center;
  align-items: center;
  background: #050610;
  border-radius: 50%;
  border: 1.5px solid rgba(255,0,85,0.4) !important;
}
.dpad-core {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: radial-gradient(circle, #ff0055 0%, #66001a 100%) !important;
  box-shadow: 0 0 8px #ff0055 !important;
}

.arcade-action-container {
  display: flex;
  justify-content: center;
  align-items: center;
}
.arcade-push-btn {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  background: #2b0012;
  border: 3px solid #ff0055;
  padding: 4px;
  box-shadow: 0 0 20px rgba(255, 0, 85, 0.45), inset 0 0 12px rgba(0, 0, 0, 0.9);
  cursor: pointer;
  outline: none;
}
.arcade-push-btn .btn-top {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ff3377, #cc0044 60%, #88002d 100%);
  border: 2px solid #ff77bb;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: #fff;
  font-weight: bold;
  font-size: 11px;
  letter-spacing: 0.5px;
  box-shadow: inset 0 4px 8px rgba(255,255,255,0.4), 0 4px 0 #55001b;
  text-shadow: 0 1px 2px #000;
}
.arcade-push-btn:active .btn-top {
  transform: translateY(3px);
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.6), 0 1px 0 #55001b;
}

.exit-btn {
  width: 100%;
  margin-top: 4px;
  padding: 10px;
  background: #1a1a2e;
  border: 1.5px solid #ff0055 !important;
  color: #ff0055 !important;
  font-weight: bold;
  font-size: 11px;
  border-radius: 8px;
  cursor: pointer;
  text-align: center;
}
.exit-btn:active { transform: scale(0.96); }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="canvas-container">
    <canvas id="game"></canvas>
  </div>

  <div class="control-deck">
    <div class="joystick-container">
      <div class="dpad-grid">
        <div style="visibility:hidden"></div><div class="ctrl-btn" id="btnUp">▲</div><div style="visibility:hidden"></div>
        <div class="ctrl-btn" id="btnLeft">◄</div><div class="ctrl-btn-center"><div class="dpad-core"></div></div><div class="ctrl-btn" id="btnRight">►</div>
        <div style="visibility:hidden"></div><div class="ctrl-btn" id="btnDown">▼</div><div style="visibility:hidden"></div>
      </div>
    </div>

    <div class="arcade-action-container">
      <button class="arcade-push-btn" id="btnGuard">
        <span class="btn-top">🛡️ RENDER</span>
      </button>
    </div>
  </div>

  <button class="exit-btn" onclick="exitGame()">◄ TORNA ALL'HUB ARCADE</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const COLS = 13;
const ROWS = 17;
const CELL_SIZE = 26;
const HUD_HEIGHT = 44;

const CANVAS_W = COLS * CELL_SIZE; 
const CANVAS_H = ROWS * CELL_SIZE + HUD_HEIGHT; 

canvas.width = CANVAS_W;
canvas.height = CANVAS_H;

function drawRoundRect(c, x, y, w, h, r) {
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

const imgGiulia = new Image(); imgGiulia.src = 'assets/frogger/giulia.png';
const imgTobi   = new Image(); imgTobi.src   = 'assets/frogger/tobi.png';
const imgDave   = new Image(); imgDave.src   = 'assets/frogger/dave.png';
const imgLuca   = new Image(); imgLuca.src   = 'assets/frogger/luca.png';

const OBSTACLE_TYPES = {
  FRAME_DROP:   { type: 'FRAME_DROP',   label: 'DROP FRAME',    bg: '#002b4a', border: '#ff0055', textCol: '#ccf5ff', wMult: 1.8, hMult: 1 },
  EXPORT_LENTO: { type: 'EXPORT_LENTO', label: 'EXPORT LENTO',  bg: '#3b3300', border: '#ffff00', textCol: '#ffffaa', wMult: 2.2, hMult: 1 },
  BUG_CRITICO:  { type: 'BUG_CRITICO',  label: 'BUG CRITICO',   bg: '#4a0000', border: '#ff0000', textCol: '#ffaaaa', wMult: 2.0, hMult: 1 },
  AUDIO_OUT:    { type: 'AUDIO_OUT',    label: 'AUDIO NO SYNC', bg: '#4a3d00', border: '#ffcc00', textCol: '#ffffcc', wMult: 2.4, hMult: 1 },
  CLIENT_EDIT:  { type: 'CLIENT_EDIT',  label: 'CAMBIO CLIENTE', bg: '#4a001a', border: '#ff0055', textCol: '#ffaacc', wMult: 2.8, hMult: 1 },
  DISCO_PIENO:  { type: 'DISCO_PIENO',  label: 'DISCO PIENO!',   bg: '#3f3000', border: '#ffbb00', textCol: '#fff5aa', wMult: 2.2, hMult: 1 },
  OVERHEAT:     { type: 'OVERHEAT',     label: 'GPU OVERHEAT',   bg: '#550000', border: '#ff2200', textCol: '#ffcccc', wMult: 2.0, hMult: 1 },
  SET_DELAY:    { type: 'SET_DELAY',    label: 'SET RITARDO',   bg: '#1c2838', border: '#2a6090', textCol: '#88c0ff', wMult: 3.2, hMult: 2 },
  RENDER_CRASH: { type: 'RENDER_CRASH', label: 'RENDER CRASH!', bg: '#500005', border: '#ff0000', textCol: '#ffffff', wMult: 3.4, hMult: 1 }
};

const LEVEL_THEMES = [
  { levelMin: 1, title: "STAGE 1: TIMELINE INIZIALE", msg: "Primi export veloci e pochi ostacoli!" },
  { levelMin: 2, title: "STAGE 2: MONTAGGIO COMPLESSO", msg: "Audio fuori sync e bug di sistema!" },
  { levelMin: 3, title: "STAGE 3: RUSH EXPORT FINALE", msg: "Attento ai blocchi alti e alla GPU!" },
  { levelMin: 4, title: "STAGE 4: CAOS PRIMA DELLE 18:00", msg: "Massima velocità e ostacoli continui!" }
];

const CHARACTERS = {
  GIULIA: {
    id: 'GIULIA', name: "GIULIA", subtitle: "Lead Video Editor",
    perkBonus: "BONUS: Precisione (Punti 1.25x)",
    perkMalus: "MALUS: Ricarica Render Lenta (+25%)",
    primary: "#ff0055", bg: "#040414", img: imgGiulia,
    arrowCol: "#ff0055", arrowGlow: "#880022",
    speed: 2.8, guardCooldown: 400, scoreMult: 1.25
  },
  TOBI: {
    id: 'TOBI', name: "TOBI", subtitle: "Assistant Video Editor",
    perkBonus: "BONUS: Agilità (+20% Velocità)",
    perkMalus: "MALUS: Punteggio Base (-10%)",
    primary: "#ffd700", bg: "#140e00", img: imgTobi,
    arrowCol: "#ffd700", arrowGlow: "#886600",
    speed: 3.4, guardCooldown: 320, scoreMult: 0.9
  },
  DAVE: {
    id: 'DAVE', name: "DAVE", subtitle: "Focused Director",
    perkBonus: "BONUS: Autorità (+30% Punteggio)",
    perkMalus: "MALUS: Passo Pesante (-20% Velocità)",
    primary: "#ff0055", bg: "#140e00", img: imgDave,
    arrowCol: "#ff0055", arrowGlow: "#880022",
    speed: 2.0, guardCooldown: 320, scoreMult: 1.3
  },
  LUCA: {
    id: 'LUCA', name: "LUCA", subtitle: "VFX Artist Whiz",
    perkBonus: "BONUS: VFX Ricarica (Render -15%)",
    perkMalus: "MALUS: Render Fragile",
    primary: "#ffaa00", bg: "#140e00", img: imgLuca,
    arrowCol: "#ffaa00", arrowGlow: "#885500",
    speed: 3.2, guardCooldown: 270, scoreMult: 1.15
  }
};

const CHARACTER_LIST = ['GIULIA', 'TOBI', 'DAVE', 'LUCA'];

const PICKUP_TYPES = {
  COFFEE:    { type: 'COFFEE',    label: '☕ CAFFÈ',   pts: 300,  isMalus: false },
  TURBO:     { type: 'TURBO',     label: '⚡ TURBO',   pts: 150,  isMalus: false, speedBoost: 1.3 },
  DOUBLE_PTS:{ type: 'DOUBLE_PTS',label: '⭐ 2X PUNTI',pts: 500,  isMalus: false, scoreBoost: 2.0 },
  SLOW:      { type: 'SLOW',      label: '🐌 SLOW',    pts: -100, isMalus: true,  slowFactor: 0.6 },
  GLITCH:    { type: 'GLITCH',    label: '⚠️ GLITCH',  pts: -200, isMalus: true,  invertControls: true }
};

let currentTheme = CHARACTERS.GIULIA;
let highScore = parseInt(localStorage.getItem('deadlineDrive_highScore')) || 0;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);

  if (type === 'cross') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523, audioCtx.currentTime);
    osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    osc.start(); osc.stop(audioCtx.currentTime + 0.16);
  } else if (type === 'crash') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(250, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
  } else if (type === 'guard_active') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'pickup') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
    osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  } else if (type === 'malus') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  } else if (type === 'fail') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  }
}

let activeLanes = [];
let gameState = 'TUTORIAL';
let level = 1;
let score = 0;
let lives = 3;
let visualScrollOffset = 0; 

let player = {
  gx: Math.floor(COLS / 2),
  gy: ROWS - 2,
  w: 16, h: 16,
  facingLeft: false,
  invTimer: 0,
  guardTimer: 0,
  guardCooldownTimer: 0,
  nextMoveAllowedTimer: 0,
  speedMult: 1.0,
  tempScoreMult: 1.0,
  glitchTimer: 0
};

let moveUp = false, moveDown = false, moveLeft = false, moveRight = false;
let selectedCharIndex = 0;

function createNewLane(isInitialSetup = false, r = 0) {
  let isSafe = false;

  if (isInitialSetup) {
    isSafe = (r === 0 || r === ROWS - 1 || r === ROWS - 2 || r === ROWS - 3 || (r % 4 === 0 && level === 1));
  } else {
    let topLane = activeLanes[0];
    if (topLane && topLane.type === 'SAFE') {
      isSafe = false;
    } else {
      isSafe = Math.random() < 0.22;
    }
  }

  let laneType = isSafe ? 'SAFE' : 'ROAD';
  let dir = (Math.random() < 0.5) ? 1 : -1;

  let speedFactor = 0.5 + Math.min(level * 0.2, 1.5);
  let baseSpeed = (0.6 + Math.random() * 0.4) * speedFactor;

  let vTypes = [];
  if (level === 1) vTypes = [OBSTACLE_TYPES.FRAME_DROP, OBSTACLE_TYPES.EXPORT_LENTO];
  else if (level === 2) vTypes = [OBSTACLE_TYPES.EXPORT_LENTO, OBSTACLE_TYPES.BUG_CRITICO, OBSTACLE_TYPES.AUDIO_OUT, OBSTACLE_TYPES.DISCO_PIENO];
  else if (level === 3) vTypes = [OBSTACLE_TYPES.AUDIO_OUT, OBSTACLE_TYPES.CLIENT_EDIT, OBSTACLE_TYPES.OVERHEAT, OBSTACLE_TYPES.SET_DELAY];
  else vTypes = Object.values(OBSTACLE_TYPES);

  let laneObj = {
    type: laneType,
    bg: isSafe ? '#080820' : '#0e1224',
    wallCol: currentTheme.wallCol || '#ff0055',
    dir: dir,
    speed: baseSpeed,
    objects: [],
    pickups: []
  };

  if (laneType === 'ROAD') {
    let x = -CELL_SIZE * 2;
    let gapMultiplier = Math.max(2.5, 6.5 - (level * 0.8));
    
    do {
      x += CELL_SIZE * (Math.random() * 2 + gapMultiplier);
      if (x < CANVAS_W + CELL_SIZE * 2) {
        let vType = vTypes[Math.floor(Math.random() * vTypes.length)];
        laneObj.objects.push({ x, type: vType, w: vType.wMult * CELL_SIZE, hMult: vType.hMult });
      }
    } while (x < CANVAS_W + CELL_SIZE * 2);
  } else if (isSafe && Math.random() < 0.35) {
    let pTypeKeys = Object.keys(PICKUP_TYPES);
    let chosenKey = pTypeKeys[Math.floor(Math.random() * pTypeKeys.length)];
    laneObj.pickups.push({
      gx: Math.floor(Math.random() * (COLS - 2)) + 1,
      type: PICKUP_TYPES[chosenKey]
    });
  }

  return laneObj;
}

function startInfiniteScroll() {
  activeLanes = [];
  visualScrollOffset = 0;
  for (let r = 0; r < ROWS; r++) {
    activeLanes.push(createNewLane(true, r));
  }
  resetPlayer();
}

function resetPlayer() {
  player.gx = Math.floor(COLS / 2);
  player.gy = ROWS - 2;
  player.w = 16; player.h = 16;
  player.invTimer = 0;
  player.guardTimer = 0;
  player.guardCooldownTimer = 0;
  player.nextMoveAllowedTimer = 0;
  player.speedMult = 1.0;
  player.tempScoreMult = 1.0;
  player.glitchTimer = 0;
}

function activateGuard() {
  if (gameState !== 'PLAYING') return;
  if (player.guardCooldownTimer > 0) return;

  player.guardTimer = 180;
  player.guardCooldownTimer = currentTheme.guardCooldown;
  playSound('guard_active');
}

function updatePlayer() {
  if (player.nextMoveAllowedTimer > 0) player.nextMoveAllowedTimer--;
  if (player.glitchTimer > 0) player.glitchTimer--;
  
  if (player.nextMoveAllowedTimer <= 0) {
    let dx = 0, dy = 0;

    let inLeft = keyPressed('ArrowLeft') || keyPressed('KeyA') || moveLeft;
    let inRight = keyPressed('ArrowRight') || keyPressed('KeyD') || moveRight;
    let inUp = keyPressed('ArrowUp') || keyPressed('KeyW') || moveUp;
    let inDown = keyPressed('ArrowDown') || keyPressed('KeyS') || moveDown;

    if (player.glitchTimer > 0) {
      let tempL = inLeft, tempR = inRight, tempU = inUp, tempD = inDown;
      inLeft = tempR; inRight = tempL; inUp = tempD; inDown = tempU;
    }

    if (inLeft) { dx--; player.facingLeft = true; }
    else if (inRight) { dx++; player.facingLeft = false; }
    
    if (inUp) dy--;
    else if (inDown) dy++;

    if (dx !== 0 || dy !== 0) {
      let ngx = player.gx + dx;
      let ngy = player.gy + dy;
      
      if (ngx >= 0 && ngx < COLS && ngy >= 0 && ngy < ROWS) {
        player.gx = ngx;
        player.gy = ngy;

        if (dy < 0 && player.gy < 6) {
          scrollWorldDown();
        } else if (dy < 0) {
          score += Math.floor(10 * level * currentTheme.scoreMult * player.tempScoreMult);
        }

        playSound('cross');
        let effSpeed = currentTheme.speed * player.speedMult;
        player.nextMoveAllowedTimer = Math.max(5, Math.floor(14 / effSpeed));
      }
    }
  }

  if (player.invTimer > 0) player.invTimer--;
  if (player.guardTimer > 0) player.guardTimer--;
  if (player.guardCooldownTimer > 0) player.guardCooldownTimer--;

  checkPickups();
  checkCollisions();
}

function scrollWorldDown() {
  activeLanes.pop();
  activeLanes.unshift(createNewLane(false));
  player.gy++; 
  visualScrollOffset -= CELL_SIZE; 
  score += Math.floor(15 * level * currentTheme.scoreMult * player.tempScoreMult);

  if (score > level * 1200) {
    level++;
  }
}

function updateVehicles() {
  visualScrollOffset += (0 - visualScrollOffset) * 0.25;
  if (Math.abs(visualScrollOffset) < 0.1) visualScrollOffset = 0;

  activeLanes.forEach(lane => {
    if (lane.type === 'ROAD') {
      lane.objects.forEach(obj => {
        obj.x += lane.speed * lane.dir;
        if (lane.dir > 0 && obj.x > CANVAS_W + obj.w) {
          obj.x = -obj.w;
        } else if (lane.dir < 0 && obj.x < -obj.w) {
          obj.x = CANVAS_W + obj.w;
        }
      });
    }
  });
}

function checkPickups() {
  let currentLane = activeLanes[player.gy];
  if (!currentLane || currentLane.pickups.length === 0) return;

  for (let i = currentLane.pickups.length - 1; i >= 0; i--) {
    let p = currentLane.pickups[i];
    if (p.gx === player.gx) {
      score += Math.floor(p.type.pts * currentTheme.scoreMult);
      if (p.type.isMalus) {
        playSound('malus');
        if (p.type.slowFactor) player.speedMult = p.type.slowFactor;
        if (p.type.invertControls) player.glitchTimer = 180;
      } else {
        playSound('pickup');
        if (p.type.speedBoost) player.speedMult = p.type.speedBoost;
        if (p.type.scoreBoost) player.tempScoreMult = p.type.scoreBoost;
      }
      currentLane.pickups.splice(i, 1);
    }
  }
}

function isInvincible() { return player.invTimer > 0 || player.guardTimer > 0; }

function checkCollisions() {
  if (gameState !== 'PLAYING' || isInvincible()) return;

  let playerX = player.gx * CELL_SIZE + CELL_SIZE / 2;

  for (let offset = 0; offset <= 1; offset++) {
    let checkLaneIdx = player.gy - offset;
    if (checkLaneIdx < 0 || checkLaneIdx >= ROWS) continue;

    let lane = activeLanes[checkLaneIdx];
    if (!lane || lane.type !== 'ROAD') continue;

    lane.objects.forEach(obj => {
      if (offset === 1 && obj.hMult !== 2) return;

      let oLeft = obj.x;
      let oRight = obj.x + obj.w;
      let pLeft = playerX - player.w / 2;
      let pRight = playerX + player.w / 2;

      if (pLeft < oRight && pRight > oLeft) {
        hitPlayer();
      }
    });
  }
}

function hitPlayer() {
  lives--;
  playSound('crash');
  if (lives <= 0) {
    gameState = 'GAME_OVER';
    playSound('fail');
    saveScore();
  } else {
    resetPlayer();
    player.invTimer = 90;
  }
}

function drawGameWorld() {
  ctx.fillStyle = '#0a0a22'; 
  ctx.fillRect(0, HUD_HEIGHT, CANVAS_W, CANVAS_H - HUD_HEIGHT);

  activeLanes.forEach((lane, r) => {
    let y = r * CELL_SIZE + HUD_HEIGHT + visualScrollOffset;
    ctx.fillStyle = lane.bg;
    ctx.fillRect(0, y, CANVAS_W, CELL_SIZE);
    
    if (lane.type === 'SAFE') {
      ctx.strokeStyle = lane.wallCol || '#ff0055';
      ctx.lineWidth = 1;
      ctx.strokeRect(0, y, CANVAS_W, CELL_SIZE);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.fillRect(1, y + 1, CANVAS_W - 2, 3);
    } else if (lane.type === 'ROAD') {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(0, y, CANVAS_W, CELL_SIZE);
    }
  });

  activeLanes.forEach((lane, r) => {
    if (lane.type === 'SAFE') {
      let y = r * CELL_SIZE + HUD_HEIGHT + visualScrollOffset;
      lane.pickups.forEach(p => {
        let px = p.gx * CELL_SIZE + CELL_SIZE / 2;
        let py = y + CELL_SIZE / 2;
        ctx.fillStyle = p.type.isMalus ? '#ff0055' : '#ffff00';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.type.label.split(' ')[0], px, py);
      });
    }
  });

  activeLanes.forEach((lane, r) => {
    if (lane.type === 'ROAD') {
      let y = r * CELL_SIZE + HUD_HEIGHT + visualScrollOffset;
      drawObstacles(lane, y);
    }
  });

  drawSinglePlayer();
}

function drawObstacles(lane, laneY) {
  lane.objects.forEach(obj => {
    let x = obj.x;
    let y = laneY;
    let vData = obj.type;
    let blockW = obj.w;
    let blockH = (obj.hMult === 2 ? CELL_SIZE * 2 : CELL_SIZE) - 2;

    ctx.save();
    ctx.fillStyle = vData.bg;
    ctx.fillRect(x + 1, y + 1, blockW - 2, blockH);
    ctx.strokeStyle = vData.border;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x + 1.5, y + 1.5, blockW - 3, blockH - 1);
    
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.fillRect(x + 2, y + 2, blockW - 4, 3);
    
    ctx.fillStyle = vData.textCol;
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(vData.label, x + blockW / 2, y + blockH / 2 + 1, blockW - 6);
    ctx.restore();
  });
}

function drawSinglePlayer() {
  let playerY = player.gy * CELL_SIZE + HUD_HEIGHT + CELL_SIZE / 2 + visualScrollOffset;
  let playerX = player.gx * CELL_SIZE + CELL_SIZE / 2;
  
  if (player.invTimer > 0 && Math.floor(player.invTimer / 4) % 2 === 0) return;

  ctx.save();
  ctx.translate(playerX, playerY);

  if (player.facingLeft) {
    ctx.scale(-1, 1);
  }

  ctx.shadowColor = currentTheme.arrowGlow;
  ctx.shadowBlur = 12;
  ctx.fillStyle = currentTheme.arrowCol;

  ctx.beginPath();
  ctx.moveTo(0, 10);    
  ctx.lineTo(-10, -9);  
  ctx.lineTo(10, -9);   
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.beginPath();
  ctx.moveTo(0, 10);
  ctx.lineTo(0, -9);
  ctx.lineTo(10, -9);
  ctx.closePath();
  ctx.fill();

  if (player.glitchTimer > 0) {
    ctx.fillStyle = '#ff0055';
    ctx.font = 'bold 10px monospace';
    ctx.fillText('⚠', 0, -14);
  }

  if (player.guardTimer > 0) {
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 12;
    ctx.strokeStyle = '#ff0055';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 16, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = '#0a0a22';
  ctx.fillRect(0, 0, canvas.width, HUD_HEIGHT);
  ctx.strokeStyle = currentTheme.primary;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(0, 0, canvas.width, HUD_HEIGHT);

  ctx.fillStyle = currentTheme.primary;
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`${currentTheme.name}`, 8, 16);
  ctx.fillStyle = '#ffff00';
  ctx.fillText(`PTS: ${score}`, 8, 32);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'center';
  let tData = LEVEL_THEMES[Math.min(level - 1, LEVEL_THEMES.length - 1)];
  ctx.fillText(tData.title, canvas.width / 2, 26);

  ctx.fillStyle = '#ffff00';
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(`REC: ${highScore}`, canvas.width - 8, 16);
  ctx.fillStyle = '#ff0055';
  ctx.fillText(`VITE: ${'❤️'.repeat(lives)}`, canvas.width - 8, 34);

  if (currentTheme.guardCooldown > 0) {
    let barW = 70;
    let barH = 4;
    let barX = (canvas.width - barW) / 2;
    let barY = HUD_HEIGHT - 7;
    ctx.fillStyle = '#0a0a22';
    ctx.fillRect(barX, barY, barW, barH);
    let fillPct = 1 - (player.guardCooldownTimer / currentTheme.guardCooldown);
    ctx.fillStyle = (player.guardCooldownTimer <= 0) ? '#ff0055' : '#88002d';
    ctx.fillRect(barX, barY, barW * fillPct, barH);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(barX, barY, barW, barH);
  }
}

function drawTutorial() {
  ctx.fillStyle = 'rgba(4, 4, 18, 0.96)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#ff0055';
  ctx.font = 'bold 18px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('DEADLINE DODGE 🚗', canvas.width / 2, 40);

  drawRoundRect(ctx, 12, 60, 314, 78, 10);
  ctx.fillStyle = '#101228'; ctx.fill();
  ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#ff0055'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'left';
  ctx.fillText('SCHIVA GLI OSTACOLI DI SET', 22, 82);
  ctx.fillStyle = '#ffffff'; ctx.font = '10px monospace';
  ctx.fillText('Attraversa le tracce ed evita', 22, 100);
  ctx.fillText('Render Crash, File Lenti e Bug!', 22, 116);

  drawRoundRect(ctx, 12, 148, 314, 78, 10);
  ctx.fillStyle = '#101228'; ctx.fill();
  ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#ff0055'; ctx.font = 'bold 11px monospace';
  ctx.fillText('PROTEZIONE RENDER GUARD', 22, 170);
  ctx.fillStyle = '#ffffff'; ctx.font = '10px monospace';
  ctx.fillText('Premi 🛡️ RENDER sotto', 22, 190);
  ctx.fillText('per diventare invincibile temporaneamente!', 22, 206);

  drawRoundRect(ctx, 12, 236, 314, 78, 10);
  ctx.fillStyle = '#101228'; ctx.fill();
  ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 11px monospace';
  ctx.fillText('CONTROLLI PC & TOUCH', 22, 258);
  ctx.fillStyle = '#ffffff'; ctx.font = '10px monospace';
  ctx.fillText('Usa il D-Pad o WASD/Frecce.', 22, 278);
  ctx.fillText('Seleziona il tuo videomaker preferito!', 22, 294);

  ctx.fillStyle = '#ffff00';
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`RECORD ATTUALE: ${highScore} PTS`, canvas.width / 2, 342);

  drawRoundRect(ctx, 16, 368, 306, 42, 10);
  ctx.fillStyle = '#ff0055'; ctx.fill();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px monospace';
  ctx.fillText('AVANTI: SCEGLI VIDEOMAKER ►', canvas.width / 2, 396);
}

function drawCharSelect() {
  ctx.fillStyle = 'rgba(4, 4, 18, 0.96)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#ffff00';
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('Scegli il tuo Creativo in Deadline Dodge', canvas.width / 2, 30);

  let cKey = CHARACTER_LIST[selectedCharIndex];
  let c = CHARACTERS[cKey];

  let cardW = 314;
  let cardH = 340;
  let cardX = (CANVAS_W - cardW) / 2;
  let cardY = 44;

  drawRoundRect(ctx, cardX, cardY, cardW, cardH, 12);
  ctx.fillStyle = '#101228'; ctx.fill();
  ctx.strokeStyle = c.primary; ctx.lineWidth = 2.5; ctx.stroke();

  let boxSize = 100;
  let boxX = (CANVAS_W - boxSize) / 2;
  let boxY = cardY + 12;

  if (c.img && c.img.complete && c.img.naturalWidth !== 0) {
    ctx.save();
    drawRoundRect(ctx, boxX, boxY, boxSize, boxSize, 12);
    ctx.clip();

    let imgW = c.img.naturalWidth;
    let imgH = c.img.naturalHeight;
    let scale = Math.min(boxSize / imgW, boxSize / imgH);
    let renderW = imgW * scale;
    let renderH = imgH * scale;
    let renderX = boxX + (boxSize - renderW) / 2;
    let renderY = boxY + (boxSize - renderH) / 2;

    ctx.drawImage(c.img, renderX, renderY, renderW, renderH);
    ctx.restore();
    drawRoundRect(ctx, boxX, boxY, boxSize, boxSize, 12);
    ctx.strokeStyle = c.primary; ctx.lineWidth = 2; ctx.stroke();
  } else {
    drawRoundRect(ctx, boxX, boxY, boxSize, boxSize, 12);
    ctx.fillStyle = c.primary; ctx.fill();
  }

  ctx.fillStyle = c.primary;
  ctx.font = 'bold 18px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(c.name, CANVAS_W / 2, cardY + 148);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 10px monospace';
  ctx.fillText(c.subtitle, CANVAS_W / 2, cardY + 166);

  ctx.fillStyle = '#ffff00';
  ctx.font = '9px monospace';
  ctx.fillText(c.perkBonus, CANVAS_W / 2, cardY + 188);

  ctx.fillStyle = '#ff0055';
  ctx.font = '9px monospace';
  ctx.fillText(c.perkMalus, CANVAS_W / 2, cardY + 204);

  ctx.fillStyle = c.primary;
  ctx.font = 'bold 11px monospace';
  ctx.fillText('► TOCCA PER CONFERMARE ◄', CANVAS_W / 2, cardY + 238);

  let arrowY = cardY + cardH + 24;
  ctx.fillStyle = '#ff0055';
  ctx.font = 'bold 18px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('◄  CAMBIA PERSONAGGIO  ►', CANVAS_W / 2, arrowY);
}

function handleSelectionInput(dir) {
  playSound('cross');
  selectedCharIndex += dir;
  if (selectedCharIndex < 0) selectedCharIndex = CHARACTER_LIST.length - 1;
  if (selectedCharIndex >= CHARACTER_LIST.length) selectedCharIndex = 0;
}

function drawLevelClear() {
  ctx.fillStyle = 'rgba(4, 4, 18, 0.88)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let tData = LEVEL_THEMES[Math.min(level - 2, LEVEL_THEMES.length - 1)];

  ctx.fillStyle = currentTheme.primary;
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`${tData.title} COMPLETE! 🎉`, canvas.width / 2, canvas.height / 2 - 30);

  ctx.fillStyle = '#ff0055';
  ctx.font = 'bold 10px monospace';
  ctx.fillText(tData.msg, canvas.width / 2, canvas.height / 2);

  ctx.fillStyle = '#ffff00';
  ctx.font = 'bold 13px monospace';
  ctx.fillText(`BONUS STAGE: +${Math.floor(1000 * (level - 1) * currentTheme.scoreMult)} PTS`, canvas.width / 2, canvas.height / 2 + 35);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(4, 4, 18, 0.94)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#ff0055';
  ctx.font = 'bold 22px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('DEADLINE MISSED! 💀', canvas.width / 2, canvas.height / 2 - 40);

  ctx.fillStyle = '#ffff00';
  ctx.font = 'bold 15px monospace';
  ctx.fillText(`PUNTEGGIO: ${score}`, canvas.width / 2, canvas.height / 2 + 5);

  ctx.fillStyle = '#ff0055';
  ctx.font = 'bold 11px monospace';
  ctx.fillText(`RECORD ATTUALE: ${highScore}`, canvas.width / 2, canvas.height / 2 + 35);

  ctx.fillStyle = Math.floor(Date.now() / 400) % 2 === 0 ? '#ffffff' : currentTheme.primary;
  ctx.font = 'bold 11px monospace';
  ctx.fillText('► TOCCA PER GIOCARE ANCORA ◄', canvas.width / 2, canvas.height / 2 + 80);
}

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (gameState === 'TUTORIAL') {
    drawTutorial();
  } else if (gameState === 'CHAR_SELECT') {
    drawCharSelect();
  } else if (gameState === 'PLAYING') {
    updateVehicles();
    updatePlayer();
    drawGameWorld();
    drawHUD();
  } else if (gameState === 'LEVEL_CLEAR') {
    drawGameWorld();
    drawLevelClear();
    drawHUD();
  } else if (gameState === 'GAME_OVER') {
    drawGameWorld();
    drawGameOver();
  }

  requestAnimationFrame(gameLoop);
}

function selectCharacter(charKey) {
  currentTheme = CHARACTERS[charKey];
  canvas.style.borderColor = currentTheme.primary;
  canvas.style.boxShadow = `inset 0 0 15px ${currentTheme.primary}`;
  startInfiniteScroll();
  gameState = 'PLAYING';
  playSound('pickup');
}

canvas.addEventListener('pointerdown', (e) => {
  let rect = canvas.getBoundingClientRect();
  let x = (e.clientX - rect.left) * (canvas.width / rect.width);
  let y = (e.clientY - rect.top) * (canvas.height / rect.height);

  if (gameState === 'TUTORIAL') {
    if (y >= 330) { gameState = 'CHAR_SELECT'; playSound('cross'); }
    return;
  }

  if (gameState === 'CHAR_SELECT') {
    if (y >= 370) {
      if (x < CANVAS_W / 2) handleSelectionInput(-1);
      else handleSelectionInput(1);
    } else {
      selectCharacter(CHARACTER_LIST[selectedCharIndex]);
    }
    return;
  }

  if (gameState === 'GAME_OVER') {
    gameState = 'CHAR_SELECT';
    return;
  }
});

function bindBtn(id, onPress) {
  let btn = document.getElementById(id);
  if (!btn) return;
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (gameState === 'TUTORIAL' || gameState === 'GAME_OVER') {
      gameState = 'CHAR_SELECT';
    } else if (gameState === 'CHAR_SELECT') {
      selectCharacter(CHARACTER_LIST[selectedCharIndex]);
    } else {
      onPress(true);
    }
  });
  btn.addEventListener('pointerup', (e) => {
    e.preventDefault();
    onPress(false);
  });
}

bindBtn('btnUp', isDown => { moveUp = isDown; });
bindBtn('btnDown', isDown => { moveDown = isDown; });
bindBtn('btnLeft', isDown => { moveLeft = isDown; });
bindBtn('btnRight', isDown => { moveRight = isDown; });
bindBtn('btnGuard', isDown => { if (isDown) activateGuard(); });

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (gameState === 'TUTORIAL' && (e.code === 'Space' || e.code === 'Enter')) {
    gameState = 'CHAR_SELECT';
  } else if (gameState === 'CHAR_SELECT') {
    if (e.key === 'ArrowLeft' || e.key === 'a') handleSelectionInput(-1);
    if (e.key === 'ArrowRight' || e.key === 'd') handleSelectionInput(1);
    if (e.code === 'Space' || e.code === 'Enter') selectCharacter(CHARACTER_LIST[selectedCharIndex]);
  } else if (gameState === 'GAME_OVER' && (e.code === 'Space' || e.code === 'Enter')) {
    gameState = 'CHAR_SELECT';
  } else if (gameState === 'PLAYING' && (e.code === 'Space' || e.code === 'KeyZ')) {
    activateGuard();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function keyPressed(code) { return !!keys[code]; }

function saveScore() {
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('deadlineDrive_highScore', highScore);
  }
  if (score <= 0) return;
  let curUser = JSON.parse(localStorage.getItem('arcade_current_user'));
  if (curUser) {
    curUser.stats.gamesPlayed = (curUser.stats.gamesPlayed || 0) + 1;
    curUser.stats.deadlineDrive = (curUser.stats.deadlineDrive || 0) + score;
    localStorage.setItem('arcade_current_user', JSON.stringify(curUser));
    if (!curUser.username.startsWith("GUEST_")) {
      let users = JSON.parse(localStorage.getItem('arcade_users')) || {};
      if (users[curUser.username]) {
        users[curUser.username].stats = curUser.stats;
        localStorage.setItem('arcade_users', JSON.stringify(users));
      }
    }
  }
}

function exitGame() {
  saveScore();
  window.location.href = 'index.html';
}

requestAnimationFrame(gameLoop);
</script>
</body>
