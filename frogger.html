<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Deadline Drive - Premiere Pro Timeline Rush</title>
<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none !important;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #030305;
    color: #e0e0e0;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #game-wrapper {
    position: relative;
    width: 100vw;
    height: 100dvh;
    max-width: 440px;
    max-height: 860px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: max(env(safe-area-inset-top), 6px) 8px max(env(safe-area-inset-bottom), 6px) 8px;
    background: #1e1e1e;
    border: 2px solid #333333;
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 210, 255, 0.2);
    border-radius: 14px;
  }

  /* TOP BAR PREMIERE PRO STYLE */
  .top-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 6px;
    background: #282828;
    border-bottom: 1px solid #3a3a3a;
    border-radius: 8px 8px 0 0;
    margin-bottom: 2px;
    flex-shrink: 0;
  }
  .header-title {
    color: #00d2ff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    font-family: 'Courier New', monospace;
  }
  .opt-btn {
    background: #333333;
    border: 1px solid #555555;
    color: #ffea00;
    padding: 3px 8px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
  }
  .opt-btn:active { transform: scale(0.92); }

  #canvas-container {
    position: relative;
    width: 100%;
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    min-height: 0;
  }
  canvas {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    aspect-ratio: 338 / 486;
    border: 1.5px solid #3a3a3a;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    background: #181818;
    cursor: pointer;
    border-radius: 6px;
  }

  /* DECK DI CONTROLLO CENTRATO CON D-PAD XL */
  .control-deck {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px 12px;
    background: #232323;
    border: 1.5px solid #383838;
    border-radius: 12px;
    margin-top: 4px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    flex-shrink: 0;
  }

  /* D-PAD A CROCE CON TASTI XL CENTRATO */
  .joystick-container {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .dpad-grid {
    display: grid;
    grid-template-columns: repeat(3, 62px);
    grid-template-rows: repeat(3, 54px);
    gap: 4px;
  }
  .ctrl-btn {
    background: linear-gradient(180deg, #32323e 0%, #1c1c24 100%);
    border: 1.5px solid #00d2ff;
    color: #00d2ff;
    font-size: 24px;
    font-weight: bold;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 4px 0 #005f73, inset 0 1px 0 rgba(255,255,255,0.2);
    text-shadow: 0 0 6px rgba(0, 210, 255, 0.6);
  }
  .ctrl-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #005f73;
    background: #00d2ff;
    color: #000;
    text-shadow: none;
  }
  .ctrl-btn-center {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #18181c;
    border-radius: 50%;
    border: 1.5px solid rgba(0,210,255,0.3);
  }
  .dpad-core {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: radial-gradient(circle, #00d2ff 0%, #005f73 100%);
    box-shadow: 0 0 10px #00d2ff;
  }

  .exit-btn {
    width: 100%;
    margin-top: 4px;
    padding: 7px;
    background: #222222;
    border: 1px solid #444444;
    color: #ff3366;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    font-size: 10px;
    border-radius: 6px;
    cursor: pointer;
    text-align: center;
    flex-shrink: 0;
  }
  .exit-btn:active { transform: scale(0.96); }

  /* MODALE OPZIONI */
  .modal-overlay {
    display: none;
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(18, 18, 18, 0.95);
    z-index: 200;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }
  .modal-box {
    width: 100%;
    max-width: 300px;
    background: #232323;
    border: 2px solid #00d2ff;
    box-shadow: 0 0 25px rgba(0, 210, 255, 0.3);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    color: #ffffff;
    text-align: center;
  }
  .modal-title {
    color: #ffea00;
    font-size: 14px;
    font-weight: 900;
    font-family: 'Courier New', monospace;
  }
  .option-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: #1a1a1a;
    padding: 8px;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
  }
  .option-label {
    font-size: 11px;
    font-weight: bold;
    color: #00d2ff;
    font-family: 'Courier New', monospace;
  }
  .toggle-btn {
    width: 100%;
    padding: 8px;
    background: #2a2a2a;
    border: 1.5px solid #ff0055;
    color: #ffffff;
    font-weight: bold;
    font-size: 12px;
    font-family: 'Courier New', monospace;
    border-radius: 6px;
    cursor: pointer;
  }
  .toggle-btn.active {
    border-color: #00ff66;
    color: #00ff66;
    background: #122818;
  }
  .close-modal-btn {
    padding: 10px;
    background: #00d2ff;
    border: none;
    color: #000000;
    font-weight: bold;
    font-size: 12px;
    font-family: 'Courier New', monospace;
    border-radius: 6px;
    cursor: pointer;
  }
</style>
</head>
<body>

<audio id="bgMusic" src="assets/frogger/music.mp3" loop autoplay playsinline style="display:none;"></audio>

<div id="game-wrapper">
  <!-- TOP BAR PREMIERE UI -->
  <div class="top-header">
    <span class="header-title">SEQUENCE: TIMELINE_RUSH_2026</span>
    <button class="opt-btn" id="btnOpenSettings">⚙️ OPZIONI</button>
  </div>

  <div id="canvas-container">
    <canvas id="game"></canvas>
  </div>

  <div class="control-deck">
    <!-- D-PAD A CROCE XL CENTRATO -->
    <div class="joystick-container">
      <div class="dpad-grid">
        <div style="visibility:hidden"></div><div class="ctrl-btn" id="btnUp">▲</div><div style="visibility:hidden"></div>
        <div class="ctrl-btn" id="btnLeft">◄</div><div class="ctrl-btn-center"><div class="dpad-core"></div></div><div class="ctrl-btn" id="btnRight">►</div>
        <div style="visibility:hidden"></div><div class="ctrl-btn" id="btnDown">▼</div><div style="visibility:hidden"></div>
      </div>
    </div>
  </div>

  <button class="exit-btn" onclick="exitGame()">◄ TORNA ALL'HUB ARCADE</button>

  <!-- MODALE OPZIONI -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box">
      <div class="modal-title">⚙️ TIMELINE SETTINGS</div>

      <div class="option-item">
        <span class="option-label">MUSICA DI SOTTOFONDO</span>
        <button class="toggle-btn active" id="btnToggleMusic">ON 🎵</button>
      </div>

      <div class="option-item">
        <span class="option-label">EFFETTI SONORI (SFX)</span>
        <button class="toggle-btn active" id="btnToggleSfx">ON 🔊</button>
      </div>

      <button class="close-modal-btn" id="btnCloseSettings">SALVA E CHIUDI ►</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const COLS = 13;
const ROWS = 17;
const CELL_SIZE = 26;
const HUD_HEIGHT = 44;
const TRACK_HEADER_W = 38;

const CANVAS_W = COLS * CELL_SIZE; // 338px
const CANVAS_H = ROWS * CELL_SIZE + HUD_HEIGHT; // 486px

canvas.width = CANVAS_W;
canvas.height = CANVAS_H;

function drawRoundRect(c, x, y, w, h, r) {
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// --- CONFIGURAZIONE OPZIONI & AUDIO ---
let musicEnabled = localStorage.getItem('deadlineDrive_music') !== 'false';
let sfxEnabled = localStorage.getItem('deadlineDrive_sfx') !== 'false';

const bgMusic = document.getElementById('bgMusic');
bgMusic.volume = 0.4;

function playBgMusic() {
  if (musicEnabled && bgMusic.paused) {
    bgMusic.play().catch(() => {});
  }
}

playBgMusic();
window.addEventListener('DOMContentLoaded', playBgMusic);
window.addEventListener('load', playBgMusic);
['pointerdown', 'touchstart', 'click', 'keydown'].forEach(evt => {
  window.addEventListener(evt, () => playBgMusic(), { once: true });
});

function updateMusicState() {
  if (musicEnabled) {
    playBgMusic();
  } else {
    bgMusic.pause();
  }
}

const settingsModal = document.getElementById('settingsModal');
const btnOpenSettings = document.getElementById('btnOpenSettings');
const btnCloseSettings = document.getElementById('btnCloseSettings');
const btnToggleMusic = document.getElementById('btnToggleMusic');
const btnToggleSfx = document.getElementById('btnToggleSfx');

function renderOptionButtons() {
  btnToggleMusic.className = `toggle-btn ${musicEnabled ? 'active' : ''}`;
  btnToggleMusic.innerText = musicEnabled ? 'ON 🎵' : 'OFF 🔇';

  btnToggleSfx.className = `toggle-btn ${sfxEnabled ? 'active' : ''}`;
  btnToggleSfx.innerText = sfxEnabled ? 'ON 🔊' : 'OFF 🔇';
}
renderOptionButtons();

btnToggleMusic.onclick = () => {
  musicEnabled = !musicEnabled;
  localStorage.setItem('deadlineDrive_music', musicEnabled);
  renderOptionButtons();
  updateMusicState();
};

btnToggleSfx.onclick = () => {
  sfxEnabled = !sfxEnabled;
  localStorage.setItem('deadlineDrive_sfx', sfxEnabled);
  renderOptionButtons();
};

btnOpenSettings.onclick = () => {
  if (gameState === 'PLAYING') {
    gameState = 'PAUSE';
  }
  settingsModal.style.display = 'flex';
};

btnCloseSettings.onclick = () => {
  settingsModal.style.display = 'none';
  getAC();
  if (gameState === 'PAUSE') {
    gameState = 'PLAYING';
  }
  updateMusicState();
};

// AUDIO SYNTH SFX
let audioCtx = null;
function getAC() {
  try {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) audioCtx = new AudioContextClass();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  } catch(e) {}
  playBgMusic();
  return audioCtx;
}

function playSound(type) {
  if (!sfxEnabled) return;
  try {
    const ac = getAC();
    if (!ac) return;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);

    if (type === 'cross') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523, ac.currentTime);
      osc.frequency.setValueAtTime(659, ac.currentTime + 0.08);
      gain.gain.setValueAtTime(0.18, ac.currentTime);
      osc.start(); osc.stop(ac.currentTime + 0.16);
    } else if (type === 'crash') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(250, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, ac.currentTime + 0.25);
      gain.gain.setValueAtTime(0.25, ac.currentTime);
      osc.start(); osc.stop(ac.currentTime + 0.25);
    } else if (type === 'guard_active') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, ac.currentTime);
      osc.frequency.linearRampToValueAtTime(1200, ac.currentTime + 0.1);
      gain.gain.setValueAtTime(0.15, ac.currentTime);
      osc.start(); osc.stop(ac.currentTime + 0.1);
    } else if (type === 'pickup') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, ac.currentTime);
      osc.frequency.setValueAtTime(880, ac.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, ac.currentTime);
      osc.start(); osc.stop(ac.currentTime + 0.2);
    } else if (type === 'malus') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, ac.currentTime);
      osc.frequency.linearRampToValueAtTime(80, ac.currentTime + 0.2);
      gain.gain.setValueAtTime(0.2, ac.currentTime);
      osc.start(); osc.stop(ac.currentTime + 0.2);
    } else if (type === 'fail') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ac.currentTime);
      osc.frequency.linearRampToValueAtTime(50, ac.currentTime + 0.3);
      gain.gain.setValueAtTime(0.25, ac.currentTime);
      osc.start(); osc.stop(ac.currentTime + 0.3);
    }
  } catch(e) {}
}

// RITRATTI
const imgGiulia = new Image(); imgGiulia.src = 'assets/frogger/giulia.png';
const imgTobi   = new Image(); imgTobi.src   = 'assets/frogger/tobi.png';
const imgDave   = new Image(); imgDave.src   = 'assets/frogger/dave.png';
const imgLuca   = new Image(); imgLuca.src   = 'assets/frogger/luca.png';

// PALETTE COLORI ADOBE PREMIERE PRO TIMELINE
const PREMIERE_CLIPS = {
  BLUE_A_ROLL:    { type: 'A_ROLL',    label: 'A001_C004.MOV',  bg: '#2b52a1', border: '#5682e8', textCol: '#d0e0ff', topBar: '#00ff66', wMult: 2.2, hMult: 1 },
  PURPLE_B_ROLL:  { type: 'B_ROLL',    label: 'B002_DRONE.MP4', bg: '#7f22a7', border: '#b842df', textCol: '#f2c8ff', topBar: '#ff0055', wMult: 2.5, hMult: 1 },
  ROSE_LUMETRI:   { type: 'LUMETRI',   label: 'LUMETRI COLOR',  bg: '#a11b43', border: '#e64273', textCol: '#ffd4e2', topBar: '#ffee00', wMult: 2.0, hMult: 1 },
  GOLD_VOICEOVER: { type: 'VOICEOVER', label: 'VO_MASTER_V2',   bg: '#8f7d18', border: '#dbc330', textCol: '#fdf8c2', topBar: '#00ff66', isAudio: true, wMult: 2.0, hMult: 1 },
  GREEN_SFX:      { type: 'SFX_WAVE',  label: 'SFX_WHOOSH.WAV', bg: '#2d7a3a', border: '#4ec462', textCol: '#d2f8da', topBar: '#00ff66', isAudio: true, wMult: 1.8, hMult: 1 },
  TEAL_MUSIC:     { type: 'MUSIC',     label: 'BEAT_TRACK_FLAC',bg: '#147b85', border: '#23b3be', textCol: '#c2f8fc', topBar: '#00ff66', isAudio: true, wMult: 2.8, hMult: 1 },
  NESTED_SEQ:     { type: 'NESTED',    label: 'NEST_INTRO_SEQ', bg: '#5b1e8a', border: '#8b3adb', textCol: '#e8cbff', topBar: '#ffee00', wMult: 3.0, hMult: 1 },
  OFFLINE_RED:    { type: 'OFFLINE',   label: 'MEDIA OFFLINE! 🔴',bg: '#8b0000', border: '#ff3333', textCol: '#ffffff', topBar: '#ff0000', wMult: 3.2, hMult: 1 }
};

const LEVEL_THEMES = [
  { levelMin: 1, title: "STAGE 1: ASSEMBLY TIMELINE", msg: "Primi stacchi video: pochi ostacoli e flusso regolare!" },
  { levelMin: 2, title: "STAGE 2: MONTAGGIO RUSH", msg: "Aumentano le clip b-roll e le tracce audio!" },
  { levelMin: 3, title: "STAGE 3: COLOR & FX MULTI-LAYER", msg: "Lumetri Color, Nested Sequences e tracce complesse!" },
  { levelMin: 4, title: "STAGE 4: EXPORT FINALE PRE-DEADLINE", msg: "Massima densità e velocità sulla Timeline!" }
];

const CHARACTERS = {
  GIULIA: {
    id: 'GIULIA', name: "GIULIA", subtitle: "Lead Video Editor",
    perkBonus: "BONUS: Precisione (Punti 1.25x)",
    perkMalus: "MALUS: Sensibile al Glitch",
    primary: "#00d2ff", bg: "#181818", img: imgGiulia,
    arrowCol: "#00d2ff", arrowGlow: "#005f73",
    speed: 2.8, scoreMult: 1.25
  },
  TOBI: {
    id: 'TOBI', name: "TOBI", subtitle: "Assistant Video Editor",
    perkBonus: "BONUS: Agilità (+20% Velocità)",
    perkMalus: "MALUS: Punteggio Base (-10%)",
    primary: "#ffd700", bg: "#181818", img: imgTobi,
    arrowCol: "#ffd700", arrowGlow: "#886600",
    speed: 3.4, scoreMult: 0.9
  },
  DAVE: {
    id: 'DAVE', name: "DAVE", subtitle: "Focused Director",
    perkBonus: "BONUS: Autorità (+30% Punteggio)",
    perkMalus: "MALUS: Passo Pesante (-20% Velocità)",
    primary: "#ff0055", bg: "#181818", img: imgDave,
    arrowCol: "#ff0055", arrowGlow: "#880022",
    speed: 2.0, scoreMult: 1.3
  },
  LUCA: {
    id: 'LUCA', name: "LUCA", subtitle: "VFX Artist Whiz",
    perkBonus: "BONUS: VFX Master (+15% Punti)",
    perkMalus: "MALUS: Meno Vite Iniziali",
    primary: "#ffaa00", bg: "#181818", img: imgLuca,
    arrowCol: "#ffaa00", arrowGlow: "#885500",
    speed: 3.2, scoreMult: 1.15
  }
};

const CHARACTER_LIST = ['GIULIA', 'TOBI', 'DAVE', 'LUCA'];

const PICKUP_TYPES = {
  AUTO_SAVE:  { type: 'AUTOSAVE',  label: '💾 SAVE',     pts: 300, isMalus: false },
  PROXY_ON:   { type: 'PROXY',     label: '🎬 PROXY 2X', pts: 400, isMalus: false, scoreBoost: 2.0 },
  CACHE_BOOST:{ type: 'CACHE',     label: '⚡ CACHE',    pts: 150, isMalus: false, speedBoost: 1.3 },
  GUARD:      { type: 'GUARD',     label: '🛡️ RENDER',  pts: 250, isMalus: false, shieldDuration: 180 },
  DROP_FRAME: { type: 'DROP_FRAME',label: '🐌 DROP',     pts: -100, isMalus: true,  slowFactor: 0.6 },
  DISK_FULL:  { type: 'DISK_FULL', label: '⚠️ FULL DISK',pts: -200, isMalus: true,  invertControls: true }
};

let currentTheme = CHARACTERS.GIULIA;
let highScore = parseInt(localStorage.getItem('deadlineDrive_highScore')) || 0;

let activeLanes = [];
let gameState = 'TUTORIAL';
let level = 1;
let score = 0;
let lives = 3;
let visualScrollOffset = 0; 

let player = {
  gx: Math.floor(COLS / 2),
  gy: ROWS - 2,
  w: 16, h: 16,
  facingLeft: false,
  invTimer: 0,
  guardTimer: 0,
  nextMoveAllowedTimer: 0,
  speedMult: 1.0,
  tempScoreMult: 1.0,
  glitchTimer: 0
};

let moveUp = false, moveDown = false, moveLeft = false, moveRight = false;
let selectedCharIndex = 0;
let particles = [];

function createNewLane(isInitialSetup = false, r = 0) {
  let isSafe = false;

  let safeChance = Math.max(0.20, 0.45 - (level * 0.08));

  if (isInitialSetup) {
    isSafe = (r === 0 || r === ROWS - 1 || r === ROWS - 2 || r === ROWS - 3 || (r % 3 === 0 && level === 1));
  } else {
    let topLane = activeLanes[0];
    if (topLane && topLane.type === 'SAFE') {
      isSafe = false;
    } else {
      isSafe = Math.random() < safeChance;
    }
  }

  let laneType = isSafe ? 'SAFE' : 'ROAD';
  let dir = (Math.random() < 0.5) ? 1 : -1;

  let speedFactor = 0.38 + Math.min(level * 0.16, 1.2);
  let baseSpeed = (0.45 + Math.random() * 0.35) * speedFactor;

  let vTypes = Object.values(PREMIERE_CLIPS);

  let trackLabel = "V1";
  if (r % 5 === 0) trackLabel = "V3";
  else if (r % 5 === 1) trackLabel = "V2";
  else if (r % 5 === 2) trackLabel = "V1";
  else if (r % 5 === 3) trackLabel = "A1";
  else trackLabel = "A2";

  let laneObj = {
    type: laneType,
    trackLabel: isSafe ? "SAFE" : trackLabel,
    bg: isSafe ? '#1c2230' : '#141416',
    dir: dir,
    speed: baseSpeed,
    objects: [],
    pickups: []
  };

  if (laneType === 'ROAD') {
    let x = TRACK_HEADER_W - CELL_SIZE * 3;
    let minGap = Math.max(4.0, 10.0 - (level * 1.5));
    
    do {
      x += CELL_SIZE * (Math.random() * 2.5 + minGap);
      if (x < CANVAS_W + CELL_SIZE * 3) {
        let vType = vTypes[Math.floor(Math.random() * vTypes.length)];
        laneObj.objects.push({ x, type: vType, w: vType.wMult * CELL_SIZE, hMult: vType.hMult });
      }
    } while (x < CANVAS_W + CELL_SIZE * 3);
  } else if (isSafe && Math.random() < 0.35) {
    let pTypeKeys = Object.keys(PICKUP_TYPES);
    let chosenKey = pTypeKeys[Math.floor(Math.random() * pTypeKeys.length)];
    laneObj.pickups.push({
      gx: Math.floor(Math.random() * (COLS - 3)) + 2,
      type: PICKUP_TYPES[chosenKey]
    });
  }

  return laneObj;
}

function startInfiniteScroll() {
  activeLanes = [];
  visualScrollOffset = 0;
  for (let r = 0; r < ROWS; r++) {
    activeLanes.push(createNewLane(true, r));
  }
  resetPlayer();
}

function resetPlayer() {
  player.gx = Math.floor(COLS / 2);
  player.gy = ROWS - 2;
  player.w = 16; player.h = 16;
  player.invTimer = 0;
  player.guardTimer = 0;
  player.nextMoveAllowedTimer = 0;
  player.speedMult = 1.0;
  player.tempScoreMult = 1.0;
  player.glitchTimer = 0;
}

function updatePlayer() {
  if (player.nextMoveAllowedTimer > 0) player.nextMoveAllowedTimer--;
  if (player.glitchTimer > 0) player.glitchTimer--;
  
  if (player.nextMoveAllowedTimer <= 0) {
    let dx = 0, dy = 0;

    let inLeft = keyPressed('ArrowLeft') || keyPressed('KeyA') || moveLeft;
    let inRight = keyPressed('ArrowRight') || keyPressed('KeyD') || moveRight;
    let inUp = keyPressed('ArrowUp') || keyPressed('KeyW') || moveUp;
    let inDown = keyPressed('ArrowDown') || keyPressed('KeyS') || moveDown;

    if (player.glitchTimer > 0) {
      let tempL = inLeft, tempR = inRight, tempU = inUp, tempD = inDown;
      inLeft = tempR; inRight = tempL; inUp = tempD; inDown = tempU;
    }

    if (inLeft) { dx--; player.facingLeft = true; }
    else if (inRight) { dx++; player.facingLeft = false; }
    
    if (inUp) dy--;
    else if (inDown) dy++;

    if (dx !== 0 || dy !== 0) {
      let ngx = player.gx + dx;
      let ngy = player.gy + dy;

      let minGx = 2; 
      
      if (ngx >= minGx && ngx < COLS && ngy >= 0 && ngy < ROWS) {
        player.gx = ngx;
        player.gy = ngy;

        if (dy < 0 && player.gy < 6) {
          scrollWorldDown();
        } else if (dy < 0) {
          score += Math.floor(10 * level * currentTheme.scoreMult * player.tempScoreMult);
        }

        playSound('cross');
        let effSpeed = currentTheme.speed * player.speedMult;
        player.nextMoveAllowedTimer = Math.max(5, Math.floor(14 / effSpeed));
      }
    }
  }

  if (player.invTimer > 0) player.invTimer--;
  if (player.guardTimer > 0) player.guardTimer--;

  checkPickups();
  checkCollisions();
}

function scrollWorldDown() {
  activeLanes.pop();
  activeLanes.unshift(createNewLane(false));
  player.gy++; 
  visualScrollOffset -= CELL_SIZE; 
  score += Math.floor(15 * level * currentTheme.scoreMult * player.tempScoreMult);

  if (score > level * 1200) {
    level++;
  }
}

function updateVehicles() {
  visualScrollOffset += (0 - visualScrollOffset) * 0.25;
  if (Math.abs(visualScrollOffset) < 0.1) visualScrollOffset = 0;

  activeLanes.forEach(lane => {
    if (lane.type === 'ROAD') {
      lane.objects.forEach(obj => {
        obj.x += lane.speed * lane.dir;
        if (lane.dir > 0 && obj.x > CANVAS_W + obj.w) {
          obj.x = TRACK_HEADER_W - obj.w;
        } else if (lane.dir < 0 && obj.x < TRACK_HEADER_W - obj.w) {
          obj.x = CANVAS_W + obj.w;
        }
      });
    }
  });

  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function addParticles(x, y, color, count = 8) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      life: 16,
      color
    });
  }
}

function checkPickups() {
  let currentLane = activeLanes[player.gy];
  if (!currentLane || currentLane.pickups.length === 0) return;

  for (let i = currentLane.pickups.length - 1; i >= 0; i--) {
    let p = currentLane.pickups[i];
    if (p.gx === player.gx) {
      score += Math.floor(p.type.pts * currentTheme.scoreMult);
      if (p.type.isMalus) {
        playSound('malus');
        if (p.type.slowFactor) player.speedMult = p.type.slowFactor;
        if (p.type.invertControls) player.glitchTimer = 180;
      } else {
        playSound('pickup');
        if (p.type.speedBoost) player.speedMult = p.type.speedBoost;
        if (p.type.scoreBoost) player.tempScoreMult = p.type.scoreBoost;
        if (p.type.shieldDuration) {
          player.guardTimer = p.type.shieldDuration;
          playSound('guard_active');
        }
      }
      addParticles(player.gx * CELL_SIZE + CELL_SIZE / 2, player.gy * CELL_SIZE + HUD_HEIGHT, p.type.isMalus ? '#ff0055' : '#00d2ff', 10);
      currentLane.pickups.splice(i, 1);
    }
  }
}

function isInvincible() { return player.invTimer > 0 || player.guardTimer > 0; }

function checkCollisions() {
  if (gameState !== 'PLAYING' || isInvincible()) return;

  let playerX = player.gx * CELL_SIZE + CELL_SIZE / 2;

  for (let offset = 0; offset <= 1; offset++) {
    let checkLaneIdx = player.gy - offset;
    if (checkLaneIdx < 0 || checkLaneIdx >= ROWS) continue;

    let lane = activeLanes[checkLaneIdx];
    if (!lane || lane.type !== 'ROAD') continue;

    lane.objects.forEach(obj => {
      if (offset === 1 && obj.hMult !== 2) return;

      let oLeft = obj.x;
      let oRight = obj.x + obj.w;
      let pLeft = playerX - player.w / 2;
      let pRight = playerX + player.w / 2;

      if (pLeft < oRight && pRight > oLeft) {
        hitPlayer();
      }
    });
  }
}

// RESPAWN ALLA PRIMA CORSIA SAFE INDIETRO
function hitPlayer() {
  lives--;
  playSound('crash');
  addParticles(player.gx * CELL_SIZE + CELL_SIZE / 2, player.gy * CELL_SIZE + HUD_HEIGHT, '#ff0055', 20);
  
  if (lives <= 0) {
    gameState = 'GAME_OVER';
    playSound('fail');
    saveScore();
  } else {
    // Cerca la prima corsia SAFE alla posizione attuale o indietro (aumentando gy)
    let respawnGy = ROWS - 2;
    for (let r = player.gy; r < ROWS; r++) {
      if (activeLanes[r] && activeLanes[r].type === 'SAFE') {
        respawnGy = r;
        break;
      }
    }
    player.gx = Math.floor(COLS / 2);
    player.gy = respawnGy;
    player.invTimer = 90;
    player.glitchTimer = 0;
    player.speedMult = 1.0;
    player.tempScoreMult = 1.0;
  }
}

function drawGameWorld() {
  ctx.fillStyle = '#181818'; 
  ctx.fillRect(0, HUD_HEIGHT, CANVAS_W, CANVAS_H - HUD_HEIGHT);

  activeLanes.forEach((lane, r) => {
    let y = r * CELL_SIZE + HUD_HEIGHT + visualScrollOffset;
    ctx.fillStyle = lane.bg;
    ctx.fillRect(0, y, CANVAS_W, CELL_SIZE);
    
    ctx.strokeStyle = '#222226';
    ctx.lineWidth = 1;
    ctx.strokeRect(0, y, CANVAS_W, CELL_SIZE);
  });

  activeLanes.forEach((lane, r) => {
    if (lane.type === 'SAFE') {
      let y = r * CELL_SIZE + HUD_HEIGHT + visualScrollOffset;
      lane.pickups.forEach(p => {
        let px = p.gx * CELL_SIZE + CELL_SIZE / 2;
        let py = y + CELL_SIZE / 2;
        ctx.fillStyle = p.type.isMalus ? '#ff0055' : '#ffff00';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.type.label.split(' ')[0], px, py);
      });
    }
  });

  activeLanes.forEach((lane, r) => {
    if (lane.type === 'ROAD') {
      let y = r * CELL_SIZE + HUD_HEIGHT + visualScrollOffset;
      drawObstacles(lane, y);
    }
  });

  activeLanes.forEach((lane, r) => {
    let y = r * CELL_SIZE + HUD_HEIGHT + visualScrollOffset;
    ctx.fillStyle = '#222226';
    ctx.fillRect(0, y, TRACK_HEADER_W, CELL_SIZE);
    ctx.strokeStyle = '#323238';
    ctx.lineWidth = 1;
    ctx.strokeRect(0, y, TRACK_HEADER_W, CELL_SIZE);

    ctx.fillStyle = '#8a8a95';
    ctx.font = 'bold 9px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(lane.trackLabel, TRACK_HEADER_W / 2, y + CELL_SIZE / 2);
  });

  for (let i = 0; i < particles.length; i++) {
    let p = particles[i];
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
  }

  let playheadX = player.gx * CELL_SIZE + CELL_SIZE / 2;
  ctx.strokeStyle = 'rgba(0, 210, 255, 0.4)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(playheadX, HUD_HEIGHT);
  ctx.lineTo(playheadX, CANVAS_H);
  ctx.stroke();

  drawSinglePlayer();
}

function drawObstacles(lane, laneY) {
  lane.objects.forEach(obj => {
    let x = obj.x;
    let y = laneY;
    let vData = obj.type;
    let blockW = obj.w;
    let blockH = (obj.hMult === 2 ? CELL_SIZE * 2 : CELL_SIZE) - 2;

    if (x + blockW < TRACK_HEADER_W) return;

    ctx.save();
    ctx.fillStyle = vData.bg;
    ctx.fillRect(x + 1, y + 1, blockW - 2, blockH);
    
    ctx.fillStyle = vData.topBar || '#00ff66';
    ctx.fillRect(x + 1, y + 1, blockW - 2, 2);

    ctx.strokeStyle = vData.border;
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 1, y + 1, blockW - 2, blockH);

    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(x + 4, y + 4, 13, 10);
    ctx.fillStyle = '#00d2ff';
    ctx.font = 'bold 8px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('fx', x + 10, y + 9);

    if (vData.isAudio) {
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.setLineDash([3, 3]);
      ctx.moveTo(x + 18, y + blockH / 2);
      ctx.lineTo(x + blockW - 6, y + blockH / 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.fillStyle = vData.textCol;
    ctx.font = 'bold 9px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(vData.label, x + blockW / 2 + 6, y + blockH / 2 + 1, blockW - 22);
    ctx.restore();
  });
}

function drawSinglePlayer() {
  let playerY = player.gy * CELL_SIZE + HUD_HEIGHT + CELL_SIZE / 2 + visualScrollOffset;
  let playerX = player.gx * CELL_SIZE + CELL_SIZE / 2;
  
  if (player.invTimer > 0 && Math.floor(player.invTimer / 4) % 2 === 0) return;

  ctx.save();
  ctx.translate(playerX, playerY);

  if (player.facingLeft) {
    ctx.scale(-1, 1);
  }

  ctx.shadowColor = '#00d2ff';
  ctx.shadowBlur = 10;
  ctx.fillStyle = '#00d2ff';

  ctx.beginPath();
  ctx.moveTo(0, -12);    
  ctx.lineTo(10, 0);  
  ctx.lineTo(0, 12);   
  ctx.lineTo(-10, 0);   
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  if (player.glitchTimer > 0) {
    ctx.fillStyle = '#ff0055';
    ctx.font = 'bold 10px monospace';
    ctx.fillText('⚠', 0, -16);
  }

  if (player.guardTimer > 0) {
    ctx.shadowColor = '#00ff66';
    ctx.shadowBlur = 12;
    ctx.strokeStyle = '#00ff66';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 16, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function gameLoop() {
  try {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'TUTORIAL') {
      drawTutorial();
    } else if (gameState === 'CHAR_SELECT') {
      drawCharSelect();
    } else if (gameState === 'PLAYING') {
      updateVehicles();
      updatePlayer();
      drawGameWorld();
      drawHUD();
    } else if (gameState === 'PAUSE') {
      drawGameWorld();
      drawHUD();
      drawPause();
    } else if (gameState === 'LEVEL_CLEAR') {
      drawGameWorld();
      drawLevelClear();
      drawHUD();
    } else if (gameState === 'GAME_OVER') {
      drawGameWorld();
      drawGameOver();
    }
  } catch (err) {
    console.error("Game Loop Error:", err);
  }

  requestAnimationFrame(gameLoop);
}

function selectCharacter(charKey) {
  currentTheme = CHARACTERS[charKey];
  canvas.style.borderColor = currentTheme.primary;
  canvas.style.boxShadow = `inset 0 0 15px ${currentTheme.primary}`;
  startInfiniteScroll();
  gameState = 'PLAYING';
  playSound('pickup');
}

canvas.addEventListener('pointerdown', (e) => {
  if (e.cancelable) e.preventDefault();
  getAC();
  let rect = canvas.getBoundingClientRect();
  let x = (e.clientX - rect.left) * (canvas.width / rect.width);
  let y = (e.clientY - rect.top) * (canvas.height / rect.height);

  if (gameState === 'TUTORIAL') {
    if (y >= 330) { gameState = 'CHAR_SELECT'; playSound('cross'); }
    return;
  }

  if (gameState === 'CHAR_SELECT') {
    if (y >= 400) {
      if (x < CANVAS_W / 2) handleSelectionInput(-1);
      else handleSelectionInput(1);
    } else {
      selectCharacter(CHARACTER_LIST[selectedCharIndex]);
    }
    return;
  }

  if (gameState === 'PLAYING') {
    if (y < HUD_HEIGHT) {
      gameState = 'PAUSE';
      updateMusicState();
    }
    return;
  }

  if (gameState === 'PAUSE') {
    gameState = 'PLAYING';
    updateMusicState();
    return;
  }

  if (gameState === 'GAME_OVER') {
    gameState = 'CHAR_SELECT';
    return;
  }
}, { passive: false });

function bindBtn(id, onPress) {
  let btn = document.getElementById(id);
  if (!btn) return;
  btn.addEventListener('pointerdown', (e) => {
    if (e.cancelable) e.preventDefault();
    getAC();
    if (gameState === 'TUTORIAL' || gameState === 'GAME_OVER') {
      gameState = 'CHAR_SELECT';
    } else if (gameState === 'CHAR_SELECT') {
      selectCharacter(CHARACTER_LIST[selectedCharIndex]);
    } else {
      onPress(true);
    }
  }, { passive: false });
  btn.addEventListener('pointerup', (e) => {
    if (e.cancelable) e.preventDefault();
    onPress(false);
  }, { passive: false });
}

bindBtn('btnUp', isDown => { moveUp = isDown; });
bindBtn('btnDown', isDown => { moveDown = isDown; });
bindBtn('btnLeft', isDown => { moveLeft = isDown; });
bindBtn('btnRight', isDown => { moveRight = isDown; });

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  getAC();
  if (gameState === 'TUTORIAL' && (e.code === 'Space' || e.code === 'Enter')) {
    gameState = 'CHAR_SELECT';
  } else if (gameState === 'CHAR_SELECT') {
    if (e.key === 'ArrowLeft' || e.key === 'a') handleSelectionInput(-1);
    if (e.key === 'ArrowRight' || e.key === 'd') handleSelectionInput(1);
    if (e.code === 'Space' || e.code === 'Enter') selectCharacter(CHARACTER_LIST[selectedCharIndex]);
  } else if (gameState === 'GAME_OVER' && (e.code === 'Space' || e.code === 'Enter')) {
    gameState = 'CHAR_SELECT';
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function keyPressed(code) { return !!keys[code]; }

function saveScore() {
  try {
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('deadlineDrive_highScore', highScore.toString());
    }
    if (score <= 0) return;
    let rawUser = localStorage.getItem('arcade_current_user');
    if (!rawUser) return;
    let curUser = JSON.parse(rawUser);
    if (curUser && curUser.stats) {
      curUser.stats.gamesPlayed = (curUser.stats.gamesPlayed || 0) + 1;
      curUser.stats.deadlineDrive = (curUser.stats.deadlineDrive || 0) + score;
      localStorage.setItem('arcade_current_user', JSON.stringify(curUser));

      if (curUser.username && !curUser.username.startsWith("GUEST_")) {
        let rawUsers = localStorage.getItem('arcade_users');
        let users = rawUsers ? JSON.parse(rawUsers) : {};
        if (users[curUser.username]) {
          users[curUser.username].stats = curUser.stats;
          localStorage.setItem('arcade_users', JSON.stringify(users));
        }
      }
    }
  } catch (e) {
    console.warn("Save score error:", e);
  }
}

function exitGame() {
  saveScore();
  bgMusic.pause();
  window.location.href = 'index.html';
}

requestAnimationFrame(gameLoop);
</script>
