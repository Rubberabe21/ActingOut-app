function drawRoundRect(c,x,y,w,h,r){
 if(w<2*r)r=w/2;
 if(h<2*r)r=h/2;
 c.beginPath();
 c.moveTo(x+r,y);
 c.arcTo(x+w,y,x+w,y+h,r);
 c.arcTo(x+w,y+h,x,y+h,r);
 c.arcTo(x,y+h,x,y,r);
 c.arcTo(x,y,x+w,y,r);
 c.closePath()
}

let musicEnabled=localStorage.getItem('deadlineDrive_music')!=='false';
let sfxEnabled=localStorage.getItem('deadlineDrive_sfx')!=='false';

const bgMusic=document.getElementById('bgMusic');
bgMusic.volume=.4;

function playBgMusic(){
 if(musicEnabled&&bgMusic.paused)bgMusic.play().catch(()=>{})
}

playBgMusic();
window.addEventListener('DOMContentLoaded',playBgMusic);
window.addEventListener('load',playBgMusic);

['pointerdown','touchstart','click','keydown'].forEach(e=>
 window.addEventListener(e,()=>playBgMusic(),{once:true})
);

function updateMusicState(){
 if(musicEnabled)playBgMusic();
 else bgMusic.pause()
}

const btnOpenSettings=document.getElementById('btnOpenSettings');
const btnCloseSettings=document.getElementById('btnCloseSettings');

const btnToggleSfx=document.getElementById('btnToggleSfx');

function renderOptionButtons(){
 btnToggleMusic.className=`toggle-btn ${musicEnabled?'active':''}`;
 btnToggleMusic.innerText=musicEnabled?'ON 🎵':'OFF 🔇';

 btnToggleSfx.className=`toggle-btn ${sfxEnabled?'active':''}`;
 btnToggleSfx.innerText=sfxEnabled?'ON 🔊':'OFF 🔇'
}

renderOptionButtons();

btnToggleMusic.onclick=()=>{
 musicEnabled=!musicEnabled;
 localStorage.setItem('deadlineDrive_music',musicEnabled);
 renderOptionButtons();
 updateMusicState()
};

btnToggleSfx.onclick=()=>{
 sfxEnabled=!sfxEnabled;

};

btnOpenSettings.onclick=()=>{

};

btnCloseSettings.onclick=()=>{
 settingsModal.style.display='none';
 getAC();
 if(gameState==='PAUSE')gameState='PLAYING';
 updateMusicState()
};

let audioCtx=null;

function getAC(){
 try{
  if(!audioCtx){
   const A=window.AudioContext||window.webkitAudioContext;
   if(A)audioCtx=new A
  }

  if(audioCtx&&audioCtx.state==='suspended')
   audioCtx.resume().catch(()=>{});

 }catch(e){}

 playBgMusic();
 return audioCtx
}

function playSound(type){
 if(!sfxEnabled)return;

 try{
  const ac=getAC();
  if(!ac)return;

  const osc=ac.createOscillator();
  const gain=ac.createGain();

  osc.connect(gain);
  gain.connect(ac.destination);

  if(type==='cross'){
   osc.type='triangle';
   osc.frequency.setValueAtTime(523,ac.currentTime);
   osc.frequency.setValueAtTime(659,ac.currentTime+.08);
   gain.gain.setValueAtTime(.18,ac.currentTime);
   osc.start();
   osc.stop(ac.currentTime+.16)
  }

  else if(type==='crash'){
   osc.type='sawtooth';
   osc.frequency.setValueAtTime(250,ac.currentTime);
   osc.frequency.exponentialRampToValueAtTime(40,ac.currentTime+.25);
   gain.gain.setValueAtTime(.25,ac.currentTime);
   osc.start();
   osc.stop(ac.currentTime+.25)
  }

  else if(type==='guard_active'){
   osc.type='sine';
   osc.frequency.setValueAtTime(600,ac.currentTime);
   osc.frequency.linearRampToValueAtTime(1200,ac.currentTime+.1);
   gain.gain.setValueAtTime(.15,ac.currentTime);
   osc.start();
   osc.stop(ac.currentTime+.1)
  }

  else if(type==='pickup'){
   osc.type='triangle';
   osc.frequency.setValueAtTime(440,ac.currentTime);
   osc.frequency.setValueAtTime(880,ac.currentTime+.1);
   gain.gain.setValueAtTime(.2,ac.currentTime);
   osc.start();
   osc.stop(ac.currentTime+.2)
  }

  else if(type==='malus'){
   osc.type='sawtooth';
   osc.frequency.setValueAtTime(180,ac.currentTime);
   osc.frequency.linearRampToValueAtTime(80,ac.currentTime+.2);
   gain.gain.setValueAtTime(.2,ac.currentTime);
   osc.start();
   osc.stop(ac.currentTime+.2)
  }

  else if(type==='fail'){
   osc.type='sawtooth';
   osc.frequency.setValueAtTime(220,ac.currentTime);
   osc.frequency.linearRampToValueAtTime(50,ac.currentTime+.3);
   gain.gain.setValueAtTime(.25,ac.currentTime);
   osc.start();
   osc.stop(ac.currentTime+.3)
  }

 }catch(e){}
}

let player={

 w:16,

function createNewLane(isInitialSetup=false,r=0){
 let isSafe=false,
     safeChance=Math.max(.2,.45-level*.08);

 if(isInitialSetup)
  isSafe=(r===0||r===ROWS-1||r===ROWS-2||r===ROWS-3||(r%3===0&&level===1));
 else{
  let topLane=activeLanes[0];
  isSafe=(topLane&&topLane.type==='SAFE')?false:Math.random()<safeChance
 }

 let laneType=isSafe?'SAFE':'ROAD',
     dir=Math.random()<.5?1:-1,
     speedFactor=.38+Math.min(level*.16,1.2),
     baseSpeed=(.45+Math.random()*.35)*speedFactor;

 let vTypes=Object.values(PREMIERE_CLIPS),
     trackLabel=r%5===0?"V3":
                r%5===1?"V2":
                r%5===2?"V1":
                r%5===3?"A1":"A2";

 let laneObj={
  type:laneType,
  trackLabel:isSafe?"SAFE":trackLabel,
  bg:isSafe?'#1c2230':'#141416',
  dir,
  speed:baseSpeed,
  objects:[],
  pickups:[]
 };

 if(laneType==='ROAD'){
  let x=TRACK_HEADER_W-CELL_SIZE*3,
      minGap=Math.max(4,10-level*1.5);

  do{
   x+=CELL_SIZE*(Math.random()*2.5+minGap);

   if(x<CANVAS_W+CELL_SIZE*3){
    let vType=vTypes[Math.floor(Math.random()*vTypes.length)];

    laneObj.objects.push({
     x,
     type:vType,
     w:vType.wMult*CELL_SIZE,
     hMult:vType.hMult
    })
   }

  }while(x<CANVAS_W+CELL_SIZE*3)

 }else if(Math.random()<.35){

  let keys=Object.keys(PICKUP_TYPES),
      key=keys[Math.floor(Math.random()*keys.length)];

  laneObj.pickups.push({
   gx:Math.floor(Math.random()*(COLS-3))+2,
   type:PICKUP_TYPES[key]
  })
 }

 return laneObj
}

function startInfiniteScroll(){
 activeLanes=[];
 visualScrollOffset=0;

 for(let r=0;r<ROWS;r++)
  activeLanes.push(createNewLane(true,r));

 player.gx=Math.floor(COLS/2);
 player.gy=ROWS-2;
 player.w=16;
 player.h=16;
 player.invTimer=0;
 player.guardTimer=0;
 player.nextMoveAllowedTimer=0;
 player.speedMult=1;
 player.tempScoreMult=1;
 player.glitchTimer=0
}

function updatePlayer(){
 if(player.nextMoveAllowedTimer>0)
  player.nextMoveAllowedTimer--;

 if(player.glitchTimer>0)
  player.glitchTimer--;

 if(player.nextMoveAllowedTimer<=0){

  let dx=0,dy=0,
      inLeft=keyPressed('ArrowLeft')||keyPressed('KeyA')||moveLeft,
      inRight=keyPressed('ArrowRight')||keyPressed('KeyD')||moveRight,
      inUp=keyPressed('ArrowUp')||keyPressed('KeyW')||moveUp,
      inDown=keyPressed('ArrowDown')||keyPressed('KeyS')||moveDown;

  if(player.glitchTimer>0){
   let tL=inLeft,tR=inRight,tU=inUp,tD=inDown;
   inLeft=tR;
   inRight=tL;
   inUp=tD;
   inDown=tU
  }

  if(inLeft){
   dx--;
   player.facingLeft=true
  }else if(inRight){
   dx++;
   player.facingLeft=false
  }

  if(inUp)dy--;
  else if(inDown)dy++;

  if(dx||dy){

   let ngx=player.gx+dx,
       ngy=player.gy+dy;

   if(ngx>=2&&ngx<COLS&&ngy>=0&&ngy<ROWS){

    player.gx=ngx;
    player.gy=ngy;

    if(dy<0&&player.gy<6)
     scrollWorldDown();
    else if(dy<0)
     score+=Math.floor(10*level*currentTheme.scoreMult*player.tempScoreMult);

    playSound('cross');

    let effSpeed=currentTheme.speed*player.speedMult;
    player.nextMoveAllowedTimer=Math.max(5,Math.floor(14/effSpeed))
   }
  }
 }

 if(player.invTimer>0)player.invTimer--;
 if(player.guardTimer>0)player.guardTimer--;

 checkPickups();
 checkCollisions()
}

function scrollWorldDown(){
 activeLanes.pop();
 activeLanes.unshift(createNewLane(false));
 player.gy++;
 visualScrollOffset-=CELL_SIZE;
 score+=Math.floor(15*level*currentTheme.scoreMult*player.tempScoreMult);

 if(score>level*1200)
  level++
}

function updateVehicles(){

 visualScrollOffset+=(0-visualScrollOffset)*.25;

 if(Math.abs(visualScrollOffset)<.1)
  visualScrollOffset=0;

 activeLanes.forEach(lane=>{
  if(lane.type==='ROAD')
   lane.objects.forEach(obj=>{
    obj.x+=lane.speed*lane.dir;

    if(lane.dir>0&&obj.x>CANVAS_W+obj.w)
     obj.x=TRACK_HEADER_W-obj.w;
    else if(lane.dir<0&&obj.x<TRACK_HEADER_W-obj.w)
     obj.x=CANVAS_W+obj.w
   })
 });

 for(let i=particles.length-1;i>=0;i--){
  let p=particles[i];

  p.x+=p.vx;
  p.y+=p.vy;
  p.life--;

  if(p.life<=0)
   particles.splice(i,1)
 }
}

function addParticles(x,y,color,count=8){
 for(let i=0;i<count;i++)
  particles.push({
   x,
   y,
   vx:(Math.random()-.5)*6,
   vy:(Math.random()-.5)*6,
   life:16,
   color
  })
}

function checkPickups(){
 let currentLane=activeLanes[player.gy];

 if(!currentLane||!currentLane.pickups.length)
  return;

 for(let i=currentLane.pickups.length-1;i>=0;i--){

  let p=currentLane.pickups[i];

  if(p.gx===player.gx){

   score+=Math.floor(p.type.pts*currentTheme.scoreMult);

   if(p.type.isMalus){
    playSound('malus');

    if(p.type.slowFactor)
     player.speedMult=p.type.slowFactor;

    if(p.type.invertControls)
     player.glitchTimer=180

   }else{

    playSound('pickup');

    if(p.type.speedBoost)
     player.speedMult=p.type.speedBoost;

    if(p.type.scoreBoost)
     player.tempScoreMult=p.type.scoreBoost;

    if(p.type.shieldDuration){
     player.guardTimer=p.type.shieldDuration;
     playSound('guard_active')
    }
   }

   addParticles(
    player.gx*CELL_SIZE+CELL_SIZE/2,
    player.gy*CELL_SIZE+HUD_HEIGHT,
    p.type.isMalus?'#ff0055':'#00d2ff',
    10
   );

   currentLane.pickups.splice(i,1)
  }
 }
}

function isInvincible(){
 return player.invTimer>0||player.guardTimer>0
}

function checkCollisions(){

 if(gameState!=='PLAYING'||isInvincible())
  return;

 let playerX=player.gx*CELL_SIZE+CELL_SIZE/2;

 for(let offset=0;offset<=1;offset++){

  let checkLaneIdx=player.gy-offset;

  if(checkLaneIdx<0||checkLaneIdx>=ROWS)
   continue;

  let lane=activeLanes[checkLaneIdx];

  if(!lane||lane.type!=='ROAD')
   continue;

  lane.objects.forEach(obj=>{

   if(offset===1&&obj.hMult!==2)
    return;

   let oLeft=obj.x,
       oRight=obj.x+obj.w,
       pLeft=playerX-player.w/2,
       pRight=playerX+player.w/2;

   if(pLeft<oRight&&pRight>oLeft)
    hitPlayer()
  })
 }
}

function hitPlayer(){

 lives--;
 playSound('crash');

 addParticles(
  player.gx*CELL_SIZE+CELL_SIZE/2,
  player.gy*CELL_SIZE+HUD_HEIGHT,
  '#ff0055',
  20
 );

 if(lives<=0){

  gameState='GAME_OVER';
  playSound('fail');
  saveScore()

 }else{

  let respawnGy=ROWS-2;

  for(let r=player.gy;r<ROWS;r++){
   if(activeLanes[r]&&activeLanes[r].type==='SAFE'){
    respawnGy=r;
    break
   }
  }

  player.gx=Math.floor(COLS/2);
  player.gy=respawnGy;
  player.invTimer=90;
  player.glitchTimer=0;
  player.speedMult=1;
  player.tempScoreMult=1
 }
}

function drawObstacles(lane,laneY){

 lane.objects.forEach(obj=>{

  let x=obj.x,
      y=laneY,
      vData=obj.type,
      blockW=obj.w,
      blockH=(obj.hMult===2?CELL_SIZE*2:CELL_SIZE)-2;

  if(x+blockW<TRACK_HEADER_W)
   return;

  ctx.save();

  ctx.fillStyle=vData.bg;
  ctx.fillRect(x+1,y+1,blockW-2,blockH);

  ctx.fillStyle=vData.topBar||'#00ff66';
  ctx.fillRect(x+1,y+1,blockW-2,2);

  ctx.strokeStyle=vData.border;
  ctx.lineWidth=1;
  ctx.strokeRect(x+1,y+1,blockW-2,blockH);

  ctx.fillStyle='rgba(0,0,0,.4)';
  ctx.fillRect(x+4,y+4,13,10);

  ctx.fillStyle='#00d2ff';
  ctx.font='bold 8px sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('fx',x+10,y+9);

  if(vData.isAudio){

   ctx.strokeStyle='rgba(255,255,255,.18)';
   ctx.lineWidth=1;
   ctx.beginPath();
   ctx.setLineDash([3,3]);
   ctx.moveTo(x+18,y+blockH/2);
   ctx.lineTo(x+blockW-6,y+blockH/2);
   ctx.stroke();
   ctx.setLineDash([])
  }

  ctx.fillStyle=vData.textCol;
  ctx.font='bold 9px -apple-system,sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(
   vData.label,
   x+blockW/2+6,
   y+blockH/2+1,
   blockW-22
  );

  ctx.restore()
 })
}

function gameLoop(){

 try{

  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(gameState==='TUTORIAL')
   drawTutorial();

  else if(gameState==='CHAR_SELECT')
   drawCharSelect();

  else if(gameState==='PLAYING'){
   updateVehicles();
   updatePlayer();
   drawGameWorld();
   drawHUD()
  }

  else if(gameState==='PAUSE'){
   drawGameWorld();
   drawHUD();
   drawPause()
  }

  else if(gameState==='LEVEL_CLEAR'){
   drawGameWorld();
   drawLevelClear();
   drawHUD()
  }

  else if(gameState==='GAME_OVER'){
   drawGameWorld();
   drawGameOver()
  }

 }catch(err){
  console.error("Game Loop Error:",err)
 }

 requestAnimationFrame(gameLoop)
}

canvas.addEventListener('pointerdown',e=>{

  e.preventDefault();

 getAC();

 let rect=canvas.getBoundingClientRect(),
     x=(e.clientX-rect.left)*(canvas.width/rect.width),
     y=(e.clientY-rect.top)*(canvas.height/rect.height);

 if(gameState==='TUTORIAL'){
  if(y>=330){
   gameState='CHAR_SELECT';

 }

 if(gameState==='CHAR_SELECT'){

  if(y>=400)
   handleSelectionInput(x<CANVAS_W/2?-1:1);

   confirmCharacterSelection();

  return
 }

 if(gameState==='PLAYING'){

  if(y<HUD_HEIGHT){

   updateMusicState()
  }

 }

  gameState='CHAR_SELECT';
  return
 }

  if(gameState==='TUTORIAL'||gameState==='GAME_OVER')
   gameState='CHAR_SELECT';
  else if(gameState==='CHAR_SELECT')
   onPress(true);

 btn.addEventListener('pointerup',e=>{
  if(e.cancelable)e.preventDefault();
  onPress(false)
 },{passive:false});

 btn.addEventListener('pointercancel',()=>onPress(false));
 btn.addEventListener('pointerleave',()=>onPress(false))
}

  if(
   e.key==='ArrowRight'||
   e.key==='d'||
   e.key==='ArrowUp'||
   e.key==='w'
  )
   handleSelectionInput(1);

  if(e.code==='Space'||e.code==='Enter')
   confirmCharacterSelection()

 }

 else if(
  gameState==='GAME_OVER'&&
  (e.code==='Space'||e.code==='Enter')
 )
  gameState='CHAR_SELECT'

});

window.addEventListener('keyup',e=>{
 keys[e.code]=false
});

function keyPressed(code){
 return!!keys[code]
}

function saveScore(){

 try{

  if(score>highScore){
   highScore=score;
   localStorage.setItem(
    'deadlineDrive_highScore',
    highScore.toString()
   )
  }

  if(score<=0)
   return;

  let rawUser=localStorage.getItem('arcade_current_user');

  if(!rawUser)
   return;

  let curUser=JSON.parse(rawUser);

  if(curUser&&curUser.stats){

   curUser.stats.gamesPlayed=
    (curUser.stats.gamesPlayed||0)+1;

   curUser.stats.deadlineDrive=
    (curUser.stats.deadlineDrive||0)+score;

   localStorage.setItem(
    'arcade_current_user',
    JSON.stringify(curUser)
   );

   if(
    curUser.username&&
    !curUser.username.startsWith("GUEST_")
   ){

    let rawUsers=localStorage.getItem('arcade_users'),
        users=rawUsers?JSON.parse(rawUsers):{};

    if(users[curUser.username]){

     users[curUser.username].stats=curUser.stats;

     localStorage.setItem(
      'arcade_users',
      JSON.stringify(users)
     )
    }
   }
  }

 }catch(e){
  console.warn("Save score error:",e)
 }
}

function exitGame(){
 saveScore();
 bgMusic.pause();
 window.location.href='index.html'
}

requestAnimationFrame(gameLoop);
</script>
