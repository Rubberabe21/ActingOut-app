<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Deadline Drive - Premiere Pro Timeline Rush</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent !important;
  -webkit-focus-ring-color: transparent !important;
  outline: none !important;
  touch-action: manipulation;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Courier New', monospace;
}

html {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  background: #060609 !important;
  overflow: hidden;
}

body {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  background: #060609 !important;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  display: flex;
  justify-content: center;
  align-items: center;
}

#game-wrapper {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100vw;
  height: 100svh;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: max(env(safe-area-inset-top), 4px) 4px max(env(safe-area-inset-bottom), 6px) 4px;
  background: #060609 !important;
  overflow: hidden;
}

.top-header {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 6px;
  margin-bottom: 2px;
  flex-shrink: 0;
  background: linear-gradient(90deg, #111118 0%, #1a1a26 100%);
  border-radius: 6px;
  border: 1px solid #00f3ff55;
  box-shadow: 0 0 10px rgba(0, 243, 255, 0.15);
}

.header-title {
  color: #00f3ff !important;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .5px;
  font-family: 'Courier New', monospace;
  white-space: nowrap;
  flex: 1;
  text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
}

.header-btns-right {
  display: flex;
  gap: 4px;
  align-items: center;
}

.opt-btn {
  background: #181824;
  border: 1.5px solid #ffea00 !important;
  color: #ffea00 !important;
  padding: 3px 6px;
  font-family: 'Courier New', monospace;
  font-size: 9px;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
  box-shadow: 0 0 6px rgba(255, 234, 0, 0.3) !important;
  transition: transform 0.1s ease;
}

.opt-btn:active { transform: scale(0.92); }

#btnMenuTop {
  border-color: #00f3ff !important;
  color: #00f3ff !important;
  box-shadow: 0 0 6px rgba(0, 243, 255, 0.3) !important;
}

#btnExitTop {
  border-color: #ff0055 !important;
  color: #ff0055 !important;
  box-shadow: 0 0 6px rgba(255, 0, 85, 0.3) !important;
}

#canvas-container {
  position: relative;
  width: 100%;
  flex: 1 1 auto;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  min-height: 0;
  margin: 2px 0;
}

canvas {
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  aspect-ratio: 468 / 672;
  border: 2px solid #00f3ff !important;
  box-shadow: 0 0 20px rgba(0, 243, 255, 0.35) !important;
  background: #101014;
  border-radius: 8px;
  cursor: pointer;
}

/* PULSANTIERA D-PAD T-SHAPE */
.control-deck {
  width: 100%;
  max-width: 320px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(2, 48px);
  gap: 6px;
  padding: 6px;
  background: linear-gradient(180deg, #14141d 0%, #0b0b10 100%);
  border: 2px solid #00f3ff !important;
  border-radius: 12px;
  box-shadow: 0 0 15px rgba(0, 243, 255, 0.25) !important;
  flex-shrink: 0;
  margin-top: 4px;
}

.dir-btn {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(180deg, #00b4d8 0%, #0077b6 100%);
  border: 2px solid #90e0ef;
  color: #ffffff;
  font-size: 10px;
  font-weight: 900;
  border-radius: 8px;
  cursor: pointer;
  box-shadow: 0 3px 0 #003554, 0 3px 8px rgba(0, 0, 0, 0.5);
  text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  font-family: 'Courier New', monospace;
  transition: transform 0.05s ease, background 0.1s ease;
}

.dir-btn span {
  font-size: 16px;
  line-height: 1;
  margin-bottom: 1px;
}

.dir-btn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #003554, 0 2px 4px rgba(0,0,0,0.4);
  background: linear-gradient(180deg, #0077b6 0%, #005f73 100%);
}

#btnUp { grid-column: 2; grid-row: 1; }
#btnLeft { grid-column: 1; grid-row: 2; }
#btnDown { grid-column: 2; grid-row: 2; }
#btnRight { grid-column: 3; grid-row: 2; }

.modal-overlay {
  display: none;
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(6, 6, 10, 0.95);
  z-index: 200;
  justify-content: center;
  align-items: center;
  padding: 16px;
}

.modal-box {
  width: 100%;
  max-width: 340px;
  background: #14141e;
  border: 2px solid #00f3ff !important;
  box-shadow: 0 0 25px rgba(0, 243, 255, 0.4) !important;
  border-radius: 14px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  color: #ffffff;
  text-align: center;
}

.modal-title {
  color: #ffea00;
  font-size: 15px;
  font-weight: 900;
  font-family: 'Courier New', monospace;
  letter-spacing: 1px;
  text-shadow: 0 0 8px rgba(255, 234, 0, 0.5);
}

.option-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: #0a0a10;
  padding: 8px;
  border: 1px solid #00f3ff44;
  border-radius: 8px;
}

.option-label {
  font-size: 10px;
  font-weight: bold;
  color: #00f3ff !important;
  font-family: 'Courier New', monospace;
}

.toggle-btn {
  width: 100%;
  padding: 7px;
  background: #1e1e2a;
  border: 1.5px solid #ff0055;
  color: #ffffff;
  font-weight: bold;
  font-size: 11px;
  font-family: 'Courier New', monospace;
  border-radius: 6px;
  cursor: pointer;
}

.toggle-btn.active {
  border-color: #00ff66;
  color: #00ff66;
  background: #0a2414;
  box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
}

.close-modal-btn {
  padding: 9px;
  background: linear-gradient(90deg, #00f3ff 0%, #00a8ff 100%);
  border: none;
  color: #000;
  font-weight: 900;
  font-size: 11px;
  font-family: 'Courier New', monospace;
  border-radius: 6px;
  cursor: pointer;
  box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
}
</style>
</head>
<body>

<div id="game-wrapper">
  <div class="top-header">
    <span class="header-title">DEADLINE DRIVE</span>
    <div class="header-btns-right">
      <button class="opt-btn" id="btnMenuTop">🏠 MENU</button>
      <button class="opt-btn" id="btnExitTop">◄ ESCI</button>
      <button class="opt-btn" id="btnOpenSettings">⚙️ OPZIONI</button>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="game"></canvas>
  </div>

  <div class="control-deck">
    <button class="dir-btn" id="btnUp"><span>▲</span>SU</button>
    <button class="dir-btn" id="btnLeft"><span>◀</span>SINISTRA</button>
    <button class="dir-btn" id="btnDown"><span>▼</span>GIÙ</button>
    <button class="dir-btn" id="btnRight"><span>▶</span>DESTRA</button>
  </div>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box">
      <div class="modal-title">⚙️ TIMELINE SETTINGS</div>

      <div class="option-item">
        <span class="option-label">EFFETTI SONORI (SFX)</span>
        <button class="toggle-btn active" id="btnToggleSfx">ON 🔊</button>
      </div>

      <div class="option-item">
        <span class="option-label">CONSULTA INFO GIOCO</span>
        <button class="toggle-btn" id="btnModalRules" style="margin-bottom:4px; border-color:#ffea00; color:#ffea00; background:#222210;">📋 REGOLE GIOCO</button>
        <button class="toggle-btn" id="btnModalPowerups" style="border-color:#00ff66; color:#00ff66; background:#0a2414;">⚡ BONUS & MALUS</button>
      </div>

      <button class="close-modal-btn" id="btnCloseSettings">SALVA E CHIUDI ►</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const COLS = 13, ROWS = 17, CELL_SIZE = 36, HUD_HEIGHT = 60, TRACK_HEADER_W = 50;
const CANVAS_W = COLS * CELL_SIZE; // 468px
const CANVAS_H = ROWS * CELL_SIZE + HUD_HEIGHT; // 672px

canvas.width = CANVAS_W;
canvas.height = CANVAS_H;

let sfxEnabled = localStorage.getItem('deadlineDrive_sfx') !== 'false';
let audioCtx = null;

function unlockAudio() {
  try {
    if (!audioCtx) {
      const A = window.AudioContext || window.webkitAudioContext;
      if (A) audioCtx = new A();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  } catch (e) {}
}

const unlockEvents = ['pointerdown', 'touchstart', 'mousedown', 'keydown', 'click'];
unlockEvents.forEach(evt => {
  window.addEventListener(evt, unlockAudio, { capture: true, passive: true });
  document.addEventListener(evt, unlockAudio, { capture: true, passive: true });
});

function getAC() {
  unlockAudio();
  return audioCtx;
}

const settingsModal = document.getElementById('settingsModal');
const btnOpenSettings = document.getElementById('btnOpenSettings');
const btnCloseSettings = document.getElementById('btnCloseSettings');
const btnMenuTop = document.getElementById('btnMenuTop');
const btnExitTop = document.getElementById('btnExitTop');
const btnToggleSfx = document.getElementById('btnToggleSfx');
const btnModalRules = document.getElementById('btnModalRules');
const btnModalPowerups = document.getElementById('btnModalPowerups');

function renderOptionButtons() {
  btnToggleSfx.className = `toggle-btn ${sfxEnabled ? 'active' : ''}`;
  btnToggleSfx.innerText = sfxEnabled ? 'ON 🔊' : 'OFF 🔇';
}
renderOptionButtons();

btnToggleSfx.onclick = () => {
  sfxEnabled = !sfxEnabled;
  localStorage.setItem('deadlineDrive_sfx', sfxEnabled);
  renderOptionButtons();
};

btnOpenSettings.onclick = () => {
  if (gameState === 'playing') {
    gameState = 'PAUSE';
  }
  settingsModal.style.display = 'flex';
};

btnCloseSettings.onclick = () => {
  settingsModal.style.display = 'none';
  getAC();
  if (gameState === 'PAUSE') {
    gameState = 'playing';
  }
};

btnMenuTop.onclick = () => {
  getAC();
  saveScore();
  gameState = 'COVER';
  if (settingsModal.style.display === 'flex') {
    settingsModal.style.display = 'none';
  }
};

btnExitTop.onclick = () => {
  exitGame();
};

btnModalRules.onclick = () => {
  settingsModal.style.display = 'none';
  getAC();
  gameState = 'RULES';
};

btnModalPowerups.onclick = () => {
  settingsModal.style.display = 'none';
  getAC();
  gameState = 'POWERUPS_INFO';
};

function playSound(type) {
  if (!sfxEnabled) return;
  try {
    const ac = getAC();
    if (!ac) return;

    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain);
    gain.connect(ac.destination);

    if (type === 'cross') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(580, ac.currentTime);
      osc.frequency.setValueAtTime(750, ac.currentTime + .06);
      gain.gain.setValueAtTime(.40, ac.currentTime);
      osc.start(); osc.stop(ac.currentTime + .12);
    } else if (type === 'crash') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(380, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(35, ac.currentTime + .28);
      gain.gain.setValueAtTime(.60, ac.currentTime);
      osc.start(); osc.stop(ac.currentTime + .28);
    } else if (type === 'pickup') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520, ac.currentTime);
      osc.frequency.setValueAtTime(1040, ac.currentTime + .1);
      gain.gain.setValueAtTime(.50, ac.currentTime);
      osc.start(); osc.stop(ac.currentTime + .20);
    } else if (type === 'malus') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ac.currentTime);
      osc.frequency.linearRampToValueAtTime(70, ac.currentTime + .22);
      gain.gain.setValueAtTime(.50, ac.currentTime);
      osc.start(); osc.stop(ac.currentTime + .22);
    } else if (type === 'fail') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(280, ac.currentTime);
      osc.frequency.linearRampToValueAtTime(40, ac.currentTime + .35);
      gain.gain.setValueAtTime(.65, ac.currentTime);
      osc.start(); osc.stop(ac.currentTime + .35);
    } else if (type === 'levelup') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, ac.currentTime);
      osc.frequency.setValueAtTime(660, ac.currentTime + .08);
      osc.frequency.setValueAtTime(880, ac.currentTime + .16);
      gain.gain.setValueAtTime(.60, ac.currentTime);
      osc.start(); osc.stop(ac.currentTime + .28);
    }
  } catch (e) {}
}

const imgCover = new Image(); imgCover.src = 'assets/frogger/copertina.png';
const imgGiulia = new Image(); imgGiulia.src = 'assets/frogger/giulia.png';
const imgTobi = new Image();   imgTobi.src = 'assets/frogger/tobi.png';
const imgDave = new Image();   imgDave.src = 'assets/frogger/dave.png';
const imgLuca = new Image();   imgLuca.src = 'assets/frogger/luca.png';

const ASSETS = { COVER: imgCover };

const CHARACTERS = {
  GIULIA: {
    id: 'GIULIA', name: "GIULIA", subtitle: "Lead Video Editor",
    perkBonus: "BONUS: Precisione (+25% Punti)", perkMalus: "MALUS: Sensibile al Glitch",
    primary: "#00f3ff", img: imgGiulia, speed: 1.0, scoreMult: 1.25
  },
  TOBI: {
    id: 'TOBI', name: "TOBI", subtitle: "Assistant Video Editor",
    perkBonus: "BONUS: Agilità (+20% Velocità)", perkMalus: "MALUS: Punteggio Base (-10%)",
    primary: "#ffd700", img: imgTobi, speed: 1.15, scoreMult: 0.9
  },
  DAVE: {
    id: 'DAVE', name: "DAVE", subtitle: "Focused Director",
    perkBonus: "BONUS: Autorità (+30% Punteggio)", perkMalus: "MALUS: Passo Pesante (-15% Velocità)",
    primary: "#ff0055", img: imgDave, speed: 0.85, scoreMult: 1.3
  },
  LUCA: {
    id: 'LUCA', name: "LUCA", subtitle: "VFX Artist Whiz",
    perkBonus: "BONUS: VFX Master (+15% Punti)", perkMalus: "MALUS: Sensibilità Media",
    primary: "#ffaa00", img: imgLuca, speed: 1.05, scoreMult: 1.15
  }
};

const CHARACTER_LIST = ['GIULIA', 'TOBI', 'DAVE', 'LUCA'];
let selectedCharIndex = 0;
let currentTheme = CHARACTERS.GIULIA;

/* DEFINIZIONE BLOCCHI CON COMPORTAMENTI UNICI */
const BLOCK_TYPES = {
  A_ROLL: {
    id: 'A_ROLL', label: 'A001_C004', bg: '#2b52a1', border: '#5682e8', textCol: '#ffffff', topBar: '#00ff66', wMult: 2.2,
    desc: 'Clip Standard: Movimento costante e regolare.'
  },
  SPEED_RAMP: {
    id: 'SPEED_RAMP', label: 'SPEED RAMP ⚡', bg: '#7f22a7', border: '#b842df', textCol: '#ffffff', topBar: '#ff0055', wMult: 2.3,
    desc: 'Speed Ramp: Accelera e rallenta ritmicamente!'
  },
  LUMETRI: {
    id: 'LUMETRI', label: 'LUMETRI COLOR 🎨', bg: '#a11b43', border: '#e64273', textCol: '#ffffff', topBar: '#ffee00', wMult: 2.1,
    desc: 'Lumetri Glitch: Esegue flash cromatici di disturbo.'
  },
  PROXY_FADE: {
    id: 'PROXY_FADE', label: 'PROXY 50% 🎬', bg: '#147b85', border: '#23b3be', textCol: '#ffffff', topBar: '#00ff66', wMult: 2.4,
    desc: 'Proxy Fade: Diventa semitrasparente. Sfrutta il ritmo!'
  },
  OFFLINE_CORRUPT: {
    id: 'OFFLINE_CORRUPT', label: 'OFFLINE 🔴', bg: '#8b0000', border: '#ff3333', textCol: '#ffffff', topBar: '#ff0000', wMult: 2.2,
    desc: 'Corrupt Offline: Movimento a scatti intermittenti.'
  }
};

const PICKUP_TYPES = {
  AUTO_SAVE:   { label: '💾 SAVE', pts: 300, isMalus: false },
  PROXY_ON:    { label: '🎬 PROXY 2X', pts: 400, isMalus: false, scoreBoost: 2 },
  CACHE_BOOST: { label: '⚡ CACHE', pts: 150, isMalus: false, speedBoost: 1.2 },
  GUARD:       { label: '🛡️ RENDER', pts: 250, isMalus: false, shieldDuration: 180 },
  DROP_FRAME:  { label: '🐌 DROP', pts: -100, isMalus: true, slowFactor: 0.7 },
  DISK_FULL:   { label: '⚠️ FULL DISK', pts: -200, isMalus: true, invertControls: true }
};

let gameState = 'COVER';
let score = 0;
let highScore = parseInt(localStorage.getItem('deadlineDrive_highScore')) || 0;
let lives = 3;
let currentLevel = 1;
let maxReachedLevel = 1;
let totalLanesGenerated = 0;
let frame = 0;
let visualScrollOffset = 0;
let activeLanes = [];
let particles = [];

let levelModalData = { title: '', desc: '', blockInfo: '' };

let player = {
  gx: Math.floor(COLS / 2),
  gy: ROWS - 2,
  w: 22, h: 22,
  facingLeft: false,
  invTimer: 0,
  guardTimer: 0,
  speedMult: 1,
  tempScoreMult: 1,
  glitchTimer: 0
};

let moveState = { up: false, down: false, left: false, right: false };
let moveCooldown = 0;
let lastMenuAdvanceTime = 0;

function advanceMenuState() {
  const now = Date.now();
  if (now - lastMenuAdvanceTime < 250) return;
  lastMenuAdvanceTime = now;

  getAC();
  playSound('cross');
  if (gameState === 'COVER') {
    gameState = 'STORY';
  } else if (gameState === 'STORY') {
    gameState = 'RULES';
  } else if (gameState === 'RULES') {
    gameState = 'POWERUPS_INFO';
  } else if (gameState === 'POWERUPS_INFO') {
    gameState = 'CHAR_SELECT';
  } else if (gameState === 'CHAR_SELECT') {
    startGame();
  } else if (gameState === 'LEVEL_POPUP') {
    gameState = 'playing';
  } else if (gameState === 'gameover') {
    gameState = 'CHAR_SELECT';
  }
}

function showLevelPopup(lvl, blockType) {
  currentLevel = lvl;
  playSound('levelup');
  levelModalData = {
    title: `🎬 TIMELINE TRACK V${lvl}`,
    desc: `Hai raggiunto il livello di traccia V${lvl}!`,
    blockInfo: blockType ? blockType.desc : 'Mantieni il ritmo lungo la Timeline!'
  };
  gameState = 'LEVEL_POPUP';
}

/* GENERAZIONE CORSIE E TRACCE CON RIGHE MONO-TIPO E LIVELLI V1, V2, V3... */
function createNewLane(isInitialSetup = false, r = 0) {
  totalLanesGenerated++;
  
  // Ogni livello occupa un blocco di 5 corsie (4 ostacoli + 1 SAFE checkpoint)
  let laneLevelIndex = Math.max(1, Math.floor(totalLanesGenerated / 5) + 1);
  let isSafe = (totalLanesGenerated % 5 === 0) || (isInitialSetup && (r === 0 || r === ROWS - 1 || r === ROWS - 2));

  let laneType = isSafe ? 'SAFE' : 'ROAD';
  let dir = Math.random() < 0.5 ? 1 : -1;
  
  // Calcolo della velocità dinamica bilanciata e mai impossibile
  let baseSpeed = 0.38 + Math.min((laneLevelIndex - 1) * 0.09, 0.85);

  // Selezione UNICA del blocco per l'INTERA riga in base al livello di traccia
  let selectedBlockType = BLOCK_TYPES.A_ROLL;
  if (laneLevelIndex === 2) selectedBlockType = BLOCK_TYPES.SPEED_RAMP;
  else if (laneLevelIndex === 3) selectedBlockType = BLOCK_TYPES.LUMETRI;
  else if (laneLevelIndex === 4) selectedBlockType = BLOCK_TYPES.PROXY_FADE;
  else if (laneLevelIndex >= 5) {
    let types = [BLOCK_TYPES.SPEED_RAMP, BLOCK_TYPES.LUMETRI, BLOCK_TYPES.PROXY_FADE, BLOCK_TYPES.OFFLINE_CORRUPT];
    selectedBlockType = types[Math.floor(Math.random() * types.length)];
  }

  let laneObj = {
    type: laneType,
    levelNumber: laneLevelIndex,
    trackLabel: isSafe ? "SAFE" : `V${laneLevelIndex}`,
    bg: isSafe ? '#1b2333' : '#141416',
    dir,
    baseSpeed,
    blockType: selectedBlockType,
    objects: [],
    pickups: []
  };

  if (laneType === 'ROAD') {
    let x = TRACK_HEADER_W - CELL_SIZE * 2;
    // Spazio GARANTITO di passaggio tra le clip
    let minGap = CELL_SIZE * Math.max(3.6, 5.8 - Math.min((laneLevelIndex - 1) * 0.2, 1.8));

    do {
      x += CELL_SIZE * (1.2 + Math.random() * 1.4) + minGap;
      if (x < CANVAS_W + CELL_SIZE * 2) {
        let widthFactor = Math.min(2.3, selectedBlockType.wMult);
        laneObj.objects.push({
          x,
          type: selectedBlockType,
          w: widthFactor * CELL_SIZE
        });
      }
    } while (x < CANVAS_W + CELL_SIZE * 2);
  } else if (Math.random() < 0.40) {
    let keys = Object.keys(PICKUP_TYPES);
    let key = keys[Math.floor(Math.random() * keys.length)];
    laneObj.pickups.push({
      gx: Math.floor(Math.random() * (COLS - 3)) + 2,
      type: PICKUP_TYPES[key]
    });
  }

  return laneObj;
}

function startInfiniteScroll() {
  activeLanes = [];
  visualScrollOffset = 0;
  totalLanesGenerated = 0;
  currentLevel = 1;
  maxReachedLevel = 1;
  
  for (let r = 0; r < ROWS; r++) {
    activeLanes.push(createNewLane(true, r));
  }
  resetPlayer();
}

function resetPlayer() {
  player.gx = Math.floor(COLS / 2);
  player.gy = ROWS - 2;
  player.invTimer = 120;
  player.guardTimer = 0;
  player.speedMult = 1;
  player.tempScoreMult = 1;
  player.glitchTimer = 0;
  moveCooldown = 0;
}

function startGame() {
  currentTheme = CHARACTERS[CHARACTER_LIST[selectedCharIndex]];
  score = 0;
  lives = 3;
  startInfiniteScroll();
  gameState = 'playing';
  playSound('pickup');
}

function executePlayerStep(dx, dy) {
  let ngx = player.gx + dx;
  let ngy = player.gy + dy;

  if (ngx >= 2 && ngx < COLS && ngy >= 0 && ngy < ROWS) {
    player.gx = ngx;
    player.gy = ngy;

    if (dy < 0 && player.gy < 6) scrollWorldDown();
    else if (dy < 0) score += Math.floor(12 * currentLevel * currentTheme.scoreMult * player.tempScoreMult);

    playSound('cross');
  }
}

function updatePlayer() {
  if (player.glitchTimer > 0) player.glitchTimer--;
  if (player.invTimer > 0) player.invTimer--;
  if (player.guardTimer > 0) player.guardTimer--;

  if (moveCooldown > 0) {
    moveCooldown--;
  } else {
    let inLeft = keyPressed('ArrowLeft') || keyPressed('KeyA') || moveState.left;
    let inRight = keyPressed('ArrowRight') || keyPressed('KeyD') || moveState.right;
    let inUp = keyPressed('ArrowUp') || keyPressed('KeyW') || moveState.up;
    let inDown = keyPressed('ArrowDown') || keyPressed('KeyS') || moveState.down;

    if (player.glitchTimer > 0) {
      let tL = inLeft, tR = inRight, tU = inUp, tD = inDown;
      inLeft = tR; inRight = tL; inUp = tD; inDown = tU;
    }

    let dx = 0, dy = 0;
    if (inLeft) { dx--; player.facingLeft = true; }
    else if (inRight) { dx++; player.facingLeft = false; }

    if (inUp) dy--;
    else if (inDown) dy++;

    if (dx !== 0 || dy !== 0) {
      executePlayerStep(dx, dy);
      moveCooldown = Math.max(9, Math.floor(12 / (currentTheme.speed * player.speedMult)));
    }
  }

  checkPickups();
  checkCollisions();
}

function scrollWorldDown() {
  activeLanes.pop();
  let newLane = createNewLane(false);
  activeLanes.unshift(newLane);
  player.gy++;
  visualScrollOffset -= CELL_SIZE;
  
  score += Math.floor(18 * currentLevel * currentTheme.scoreMult * player.tempScoreMult);

  // Controllo Avanzamento Livello Traccia
  if (newLane.levelNumber > maxReachedLevel) {
    maxReachedLevel = newLane.levelNumber;
    showLevelPopup(maxReachedLevel, newLane.blockType);
  }
}

function updateVehicles() {
  visualScrollOffset += (0 - visualScrollOffset) * 0.25;
  if (Math.abs(visualScrollOffset) < 0.1) visualScrollOffset = 0;

  activeLanes.forEach(lane => {
    if (lane.type === 'ROAD') {
      // CALCOLO DEI COMPORTAMENTI DINAMICI DELLE CLIP
      let currentSpeed = lane.baseSpeed;

      if (lane.blockType.id === 'SPEED_RAMP') {
        // Variazione di velocità ritmica (Accelerazione/Rallentamento)
        currentSpeed *= (0.6 + 0.8 * (Math.sin(frame * 0.06) + 1) / 2);
      } else if (lane.blockType.id === 'OFFLINE_CORRUPT') {
        // Movimento a scatti intermittenti
        if (Math.floor(frame / 20) % 3 === 0) currentSpeed = 0;
      }

      lane.objects.forEach(obj => {
        obj.x += currentSpeed * lane.dir;
        if (lane.dir > 0 && obj.x > CANVAS_W + obj.w) obj.x = TRACK_HEADER_W - obj.w;
        else if (lane.dir < 0 && obj.x < TRACK_HEADER_W - obj.w) obj.x = CANVAS_W + obj.w;
      });
    }
  });

  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function addParticles(x, y, color, count = 8) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - .5) * 6,
      vy: (Math.random() - .5) * 6,
      life: 16, color
    });
  }
}

function checkPickups() {
  let currentLane = activeLanes[player.gy];
  if (!currentLane || !currentLane.pickups.length) return;

  for (let i = currentLane.pickups.length - 1; i >= 0; i--) {
    let p = currentLane.pickups[i];
    if (p.gx === player.gx) {
      score += Math.floor(p.type.pts * currentTheme.scoreMult);
      if (p.type.isMalus) {
        playSound('malus');
        if (p.type.slowFactor) player.speedMult = p.type.slowFactor;
        if (p.type.invertControls) player.glitchTimer = 180;
      } else {
        playSound('pickup');
        if (p.type.speedBoost) player.speedMult = p.type.speedBoost;
        if (p.type.scoreBoost) player.tempScoreMult = p.type.scoreBoost;
        if (p.type.shieldDuration) {
          player.guardTimer = p.type.shieldDuration;
        }
      }
      addParticles(player.gx * CELL_SIZE + CELL_SIZE / 2, player.gy * CELL_SIZE + HUD_HEIGHT, p.type.isMalus ? '#ff0055' : '#00f3ff', 10);
      currentLane.pickups.splice(i, 1);
    }
  }
}

function checkCollisions() {
  if (gameState !== 'playing' || player.invTimer > 0 || player.guardTimer > 0) return;
  let playerX = player.gx * CELL_SIZE + CELL_SIZE / 2;
  let lane = activeLanes[player.gy];

  if (lane && lane.type === 'ROAD') {
    // Se la clip Proxy è completamente trasparente in questo frame, permette il passaggio!
    if (lane.blockType.id === 'PROXY_FADE' && Math.floor(frame / 30) % 2 === 0) {
      return;
    }

    lane.objects.forEach(obj => {
      let oLeft = obj.x, oRight = obj.x + obj.w;
      let pLeft = playerX - player.w / 2, pRight = playerX + player.w / 2;
      if (pLeft < oRight && pRight > oLeft) hitPlayer();
    });
  }
}

function hitPlayer() {
  lives--;
  playSound('crash');
  addParticles(player.gx * CELL_SIZE + CELL_SIZE / 2, player.gy * CELL_SIZE + HUD_HEIGHT, '#ff0055', 20);

  if (lives <= 0) {
    gameState = 'gameover';
    playSound('fail');
    saveScore();
  } else {
    let respawnGy = ROWS - 2;
    for (let r = player.gy; r < ROWS; r++) {
      if (activeLanes[r] && activeLanes[r].type === 'SAFE') {
        respawnGy = r;
        break;
      }
    }
    player.gx = Math.floor(COLS / 2);
    player.gy = respawnGy;
    player.invTimer = 120;
    player.glitchTimer = 0;
    player.speedMult = 1;
    player.tempScoreMult = 1;
  }
}

function drawGameWorld() {
  ctx.fillStyle = '#181818';
  ctx.fillRect(0, HUD_HEIGHT, CANVAS_W, CANVAS_H - HUD_HEIGHT);

  activeLanes.forEach((lane, r) => {
    let y = r * CELL_SIZE + HUD_HEIGHT + visualScrollOffset;
    ctx.fillStyle = lane.bg;
    ctx.fillRect(0, y, CANVAS_W, CELL_SIZE);
    ctx.strokeStyle = '#222226';
    ctx.strokeRect(0, y, CANVAS_W, CELL_SIZE);
  });

  activeLanes.forEach((lane, r) => {
    if (lane.type === 'SAFE') {
      let y = r * CELL_SIZE + HUD_HEIGHT + visualScrollOffset;
      lane.pickups.forEach(p => {
        let px = p.gx * CELL_SIZE + CELL_SIZE / 2;
        let py = y + CELL_SIZE / 2;
        ctx.fillStyle = p.type.isMalus ? '#ff0055' : '#ffff00';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.type.label.split(' ')[0], px, py);
      });
    }
  });

  /* RENDER BLOCCHI CLIP CON EFFETTI SPECIALI */
  activeLanes.forEach((lane, r) => {
    if (lane.type === 'ROAD') {
      let y = r * CELL_SIZE + HUD_HEIGHT + visualScrollOffset;

      lane.objects.forEach(obj => {
        let x = obj.x;
        let blockW = obj.w;
        let blockH = CELL_SIZE - 2;

        if (x + blockW < TRACK_HEADER_W) return;

        ctx.save();

        // COMPORTAMENTO PROXY: DISSOLVENZA TRASPARENTE
        if (lane.blockType.id === 'PROXY_FADE' && Math.floor(frame / 30) % 2 === 0) {
          ctx.globalAlpha = 0.25;
        }

        ctx.beginPath();
        ctx.rect(x + 1, y + 1, blockW - 2, blockH);
        ctx.clip();

        ctx.fillStyle = obj.type.bg;
        ctx.fillRect(x + 1, y + 1, blockW - 2, blockH);

        // COMPORTAMENTO LUMETRI: FLASHING GLITCH COLOR
        let topBarCol = obj.type.topBar || '#00ff66';
        if (lane.blockType.id === 'LUMETRI' && Math.floor(frame / 12) % 2 === 0) {
          topBarCol = '#00f3ff';
        }
        ctx.fillStyle = topBarCol;
        ctx.fillRect(x + 1, y + 1, blockW - 2, 3);

        ctx.strokeStyle = obj.type.border;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x + 1, y + 1, blockW - 2, blockH);

        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(x + 4, y + 6, 16, 14);
        ctx.fillStyle = '#00f3ff';
        ctx.font = '900 9px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('FX', x + 12, y + 13);

        ctx.fillStyle = obj.type.textCol || '#ffffff';
        ctx.font = '900 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        
        let maxTextW = blockW - 28;
        if (maxTextW > 10) {
          ctx.fillText(obj.type.label, x + 24, y + blockH / 2 + 1, maxTextW);
        }

        ctx.restore();
      });
    }
  });

  // SIDEBAR TRACK HEADER CON LIVELLI V1, V2, V3...
  activeLanes.forEach((lane, r) => {
    let y = r * CELL_SIZE + HUD_HEIGHT + visualScrollOffset;
    ctx.fillStyle = '#1c1c24';
    ctx.fillRect(0, y, TRACK_HEADER_W, CELL_SIZE);
    ctx.strokeStyle = '#2a2a38';
    ctx.strokeRect(0, y, TRACK_HEADER_W, CELL_SIZE);

    ctx.fillStyle = lane.type === 'SAFE' ? '#00ff66' : '#00f3ff';
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(lane.trackLabel, TRACK_HEADER_W / 2, y + CELL_SIZE / 2);
  });

  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
  });

  let playheadX = player.gx * CELL_SIZE + CELL_SIZE / 2;
  ctx.strokeStyle = 'rgba(0,243,255,0.45)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(playheadX, HUD_HEIGHT);
  ctx.lineTo(playheadX, CANVAS_H);
  ctx.stroke();

  drawSinglePlayer();
}

function drawSinglePlayer() {
  let playerY = player.gy * CELL_SIZE + HUD_HEIGHT + CELL_SIZE / 2 + visualScrollOffset;
  let playerX = player.gx * CELL_SIZE + CELL_SIZE / 2;

  if (player.invTimer > 0 && Math.floor(player.invTimer / 4) % 2 === 0) return;

  ctx.save();
  ctx.translate(playerX, playerY);
  if (player.facingLeft) ctx.scale(-1, 1);

  ctx.shadowColor = '#00f3ff';
  ctx.shadowBlur = 10;
  ctx.fillStyle = '#00f3ff';
  ctx.beginPath();
  ctx.moveTo(0, -14); ctx.lineTo(12, 0); ctx.lineTo(0, 14); ctx.lineTo(-12, 0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  if (player.glitchTimer > 0) {
    ctx.fillStyle = '#ff0055';
    ctx.font = 'bold 12px monospace';
    ctx.fillText('⚠', 0, -18);
  }

  if (player.guardTimer > 0) {
    ctx.shadowColor = '#00ff66';
    ctx.strokeStyle = '#00ff66';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, 20, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawMenuBackground() {
  ctx.fillStyle = '#08080d';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  ctx.strokeStyle = 'rgba(0, 243, 255, 0.06)';
  ctx.lineWidth = 1;
  let gridStep = 24;
  let offsetY = (frame * 0.5) % gridStep;

  for (let x = 0; x <= CANVAS_W; x += gridStep) {
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x, CANVAS_H);
    ctx.stroke();
  }
  for (let y = offsetY; y <= CANVAS_H; y += gridStep) {
    ctx.beginPath();
    ctx.moveTo(0, y); ctx.lineTo(CANVAS_W, y);
    ctx.stroke();
  }

  ctx.fillStyle = 'rgba(0, 243, 255, 0.18)';
  ctx.font = '10px monospace';
  ctx.textAlign = 'left';
  let tcSec = Math.floor(frame / 60) % 60;
  let tcFrame = frame % 60;
  ctx.fillText(`TC: 00:14:${tcSec < 10 ? '0' + tcSec : tcSec}:${tcFrame < 10 ? '0' + tcFrame : tcFrame}`, 12, 24);
  ctx.fillText(`SEQ: TIMELINE_RUSH_2026`, 12, 38);
  ctx.textAlign = 'right';
  ctx.fillText(`PROXIES: ACTIVE`, CANVAS_W - 12, 24);
  ctx.fillText(`GPU_ACCEL: ON`, CANVAS_W - 12, 38);
}

function drawCyberPanel(x, y, w, h, borderColor = '#00f3ff', bgColor = 'rgba(16, 16, 26, 0.92)') {
  ctx.save();
  ctx.fillStyle = bgColor;
  ctx.fillRect(x, y, w, h);

  ctx.strokeStyle = borderColor;
  ctx.lineWidth = 2;
  ctx.shadowColor = borderColor;
  ctx.shadowBlur = 10;
  ctx.strokeRect(x, y, w, h);
  ctx.shadowBlur = 0;

  let cLen = 10;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y + cLen); ctx.lineTo(x, y); ctx.lineTo(x + cLen, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + w, y + h - cLen); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - cLen, y + h); ctx.stroke();

  ctx.restore();
}

    ctx.fillText('--- POTENZIAMENTI BONUS ---', boxX + 32, boxY + 90);
    ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif';
    ctx.fillText('• 💾 AUTO-SAVE: +300 Punti istantanei', boxX + 32, boxY + 115);
    ctx.fillText('• 🎬 PROXY 2X: Moltiplica x2 i punti', boxX + 32, boxY + 138);
    ctx.fillText('• ⚡ CACHE BOOST: +150 Punti & Velocità', boxX + 32, boxY + 161);
    ctx.fillText('• 🛡️ RENDER SHIELD: Scudo Invulnerabile', boxX + 32, boxY + 184);

    ctx.fillStyle = '#ff0055'; ctx.font = 'bold 12px monospace';
    ctx.fillText('--- MALUS TRAPPOLA ---', boxX + 32, boxY + 225);
    ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif';
    ctx.fillText('• 🐌 DROP FRAME: -100 Punti & Rallenta', boxX + 32, boxY + 250);
    ctx.fillText('• ⚠️ FULL DISK: -200 Punti & Inverte Guida', boxX + 32, boxY + 273);

    ctx.fillStyle = '#ffea00'; ctx.font = 'bold 12px monospace';
    ctx.fillText('CONSIGLIO: Mantieni i riflessi pronti!', boxX + 32, boxY + 320);

    ctx.fillStyle = '#00ff66';
    ctx.fillRect(boxX + 35, boxY + 425, boxW - 70, 50);
    ctx.fillStyle = '#000'; ctx.font = '900 14px monospace'; ctx.textAlign = 'center';
    ctx.fillText('SCEGLI VIDEOMAKER ►', CANVAS_W / 2, boxY + 455);
    return;
  }

  if (gameState === 'CHAR_SELECT') {
    let boxW = 390, boxH = 510;
    let boxX = (CANVAS_W - boxW) / 2, boxY = 45;

    let c = CHARACTERS[CHARACTER_LIST[selectedCharIndex]];

    drawCyberPanel(boxX, boxY, boxW, boxH, c.primary);

    ctx.fillStyle = c.primary;
    ctx.font = '900 18px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('🎬 SELEZIONA VIDEOMAKER', CANVAS_W / 2, boxY + 35);

    let imgW = 160, imgH = 160;
    let imgX = (CANVAS_W - imgW) / 2, imgY = boxY + 55;

    ctx.fillStyle = '#181824';
    ctx.fillRect(boxX + 16, imgY + 50, 44, 60);
    ctx.strokeStyle = c.primary;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(boxX + 16, imgY + 50, 44, 60);
    ctx.fillStyle = c.primary;
    ctx.font = '900 24px monospace';
    ctx.fillText('◄', boxX + 38, imgY + 86);

    ctx.fillStyle = '#181824';
    ctx.fillRect(boxX + boxW - 60, imgY + 50, 44, 60);
    ctx.strokeStyle = c.primary;
    ctx.strokeRect(boxX + boxW - 60, imgY + 50, 44, 60);
    ctx.fillStyle = c.primary;
    ctx.fillText('►', boxX + boxW - 38, imgY + 86);

    ctx.fillStyle = '#0a0a10';
    ctx.fillRect(imgX, imgY, imgW, imgH);

    if (c.img && c.img.complete && c.img.naturalWidth > 0) {
      ctx.drawImage(c.img, imgX, imgY, imgW, imgH);
    } else {
      ctx.fillStyle = c.primary;
      ctx.font = '900 56px monospace';
      ctx.fillText(c.name[0], CANVAS_W / 2, imgY + 100);
    }

    ctx.strokeStyle = c.primary;
    ctx.lineWidth = 2;
    ctx.strokeRect(imgX, imgY, imgW, imgH);

    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(imgX + 5, imgY + 5, 60, 16);
    ctx.fillStyle = '#00ff66';
    ctx.font = 'bold 9px monospace';
    ctx.fillText('● REC 4K', imgX + 35, imgY + 16);

    ctx.fillStyle = c.primary;
    ctx.font = '900 22px -apple-system, sans-serif';
    ctx.fillText(c.name, CANVAS_W / 2, boxY + 242);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText(c.subtitle, CANVAS_W / 2, boxY + 264);

    ctx.fillStyle = '#0a0a10';
    ctx.fillRect(boxX + 25, boxY + 282, boxW - 50, 85);
    ctx.strokeStyle = '#2a2a38';
    ctx.strokeRect(boxX + 25, boxY + 282, boxW - 50, 85);

    ctx.fillStyle = '#ffea00';
    ctx.font = 'bold 12px monospace';
    ctx.fillText(c.perkBonus, CANVAS_W / 2, boxY + 312);

    ctx.fillStyle = '#ff0055';
    ctx.fillText(c.perkMalus, CANVAS_W / 2, boxY + 342);

    let dotSpacing = 16;
    let startX = CANVAS_W / 2 - ((CHARACTER_LIST.length - 1) * dotSpacing) / 2;
    for (let i = 0; i < CHARACTER_LIST.length; i++) {
      ctx.beginPath();
      ctx.arc(startX + i * dotSpacing, boxY + 392, 4, 0, Math.PI * 2);
      ctx.fillStyle = (i === selectedCharIndex) ? c.primary : '#333344';
      ctx.fill();
    }

    ctx.fillStyle = c.primary;
    ctx.fillRect(boxX + 30, boxY + 425, boxW - 60, 52);
    ctx.fillStyle = '#000000';
    ctx.font = '900 15px monospace';
    ctx.fillText(`GIOCA CON ${c.name} ►`, CANVAS_W / 2, boxY + 457);
    return;
  }

  /* POP-UP MANUALE DI AVANZAMENTO LIVELLO */
  if (gameState === 'LEVEL_POPUP') {
    drawGameWorld();
    drawHUD();

    let boxW = 370, boxH = 270;
    let boxX = (CANVAS_W - boxW) / 2, boxY = (CANVAS_H - boxH) / 2 - 20;

    drawCyberPanel(boxX, boxY, boxW, boxH, '#00f3ff');

    ctx.fillStyle = '#00f3ff';
    ctx.font = '900 18px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(levelModalData.title, CANVAS_W / 2, boxY + 42);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(levelModalData.desc, CANVAS_W / 2, boxY + 80);

    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(boxX + 20, boxY + 105, boxW - 40, 75);
    ctx.strokeStyle = '#ffea00';
    ctx.lineWidth = 1;
    ctx.strokeRect(boxX + 20, boxY + 105, boxW - 40, 75);

    ctx.fillStyle = '#ffea00';
    ctx.font = 'bold 11px monospace';
    ctx.fillText('COMPORTAMENTO BLOCCHI:', CANVAS_W / 2, boxY + 128);

    ctx.fillStyle = '#00ff66';
    ctx.font = '12px sans-serif';
    ctx.fillText(levelModalData.blockInfo, CANVAS_W / 2, boxY + 155);

    ctx.fillStyle = '#00f3ff';
    ctx.fillRect(boxX + 30, boxY + 200, boxW - 60, 48);
    ctx.fillStyle = '#000';
    ctx.font = '900 14px monospace';
    ctx.fillText('CONTINUA MONTAGGIO ►', CANVAS_W / 2, boxY + 230);
    return;
  }

  if (gameState === 'PAUSE') {
    let boxW = 340, boxH = 220;
    let boxX = (CANVAS_W - boxW) / 2, boxY = (CANVAS_H - boxH) / 2;

    drawCyberPanel(boxX, boxY, boxW, boxH, '#ffea00');

    ctx.fillStyle = '#ffea00';
    ctx.font = '900 26px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('⏸️ IN PAUSA', CANVAS_W / 2, boxY + 75);

    ctx.fillStyle = '#00f3ff';
    ctx.font = 'bold 13px monospace';
    ctx.fillText('TIMELINE SOSPESA', CANVAS_W / 2, boxY + 118);

    ctx.fillStyle = '#ffffff';
    ctx.font = '12px monospace';
    ctx.fillText('TOCCA PER RIPRENDERE IL MONTAGGIO', CANVAS_W / 2, boxY + 160);
    return;
  }

  if (gameState === 'gameover') {
    let boxW = 380, boxH = 390;
    let boxX = (CANVAS_W - boxW) / 2, boxY = (CANVAS_H - boxH) / 2;

    drawCyberPanel(boxX, boxY, boxW, boxH, '#ff0055');

    ctx.fillStyle = '#ff0055';
    ctx.font = '900 24px monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 10;
    ctx.fillText('DEADLINE MISSED! 💀', CANVAS_W / 2, boxY + 65);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#ffffff';
    ctx.font = '14px monospace';
    ctx.fillText('CRASH DEL SISTEMA DI EXPORT', CANVAS_W / 2, boxY + 105);

    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(boxX + 25, boxY + 135, boxW - 50, 130);
    ctx.strokeStyle = '#ffea00';
    ctx.strokeRect(boxX + 25, boxY + 135, boxW - 50, 130);

    ctx.fillStyle = '#ffea00';
    ctx.font = '900 20px monospace';
    ctx.fillText(`PUNTEGGIO: ${score}`, CANVAS_W / 2, boxY + 185);

    ctx.fillStyle = '#00f3ff';
    ctx.font = 'bold 13px monospace';
    ctx.fillText(`TRACCIA MASSIMA: V${maxReachedLevel} | REC: ${highScore}`, CANVAS_W / 2, boxY + 225);

    ctx.fillStyle = Math.floor(frame / 30) % 2 === 0 ? '#ff0055' : '#ffea00';
    ctx.fillRect(boxX + 35, boxY + 295, boxW - 70, 52);
    ctx.fillStyle = '#000';
    ctx.font = '900 14px monospace';
    ctx.fillText('► TOCCA PER RIPROVARE ◄', CANVAS_W / 2, boxY + 327);
  }
}

canvas.addEventListener('pointerdown', e => {
  getAC();
  let rect = canvas.getBoundingClientRect();
  let x = (e.clientX - rect.left) * (CANVAS_W / rect.width);
  let y = (e.clientY - rect.top) * (CANVAS_H / rect.height);

  if (['COVER', 'STORY', 'RULES', 'POWERUPS_INFO'].includes(gameState)) {
    advanceMenuState();
    return;
  }

  if (gameState === 'LEVEL_POPUP') {
    gameState = 'playing';
    return;
  }

  if (gameState === 'CHAR_SELECT') {
    let boxW = 390;
    let boxX = (CANVAS_W - boxW) / 2;
    let imgY = 100;

    if (x >= boxX + 10 && x <= boxX + 70 && y >= imgY + 40 && y <= imgY + 120) {
      selectedCharIndex = (selectedCharIndex - 1 + CHARACTER_LIST.length) % CHARACTER_LIST.length;
      playSound('cross');
      return;
    }
    if (x >= boxX + boxW - 70 && x <= boxX + boxW - 10 && y >= imgY + 40 && y <= imgY + 120) {
      selectedCharIndex = (selectedCharIndex + 1) % CHARACTER_LIST.length;
      playSound('cross');
      return;
    }
    if (y >= 450) {
      startGame();
      return;
    }
    return;
  }

  if (gameState === 'playing') {
    if (y < HUD_HEIGHT) {
      gameState = 'PAUSE';
    }
    return;
  }

  if (gameState === 'PAUSE') {
    gameState = 'playing';
    return;
  }

  if (gameState === 'gameover') {
    gameState = 'CHAR_SELECT';
  }
});

function bindDirBtn(id, dirKey) {
  let el = document.getElementById(id);
  if (!el) return;

  const press = (e) => {
    if (e.cancelable) e.preventDefault();
    getAC();

    if (['COVER', 'STORY', 'RULES', 'POWERUPS_INFO'].includes(gameState)) {
      advanceMenuState();
      return;
    }

    if (gameState === 'LEVEL_POPUP') {
      gameState = 'playing';
      return;
    }

    if (gameState === 'CHAR_SELECT') {
      if (dirKey === 'left') {
        selectedCharIndex = (selectedCharIndex - 1 + CHARACTER_LIST.length) % CHARACTER_LIST.length;
        playSound('cross');
      } else if (dirKey === 'right') {
        selectedCharIndex = (selectedCharIndex + 1) % CHARACTER_LIST.length;
        playSound('cross');
      } else {
        startGame();
      }
      return;
    }

    if (gameState === 'gameover') {
      gameState = 'CHAR_SELECT';
      return;
    }

    moveState[dirKey] = true;
  };

  const release = (e) => {
    if (e.cancelable) e.preventDefault();
    moveState[dirKey] = false;
  };

  el.addEventListener('pointerdown', press);
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('pointerleave', release);
}

bindDirBtn('btnUp', 'up');
bindDirBtn('btnDown', 'down');
bindDirBtn('btnLeft', 'left');
bindDirBtn('btnRight', 'right');

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  getAC();

  if (['COVER', 'STORY', 'RULES', 'POWERUPS_INFO'].includes(gameState)) {
    if (e.code === 'Space' || e.code === 'Enter') advanceMenuState();
  } else if (gameState === 'LEVEL_POPUP') {
    if (e.code === 'Space' || e.code === 'Enter') gameState = 'playing';
  } else if (gameState === 'CHAR_SELECT') {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
      selectedCharIndex = (selectedCharIndex - 1 + CHARACTER_LIST.length) % CHARACTER_LIST.length;
      playSound('cross');
    }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') {
      selectedCharIndex = (selectedCharIndex + 1) % CHARACTER_LIST.length;
      playSound('cross');
    }
    if (e.code === 'Space' || e.code === 'Enter') startGame();
  } else if (gameState === 'gameover' && (e.code === 'Space' || e.code === 'Enter')) {
    gameState = 'CHAR_SELECT';
  } else if ((e.code === 'KeyP' || e.code === 'Escape') && (gameState === 'playing' || gameState === 'PAUSE')) {
    gameState = gameState === 'playing' ? 'PAUSE' : 'playing';
  }
});

window.addEventListener('keyup', e => {
  keys[e.code] = false;
});

function keyPressed(code) {
  return !!keys[code];
}

function saveScore() {
  try {
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('deadlineDrive_highScore', highScore.toString());
    }

    if (score <= 0) return;
    let rawUser = localStorage.getItem('arcade_current_user');
    if (!rawUser) return;

    let curUser = JSON.parse(rawUser);
    if (curUser && curUser.stats) {
      curUser.stats.gamesPlayed = (curUser.stats.gamesPlayed || 0) + 1;
      curUser.stats.deadlineDrive = (curUser.stats.deadlineDrive || 0) + score;
      localStorage.setItem('arcade_current_user', JSON.stringify(curUser));

      if (curUser.username && !curUser.username.startsWith("GUEST_")) {
        let rawUsers = localStorage.getItem('arcade_users');
        let users = rawUsers ? JSON.parse(rawUsers) : {};
        if (users[curUser.username]) {
          users[curUser.username].stats = curUser.stats;
          localStorage.setItem('arcade_users', JSON.stringify(users));
        }
      }
    }
  } catch (e) {}
}

function exitGame() {
  saveScore();
  window.location.href = 'index.html';
}

function update() {
  frame++;
  if (gameState === 'playing') {
    updateVehicles();
    updatePlayer();
  }
}

function draw() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  if (gameState === 'playing') {
    drawGameWorld();
    drawHUD();
  } else {
    drawScreens();
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
