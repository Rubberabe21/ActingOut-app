<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Deadline Drive - Premiere Pro Timeline Rush</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent !important;
  -webkit-focus-ring-color: transparent !important;
  outline: none !important;
  touch-action: manipulation;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Courier New', monospace;
}

html {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  background: #060609 !important;
  overflow: hidden;
}

body {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  background: #060609 !important;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  display: flex;
  justify-content: center;
  align-items: center;
}

#game-wrapper {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100vw;
  height: 100svh;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: max(env(safe-area-inset-top), 2px) 2px max(env(safe-area-inset-bottom), 2px) 2px;
  background: #060609 !important;
  overflow: hidden;
}

.top-header {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 4px;
  margin-bottom: 2px;
  flex-shrink: 0;
  background: linear-gradient(90deg, #111118 0%, #1a1a26 100%);
  border-radius: 6px;
  border: 1px solid #00f3ff55;
  box-shadow: 0 0 10px rgba(0, 243, 255, 0.15);
}

.header-title {
  color: #00f3ff !important;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .5px;
  font-family: 'Courier New', monospace;
  white-space: nowrap;
  flex: 1;
  text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
}

.header-btns-right {
  display: flex;
  gap: 4px;
  align-items: center;
}

.opt-btn {
  background: #181824;
  border: 1.5px solid #ffea00 !important;
  color: #ffea00 !important;
  padding: 3px 6px;
  font-family: 'Courier New', monospace;
  font-size: 9px;
  font-weight: bold;
  border-radius: 4px;
  cursor: pointer;
  box-shadow: 0 0 6px rgba(255, 234, 0, 0.3) !important;
  transition: transform 0.1s ease;
}

.opt-btn:active { transform: scale(0.92); }

#btnMenuTop {
  border-color: #00f3ff !important;
  color: #00f3ff !important;
  box-shadow: 0 0 6px rgba(0, 243, 255, 0.3) !important;
}

#btnExitTop {
  border-color: #ff0055 !important;
  color: #ff0055 !important;
  box-shadow: 0 0 6px rgba(255, 0, 85, 0.3) !important;
}

#canvas-container {
  position: relative;
  width: 100%;
  flex: 1 1 auto;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  min-height: 0;
  margin: 0;
  padding: 0;
}

canvas {
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  aspect-ratio: 338 / 486;
  border: 2px solid #00f3ff !important;
  box-shadow: 0 0 20px rgba(0, 243, 255, 0.35) !important;
  background: #101014;
  border-radius: 8px;
  cursor: pointer;
}

/* Pulsantiera Orizzontale Compatta per la Direzione */
.control-deck {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  padding: 4px;
  background: linear-gradient(180deg, #14141d 0%, #0b0b10 100%);
  border: 2px solid #00f3ff !important;
  border-radius: 10px;
  box-shadow: 0 0 15px rgba(0, 243, 255, 0.25) !important;
  flex-shrink: 0;
  margin-top: 2px;
}

.dir-btn {
  height: 46px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(180deg, #00b4d8 0%, #0077b6 100%);
  border: 2px solid #90e0ef;
  color: #ffffff;
  font-size: 10px;
  font-weight: 900;
  border-radius: 8px;
  cursor: pointer;
  box-shadow: 0 3px 0 #003554, 0 3px 8px rgba(0, 0, 0, 0.5);
  text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  font-family: 'Courier New', monospace;
  transition: transform 0.05s ease, background 0.1s ease;
}

.dir-btn span {
  font-size: 15px;
  line-height: 1;
  margin-bottom: 1px;
}

.dir-btn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #003554, 0 2px 4px rgba(0,0,0,0.4);
  background: linear-gradient(180deg, #0077b6 0%, #005f73 100%);
}

.modal-overlay {
  display: none;
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(6, 6, 10, 0.95);
  z-index: 200;
  justify-content: center;
  align-items: center;
  padding: 16px;
}

.modal-box {
  width: 100%;
  max-width: 320px;
  background: #14141e;
  border: 2px solid #00f3ff !important;
  box-shadow: 0 0 25px rgba(0, 243, 255, 0.4) !important;
  border-radius: 14px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  color: #ffffff;
  text-align: center;
}

.modal-title {
  color: #ffea00;
  font-size: 15px;
  font-weight: 900;
  font-family: 'Courier New', monospace;
  letter-spacing: 1px;
  text-shadow: 0 0 8px rgba(255, 234, 0, 0.5);
}

.option-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  background: #0a0a10;
  padding: 8px;
  border: 1px solid #00f3ff44;
  border-radius: 8px;
}

.option-label {
  font-size: 10px;
  font-weight: bold;
  color: #00f3ff !important;
  font-family: 'Courier New', monospace;
}

.toggle-btn {
  width: 100%;
  padding: 7px;
  background: #1e1e2a;
  border: 1.5px solid #ff0055;
  color: #ffffff;
  font-weight: bold;
  font-size: 11px;
  font-family: 'Courier New', monospace;
  border-radius: 6px;
  cursor: pointer;
}

.toggle-btn.active {
  border-color: #00ff66;
  color: #00ff66;
  background: #0a2414;
  box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
}

.close-modal-btn {
  padding: 9px;
  background: linear-gradient(90deg, #00f3ff 0%, #00a8ff 100%);
  border: none;
  color: #000;
  font-weight: 900;
  font-size: 11px;
  font-family: 'Courier New', monospace;
  border-radius: 6px;
  cursor: pointer;
  box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
}
</style>
</head>
<body>

<!-- MUSICA INIZIALE CON FALLBACK SU FORMATI MP3/MP4 -->
<audio id="bgMusic" loop autoplay playsinline style="display:none;">
  <source src="assets/frogger/music_frogger.mp3" type="audio/mpeg">
  <source src="assets/frogger/music_frogger.mp4" type="audio/mp4">
  <source src="assets/frogger/musica_frogger.mp3" type="audio/mpeg">

</audio>

<div id="game-wrapper">
  <div class="top-header">
    <span class="header-title">DEADLINE DRIVE</span>
    <div class="header-btns-right">
      <button class="opt-btn" id="btnMenuTop">🏠 MENU</button>

  <div id="canvas-container">
    <canvas id="game"></canvas>

    <button class="dir-btn" id="btnUp"><span>▲</span>SU</button>

    <button class="dir-btn" id="btnLeft"><span>◀</span>SINISTRA</button>

        <button class="toggle-btn active" id="btnToggleMusic">ON 🎵</button>

      <div class="option-item">
        <span class="option-label">EFFETTI SONORI (SFX)</span>

        <button class="toggle-btn" id="btnModalPowerups" style="border-color:#00ff66; color:#00ff66; background:#0a2414;">⚡ BONUS & MALUS</button>
      </div>

    </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const COLS = 13, ROWS = 17, CELL_SIZE = 26, HUD_HEIGHT = 44, TRACK_HEADER_W = 38;
const CANVAS_W = COLS * CELL_SIZE;
const CANVAS_H = ROWS * CELL_SIZE + HUD_HEIGHT;

canvas.width = CANVAS_W;
canvas.height = CANVAS_H;

let musicEnabled = localStorage.getItem('deadlineDrive_music') !== 'false';
let sfxEnabled = localStorage.getItem('deadlineDrive_sfx') !== 'false';

const bgMusic = document.getElementById('bgMusic');
if (bgMusic) bgMusic.volume = 0.35;

let audioCtx = null;

// SBLOCCO AUTOMATICO E ROBUSTO DELL'AUDIO
function unlockAudio() {
  try {
    if (!audioCtx) {
      const A = window.AudioContext || window.webkitAudioContext;
      if (A) audioCtx = new A();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  } catch (e) {}

  if (musicEnabled && bgMusic) {
    bgMusic.volume = 0.35;
    bgMusic.muted = false;
    if (bgMusic.paused) {
      bgMusic.play().catch(() => {});
    }
  }
}

// ASCOLTATORI GLOBALI PER IL PRIMO TOCCO / INTERAZIONE
const unlockEvents = ['pointerdown', 'touchstart', 'mousedown', 'keydown', 'click'];
unlockEvents.forEach(evt => {
  window.addEventListener(evt, unlockAudio, { capture: true, passive: true });
  document.addEventListener(evt, unlockAudio, { capture: true, passive: true });
});

function getAC() {
  unlockAudio();
  return audioCtx;
}

function updateMusicState() {
  if (musicEnabled) unlockAudio();
  else if (bgMusic) bgMusic.pause();
}

const settingsModal = document.getElementById('settingsModal');
const btnOpenSettings = document.getElementById('btnOpenSettings');
const btnCloseSettings = document.getElementById('btnCloseSettings');
const btnMenuTop = document.getElementById('btnMenuTop');
const btnExitTop = document.getElementById('btnExitTop');
const btnToggleMusic = document.getElementById('btnToggleMusic');
const btnToggleSfx = document.getElementById('btnToggleSfx');
const btnModalRules = document.getElementById('btnModalRules');
const btnModalPowerups = document.getElementById('btnModalPowerups');

function renderOptionButtons() {
  btnToggleMusic.className = `toggle-btn ${musicEnabled ? 'active' : ''}`;
  btnToggleMusic.innerText = musicEnabled ? 'ON 🎵' : 'OFF 🔇';

  btnToggleSfx.className = `toggle-btn ${sfxEnabled ? 'active' : ''}`;
  btnToggleSfx.innerText = sfxEnabled ? 'ON 🔊' : 'OFF 🔇';
}
renderOptionButtons();

btnToggleMusic.onclick = () => {
  musicEnabled = !musicEnabled;
  localStorage.setItem('deadlineDrive_music', musicEnabled);
  renderOptionButtons();
  updateMusicState();
};

btnToggleSfx.onclick = () => {
  sfxEnabled = !sfxEnabled;
  localStorage.setItem('deadlineDrive_sfx', sfxEnabled);
  renderOptionButtons();
};

btnOpenSettings.onclick = () => {
  if (gameState === 'playing') {
    gameState = 'PAUSE';
    updateMusicState();
  }
  settingsModal.style.display = 'flex';
};

btnCloseSettings.onclick = () => {
  settingsModal.style.display = 'none';
  getAC();
  if (gameState === 'PAUSE') {
    gameState = 'playing';
  }
  updateMusicState();
};

btnMenuTop.onclick = () => {
  getAC();
  saveScore();
  gameState = 'COVER';
  if (settingsModal.style.display === 'flex') {
    settingsModal.style.display = 'none';
  }
  updateMusicState();
};

btnExitTop.onclick = () => {
  exitGame();
};

btnModalRules.onclick = () => {
  settingsModal.style.display = 'none';
  getAC();
  gameState = 'RULES';
  updateMusicState();
};

btnModalPowerups.onclick = () => {
  settingsModal.style.display = 'none';
  getAC();
  gameState = 'POWERUPS_INFO';
  updateMusicState();
};

// SINTETIZZATORE SFX POTENZIATO
function playSound(type) {
  if (!sfxEnabled) return;
  try {
    const ac = getAC();
    if (!ac) return;

    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain);
    gain.connect(ac.destination);

    if (type === 'cross') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(580, ac.currentTime);
      osc.frequency.setValueAtTime(750, ac.currentTime + .06);
      gain.gain.setValueAtTime(.50, ac.currentTime);
      osc.start(); osc.stop(ac.currentTime + .14);
    } else if (type === 'crash') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(380, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(35, ac.currentTime + .28);
      gain.gain.setValueAtTime(.70, ac.currentTime);
      osc.start(); osc.stop(ac.currentTime + .28);
    } else if (type === 'pickup') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520, ac.currentTime);
      osc.frequency.setValueAtTime(1040, ac.currentTime + .1);
      gain.gain.setValueAtTime(.60, ac.currentTime);
      osc.start(); osc.stop(ac.currentTime + .22);
    } else if (type === 'malus') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ac.currentTime);
      osc.frequency.linearRampToValueAtTime(70, ac.currentTime + .22);
      gain.gain.setValueAtTime(.60, ac.currentTime);
      osc.start(); osc.stop(ac.currentTime + .22);
    } else if (type === 'fail') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(280, ac.currentTime);
      osc.frequency.linearRampToValueAtTime(40, ac.currentTime + .35);
      gain.gain.setValueAtTime(.75, ac.currentTime);
      osc.start(); osc.stop(ac.currentTime + .35);
    } else if (type === 'guard_active') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(700, ac.currentTime);
      osc.frequency.linearRampToValueAtTime(1400, ac.currentTime + .12);
      gain.gain.setValueAtTime(.55, ac.currentTime);
      osc.start(); osc.stop(ac.currentTime + .12);
    }
  } catch (e) {}
}

const imgCover = new Image(); imgCover.src = 'assets/frogger/copertina.png';
const imgGiulia = new Image(); imgGiulia.src = 'assets/frogger/giulia.png';
const imgTobi = new Image();   imgTobi.src = 'assets/frogger/tobi.png';
const imgDave = new Image();   imgDave.src = 'assets/frogger/dave.png';
const imgLuca = new Image();   imgLuca.src = 'assets/frogger/luca.png';

const ASSETS = {
  COVER: imgCover
};

const CHARACTERS = {
  GIULIA: {
    id: 'GIULIA', name: "GIULIA", subtitle: "Lead Video Editor",
    perkBonus: "BONUS: Precisione (+25% Punti)", perkMalus: "MALUS: Sensibile al Glitch",
    primary: "#00f3ff", img: imgGiulia, speed: 2.8, scoreMult: 1.25
  },
  TOBI: {
    id: 'TOBI', name: "TOBI", subtitle: "Assistant Video Editor",
    perkBonus: "BONUS: Agilità (+20% Velocità)", perkMalus: "MALUS: Punteggio Base (-10%)",
    primary: "#ffd700", img: imgTobi, speed: 3.4, scoreMult: 0.9
  },
  DAVE: {
    id: 'DAVE', name: "DAVE", subtitle: "Focused Director",
    perkBonus: "BONUS: Autorità (+30% Punteggio)", perkMalus: "MALUS: Passo Pesante (-20% Velocità)",
    primary: "#ff0055", img: imgDave, speed: 2.0, scoreMult: 1.3
  },
  LUCA: {
    id: 'LUCA', name: "LUCA", subtitle: "VFX Artist Whiz",
    perkBonus: "BONUS: VFX Master (+15% Punti)", perkMalus: "MALUS: Sensibilità Media",
    primary: "#ffaa00", img: imgLuca, speed: 3.2, scoreMult: 1.15
  }
};

const CHARACTER_LIST = ['GIULIA', 'TOBI', 'DAVE', 'LUCA'];
let selectedCharIndex = 0;
let currentTheme = CHARACTERS.GIULIA;

const PREMIERE_CLIPS = {
  BLUE_A_ROLL:  { label: 'A001_C004.MOV', bg: '#2b52a1', border: '#5682e8', textCol: '#d0e0ff', topBar: '#00ff66', wMult: 2.2 },
  PURPLE_B_ROLL:{ label: 'B002_DRONE.MP4', bg: '#7f22a7', border: '#b842df', textCol: '#f2c8ff', topBar: '#ff0055', wMult: 2.5 },
  ROSE_LUMETRI: { label: 'LUMETRI COLOR', bg: '#a11b43', border: '#e64273', textCol: '#ffd4e2', topBar: '#ffee00', wMult: 2 },
  GOLD_VOICEOVER:{ label: 'VO_MASTER_V2', bg: '#8f7d18', border: '#dbc330', textCol: '#fdf8c2', topBar: '#00ff66', isAudio: true, wMult: 2 },
  GREEN_SFX:    { label: 'SFX_WHOOSH.WAV', bg: '#2d7a3a', border: '#4ec462', textCol: '#d2f8da', topBar: '#00ff66', isAudio: true, wMult: 1.8 },
  TEAL_MUSIC:   { label: 'BEAT_TRACK_FLAC', bg: '#147b85', border: '#23b3be', textCol: '#c2f8fc', topBar: '#00ff66', isAudio: true, wMult: 2.8 },
  NESTED_SEQ:   { label: 'NEST_INTRO_SEQ', bg: '#5b1e8a', border: '#8b3adb', textCol: '#e8cbff', topBar: '#ffee00', wMult: 3 },
  OFFLINE_RED:  { label: 'MEDIA OFFLINE! 🔴', bg: '#8b0000', border: '#ff3333', textCol: '#fff', topBar: '#ff0000', wMult: 3.2 }
};

const PICKUP_TYPES = {
  AUTO_SAVE:   { label: '💾 SAVE', pts: 300, isMalus: false },
  PROXY_ON:    { label: '🎬 PROXY 2X', pts: 400, isMalus: false, scoreBoost: 2 },
  CACHE_BOOST: { label: '⚡ CACHE', pts: 150, isMalus: false, speedBoost: 1.3 },
  GUARD:       { label: '🛡️ RENDER', pts: 250, isMalus: false, shieldDuration: 180 },
  DROP_FRAME:  { label: '🐌 DROP', pts: -100, isMalus: true, slowFactor: 0.6 },
  DISK_FULL:   { label: '⚠️ FULL DISK', pts: -200, isMalus: true, invertControls: true }
};

let gameState = 'COVER';
let score = 0;
let highScore = parseInt(localStorage.getItem('deadlineDrive_highScore')) || 0;
let lives = 3;
let level = 1;
let frame = 0;
let visualScrollOffset = 0;
let activeLanes = [];
let particles = [];

let player = {
  gx: Math.floor(COLS / 2),
  gy: ROWS - 2,
  w: 16, h: 16,
  facingLeft: false,
  invTimer: 0,
  guardTimer: 0,
  nextMoveAllowedTimer: 0,
  speedMult: 1,
  tempScoreMult: 1,
  glitchTimer: 0
};

let moveUp = false, moveDown = false, moveLeft = false, moveRight = false;
let lastMenuAdvanceTime = 0;

function advanceMenuState() {
  const now = Date.now();
  if (now - lastMenuAdvanceTime < 250) return;
  lastMenuAdvanceTime = now;

  getAC();
  playSound('cross');
  if (gameState === 'COVER') {
    gameState = 'STORY';
  } else if (gameState === 'STORY') {
    gameState = 'RULES';
  } else if (gameState === 'RULES') {
    gameState = 'POWERUPS_INFO';
  } else if (gameState === 'POWERUPS_INFO') {
    gameState = 'CHAR_SELECT';
  } else if (gameState === 'CHAR_SELECT') {
    startGame();
  } else if (gameState === 'gameover') {
    gameState = 'CHAR_SELECT';
  }
}

function createNewLane(isInitialSetup = false, r = 0) {
  let isSafe = false;
  let safeChance = Math.max(0.2, 0.45 - level * 0.08);

  if (isInitialSetup) {
    isSafe = (r === 0 || r === ROWS - 1 || r === ROWS - 2 || r === ROWS - 3 || (r % 3 === 0 && level === 1));
  } else {
    let topLane = activeLanes[0];
    isSafe = (topLane && topLane.type === 'SAFE') ? false : Math.random() < safeChance;
  }

  let laneType = isSafe ? 'SAFE' : 'ROAD';
  let dir = Math.random() < 0.5 ? 1 : -1;
  let speedFactor = 0.38 + Math.min(level * 0.16, 1.2);
  let baseSpeed = (0.45 + Math.random() * 0.35) * speedFactor;

  let vTypes = Object.values(PREMIERE_CLIPS);
  let trackLabel = r % 5 === 0 ? "V3" : r % 5 === 1 ? "V2" : r % 5 === 2 ? "V1" : r % 5 === 3 ? "A1" : "A2";

  let laneObj = {
    type: laneType,
    trackLabel: isSafe ? "SAFE" : trackLabel,
    bg: isSafe ? '#1c2230' : '#141416',
    dir,
    speed: baseSpeed,
    objects: [],
    pickups: []
  };

  if (laneType === 'ROAD') {
    let x = TRACK_HEADER_W - CELL_SIZE * 3;
    let minGap = Math.max(4, 10 - level * 1.5);

    do {
      x += CELL_SIZE * (Math.random() * 2.5 + minGap);
      if (x < CANVAS_W + CELL_SIZE * 3) {
        let vType = vTypes[Math.floor(Math.random() * vTypes.length)];
        laneObj.objects.push({
          x,
          type: vType,
          w: vType.wMult * CELL_SIZE
        });
      }
    } while (x < CANVAS_W + CELL_SIZE * 3);
  } else if (Math.random() < 0.35) {
    let keys = Object.keys(PICKUP_TYPES);
    let key = keys[Math.floor(Math.random() * keys.length)];
    laneObj.pickups.push({
      gx: Math.floor(Math.random() * (COLS - 3)) + 2,
      type: PICKUP_TYPES[key]
    });
  }

  return laneObj;
}

function startInfiniteScroll() {
  activeLanes = [];
  visualScrollOffset = 0;
  for (let r = 0; r < ROWS; r++) {
    activeLanes.push(createNewLane(true, r));
  }
  resetPlayer();
}

function resetPlayer() {
  player.gx = Math.floor(COLS / 2);
  player.gy = ROWS - 2;
  player.invTimer = 0;
  player.guardTimer = 0;
  player.nextMoveAllowedTimer = 0;
  player.speedMult = 1;
  player.tempScoreMult = 1;
  player.glitchTimer = 0;
}

function startGame() {
  currentTheme = CHARACTERS[CHARACTER_LIST[selectedCharIndex]];
  score = 0;
  lives = 3;
  level = 1;
  startInfiniteScroll();
  gameState = 'playing';
  playSound('pickup');
}

function updatePlayer() {
  if (player.nextMoveAllowedTimer > 0) player.nextMoveAllowedTimer--;
  if (player.glitchTimer > 0) player.glitchTimer--;

  if (player.nextMoveAllowedTimer <= 0) {
    let dx = 0, dy = 0;
    let inLeft = keyPressed('ArrowLeft') || keyPressed('KeyA') || moveLeft;
    let inRight = keyPressed('ArrowRight') || keyPressed('KeyD') || moveRight;
    let inUp = keyPressed('ArrowUp') || keyPressed('KeyW') || moveUp;
    let inDown = keyPressed('ArrowDown') || keyPressed('KeyS') || moveDown;

    if (player.glitchTimer > 0) {
      let tL = inLeft, tR = inRight, tU = inUp, tD = inDown;
      inLeft = tR; inRight = tL; inUp = tD; inDown = tU;
    }

    if (inLeft) { dx--; player.facingLeft = true; }
    else if (inRight) { dx++; player.facingLeft = false; }

    if (inUp) dy--;
    else if (inDown) dy++;

    if (dx || dy) {
      let ngx = player.gx + dx;
      let ngy = player.gy + dy;

      if (ngx >= 2 && ngx < COLS && ngy >= 0 && ngy < ROWS) {
        player.gx = ngx;
        player.gy = ngy;

        if (dy < 0 && player.gy < 6) scrollWorldDown();
        else if (dy < 0) score += Math.floor(10 * level * currentTheme.scoreMult * player.tempScoreMult);

        playSound('cross');
        let effSpeed = currentTheme.speed * player.speedMult;
        player.nextMoveAllowedTimer = Math.max(5, Math.floor(14 / effSpeed));
      }
    }
  }

  if (player.invTimer > 0) player.invTimer--;
  if (player.guardTimer > 0) player.guardTimer--;

  checkPickups();
  checkCollisions();
}

function scrollWorldDown() {
  activeLanes.pop();
  activeLanes.unshift(createNewLane(false));
  player.gy++;
  visualScrollOffset -= CELL_SIZE;
  score += Math.floor(15 * level * currentTheme.scoreMult * player.tempScoreMult);

  if (score > level * 1200) level++;
}

function updateVehicles() {
  visualScrollOffset += (0 - visualScrollOffset) * 0.25;
  if (Math.abs(visualScrollOffset) < 0.1) visualScrollOffset = 0;

  activeLanes.forEach(lane => {
    if (lane.type === 'ROAD') {
      lane.objects.forEach(obj => {
        obj.x += lane.speed * lane.dir;
        if (lane.dir > 0 && obj.x > CANVAS_W + obj.w) obj.x = TRACK_HEADER_W - obj.w;
        else if (lane.dir < 0 && obj.x < TRACK_HEADER_W - obj.w) obj.x = CANVAS_W + obj.w;
      });
    }
  });

  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function addParticles(x, y, color, count = 8) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - .5) * 6,
      vy: (Math.random() - .5) * 6,
      life: 16, color
    });
  }
}

function checkPickups() {
  let currentLane = activeLanes[player.gy];
  if (!currentLane || !currentLane.pickups.length) return;

  for (let i = currentLane.pickups.length - 1; i >= 0; i--) {
    let p = currentLane.pickups[i];
    if (p.gx === player.gx) {
      score += Math.floor(p.type.pts * currentTheme.scoreMult);
      if (p.type.isMalus) {
        playSound('malus');
        if (p.type.slowFactor) player.speedMult = p.type.slowFactor;
        if (p.type.invertControls) player.glitchTimer = 180;
      } else {
        playSound('pickup');
        if (p.type.speedBoost) player.speedMult = p.type.speedBoost;
        if (p.type.scoreBoost) player.tempScoreMult = p.type.scoreBoost;
        if (p.type.shieldDuration) {
          player.guardTimer = p.type.shieldDuration;
          playSound('guard_active');
        }
      }
      addParticles(player.gx * CELL_SIZE + CELL_SIZE / 2, player.gy * CELL_SIZE + HUD_HEIGHT, p.type.isMalus ? '#ff0055' : '#00f3ff', 10);
      currentLane.pickups.splice(i, 1);
    }
  }
}

function checkCollisions() {
  if (gameState !== 'playing' || player.invTimer > 0 || player.guardTimer > 0) return;
  let playerX = player.gx * CELL_SIZE + CELL_SIZE / 2;
  let lane = activeLanes[player.gy];

  if (lane && lane.type === 'ROAD') {
    lane.objects.forEach(obj => {
      let oLeft = obj.x, oRight = obj.x + obj.w;
      let pLeft = playerX - player.w / 2, pRight = playerX + player.w / 2;
      if (pLeft < oRight && pRight > oLeft) hitPlayer();
    });
  }
}

function hitPlayer() {
  lives--;
  playSound('crash');
  addParticles(player.gx * CELL_SIZE + CELL_SIZE / 2, player.gy * CELL_SIZE + HUD_HEIGHT, '#ff0055', 20);

  if (lives <= 0) {
    gameState = 'gameover';
    playSound('fail');
    saveScore();
  } else {
    let respawnGy = ROWS - 2;
    for (let r = player.gy; r < ROWS; r++) {
      if (activeLanes[r] && activeLanes[r].type === 'SAFE') {
        respawnGy = r;
        break;
      }
    }
    player.gx = Math.floor(COLS / 2);
    player.gy = respawnGy;
    player.invTimer = 90;
    player.glitchTimer = 0;
    player.speedMult = 1;
    player.tempScoreMult = 1;
  }
}

function drawGameWorld() {
  ctx.fillStyle = '#181818';
  ctx.fillRect(0, HUD_HEIGHT, CANVAS_W, CANVAS_H - HUD_HEIGHT);

  activeLanes.forEach((lane, r) => {
    let y = r * CELL_SIZE + HUD_HEIGHT + visualScrollOffset;
    ctx.fillStyle = lane.bg;
    ctx.fillRect(0, y, CANVAS_W, CELL_SIZE);
    ctx.strokeStyle = '#222226';
    ctx.strokeRect(0, y, CANVAS_W, CELL_SIZE);
  });

  activeLanes.forEach((lane, r) => {
    if (lane.type === 'SAFE') {
      let y = r * CELL_SIZE + HUD_HEIGHT + visualScrollOffset;
      lane.pickups.forEach(p => {
        let px = p.gx * CELL_SIZE + CELL_SIZE / 2;
        let py = y + CELL_SIZE / 2;
        ctx.fillStyle = p.type.isMalus ? '#ff0055' : '#ffff00';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.type.label.split(' ')[0], px, py);
      });
    }
  });

  activeLanes.forEach((lane, r) => {
    if (lane.type === 'ROAD') {
      let y = r * CELL_SIZE + HUD_HEIGHT + visualScrollOffset;
      lane.objects.forEach(obj => {
        let x = obj.x;
        let blockW = obj.w;
        let blockH = CELL_SIZE - 2;

        if (x + blockW < TRACK_HEADER_W) return;

        ctx.save();
        
        ctx.beginPath();
        ctx.rect(x + 1, y + 1, blockW - 2, blockH);
        ctx.clip();

        ctx.fillStyle = obj.type.bg;
        ctx.fillRect(x + 1, y + 1, blockW - 2, blockH);

        ctx.fillStyle = obj.type.topBar || '#00ff66';
        ctx.fillRect(x + 1, y + 1, blockW - 2, 2);

        ctx.strokeStyle = obj.type.border;
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 1, y + 1, blockW - 2, blockH);

        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(x + 3, y + 4, 12, 10);
        ctx.fillStyle = '#00f3ff';
        ctx.font = 'bold 8px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('FX', x + 9, y + 9);

        ctx.fillStyle = obj.type.textCol;
        ctx.font = 'bold 9px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        let maxTextW = Math.max(10, blockW - 22);
        ctx.fillText(obj.type.label, x + blockW / 2 + 6, y + blockH / 2 + 1, maxTextW);

        ctx.restore();
      });
    }
  });

  activeLanes.forEach((lane, r) => {
    let y = r * CELL_SIZE + HUD_HEIGHT + visualScrollOffset;
    ctx.fillStyle = '#1c1c24';
    ctx.fillRect(0, y, TRACK_HEADER_W, CELL_SIZE);
    ctx.strokeStyle = '#2a2a38';
    ctx.strokeRect(0, y, TRACK_HEADER_W, CELL_SIZE);
    ctx.fillStyle = '#8a8a95';
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(lane.trackLabel, TRACK_HEADER_W / 2, y + CELL_SIZE / 2);
  });

  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
  });

  let playheadX = player.gx * CELL_SIZE + CELL_SIZE / 2;
  ctx.strokeStyle = 'rgba(0,243,255,0.45)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(playheadX, HUD_HEIGHT);
  ctx.lineTo(playheadX, CANVAS_H);
  ctx.stroke();

  drawSinglePlayer();
}

function drawSinglePlayer() {
  let playerY = player.gy * CELL_SIZE + HUD_HEIGHT + CELL_SIZE / 2 + visualScrollOffset;
  let playerX = player.gx * CELL_SIZE + CELL_SIZE / 2;

  if (player.invTimer > 0 && Math.floor(player.invTimer / 4) % 2 === 0) return;

  ctx.save();
  ctx.translate(playerX, playerY);
  if (player.facingLeft) ctx.scale(-1, 1);

  ctx.shadowColor = '#00f3ff';
  ctx.shadowBlur = 10;
  ctx.fillStyle = '#00f3ff';
  ctx.beginPath();
  ctx.moveTo(0, -12); ctx.lineTo(10, 0); ctx.lineTo(0, 12); ctx.lineTo(-10, 0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  if (player.glitchTimer > 0) {
    ctx.fillStyle = '#ff0055';
    ctx.font = 'bold 10px monospace';
    ctx.fillText('⚠', 0, -16);
  }

  if (player.guardTimer > 0) {
    ctx.shadowColor = '#00ff66';
    ctx.strokeStyle = '#00ff66';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 16, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawMenuBackground() {
  ctx.fillStyle = '#08080d';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  ctx.strokeStyle = 'rgba(0, 243, 255, 0.06)';
  ctx.lineWidth = 1;
  let gridStep = 20;
  let offsetY = (frame * 0.5) % gridStep;

  for (let x = 0; x <= CANVAS_W; x += gridStep) {
    ctx.beginPath();
    ctx.moveTo(x, 0); ctx.lineTo(x, CANVAS_H);
    ctx.stroke();
  }
  for (let y = offsetY; y <= CANVAS_H; y += gridStep) {
    ctx.beginPath();
    ctx.moveTo(0, y); ctx.lineTo(CANVAS_W, y);
    ctx.stroke();
  }

  ctx.fillStyle = 'rgba(0, 243, 255, 0.15)';
  ctx.font = '9px monospace';
  ctx.textAlign = 'left';
  let tcSec = Math.floor(frame / 60) % 60;
  let tcFrame = frame % 60;
  ctx.fillText(`TC: 00:14:${tcSec < 10 ? '0' + tcSec : tcSec}:${tcFrame < 10 ? '0' + tcFrame : tcFrame}`, 10, 20);
  ctx.fillText(`SEQ: TIMELINE_RUSH_2026`, 10, 32);
  ctx.textAlign = 'right';
  ctx.fillText(`PROXIES: ACTIVE`, CANVAS_W - 10, 20);
  ctx.fillText(`GPU_ACCEL: ON`, CANVAS_W - 10, 32);
}

function drawCyberPanel(x, y, w, h, borderColor = '#00f3ff', bgColor = 'rgba(16, 16, 26, 0.92)') {
  ctx.save();
  ctx.fillStyle = bgColor;
  ctx.fillRect(x, y, w, h);

  ctx.strokeStyle = borderColor;
  ctx.lineWidth = 2;
  ctx.shadowColor = borderColor;
  ctx.shadowBlur = 10;
  ctx.strokeRect(x, y, w, h);
  ctx.shadowBlur = 0;

  let cLen = 8;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y + cLen); ctx.lineTo(x, y); ctx.lineTo(x + cLen, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + w, y + h - cLen); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - cLen, y + h); ctx.stroke();

  ctx.restore();
}

    ctx.fillRect(boxX + 30, boxY + 320, boxW - 60, 40);
    ctx.fillStyle = '#000'; ctx.font = '900 12px monospace'; ctx.textAlign = 'center';
    ctx.fillText('SCEGLI VIDEOMAKER ►', CANVAS_W / 2, boxY + 344);
    return;
  }

  // 5. SELEZIONE PERSONAGGIO (CHAR SELECT)
  if (gameState === 'CHAR_SELECT') {
    let boxW = 314, boxH = 400;
    let boxX = (CANVAS_W - boxW) / 2, boxY = 30;

    let c = CHARACTERS[CHARACTER_LIST[selectedCharIndex]];

    drawCyberPanel(boxX, boxY, boxW, boxH, c.primary);

    ctx.fillStyle = c.primary;
    ctx.font = '900 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('🎬 SELEZIONA VIDEOMAKER', CANVAS_W / 2, boxY + 26);

    let imgW = 140, imgH = 140;
    let imgX = (CANVAS_W - imgW) / 2, imgY = boxY + 40;

    ctx.fillStyle = '#0a0a10';
    ctx.fillRect(imgX, imgY, imgW, imgH);

    if (c.img && c.img.complete && c.img.naturalWidth > 0) {
      ctx.drawImage(c.img, imgX, imgY, imgW, imgH);
    } else {
      ctx.fillStyle = c.primary;
      ctx.font = '900 48px monospace';
      ctx.fillText(c.name[0], CANVAS_W / 2, imgY + 85);
    }

    ctx.strokeStyle = c.primary;
    ctx.lineWidth = 2;
    ctx.strokeRect(imgX, imgY, imgW, imgH);

    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(imgX + 4, imgY + 4, 50, 14);
    ctx.fillStyle = '#00ff66';
    ctx.font = 'bold 8px monospace';
    ctx.fillText('● REC 4K', imgX + 28, imgY + 14);

    ctx.fillStyle = c.primary;
    ctx.font = '900 20px -apple-system, sans-serif';
    ctx.fillText(c.name, CANVAS_W / 2, boxY + 204);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px sans-serif';
    ctx.fillText(c.subtitle, CANVAS_W / 2, boxY + 224);

    ctx.fillStyle = '#0a0a10';
    ctx.fillRect(boxX + 20, boxY + 240, boxW - 40, 65);
    ctx.strokeStyle = '#2a2a38';
    ctx.strokeRect(boxX + 20, boxY + 240, boxW - 40, 65);

    ctx.fillStyle = '#ffea00';
    ctx.font = 'bold 10px monospace';
    ctx.fillText(c.perkBonus, CANVAS_W / 2, boxY + 263);

    ctx.fillStyle = '#ff0055';
    ctx.fillText(c.perkMalus, CANVAS_W / 2, boxY + 285);

    ctx.fillStyle = '#00f3ff';
    ctx.font = '900 16px monospace';
    ctx.fillText('◄  CAMBIA PERSONAGGIO   ►', CANVAS_W / 2, boxY + 330);

    ctx.fillStyle = c.primary;
    ctx.fillRect(boxX + 30, boxY + 348, boxW - 60, 38);
    ctx.fillStyle = '#000000';
    ctx.font = '900 12px monospace';
    ctx.fillText('PREMI OK PER CONFERMARE ►', CANVAS_W / 2, boxY + 371);
    return;
  }

  // 6. PAUSA (PAUSE SCREEN)
  if (gameState === 'PAUSE') {
    let boxW = 280, boxH = 180;
    let boxX = (CANVAS_W - boxW) / 2, boxY = (CANVAS_H - boxH) / 2;

    drawCyberPanel(boxX, boxY, boxW, boxH, '#ffea00');

    ctx.fillStyle = '#ffea00';
    ctx.font = '900 22px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('⏸️ IN PAUSA', CANVAS_W / 2, boxY + 60);

    ctx.fillStyle = '#00f3ff';
    ctx.font = 'bold 11px monospace';
    ctx.fillText('TIMELINE SOSPESA', CANVAS_W / 2, boxY + 95);

    ctx.fillStyle = '#ffffff';
    ctx.font = '10px monospace';
    ctx.fillText('TOCCA PER RIPRENDERE IL MONTAGGIO', CANVAS_W / 2, boxY + 130);
    return;
  }

  // 7. GAME OVER (GAME OVER SCREEN)
  if (gameState === 'gameover') {
    let boxW = 300, boxH = 310;
    let boxX = (CANVAS_W - boxW) / 2, boxY = (CANVAS_H - boxH) / 2 - 20;

    drawCyberPanel(boxX, boxY, boxW, boxH, '#ff0055');

    ctx.fillStyle = '#ff0055';
    ctx.font = '900 20px monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 10;
    ctx.fillText('DEADLINE MISSED! 💀', CANVAS_W / 2, boxY + 50);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#ffffff';
    ctx.font = '12px monospace';
    ctx.fillText('CRASH DEL SISTEMA DI EXPORT', CANVAS_W / 2, boxY + 80);

    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(boxX + 20, boxY + 105, boxW - 40, 100);
    ctx.strokeStyle = '#ffea00';
    ctx.strokeRect(boxX + 20, boxY + 105, boxW - 40, 100);

    ctx.fillStyle = '#ffea00';
    ctx.font = '900 16px monospace';
    ctx.fillText(`PUNTEGGIO: ${score}`, CANVAS_W / 2, boxY + 145);

    ctx.fillStyle = '#00f3ff';
    ctx.font = 'bold 11px monospace';
    ctx.fillText(`RECORD ATTUALE: ${highScore}`, CANVAS_W / 2, boxY + 175);

    ctx.fillStyle = Math.floor(frame / 30) % 2 === 0 ? '#ff0055' : '#ffea00';
    ctx.fillRect(boxX + 25, boxY + 230, boxW - 50, 42);
    ctx.fillStyle = '#000';
    ctx.font = '900 12px monospace';
    ctx.fillText('► TOCCA PER RIPROVARE ◄', CANVAS_W / 2, boxY + 256);
  }
}

canvas.addEventListener('pointerdown', e => {
  getAC();
  let rect = canvas.getBoundingClientRect();
  let x = (e.clientX - rect.left) * (CANVAS_W / rect.width);
  let y = (e.clientY - rect.top) * (CANVAS_H / rect.height);

  if (['COVER', 'STORY', 'RULES', 'POWERUPS_INFO'].includes(gameState)) {
    advanceMenuState();
    return;
  }

  if (gameState === 'CHAR_SELECT') {
    if (x < 70) {
      selectedCharIndex = (selectedCharIndex - 1 + CHARACTER_LIST.length) % CHARACTER_LIST.length;
      playSound('cross');
      return;
    }
    if (x > CANVAS_W - 70) {
      selectedCharIndex = (selectedCharIndex + 1) % CHARACTER_LIST.length;
      playSound('cross');
      return;
    }
    advanceMenuState();
    return;
  }

  if (gameState === 'playing') {
    if (y < HUD_HEIGHT) {
      gameState = 'PAUSE';
      updateMusicState();
    }
    return;
  }

  if (gameState === 'PAUSE') {
    gameState = 'playing';
    updateMusicState();
    return;
  }

  if (gameState === 'gameover') {
    gameState = 'CHAR_SELECT';
  }
});

function bindDirBtn(id, setFlag) {
  let el = document.getElementById(id);
  if (!el) return;

  const press = (e) => {
    if (e.cancelable) e.preventDefault();
    getAC();
    if (['COVER', 'STORY', 'RULES', 'POWERUPS_INFO', 'CHAR_SELECT', 'gameover'].includes(gameState)) {
      if (id === 'btnLeft') {
        selectedCharIndex = (selectedCharIndex - 1 + CHARACTER_LIST.length) % CHARACTER_LIST.length;
        playSound('cross');
      } else if (id === 'btnRight') {
        selectedCharIndex = (selectedCharIndex + 1) % CHARACTER_LIST.length;
        playSound('cross');
      } else {
        advanceMenuState();
      }
      return;
    }
    setFlag(true);
  };

  const release = (e) => {
    if (e.cancelable) e.preventDefault();
    setFlag(false);
  };

  el.addEventListener('pointerdown', press);
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('pointerleave', release);
}

bindDirBtn('btnUp', d => moveUp = d);
bindDirBtn('btnDown', d => moveDown = d);
bindDirBtn('btnLeft', d => moveLeft = d);
bindDirBtn('btnRight', d => moveRight = d);

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  getAC();

  if (['COVER', 'STORY', 'RULES', 'POWERUPS_INFO'].includes(gameState)) {
    if (e.code === 'Space' || e.code === 'Enter') advanceMenuState();
  } else if (gameState === 'CHAR_SELECT') {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
      selectedCharIndex = (selectedCharIndex - 1 + CHARACTER_LIST.length) % CHARACTER_LIST.length;
      playSound('cross');
    }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') {
      selectedCharIndex = (selectedCharIndex + 1) % CHARACTER_LIST.length;
      playSound('cross');
    }
    if (e.code === 'Space' || e.code === 'Enter') advanceMenuState();
  } else if (gameState === 'gameover' && (e.code === 'Space' || e.code === 'Enter')) {
    gameState = 'CHAR_SELECT';
  } else if ((e.code === 'KeyP' || e.code === 'Escape') && (gameState === 'playing' || gameState === 'PAUSE')) {
    gameState = gameState === 'playing' ? 'PAUSE' : 'playing';
    updateMusicState();
  }
});

window.addEventListener('keyup', e => {
  keys[e.code] = false;
});

function keyPressed(code) {
  return !!keys[code];
}

function saveScore() {
  try {
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('deadlineDrive_highScore', highScore.toString());
    }

    if (score <= 0) return;
    let rawUser = localStorage.getItem('arcade_current_user');
    if (!rawUser) return;

    let curUser = JSON.parse(rawUser);
    if (curUser && curUser.stats) {
      curUser.stats.gamesPlayed = (curUser.stats.gamesPlayed || 0) + 1;
      curUser.stats.deadlineDrive = (curUser.stats.deadlineDrive || 0) + score;
      localStorage.setItem('arcade_current_user', JSON.stringify(curUser));

      if (curUser.username && !curUser.username.startsWith("GUEST_")) {
        let rawUsers = localStorage.getItem('arcade_users');
        let users = rawUsers ? JSON.parse(rawUsers) : {};
        if (users[curUser.username]) {
          users[curUser.username].stats = curUser.stats;
          localStorage.setItem('arcade_users', JSON.stringify(users));
        }
      }
    }
  } catch (e) {}
}

function exitGame() {
  saveScore();
  bgMusic.pause();
  window.location.href = 'index.html';
}

function update() {
  frame++;
  if (gameState === 'playing') {
    updateVehicles();
    updatePlayer();
  }
}

function draw() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  if (gameState === 'playing') {
    drawGameWorld();
    drawHUD();
  } else {
    drawScreens();
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
