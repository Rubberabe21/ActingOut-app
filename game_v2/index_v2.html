<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#060212">
<title>Pixel Punch V2 - Agency Arcade</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;overflow:hidden;background:#060212;color:#fff;font-family:"Courier New",monospace;touch-action:none}body{position:fixed;inset:0;display:flex;justify-content:center}#game-wrapper{width:min(100vw,540px);height:100svh;padding:max(env(safe-area-inset-top),4px) 6px max(env(safe-area-inset-bottom),6px);display:flex;flex-direction:column;align-items:center;overflow:hidden}.top-header{width:100%;height:38px;display:flex;align-items:center;gap:6px;flex:none}.header-title{flex:1;color:#ff3e91;font-size:13px;font-weight:900;letter-spacing:1px;text-shadow:0 0 8px #ff3e91}.header-btns-right{display:flex;gap:5px}.opt-btn{width:65px;padding:6px 0;border:1.5px solid #ffea00;border-radius:6px;background:#1a0836;color:#ffea00;font:900 10px "Courier New",monospace}.opt-btn:active,.action-btn:active{transform:translateY(2px)}#btnMenuTop{border-color:#00f0ff;color:#00f0ff}#btnExitTop{border-color:#ff3e91;color:#ff3e91}#canvas-container{position:relative;width:min(100%,calc(100svh - 234px));aspect-ratio:1;flex:none;display:grid;place-items:center;overflow:hidden}#pixel-punch-v2{width:100%;height:100%;display:grid;place-items:center}#pixel-punch-v2 canvas{width:100%;height:100%;max-width:100%;max-height:100%;aspect-ratio:1;border:2px solid #ff3e91;border-radius:8px;box-shadow:0 0 15px #ff3e9166;image-rendering:pixelated}.control-deck{width:100%;min-height:188px;flex:1 1 auto;margin-top:4px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#160a2c;border:2px solid #ffea00;border-radius:14px;box-shadow:0 0 15px #ffea0044}.joystick-zone{position:relative;width:clamp(122px,30vw,150px);height:clamp(122px,30vw,150px);flex:none;border:3px solid #00f0ff;border-radius:50%;background:radial-gradient(circle,#1c0b3b 30%,#090216 90%);box-shadow:inset 0 0 18px #00f0ff55,0 0 10px #00f0ff55;touch-action:none}.joystick-knob{position:absolute;left:50%;top:50%;width:58px;height:58px;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff3e91,#78003c);box-shadow:0 0 14px #ff3e91;pointer-events:none}.action-buttons{display:grid;grid-template-columns:repeat(2,clamp(68px,18vw,82px));grid-template-rows:repeat(2,clamp(68px,18vw,82px));gap:8px;place-items:center}.action-btn{position:relative;width:clamp(68px,18vw,82px);height:clamp(68px,18vw,82px);overflow:hidden;border:3px solid #fff;border-radius:50%;color:#fff;background:radial-gradient(circle at 35% 35%,#ff3e91,#84002f);box-shadow:0 4px 0 #52001e,0 0 16px #ff3e9199;font:900 30px "Courier New",monospace;touch-action:none}.action-btn.special,.action-btn.guard{width:100%;height:100%}.action-btn:not(.special):not(.guard){grid-column:1/3;width:clamp(76px,20vw,92px);height:clamp(76px,20vw,92px);margin-top:-8px}.action-btn.special{background:#221342;box-shadow:0 4px 0 #100820,0 0 14px #8f52ff88}.action-btn.guard{background:radial-gradient(circle at 35% 35%,#25d9b1,#075944);box-shadow:0 4px 0 #04382b,0 0 14px #25d9b199}.action-btn.guard.active{background:radial-gradient(circle at 35% 35%,#8dffe5,#08a77c);box-shadow:0 0 0 4px #fff,0 0 24px #25ffd0}.special-fill{position:absolute;inset:auto 0 0;height:100%;background:linear-gradient(#a260ff,#5a20d0);pointer-events:none}.btn-label{position:relative;z-index:2}#boot-error{display:none;padding:16px;border:2px solid #ff3e91;background:#170511}.modal-overlay{display:none;position:absolute;inset:0;z-index:200;align-items:center;justify-content:center;padding:16px;background:#060212f2}.modal-box{width:min(320px,100%);padding:18px;display:flex;flex-direction:column;gap:12px;text-align:center;background:#0e051b;border:3px solid #ff3e91;border-radius:14px;box-shadow:0 0 25px #ff3e9180}.modal-title{color:#ffea00;font-weight:900}.option-item{padding:10px;border:1px solid #ff3e9166;border-radius:8px;background:#160a2c}.option-label{display:block;margin-bottom:7px;color:#00f0ff;font-size:11px;font-weight:900}.sens-slider,.modal-btn{width:100%}.modal-btn{padding:9px;margin-top:5px;border:2px solid #00f0ff;border-radius:7px;background:#281448;color:#fff;font:900 12px "Courier New",monospace}.close-modal-btn{padding:10px;border:2px solid #fff;border-radius:8px;background:#c51c68;color:#fff;font:900 12px "Courier New",monospace}@media(max-width:380px),(max-height:700px){#canvas-container{width:min(100%,calc(100svh - 206px))}.control-deck{min-height:164px;padding:8px 10px;gap:8px}.joystick-zone{width:112px;height:112px}.action-buttons{grid-template-columns:repeat(2,66px);grid-template-rows:repeat(2,66px);gap:5px}.action-btn{width:66px;height:66px}.action-btn:not(.special):not(.guard){width:74px;height:74px}}
</style><script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script></head>
<body><div id="game-wrapper">
<header class="top-header"><span class="header-title">PIXEL PUNCH</span><div class="header-btns-right"><button class="opt-btn" id="btnMenuTop">MENU</button><button class="opt-btn" id="btnExitTop">ESCI</button><button class="opt-btn" id="btnOpenSettings">OPZIONI</button></div></header>
<div id="canvas-container"><main id="pixel-punch-v2" aria-label="Pixel Punch V2"></main><div id="boot-error">Impossibile avviare Pixel Punch V2. Controlla la connessione necessaria per caricare Phaser.</div></div>
<div class="control-deck"><div class="joystick-zone" id="joyZone"><div class="joystick-knob" id="joyKnob"></div></div><div class="action-buttons"><button class="action-btn run" id="btnRun" aria-label="Corri"><span class="btn-label">R</span></button><button class="action-btn guard" id="btnGuard" aria-label="Parata"><span class="btn-label">P</span></button><button class="action-btn" id="btnAttack"><span class="btn-label">A</span></button><button class="action-btn special" id="btnSpecial"><span class="special-fill" id="specialFill"></span><span class="btn-label">B</span></button></div></div>
<div class="modal-overlay" id="settingsModal"><div class="modal-box"><div class="modal-title">⚙ OPZIONI GIOCO</div><div class="option-item"><label class="option-label">SENSIBILITÀ JOYSTICK: <span id="sensValText">1.00x</span></label><input class="sens-slider" id="sensSlider" type="range" min="0.5" max="2" step="0.25" value="1"></div><div class="option-item"><button class="modal-btn" id="btnShowRules">📖 REGOLE DI GIOCO</button><button class="modal-btn" id="btnShowStory">🎬 LA STORIA</button></div><button class="close-modal-btn" id="btnCloseSettings">SALVA E CHIUDI ►</button></div></div>
</div><script src="js/PixelPunchEngine.js"></script><script>
(()=>{const input=window.PixelPunchInput={x:0,y:0,running:false},zone=document.getElementById('joyZone'),knob=document.getElementById('joyKnob');let active=null,sens=Number(localStorage.getItem('pixelPunch_joySens'))||1;const slider=document.getElementById('sensSlider'),text=document.getElementById('sensValText');slider.value=sens;text.textContent=sens.toFixed(2)+'x';function move(e){const r=zone.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,max=r.width*.32,len=Math.hypot(x,y)||1;if(len>max){x=x/len*max;y=y/len*max}knob.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;input.x=Math.max(-1,Math.min(1,x/max*sens));input.y=Math.max(-1,Math.min(1,y/max*sens))}function reset(e){if(!e||e.pointerId===active){active=null;input.x=0;input.y=0;knob.style.transform='translate(-50%,-50%)'}}zone.addEventListener('pointerdown',e=>{active=e.pointerId;zone.setPointerCapture(e.pointerId);move(e)});zone.addEventListener('pointermove',e=>{if(e.pointerId===active)move(e)});zone.addEventListener('pointerup',reset);zone.addEventListener('pointercancel',reset);const run=document.getElementById('btnRun'),setRunning=value=>{input.running=value;run.classList.toggle('active',value)};run.addEventListener('pointerdown',e=>{e.preventDefault();setRunning(true)});['pointerup','pointercancel','pointerout'].forEach(name=>run.addEventListener(name,()=>setRunning(false)));const action=name=>window.dispatchEvent(new CustomEvent('pixelpunch-action',{detail:name}));const guard=document.getElementById('btnGuard');document.getElementById('btnAttack').addEventListener('pointerdown',e=>{e.preventDefault();guard.classList.remove('active');action('attack')});document.getElementById('btnSpecial').addEventListener('pointerdown',e=>{e.preventDefault();guard.classList.remove('active');action('special')});guard.addEventListener('pointerdown',e=>{e.preventDefault();guard.classList.toggle('active');action('guard-toggle')});document.getElementById('btnMenuTop').onclick=()=>{guard.classList.remove('active');action('menu')};document.getElementById('btnExitTop').onclick=()=>history.length>1?history.back():location.assign('../index.html');const modal=document.getElementById('settingsModal');document.getElementById('btnOpenSettings').onclick=()=>{guard.classList.remove('active');modal.style.display='flex';action('pause')};document.getElementById('btnCloseSettings').onclick=()=>{modal.style.display='none';action('resume')};document.getElementById('btnShowRules').onclick=()=>{modal.style.display='none';action('rules')};document.getElementById('btnShowStory').onclick=()=>{modal.style.display='none';action('story')};slider.oninput=()=>{sens=Number(slider.value);text.textContent=sens.toFixed(2)+'x';localStorage.setItem('pixelPunch_joySens',sens)}})();
window.addEventListener('pixelpunch-guard-state',e=>document.getElementById('btnGuard').classList.toggle('active',!!e.detail));
</script></body></html>
