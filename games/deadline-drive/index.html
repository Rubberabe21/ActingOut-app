<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Deadline Drive - Premiere Pro Timeline Rush</title>

<!-- SDK Supabase per salvataggio Cloud -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../shared/js/supabase-client.js"></script>
<script src="../../shared/js/audio-manager.js"></script>
<script src="../../shared/js/score-manager.js"></script>
<script src="../../shared/js/arcade-game-shell.js"></script>

<link rel="stylesheet" href="../../shared/css/arcade-game.css">

<link rel="stylesheet" href="game.css">
<script defer src="../../shared/js/rotation-lock.js"></script>
</head>
<body>

<div id="game-wrapper">
  <div class="top-header">
    <button class="opt-btn options-btn" id="btnOpenSettings">OPZIONI</button>
    <span class="header-title"><span>DEADLINE</span><span>DRIVE</span></span>
    <div class="header-btns-right">
      <button class="opt-btn restart-btn" id="btnMenuTop">RESTART</button>
      <button class="opt-btn exit-x-btn" id="btnExitTop" aria-label="Esci">×</button>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="game"></canvas>
  </div>

  <div class="control-deck">
    <button class="dir-btn" id="btnUp"><span>▲</span>SU</button>
    <button class="dir-btn" id="btnLeft"><span>◀</span>SINISTRA</button>
    <button class="dir-btn" id="btnDown"><span>▼</span>GIÙ</button>
    <button class="dir-btn" id="btnRight"><span>▶</span>DESTRA</button>
  </div>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box">
      <div class="modal-title">⚙️ TIMELINE SETTINGS</div>

      <div class="option-item">
        <span class="option-label">MUSICA (BGM)</span>
        <button class="toggle-btn active" id="btnToggleMusic">ON 🎵</button>
      </div>

      <div class="option-item">
        <span class="option-label">EFFETTI SONORI (SFX)</span>
        <button class="toggle-btn active" id="btnToggleSfx">ON 🔊</button>
      </div>

      <div class="option-item">
        <span class="option-label">CONSULTA INFO GIOCO</span>
        <button class="toggle-btn" id="btnModalRules" style="margin-bottom:4px; border-color:#ffea00; color:#ffea00; background:#222210;">📋 REGOLE GIOCO</button>
        <button class="toggle-btn" id="btnModalPowerups" style="border-color:#00ff66; color:#00ff66; background:#0a2414;">⚡ BONUS & MALUS</button>
      </div>

      <button class="close-modal-btn" id="btnCloseSettings">SALVA E CHIUDI ►</button>
    </div>
  </div>
</div>

<script src="game.js"></script>

</body>
</html>
