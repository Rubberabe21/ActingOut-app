class GreenKeyPipeline extends Phaser.Renderer.WebGL.Pipelines.SinglePipeline {
constructor(game) {
super({
game: game,
fragShader: `
precision mediump float;
uniform sampler2D uMainSampler;
varying vec2 outTexCoord;
varying vec4 outTint;

void main() {
vec4 texColor = texture2D(uMainSampler, outTexCoord);
vec3 keyColor = vec3(0.2392, 1.0, 0.0118); // #3DFF03
float diff = distance(texColor.rgb, keyColor);

if (diff < 0.44) {
discard;
} else {
float maxRB = max(texColor.r, texColor.b);
if (texColor.g > maxRB) {
texColor.g = mix(texColor.g, maxRB, 0.85);
}
gl_FragColor = texColor * outTint;
}
}
`
});
}
}

class AuthManager {
  constructor() {
    this.currentUser = null;
    this.init();
  }

  init() {
    const savedUser = localStorage.getItem('arcade_current_user');
    if (savedUser) {
      this.currentUser = JSON.parse(savedUser);
      if (!this.currentUser.stats) this.currentUser.stats = {};
      this.syncWithSupabase();
    } else {
      window.location.replace('./start.html');
    }
  }

  async syncWithSupabase() {
    if (!this.currentUser || !this.currentUser.username || this.currentUser.username.startsWith("GUEST_")) return;
    if (!supabaseClient) return;

    try {
      let { data, error } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('username', this.currentUser.username)
        .maybeSingle();

      if (data && !error) {
        this.currentUser.avatar = data.avatar || this.currentUser.avatar;
        this.currentUser.role = data.role || this.currentUser.role;
        this.currentUser.activity = data.activity || this.currentUser.activity;
        this.currentUser.stats = data.stats || this.currentUser.stats;

        localStorage.setItem('arcade_current_user', JSON.stringify(this.currentUser));
        updateHeaderDOM();
      }
    } catch (e) {
      console.warn("Impossibile sincronizzare Supabase live:", e);
    }
  }

  logout() {
    localStorage.removeItem('arcade_current_user');
    window.location.replace('./start.html');
  }
}

const auth = new AuthManager();

function getAdviceDayKey() {
return new Date().toLocaleDateString('sv-SE');
}

function getAdviceStorageKey() {
const username = auth.currentUser?.username || 'guest';
return `arcade_saved_advice_${encodeURIComponent(username)}`;
}

function getSavedAdviceArchive() {
try {
  const saved = JSON.parse(localStorage.getItem(getAdviceStorageKey()) || '[]');
  return Array.isArray(saved) ? saved : [];
} catch (_error) {
  return [];
}
}

function getTodaySavedAdvice() {
const today = getAdviceDayKey();
return getSavedAdviceArchive().find(item => item.date === today) || null;
}

function saveDailyAdvice(text) {
const archive = getSavedAdviceArchive();
const today = getAdviceDayKey();
const existing = archive.find(item => item.date === today);
if (existing) return existing;

const entry = { date: today, text };
archive.unshift(entry);
localStorage.setItem(getAdviceStorageKey(), JSON.stringify(archive));
return entry;
}

function formatAdviceDate(dateValue) {
const parts = String(dateValue).split('-');
return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : dateValue;
}

function renderSavedAdviceArchive() {
const archive = getSavedAdviceArchive();
const todayAdvice = getTodaySavedAdvice();
const status = document.getElementById('saved-advice-status');
const count = document.getElementById('saved-advice-count');
const list = document.getElementById('saved-advice-archive');
if (!status || !count || !list) return;

status.textContent = todayAdvice ? 'CONSIGLIO DI OGGI CONSERVATO ✓' : 'OGGI LA STAMPANTE TI ASPETTA';
count.textContent = String(archive.length);
list.replaceChildren();

if (!archive.length) {
  const empty = document.createElement('div');
  empty.className = 'saved-advice-empty';
  empty.textContent = 'Avvicinati alla Stampante dei Consigli nella Hub per ricevere la prima predizione.';
  list.appendChild(empty);
  return;
}

archive.forEach(item => {
  const card = document.createElement('article');
  card.className = 'saved-advice-entry';
  const date = document.createElement('div');
  date.className = 'saved-advice-date';
  date.textContent = formatAdviceDate(item.date);
  const copy = document.createElement('div');
  copy.className = 'saved-advice-copy';
  copy.textContent = item.text;
  card.append(date, copy);
  list.appendChild(card);
});
}

function updateHeaderDOM() {
const userBtn = document.getElementById('header-user-btn');
const scoreBtn = document.getElementById('header-score-btn');

if (auth.currentUser && auth.currentUser.username) {
userBtn.innerText = "👤 " + auth.currentUser.username;
} else {
userBtn.innerText = "👤 LOGIN";
}

if (auth.currentUser && auth.currentUser.stats) {
let s = auth.currentUser.stats;
let totalPts = (s.feedbackInvaders || 0) + (s.cyberRun || 0) + (s.pixelPunch || 0) + (s.deadlineDrive || 0);
scoreBtn.innerText = "⚡ " + totalPts.toLocaleString() + " PTS";
}
}

document.getElementById('header-user-btn').addEventListener('click', () => {
if (!auth.currentUser) window.location.replace('./start.html');
else openProfileModal();
});

document.getElementById('header-score-btn').addEventListener('click', () => {
openProfileModal();
});

showInfoCard(x, y, title, recordText, actionText) {
this.infoBox.setPosition(x, y);
this.boxTitleText.setText(title);
this.boxRecordText.setText(recordText || "");
this.boxActionText.setText(actionText);

this.boxBg.clear();
if (recordText) {
this.boxBg.fillStyle(0x050515, 0.95);
this.boxBg.lineStyle(2, 0xff0055, 1);
this.boxBg.fillRoundedRect(-105, -36, 210, 72, 12);
this.boxBg.strokeRoundedRect(-105, -36, 210, 72, 12);

this.boxBg.lineStyle(1, 0xff0055, 0.35);
this.boxBg.lineBetween(-90, 8, 90, 8);

this.boxTitleText.setPosition(0, -21);
this.boxRecordText.setPosition(0, -5);
this.boxRecordText.setVisible(true);
this.boxActionText.setPosition(0, 20);

this.infoBox.setSize(210, 72);
this.infoBox.setInteractive(new Phaser.Geom.Rectangle(-105, -36, 210, 72), Phaser.Geom.Rectangle.Contains);

playPrinterSound() {
if (!window.AudioManager || AudioManager.isSFXMuted()) return;
const context = AudioManager.getContext();
const destination = AudioManager.getSfxDestination();
if (!context || !destination) return;
if (context.state === 'suspended') context.resume().catch(() => {});

const now = context.currentTime;
for (let i = 0; i < 9; i++) {
  const oscillator = context.createOscillator();
  const gain = context.createGain();
  const startsAt = now + i * 0.075;
  oscillator.type = i % 2 ? 'square' : 'sawtooth';
  oscillator.frequency.setValueAtTime(105 + (i % 3) * 28, startsAt);
  oscillator.frequency.exponentialRampToValueAtTime(62, startsAt + 0.055);
  gain.gain.setValueAtTime(0.085, startsAt);
  gain.gain.exponentialRampToValueAtTime(0.001, startsAt + 0.06);
  oscillator.connect(gain);
  gain.connect(destination);
  oscillator.start(startsAt);
  oscillator.stop(startsAt + 0.065);
}
}

interact() {
if (this.isAdviceOpen) {
this.closeAdviceSheet();
return;
}

if (this.isDialogueOpen) {
this.advanceDialogue();
return;
}

let distGabri = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.gabri.x, this.gabri.y);
if (distGabri < 70) {
this.startDialogue('gabri');
return;
}

let distPierri = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.pierri.x, this.pierri.y);
if (distPierri < 70) {
this.startDialogue('pierri');
return;
}

let distNpc = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.npc.x, this.npc.y);
if (distNpc < 70) {
this.startDialogue('npc');
return;
}

let distMorena = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.morena.x, this.morena.y);
if (distMorena < 70) {
this.startDialogue('morena');
return;
}

let distRaffa = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.raffa.x, this.raffa.y);
if (distRaffa < 70) {
this.startDialogue('raffa');
return;
}

let distScintu = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.scintu.x, this.scintu.y);
if (distScintu < 70) {
this.startDialogue('scintu');
return;
}

let distVigliani = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.vigliani.x, this.vigliani.y);
if (distVigliani < 70) {
this.startDialogue('vigliani');
return;
}

let distPrinter = Math.abs(this.player.x - this.advicePrinter.x);
if (distPrinter < 90) {
this.useAdvicePrinter();
return;
}

for (let cab of this.cabinetSprites) {
let dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, cab.x, cab.y);
if (dist < 60) {
if (cab.gameData.type === "leaderboard") {
openLeaderboardModal('feedbackInvaders');
} else if (cab.gameData.url) {
window.location.replace(cab.gameData.url);
}
return;
}
}
}

update() {
if (Phaser.Input.Keyboard.JustDown(this.keyEsc)) {
if (this.isAdviceOpen) {
this.closeAdviceSheet();
return;
}
if (this.isDialogueOpen) {
this.closeDialogue();
}
return;
}

if (this.isDialogueOpen || this.isAdviceOpen || this.isPrinterBusy) {
this.player.setVelocityX(0);
this.player.play('idle', true);
this.infoBox.setVisible(false);
return;
}

this.player.setVelocityX(0);

if (this.cursors.left.isDown || this.isMovingLeft) {
this.player.setVelocityX(-180);
this.player.setFlipX(true);
this.player.play('walk', true);
} else if (this.cursors.right.isDown || this.isMovingRight) {
this.player.setVelocityX(180);
this.player.setFlipX(false);
this.player.play('walk', true);
} else {
this.player.play('idle', true);
}

localStorage.setItem('arcade_player_x', this.player.x);

if (Phaser.Input.Keyboard.JustDown(this.keyEnter)) {
this.interact();
}

let activeCabinet = null;

if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.gabri.x, this.gabri.y) < 70) {
this.showInfoCard(this.gabri.x, this.cabBadgeY, "Gabri", null, "PARLA 💬");
return;
}

if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.pierri.x, this.pierri.y) < 70) {
this.showInfoCard(this.pierri.x, this.cabBadgeY, "Pierri", null, "PARLA 💬");
return;
}

if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.npc.x, this.npc.y) < 70) {
this.showInfoCard(this.npc.x, this.cabBadgeY, "Giovannone", null, "PARLA 💬");
return;
}

if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.morena.x, this.morena.y) < 70) {
this.showInfoCard(this.morena.x, this.cabBadgeY, "Morena", null, "PARLA 💬");
return;
}

if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.raffa.x, this.raffa.y) < 70) {
this.showInfoCard(this.raffa.x, this.cabBadgeY, "Raffa", null, "PARLA 💬");
return;
}

if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.scintu.x, this.scintu.y) < 70) {
this.showInfoCard(this.scintu.x, this.cabBadgeY, "Scintu", null, "PARLA 💬");
return;
}

if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.vigliani.x, this.vigliani.y) < 70) {
this.showInfoCard(this.vigliani.x, this.cabBadgeY, "Vigliani", null, "PARLA 💬");
return;
}

if (Math.abs(this.player.x - this.advicePrinter.x) < 90) {
this.showInfoCard(this.advicePrinter.x, this.cabBadgeY, "STAMPANTE DEI CONSIGLI", null, "STAMPA IL DESTINO 🧾");
return;
}

for (let cab of this.cabinetSprites) {
if (Phaser.Math.Distance.Between(this.player.x, this.player.y, cab.x, cab.y) < 60) {
activeCabinet = cab;
break;
}
}

if (activeCabinet) {
let data = activeCabinet.gameData;

if (data.type === "leaderboard") {
this.showInfoCard(data.badgeX, data.badgeY, data.title, "🌍 GLOBAL RANKINGS", "VEDI RECORD 🏆");
} else {
let myRecord = (auth.currentUser && auth.currentUser.stats)
? (auth.currentUser.stats[data.key] || 0)
: 0;
this.showInfoCard(data.badgeX, data.badgeY, data.title, `🏆 BEST: ${myRecord.toLocaleString()} PTS`, "PREMI PER GIOCARE 🕹️");
}
} else {
this.infoBox.setVisible(false);
}
}
}

document.getElementById('save-profile-changes-btn').addEventListener('click', async () => {
const passInput = document.getElementById('edit-password-input');
const newPass = passInput.value.trim();

let hasAvatarChange = selectedAvatarForEdit && selectedAvatarForEdit !== auth.currentUser.avatar;
let hasPassChange = newPass.length >= 4;

if (!hasAvatarChange && !hasPassChange) {
alert("Nessuna modifica effettuata o password troppo corta (min 4 caratteri)!");
return;
}

const saveBtn = document.getElementById('save-profile-changes-btn');
saveBtn.disabled = true;
saveBtn.innerText = "SALVATAGGIO...";

let updatedAvatar = hasAvatarChange ? selectedAvatarForEdit : auth.currentUser.avatar;

if (supabaseClient && auth.currentUser.username && !auth.currentUser.username.startsWith("GUEST_")) {
try {
let updateData = {};
if (hasAvatarChange) updateData.avatar = updatedAvatar;
if (hasPassChange) updateData.password = newPass;

const { error } = await supabaseClient
.from('profiles')
.update(updateData)
.eq('username', auth.currentUser.username);

if (error) console.warn("Errore aggiornamento Supabase:", error.message);
} catch (e) {
console.warn("Connessione Supabase fallita:", e);
}
}

auth.currentUser.avatar = updatedAvatar;
localStorage.setItem('arcade_current_user', JSON.stringify(auth.currentUser));

passInput.value = "";
saveBtn.disabled = false;
saveBtn.innerText = "SALVA MODIFICHE ►";
document.getElementById('edit-profile-box').style.display = 'none';

updateHeaderDOM();
openProfileModal();
alert("Profilo aggiornato con successo!");
});

async function openLeaderboardModal(gameKey) {
if (gameKey) currentLBGameKey = gameKey;
document.getElementById('leaderboard-modal').style.display = 'flex';
await fetchLeaderboardFromSupabase(currentLBGameKey);
}

async function fetchLeaderboardFromSupabase(gameKey) {
currentLBGameKey = gameKey;

document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

let activeTabBtn = document.getElementById('tab-' + gameKey);
if (activeTabBtn) activeTabBtn.classList.add('active');

const listEl = document.getElementById('lb-records-list');
listEl.innerHTML = '<div class="leaderboard-row"><span class="player-name">Caricamento classifiche Supabase...</span></div>';

let records = [];

if (supabaseClient) {
try {
let { data, error } = await supabaseClient
.from('profiles')
.select('username, stats');

if (!error && data) {
data.forEach(r => {
let scoreVal = 0;
if (r.stats && typeof r.stats === 'object') {
scoreVal = parseInt(r.stats[gameKey]) || 0;
} else if (typeof r.stats === 'string') {
try {
let parsed = JSON.parse(r.stats);
scoreVal = parseInt(parsed[gameKey]) || 0;
} catch(e){}
}
if (scoreVal > 0) {
records.push({ username: r.username, score: scoreVal });
}
});
} else if (error) {
console.error("Errore query Supabase:", error.message);
}
} catch (e) {
console.warn("Supabase non raggiungibile.");
}
}

records.sort((a, b) => b.score - a.score);
records = records.slice(0, 10);

if (records.length === 0) {
listEl.innerHTML = '<div class="leaderboard-row"><span class="player-name">Nessun record registrato per questo gioco!</span></div>';
} else {
listEl.innerHTML = records.map((r, i) => `
<div class="leaderboard-row">
<span class="rank-pos">#${i + 1}</span>
<span class="player-name">${r.username}</span>
<span class="score-val">${r.score.toLocaleString()} PTS</span>
</div>
`).join('');
}
}

function switchLBTab(gameKey) {
fetchLeaderboardFromSupabase(gameKey);
}
