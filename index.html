<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Agency Arcade</title>

    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="apple-touch-icon" href="assets/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        *, *:focus, *:active, canvas, button, input, div, a {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            outline: none !important;
            border: none;
            touch-action: manipulation;
            font-family: 'Courier New', Courier, monospace;
        }

        html, body {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            height: 100dvh !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
            overscroll-behavior: none !important;
            background-color: #000000 !important;
        }

        #game-wrapper, #game-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            background: #000000 !important;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* FORZA IL CANVAS A STIRARSI FINO AI BORDI ASSOLUTI DELLO SCHERMO */
        #game-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        #top-header-bar {
            position: absolute;
            top: max(env(safe-area-inset-top), 8px);
            left: 8px;
            right: 8px;
            height: 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 150;
            pointer-events: auto;
        }
        .header-btn {
            background: #060614;
            border: 1.5px solid #ff0055;
            color: #ffff00;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 11px;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
        }
        .header-btn:active { transform: scale(0.95); }
        #header-score-btn {
            color: #ff0055;
            border-color: #ff0055;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
        }

        .auth-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .auth-box {
            width: 100%;
            max-width: 320px;
            background: #090918;
            border: 2px solid #ff0055;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
            border-radius: 14px;
            padding: 18px;
            text-align: center;
            color: #fff;
        }
        .profile-card-header {
            background: linear-gradient(90deg, #150520, #051525);
            border: 1px solid #ff0055;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 12px;
        }
        .profile-avatar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }
        .profile-avatar {
            width: 44px; height: 44px; background: #250515;
            border: 2px solid #ff0055; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 22px; box-shadow: 0 0 10px #ff0055; overflow: hidden;
        }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-rank-title { color: #ffff00; font-size: 11px; font-weight: bold; letter-spacing: 1px; }
        .profile-username { color: #ffffff; font-size: 15px; font-weight: bold; }
        
        .xp-bar-container { width: 100%; background: #04040a; border: 1px solid #ff0055; height: 10px; border-radius: 5px; margin-top: 8px; overflow: hidden; }
        .xp-bar-fill { height: 100%; background: linear-gradient(90deg, #ffff00, #ff0055); width: 0%; box-shadow: 0 0 8px #ff0055; transition: width 0.4s ease; }
        
        .badges-row { display: flex; justify-content: space-around; background: #04040a; border: 1px dashed rgba(255, 0, 85, 0.4); border-radius: 8px; padding: 8px; margin-bottom: 12px; }
        .badge-item { font-size: 18px; filter: grayscale(1); opacity: 0.3; transition: all 0.3s; }
        .badge-item.unlocked { filter: grayscale(0); opacity: 1; transform: scale(1.1); }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
        .stat-card { background: #04040a; border: 1px solid rgba(255, 0, 85, 0.4); border-radius: 8px; padding: 8px 4px; text-align: center; }
        .stat-card .val { color: #ffff00; font-size: 13px; font-weight: bold; }
        .stat-card .lbl { color: #ff0055; font-size: 8px; margin-top: 2px; text-transform: uppercase; font-weight: bold; }

        .tab-selector { display: flex; justify-content: space-around; gap: 4px; margin-bottom: 10px; }
        .tab-btn { background: #101528; border: 1px solid #ff0055; color: #ffffff; font-size: 9px; padding: 5px 6px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #ff0055; color: #fff; border-color: #ff0055; box-shadow: 0 0 8px rgba(255, 0, 85, 0.6); }
        
        .leaderboard-list { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; max-height: 190px; overflow-y: auto; text-align: left; }
        .leaderboard-row { background: #04040a; border: 1px solid rgba(255, 0, 85, 0.3); border-radius: 6px; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; }
        .leaderboard-row .rank-pos { color: #ffff00; font-size: 11px; font-weight: bold; width: 24px; }
        .leaderboard-row .player-name { color: #ffffff; font-size: 11px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .leaderboard-row .score-val { color: #ffff00; font-size: 11px; font-weight: bold; }

        .auth-btn { width: 100%; padding: 10px; margin-top: 4px; background: #ff0055; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; box-shadow: 0 0 10px rgba(255, 0, 85, 0.6); }
        .auth-btn:active { transform: scale(0.96); }

        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 99;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 4px, 6px 100%;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

<script>
if (!sessionStorage.getItem('arcade_session_active')) {

} else {

<div id="game-wrapper">

    <!-- MODAL PROFILO LOCALE -->

            <div class="tab-selector">
                <button class="tab-btn active" id="tab-feedbackInvaders" onclick="switchLBTab('feedbackInvaders')">INVADERS</button>
                <button class="tab-btn" id="tab-cyberRun" onclick="switchLBTab('cyberRun')">CYBER RUN</button>

            <div class="leaderboard-list" id="lb-records-list">

            <button id="lb-close-btn" class="auth-btn">CHIUDI CLASSIFICA</button>
        </div>
    </div>

    <div id="game-container"></div>
    <div class="crt-overlay"></div>
</div>

<script>
const SUPABASE_URL = "https://bcitueadxwwwouhxawdw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GsvCkWy0AtlMpejqT7nsew_Ivhd7hxq";

let supabaseClient = null;
if (window.supabase) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

class GreenKeyPipeline extends Phaser.Renderer.WebGL.Pipelines.SinglePipeline {
    constructor(game) {
        super({
            game: game,
            fragShader: `
                precision mediump float;
                uniform sampler2D uMainSampler;
                varying vec2 outTexCoord;
                varying vec4 outTint;

                void main() {
                    vec4 texColor = texture2D(uMainSampler, outTexCoord);
                    vec3 keyColor = vec3(0.235, 1.0, 0.0);
                    float diff = distance(texColor.rgb, keyColor);
                    if (diff < 0.45) { discard; } else { gl_FragColor = texColor * outTint; }
                }
            `
        });
    }
}

class AuthManager {
    constructor() { this.currentUser = null; this.init(); }
    init() {
        if (!localStorage.getItem('arcade_users')) localStorage.setItem('arcade_users', JSON.stringify({}));
        const savedUser = localStorage.getItem('arcade_current_user');
        if (savedUser) {
            this.currentUser = JSON.parse(savedUser);
            if (!this.currentUser.stats) this.currentUser.stats = {};
            if (this.currentUser.stats.feedbackInvaders === undefined) this.currentUser.stats.feedbackInvaders = 0;
            if (this.currentUser.stats.cyberRun === undefined) this.currentUser.stats.cyberRun = 0;
            if (this.currentUser.stats.pixelPunch === undefined) this.currentUser.stats.pixelPunch = 0;
            if (this.currentUser.stats.deadlineDrive === undefined) this.currentUser.stats.deadlineDrive = 0;
        } else {
            window.location.replace('./start.html');
        }
    }
    getUsers() { return JSON.parse(localStorage.getItem('arcade_users')) || {}; }
    saveUsers(users) { localStorage.setItem('arcade_users', JSON.stringify(users)); }
    getRankInfo() {
        let totalPts = 0;
        if (this.currentUser) {
            let s = this.currentUser.stats;
            totalPts = (s.feedbackInvaders || 0) + (s.cyberRun || 0) + (s.pixelPunch || 0) + (s.deadlineDrive || 0);
        }
        if (totalPts >= 1000) return { title: "RETRO KING 👑", level: 5, xpPct: 100 };
        if (totalPts >= 500)  return { title: "ARCADE HERO ⚡", level: 4, xpPct: (totalPts - 500) / 5 };
        if (totalPts >= 200)  return { title: "PRO GAMER 👾", level: 3, xpPct: (totalPts - 200) / 3 };
        if (totalPts >= 100)  return { title: "CHALLENGER 🕹️", level: 2, xpPct: (totalPts - 100) };
        return { title: "ROOKIE 🐣", level: 1, xpPct: totalPts };
    }
    logout() { localStorage.removeItem('arcade_current_user'); window.location.replace('./start.html'); }
}
const auth = new AuthManager();

function updateHeaderDOM() {
    const userBtn = document.getElementById('header-user-btn');
    const scoreBtn = document.getElementById('header-score-btn');
    if (auth.currentUser && auth.currentUser.username) { userBtn.innerText = "👤 " + auth.currentUser.username; } 
    else { userBtn.innerText = "👤 LOGIN"; }
    if (auth.currentUser && auth.currentUser.stats) {
        let s = auth.currentUser.stats;
        let totalPts = (s.feedbackInvaders || 0) + (s.cyberRun || 0) + (s.pixelPunch || 0) + (s.deadlineDrive || 0);
        scoreBtn.innerText = "⚡ " + totalPts.toLocaleString() + " PTS";
    }
}

document.getElementById('header-user-btn').addEventListener('click', () => {
    if (!auth.currentUser) window.location.replace('./start.html');
    else openProfileModal();
});
document.getElementById('header-score-btn').addEventListener('click', () => { openProfileModal(); });

// CALCOLO ALTEZZA DINAMICA IN BASE ALLO SCHERMO REALE
const screenW = window.innerWidth;
const screenH = window.innerHeight;
// La larghezza logica è fissa a 360
const GAME_WIDTH = 360;
// L'altezza logica viene allungata dinamicamente in base allo schermo del tuo telefono!
const GAME_HEIGHT = Math.max(740, Math.floor(GAME_WIDTH * (screenH / screenW)));

class MainHub extends Phaser.Scene {
    constructor() { super({ key: 'MainHub' }); }

    preload() {
        this.load.image('background', 'assets/hub/background.png');
        this.load.image('logo', 'assets/hub/logo.png');
        this.load.video('npc_video', 'assets/hub/personaggio.mp4', 'loadeddata', false, true);
        this.load.video('gabri_video', 'assets/hub/gabri.mp4', 'loadeddata', false, true);
        this.load.video('raffa_video', 'assets/hub/raffa.mp4', 'loadeddata', false, true);

        const playerSkins = ['dave.png', 'iris.png', 'laura.png', 'tosatto.png', 'rache.png', 'guido.png', 'bretto.png', 'giulia.png', 'rabe.png', 'giampa.png', 'tommi.png', 'tobi.png'];
        const selectedSkin = Phaser.Math.RND.pick(playerSkins);
        this.playerName = selectedSkin.replace('.png', '').charAt(0).toUpperCase() + selectedSkin.replace('.png', '').slice(1);

        this.load.spritesheet('player', 'assets/hub/player/' + selectedSkin, { frameWidth: 755, frameHeight: 1120 });
        let g = this.make.graphics({ x: 0, y: 0, add: false });
        g.fillStyle(0xffffff, 0); g.fillRect(0, 0, 50, 80);
        g.generateTexture('hitbox_sm', 50, 80);
    }

    create() {
        const vWidth = GAME_WIDTH;
        const vHeight = GAME_HEIGHT; // Usa l'altezza calcolata appositamente

        if (this.game.renderer.pipelines && !this.game.renderer.pipelines.has('GreenKey')) {
            this.game.renderer.pipelines.add('GreenKey', new GreenKeyPipeline(this.game));
        }

        // SFONDO ANCORATO AL FONDO (setOrigin 0, 1 -> y = vHeight)
        let bg = this.add.image(0, vHeight, 'background').setOrigin(0, 1).setDepth(0);
        
        // Lo sfondo si adatta in larghezza
        let bgScale = vWidth / bg.width;
        // Se c'è più soffitto e l'altezza richiede più spazio, si adatta all'altezza
        if (bg.height * bgScale < vHeight) { bgScale = vHeight / bg.height; }
        bg.setScale(bgScale);

        const worldWidth = bg.width * bgScale;
        this.physics.world.setBounds(0, 0, worldWidth, vHeight);

        // POSIZIONI ANCORATE AL FONDO DEL DISPLAY 
        // (vHeight - X) garantisce che i piedi tocchino il pavimento vero, a prescindere dall'altezza dell'iPhone
        const floorY = vHeight - 172;
        const gabriY = vHeight - 182;
        const npcY = vHeight - 177;
        const cabY = vHeight - 192;
        this.cabBadgeY = vHeight - 410;

        this.gabri = this.add.video(150, gabriY, 'gabri_video').setOrigin(0.5, 1).setScale(0.21).setDepth(10);
        if (this.gabri.setPipeline) this.gabri.setPipeline('GreenKey');
        this.gabri.play(true); this.gabri.setMute(true);

        this.npc = this.add.video(860, npcY, 'npc_video').setOrigin(0.5, 1).setScale(0.21).setDepth(10);
        if (this.npc.setPipeline) this.npc.setPipeline('GreenKey');
        this.npc.play(true); this.npc.setMute(true);

        this.raffa = this.add.video(2210, floorY, 'raffa_video').setOrigin(0.5, 1).setScale(0.15).setDepth(10);
        if (this.raffa.setPipeline) this.raffa.setPipeline('GreenKey');
        this.raffa.play(true); this.raffa.setMute(true);

        this.anims.create({ key: 'idle', frames: [ { key: 'player', frame: 0 } ], frameRate: 10 });
        this.anims.create({ key: 'walk', frames: this.anims.generateFrameNumbers('player', { start: 1, end: 4 }), frameRate: 8, repeat: -1 });

        let savedX = parseFloat(localStorage.getItem('arcade_player_x'));
        let startX = (!isNaN(savedX) && savedX > 0) ? savedX : Math.floor(worldWidth / 3);

        this.player = this.physics.add.sprite(startX, floorY, 'player');
        this.player.setOrigin(0.5, 1).setScale(0.18).setDepth(20).setCollideWorldBounds(true);
        this.player.play('idle');

        let logo = this.add.image(vWidth / 2, 85, 'logo').setOrigin(0.5).setScrollFactor(0).setDepth(110);
        logo.setDisplaySize(280, (logo.height / logo.width) * 280);
        this.tweens.add({ targets: logo, scaleX: logo.scaleX * 1.03, scaleY: logo.scaleY * 1.03, duration: 1800, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

        updateHeaderDOM();

        this.cabinets = [
            { x: 1471, y: cabY, badgeX: 1471, badgeY: this.cabBadgeY, title: "FEEDBACK INVADERS", key: "feedbackInvaders", type: "game", url: "./invaders.html" },
            { x: 1610, y: cabY, badgeX: 1610, badgeY: this.cabBadgeY, title: "CYBER RUN", key: "cyberRun", type: "game", url: "./pacman.html" },
            { x: 1742, y: cabY, badgeX: 1742, badgeY: this.cabBadgeY, title: "PIXEL PUNCH", key: "pixelPunch", type: "game", url: "./PixelPunch.html" },
            { x: 1882, y: cabY, badgeX: 1882, badgeY: this.cabBadgeY, title: "DEADLINE DODGE", key: "deadlineDrive", type: "game", url: "./frogger.html" },
            { x: 2800, y: cabY, badgeX: 2800, badgeY: this.cabBadgeY, title: "CLASSIFICHE MONDIALI", key: "leaderboard", type: "leaderboard", url: null }
        ];

        this.cabinetSprites = [];
        this.cabinets.forEach(cab => {
            let sprite = this.physics.add.staticSprite(cab.x, cab.y, 'hitbox_sm');
            sprite.setVisible(false); sprite.gameData = cab; this.cabinetSprites.push(sprite);
        });

        this.infoBox = this.add.container(0, 0).setDepth(80);
        let boxBg = this.add.graphics();
        boxBg.fillStyle(0x050515, 0.95); boxBg.lineStyle(2, 0xff0055, 1);
        boxBg.fillRoundedRect(-85, -22, 170, 44, 10); boxBg.strokeRoundedRect(-85, -22, 170, 44, 10);

        this.boxTitleText = this.add.text(0, -9, "", { font: "bold 10px monospace", fill: "#ffff00", align: "center" }).setOrigin(0.5);
        this.boxActionText = this.add.text(0, 9, "GIOCA 🕹️", { font: "bold 10px monospace", fill: "#ff0055", align: "center" }).setOrigin(0.5);

        this.infoBox.add([boxBg, this.boxTitleText, this.boxActionText]);
        this.infoBox.setSize(170, 44);
        this.infoBox.setInteractive(new Phaser.Geom.Rectangle(-85, -22, 170, 44), Phaser.Geom.Rectangle.Contains);
        this.infoBox.on('pointerdown', (pointer, localX, localY, event) => { if (event) event.stopPropagation(); this.interact(); });
        this.infoBox.setVisible(false);

        this.createDialogueSystem();
        this.cameras.main.setBounds(0, 0, worldWidth, vHeight);
        this.cameras.main.startFollow(this.player, true, 0.1, 0.1);

        this.cursors = this.input.keyboard.createCursorKeys();
        this.keyEnter = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.ENTER);
        this.keyEsc = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.ESC);

        this.setupTouchControls(vWidth, vHeight);
    }

    createDialogueSystem() {
        this.dialogueContainer = this.add.container(0, 0).setDepth(160);
        this.dialogueBg = this.add.graphics();
        this.dialogueText = this.add.text(0, 0, "", { font: "bold 12px monospace", fill: "#0b0c10", align: "center", wordWrap: { width: 180 } }).setOrigin(0.5);
        this.dialoguePrompt = this.add.text(0, 0, "► TAP", { font: "bold 10px monospace", fill: "#ff0055" }).setOrigin(0.5);

        this.dialogueContainer.add([this.dialogueBg, this.dialogueText, this.dialoguePrompt]);
        this.dialogueContainer.setVisible(false);
        this.dialogueContainer.setSize(200, 160);
        this.dialogueContainer.setInteractive(new Phaser.Geom.Rectangle(-100, -80, 200, 160), Phaser.Geom.Rectangle.Contains);
        this.dialogueContainer.on('pointerdown', (pointer, localX, localY, event) => { if (event) event.stopPropagation(); this.advanceDialogue(); });

        this.isDialogueOpen = false; this.dialogueIndex = 0; this.activeSpeaker = null; this.npcLines = [];
    }

    drawSpeechBubble(width, height) {
        this.dialogueBg.clear(); this.dialogueBg.fillStyle(0xffffff, 0.98); this.dialogueBg.lineStyle(3, 0xff0055, 1);
        this.dialogueBg.fillRoundedRect(-width/2, -height/2, width, height, 14); this.dialogueBg.strokeRoundedRect(-width/2, -height/2, width, height, 14);
        this.dialogueBg.beginPath(); this.dialogueBg.moveTo(-10, height/2); this.dialogueBg.lineTo(0, height/2 + 14); this.dialogueBg.lineTo(10, height/2);
        this.dialogueBg.closePath(); this.dialogueBg.fillPath(); this.dialogueBg.strokePath();
    }

    startDialogue(speakerKey) {
        this.infoBox.setVisible(false); this.isDialogueOpen = true; this.dialogueIndex = 0; this.activeSpeaker = speakerKey;
        const greeting = Phaser.Math.RND.pick(["Hey", "Ehi", "Ciao"]);
        const line1 = `${greeting} ${this.playerName}!`;

        if (speakerKey === 'gabri') this.npcLines = [line1, Phaser.Math.RND.pick(["Aspetta un secondo... sto cercando di capire perché questa precomp continua a rompere tutto.", "Sto sistemando un po' di animazioni su After Effects.", "Sto lavorando su una grafica animata. Ho quasi finito!"])];
        else if (speakerKey === 'raffa') this.npcLines = [line1, Phaser.Math.RND.pick(["Sto cercando una cosa precisa! Se vai avanti c'è la lavagna con i punteggi!", "Sto preparando l'attrezzatura per il prossimo lavoro."])];
        else this.npcLines = [line1, Phaser.Math.RND.pick(["Tutto bene? Ho sentito che hanno piazzato dei giochi nuovi.", "Stavo giusto guardando quanto tempo ci mette qualcuno a scoprire i cabinati!"])];

        this.showDialogueLine(); this.dialogueContainer.setVisible(true);
    }

    showDialogueLine() {
        this.dialogueText.setText(this.npcLines[this.dialogueIndex]);
        let boxH = this.dialogueText.height + 40; if (boxH < 65) boxH = 65;
        this.drawSpeechBubble(200, boxH);
        this.dialogueText.setPosition(0, -8); this.dialoguePrompt.setPosition(200/2 - 25, boxH/2 - 12);
        let targetX = this.npc.x; let targetY = this.npc.y;
        if (this.activeSpeaker === 'gabri') { targetX = this.gabri.x; targetY = this.gabri.y; }
        else if (this.activeSpeaker === 'raffa') { targetX = this.raffa.x; targetY = this.raffa.y; }
        this.dialogueContainer.setPosition(targetX - 20, targetY - 180 - (boxH/2));
    }

    advanceDialogue() {
        this.dialogueIndex++;
        if (this.dialogueIndex < this.npcLines.length) this.showDialogueLine();
        else this.closeDialogue();
    }

    closeDialogue() { this.isDialogueOpen = false; this.dialogueContainer.setVisible(false); }

    setupTouchControls(width, height) {
        this.isMovingLeft = false; this.isMovingRight = false;
        let controlDeck = this.add.container(0, 0).setScrollFactor(0).setDepth(100);

        let deckBg = this.add.graphics(); deckBg.fillStyle(0x060612, 0.94);
        deckBg.fillRoundedRect(10, height - 98, width - 20, 86, 20);
        deckBg.lineStyle(2, 0xff0055, 0.8);
        deckBg.strokeRoundedRect(10, height - 98, width - 20, 86, 20);

        let btnY = height - 55;
        const createDPadBtn = (x, y, label, onPress) => {
            let container = this.add.container(x, y).setScrollFactor(0).setDepth(102);
            let g = this.add.graphics();
            g.fillStyle(0x101528, 0.95); g.lineStyle(2, 0xff0055, 1);
            g.fillRoundedRect(-28, -26, 56, 52, 12); g.strokeRoundedRect(-28, -26, 56, 52, 12);
            let txt = this.add.text(0, 0, label, { font: "bold 22px monospace", fill: "#ff0055" }).setOrigin(0.5);
            container.add([g, txt]);
            container.setInteractive(new Phaser.Geom.Rectangle(-28, -26, 56, 52), Phaser.Geom.Rectangle.Contains);
            container.on('pointerdown', () => { container.setScale(0.88); onPress(true); });
            container.on('pointerup', () => { container.setScale(1.0); onPress(false); });
            container.on('pointerout', () => { container.setScale(1.0); onPress(false); });
        };

        createDPadBtn(55, btnY, '◄', (isDown) => { this.isMovingLeft = isDown; });
        createDPadBtn(120, btnY, '►', (isDown) => { this.isMovingRight = isDown; });

        this.actionBtnContainer = this.add.container(width - 65, btnY).setScrollFactor(0).setDepth(102);
        this.actionAura = this.add.graphics(); this.actionAura.fillStyle(0xff0055, 0.4); this.actionAura.fillCircle(0, 0, 36); this.actionAura.setVisible(false);
        let btnBezel = this.add.graphics(); btnBezel.fillStyle(0x222233, 1); btnBezel.lineStyle(2, 0xff0055, 1); btnBezel.fillCircle(0, 0, 32); btnBezel.strokeCircle(0, 0, 32);
        let btnBody = this.add.graphics(); btnBody.fillStyle(0xff0055, 0.95); btnBody.fillCircle(0, 0, 26);
        let btnTxt = this.add.text(0, 1, "VAI", { font: "bold 15px monospace", fill: "#ffffff" }).setOrigin(0.5);
        this.actionBtnContainer.add([this.actionAura, btnBezel, btnBody, btnTxt]);
        this.actionBtnContainer.setInteractive(new Phaser.Geom.Circle(0, 0, 32), Phaser.Geom.Circle.Contains);
        this.actionBtnContainer.on('pointerdown', () => { this.actionBtnContainer.setScale(0.88); this.interact(); });
        this.actionBtnContainer.on('pointerup', () => { this.actionBtnContainer.setScale(1.0); });

        controlDeck.add([deckBg]);
    }

    interact() {
        if (this.isDialogueOpen) { this.advanceDialogue(); return; }

        let distGabri = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.gabri.x, this.gabri.y);
        if (distGabri < 70) { this.startDialogue('gabri'); return; }

        let distNpc = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.npc.x, this.npc.y);
        if (distNpc < 70) { this.startDialogue('npc'); return; }

        let distRaffa = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.raffa.x, this.raffa.y);
        if (distRaffa < 70) { this.startDialogue('raffa'); return; }

        for (let cab of this.cabinetSprites) {
            let dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, cab.x, cab.y);
            if (dist < 60) {
                if (cab.gameData.type === "leaderboard") openLeaderboardModal('feedbackInvaders');
                else if (cab.gameData.url) {
                    sessionStorage.setItem('arcade_session_active', 'true');
                    window.location.replace(cab.gameData.url);
                }
                return;
            }
        }
    }

    update() {
        if (Phaser.Input.Keyboard.JustDown(this.keyEsc)) { if (this.isDialogueOpen) this.closeDialogue(); return; }
        if (this.isDialogueOpen) { this.player.setVelocityX(0); this.player.play('idle', true); this.infoBox.setVisible(false); return; }

        this.player.setVelocityX(0);
        if (this.cursors.left.isDown || this.isMovingLeft) { this.player.setVelocityX(-180); this.player.setFlipX(true); this.player.play('walk', true); } 
        else if (this.cursors.right.isDown || this.isMovingRight) { this.player.setVelocityX(180); this.player.setFlipX(false); this.player.play('walk', true); } 
        else this.player.play('idle', true);

        localStorage.setItem('arcade_player_x', this.player.x);
        if (Phaser.Input.Keyboard.JustDown(this.keyEnter)) this.interact();

        let activeCabinet = null;
        if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.gabri.x, this.gabri.y) < 70) {
            this.infoBox.setPosition(this.gabri.x, this.cabBadgeY); this.boxTitleText.setText("Gabri"); this.boxActionText.setText("PARLA 💬"); this.infoBox.setVisible(true); return;
        }
        if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.npc.x, this.npc.y) < 70) {
            this.infoBox.setPosition(this.npc.x, this.cabBadgeY); this.boxTitleText.setText("Giovannone"); this.boxActionText.setText("PARLA 💬"); this.infoBox.setVisible(true); return;
        }
        if (Phaser.Math.Distance.Between(this.player.x, this.player.y, this.raffa.x, this.raffa.y) < 70) {
            this.infoBox.setPosition(this.raffa.x, this.cabBadgeY); this.boxTitleText.setText("Raffa"); this.boxActionText.setText("PARLA 💬"); this.infoBox.setVisible(true); return;
        }

        for (let cab of this.cabinetSprites) {
            if (Phaser.Math.Distance.Between(this.player.x, this.player.y, cab.x, cab.y) < 60) { activeCabinet = cab; break; }
        }

        if (activeCabinet) {
            let data = activeCabinet.gameData;
            this.infoBox.setPosition(data.badgeX, data.badgeY); this.boxTitleText.setText(data.title);
            if (data.type === "leaderboard") this.boxActionText.setText("VEDI RECORD 🏆");
            else { let myRecord = (auth.currentUser && auth.currentUser.stats) ? (auth.currentUser.stats[data.key] || 0) : 0; this.boxActionText.setText(`REC: ${myRecord} PTS | GIOCA 🕹️`); }
            this.infoBox.setVisible(true);
        } else this.infoBox.setVisible(false);
    }
}

const config = {
    type: Phaser.WEBGL,
    parent: 'game-container',
    backgroundColor: '#000000',
    scale: { 
        mode: Phaser.Scale.FIT, 
        autoCenter: Phaser.Scale.CENTER_BOTH, 
        width: GAME_WIDTH, 
        height: GAME_HEIGHT 
    },
    physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
    scene: [MainHub]
};

const game = new Phaser.Game(config);

let currentLBGameKey = 'feedbackInvaders';

function openProfileModal() {
    if (!auth.currentUser) return;
    let s = auth.currentUser.stats || {}; let rank = auth.getRankInfo();
    document.getElementById('profile-username').innerText = auth.currentUser.username;
    document.getElementById('profile-rank').innerText = rank.title;
    document.getElementById('profile-xp-fill').style.width = rank.xpPct + '%';
    const avatarBox = document.getElementById('profile-avatar-box');
    if (auth.currentUser.avatar) avatarBox.innerHTML = `<img src="${auth.currentUser.avatar}" alt="Avatar">`; else avatarBox.innerText = "👾";
    document.getElementById('stat-invaders').innerText = (s.feedbackInvaders || 0).toLocaleString() + " PTS";
    document.getElementById('stat-cyber').innerText = (s.cyberRun || 0).toLocaleString() + " PTS";
    document.getElementById('stat-punch').innerText = (s.pixelPunch || 0).toLocaleString() + " PTS";
    document.getElementById('stat-dodge').innerText = (s.deadlineDrive || 0).toLocaleString() + " PTS";
    document.getElementById('profile-modal').style.display = 'flex';
}

async function openLeaderboardModal(gameKey) {
    if (gameKey) currentLBGameKey = gameKey;
    document.getElementById('leaderboard-modal').style.display = 'flex';
    await fetchLeaderboardFromSupabase(currentLBGameKey);
}

async function fetchLeaderboardFromSupabase(gameKey) {
    currentLBGameKey = gameKey;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    let activeTabBtn = document.getElementById('tab-' + gameKey); if (activeTabBtn) activeTabBtn.classList.add('active');
    const listEl = document.getElementById('lb-records-list'); listEl.innerHTML = '<div class="leaderboard-row"><span class="player-name">Caricamento classifiche...</span></div>';
    let records = [];
    if (supabaseClient) {
        try {
            let { data, error } = await supabaseClient.from('leaderboard').select('username, score').eq('game_key', gameKey).order('score', { ascending: false }).limit(10);
            if (!error && data) records = data;
        } catch (e) { console.warn("Supabase non raggiungibile."); }
    }
    if (records.length === 0) {
        let users = auth.getUsers();
        for (let uname in users) { let sc = users[uname].stats ? (users[uname].stats[gameKey] || 0) : 0; if (sc > 0) records.push({ username: uname, score: sc }); }
        if (auth.currentUser && auth.currentUser.stats) {
            let mySc = auth.currentUser.stats[gameKey] || 0;
            if (mySc > 0 && !records.some(r => r.username === auth.currentUser.username)) records.push({ username: auth.currentUser.username, score: mySc });
        }
        records.sort((a, b) => b.score - a.score);
    }
    if (records.length === 0) listEl.innerHTML = '<div class="leaderboard-row"><span class="player-name">Nessun record registrato per questo gioco!</span></div>';
    else listEl.innerHTML = records.map((r, i) => `<div class="leaderboard-row"><span class="rank-pos">#${i + 1}</span><span class="player-name">${r.username}</span><span class="score-val">${r.score.toLocaleString()} PTS</span></div>`).join('');
}

function switchLBTab(gameKey) { fetchLeaderboardFromSupabase(gameKey); }
document.getElementById('profile-close-btn').addEventListener('click', () => { document.getElementById('profile-modal').style.display = 'none'; });
document.getElementById('lb-close-btn').addEventListener('click', () => { document.getElementById('leaderboard-modal').style.display = 'none'; });
document.getElementById('profile-logout-btn').addEventListener('click', () => { auth.logout(); });
</script>
