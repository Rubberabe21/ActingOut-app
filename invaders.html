<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Feedback Invaders - Agency Arcade</title>
<style>
*, *:focus, *:active, canvas, button, input, div, a {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent !important;
    -webkit-touch-callout: none !important;
    -webkit-focus-ring-color: transparent !important;
    outline: none !important;
    border: none;
    touch-action: manipulation;
    font-family: 'Courier New', Courier, monospace;
}

html {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #000000;
    overflow: hidden;
}

body {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #000000;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    display: flex;
    justify-content: center;
    align-items: center;
}

#game-wrapper {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
    max-width: 440px;
    margin: 0 auto;
    background: #000000;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: max(env(safe-area-inset-top), 6px) 8px max(env(safe-area-inset-bottom), 6px) 8px;
    overflow: hidden;
}

.top-header {
    width: 100%;
    height: 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 4px;
    flex-shrink: 0;
}

.header-title {
    color: #ff0055;
    font-size: 12px;
    font-weight: bold;
    text-shadow: 0 0 8px #ff0055;
    letter-spacing: 1px;
}

.opt-btn {
    background: #160a2c;
    border: 1.5px solid #ffea00 !important;
    color: #ffea00;
    padding: 4px 8px;
    font-size: 10px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
}

.opt-btn:active {
    transform: scale(0.95);
}

#canvas-container {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    margin: 4px 0;
}

canvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    aspect-ratio: 3/4;
    border: 2px solid #ff0055;
    box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
    image-rendering: pixelated;
    background: #060212;
    border-radius: 8px;
}

.control-deck {
    width: 100%;
    height: 126px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 6px 10px;
    background: #120724;
    border: 2px solid #ffea00 !important;
    border-radius: 12px;
    box-shadow: 0 0 12px rgba(255, 234, 0, 0.3);
    flex-shrink: 0;
}

.joystick-zone {
    position: relative;
    width: 98px;
    height: 98px;
    background: radial-gradient(circle, #1c0b3b 30%, #0a0318 90%);
    border: 2px solid #ff0055 !important;
    border-radius: 50%;
    box-shadow: inset 0 0 15px rgba(255,0,85,.5);
    touch-action: none;
    display: flex;
    justify-content: center;
    align-items: center;
}

.joystick-knob {
    position: absolute;
    width: 44px;
    height: 44px;
    background: radial-gradient(circle at 35% 35%, #ff007f, #880040);
    border: 2px solid #fff !important;
    border-radius: 50%;
    box-shadow: 0 0 12px #ff007f;
    pointer-events: none;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.fire-btn {
    width: 90px;
    height: 90px;
    background: radial-gradient(circle at 35% 35%, #ff3366, #990026);
    border: 3px solid #fff !important;
    color: #fff;
    font-size: 12px;
    font-weight: 900;
    border-radius: 50%;
    box-shadow: 0 5px 0 #66001a, 0 0 15px rgba(255,0,85,.8);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

.fire-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #66001a;
}

.exit-btn {
    width: 100%;
    height: 32px;
    background: #0c051a;
    border: 1.5px solid #ff007f !important;
    color: #ff007f;
    font-weight: bold;
    font-size: 11px;
    border-radius: 6px;
    text-align: center;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 2px;
}

.exit-btn:active {
    background: #180a30;
}

.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.95);
    z-index: 200;
    justify-content: center;
    align-items: center;
    padding: 16px;
}

.modal-box {
    width: 100%;
    max-width: 320px;
    background: #0e051b;
    border: 2px solid #ff0055 !important;
    box-shadow: 0 0 25px rgba(255,0,85,.5);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    color: #fff;
    text-align: center;
}

.modal-title {
    color: #ffea00;
    font-size: 15px;
    font-weight: 900;
}

.option-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: #160a2c;
    padding: 8px;
    border: 1px solid rgba(255,0,127,.4) !important;
    border-radius: 8px;
}

.option-label {
    font-size: 11px;
    font-weight: bold;
    color: #ff0055;
}

.toggle-btn {
    width: 100%;
    padding: 8px;
    background: #2a144a;
    border: 1.5px solid #ff007f !important;
    color: #fff;
    font-weight: bold;
    font-size: 12px;
    border-radius: 6px;
    cursor: pointer;
}

.toggle-btn.active {
    border-color: #00ff66 !important;
    color: #00ff66;
    background: #082814;
}

.sens-slider {
    width: 100%;
    accent-color: #ff007f;
}

.close-modal-btn {
    padding: 10px;
    background: linear-gradient(180deg, #ff007f, #a30052);
    border: 1.5px solid #fff !important;
    color: #fff;
    font-weight: bold;
    font-size: 12px;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>
<body>

<audio id="bgMusic" src="assets/invaders/music.mp3" loop autoplay playsinline style="display:none"></audio>

<div id="game-wrapper">
    <div class="top-header">
        <span class="header-title">FEEDBACK INVADERS</span>
        <button class="opt-btn" id="btnOpenSettings">⚙️ OPZIONI</button>
    </div>

    <div id="canvas-container"><canvas id="game"></canvas></div>

    <div class="control-deck">
        <div class="joystick-zone" id="joyZone"><div class="joystick-knob" id="joyKnob"></div></div>
        <div class="fire-btn" id="btnFire"><span>🔥</span><span>SPARO</span></div>
    </div>

    <button class="exit-btn" onclick="exitGame(score)">◄ TORNA ALL'HUB ARCADE</button>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal-box">
            <div class="modal-title">⚙️ OPZIONI GIOCO</div>
            <div class="option-item">
                <span class="option-label">SENSIBILITÀ JOYSTICK: <span id="sensValText">1.0x</span></span>
                <input type="range" class="sens-slider" id="sensSlider" min="0.5" max="2" step="0.25" value="1">
            </div>
            <div class="option-item">
                <span class="option-label">MUSICA DI SOTTOFONDO</span>
                <button class="toggle-btn active" id="btnToggleMusic">ON 🎵</button>
            </div>
            <div class="option-item">
                <span class="option-label">EFFETTI SONORI (SFX)</span>
                <button class="toggle-btn active" id="btnToggleSfx">ON 🔊</button>
            </div>
            <button class="close-modal-btn" id="btnCloseSettings">SALVA E CHIUDI ►</button>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d'), W = 480, H = 640;
canvas.width = W; canvas.height = H;

let joySensitivity = parseFloat(localStorage.getItem('invaders_joySens')) || 1,
musicEnabled = localStorage.getItem('invaders_music') !== 'false',
sfxEnabled = localStorage.getItem('invaders_sfx') !== 'false';

const bgMusic = document.getElementById('bgMusic');
bgMusic.volume = 0.5;

function playBgMusic() { if (musicEnabled && bgMusic.paused) { let p = bgMusic.play(); if (p) p.catch(() => {}); } }
playBgMusic();
['pointerdown', 'touchstart', 'mousedown', 'keydown', 'click'].forEach(e => window.addEventListener(e, playBgMusic, { once: true, capture: true }));

function updateMusicState() { musicEnabled ? playBgMusic() : bgMusic.pause(); }

const settingsModal = document.getElementById('settingsModal'),
btnOpenSettings = document.getElementById('btnOpenSettings'),
btnCloseSettings = document.getElementById('btnCloseSettings'),
sensSlider = document.getElementById('sensSlider'),
sensValText = document.getElementById('sensValText'),
btnToggleMusic = document.getElementById('btnToggleMusic'),
btnToggleSfx = document.getElementById('btnToggleSfx');

sensSlider.value = joySensitivity;
sensValText.innerText = joySensitivity.toFixed(2) + 'x';

function renderOptionButtons() {
    btnToggleMusic.className = `toggle-btn ${musicEnabled ? 'active' : ''}`;
    btnToggleMusic.innerText = musicEnabled ? 'ON 🎵' : 'OFF 🔇';
    btnToggleSfx.className = `toggle-btn ${sfxEnabled ? 'active' : ''}`;
    btnToggleSfx.innerText = sfxEnabled ? 'ON 🔊' : 'OFF 🔇';
}
renderOptionButtons();

sensSlider.oninput = () => {
    joySensitivity = parseFloat(sensSlider.value);
    sensValText.innerText = joySensitivity.toFixed(2) + 'x';
    localStorage.setItem('invaders_joySens', joySensitivity);
};

btnToggleMusic.onclick = () => {
    musicEnabled = !musicEnabled;
    localStorage.setItem('invaders_music', musicEnabled);
    renderOptionButtons();
    updateMusicState();
};

btnToggleSfx.onclick = () => {
    sfxEnabled = !sfxEnabled;
    localStorage.setItem('invaders_sfx', sfxEnabled);
    renderOptionButtons();
};

btnOpenSettings.onclick = () => {
    if (state === 'playing') { state = 'PAUSE'; updateMusicState(); }
    settingsModal.style.display = 'flex';
};

btnCloseSettings.onclick = () => {
    settingsModal.style.display = 'none';
    getAC();
    if (state === 'PAUSE') state = 'playing';
    updateMusicState();
};

const imgTommi = new Image(), imgGiampa = new Image(), imgBretto = new Image();
imgTommi.src = 'assets/invaders/tommi.png';
imgGiampa.src = 'assets/invaders/giampa.png';
imgBretto.src = 'assets/invaders/bretto.png';

const astTommi = new Image(), astGiampa = new Image(), astBretto = new Image();
astTommi.src = 'assets/invaders/tommi-ast.png';
astGiampa.src = 'assets/invaders/giampa-ast.png';
astBretto.src = 'assets/invaders/bretto-ast.png';

const CHARACTERS = {
    TOMMI: { id: 'TOMMI', name: 'TOMMI', role: 'Coordinatore Video & Set 🎬', perkBonus: 'BONUS: Citronella (Sparo Ultra Rapido)', perkMalus: 'MALUS: Movimento iperattivo', primary: '#ff0055', bg: '#060a1a', portrait: imgTommi, astImg: astTommi, speed: 6.8, cooldown: 8, bulletWidth: 5, multiShot: false },
    GIAMPA: { id: 'GIAMPA', name: 'GIAMPA', role: 'Coordinatore Grafica 🎨', perkBonus: 'BONUS: Laser Vettoriale (+40% Largo)', perkMalus: 'MALUS: Navicella più pesante', primary: '#ffd700', bg: '#141000', portrait: imgGiampa, astImg: astGiampa, speed: 4.5, cooldown: 15, bulletWidth: 12, multiShot: false },
    BRETTO: { id: 'BRETTO', name: 'BRETTO', role: 'Regista degli Eventi 🎧', perkBonus: 'BONUS: Regia Multi-Cam (Sparo Triplo)', perkMalus: 'MALUS: Ricarica leggermente lunga', primary: '#ff33aa', bg: '#140018', portrait: imgBretto, astImg: astBretto, speed: 5.2, cooldown: 19, bulletWidth: 6, multiShot: true }
};

let currentBoss = CHARACTERS.TOMMI;

function saveScore(finalScore) {
    if (finalScore > hiScore) { hiScore = finalScore; localStorage.setItem('invaders_highScore', hiScore); }
    if (finalScore > 0) {
        let u = JSON.parse(localStorage.getItem('arcade_current_user'));
        if (u) {
            u.stats.gamesPlayed = (u.stats.gamesPlayed || 0) + 1;
            u.stats.feedbackInvaders = (u.stats.feedbackInvaders || 0) + finalScore;
            localStorage.setItem('arcade_current_user', JSON.stringify(u));
            if (!u.username.startsWith('GUEST_')) {
                let users = JSON.parse(localStorage.getItem('arcade_users')) || {};
                if (users[u.username]) { users[u.username].stats = u.stats; localStorage.setItem('arcade_users', JSON.stringify(users)); }
            }
        }
    }
}

function exitGame(finalScore) { saveScore(finalScore); bgMusic.pause(); window.location.href = 'index.html'; }

let state = 'TUTORIAL', score = 0, hiScore = parseInt(localStorage.getItem('invaders_highScore')) || 0, lives = 3, wave = 1, frame = 0, deathTimer = 0;
let joyDX = 0, joyDY = 0, joyActive = false, touchFire = false;
let shakeTime = 0, shakeMag = 0;
let audioCtx = null;

function triggerShake(time = 12, mag = 6) { shakeTime = time; shakeMag = mag; }

function getAC() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    playBgMusic(); return audioCtx;
}

function tone(type, f1, f2, dur, vol) {
    if (!sfxEnabled) return;
    const ac = getAC(), t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination); o.type = type; o.frequency.setValueAtTime(f1, t);
    (f2 !== f1 ? o.frequency[type === 'sawtooth' ? 'linearRampToValueAtTime' : 'exponentialRampToValueAtTime'](f2, t + dur) : 0);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.start(t); o.stop(t + dur);
}

function sfxShoot() { tone('square', 850, 350, .07, .06); }
function sfxPowerUp() { tone('sine', 523, 783, .24, .15); }
function sfxDebuff() { tone('sawtooth', 220, 80, .2, .2); }
function sfxPlayerHit() { tone('sawtooth', 380, 50, .4, .15); triggerShake(16, 10); }
function sfxEnemyHit() {
    if (!sfxEnabled) return;
    const ac = getAC(), t = ac.currentTime, dur = .06, b = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = b; f.type = 'bandpass'; f.frequency.value = 1200; g.gain.setValueAtTime(.1, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t);
}
function sfxEnemyExplode() {
    if (!sfxEnabled) return;
    const ac = getAC(), t = ac.currentTime, dur = .35, b = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = b; f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(70, t + dur);
    g.gain.setValueAtTime(.2, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t);
}

const keys = {};
document.addEventListener('keydown', e => {
    keys[e.code] = true; getAC();
    if (state === 'TUTORIAL' && (e.code === 'Space' || e.code === 'Enter')) state = 'CHAR_SELECT';
    else if (state === 'CHAR_SELECT') { if (e.key === '1') selectBoss('TOMMI'); if (e.key === '2') selectBoss('GIAMPA'); if (e.key === '3') selectBoss('BRETTO'); }
    else if (state === 'gameover' && (e.code === 'Space' || e.code === 'Enter')) state = 'CHAR_SELECT';
    else if ((e.code === 'KeyP' || e.code === 'Escape') && (state === 'playing' || state === 'PAUSE')) { state = state === 'playing' ? 'PAUSE' : 'playing'; updateMusicState(); }
});
document.addEventListener('keyup', e => keys[e.code] = false);
const keyPressed = k => !!keys[k];

const joyZone = document.getElementById('joyZone'), joyKnob = document.getElementById('joyKnob');

function handleJoyMove(x, y) {
    const r = joyZone.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy), max = r.width / 2 - 12;
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    joyKnob.style.transform = `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
    joyDX = dx / max * joySensitivity; joyDY = dy / max * joySensitivity;
}
function resetJoy() { joyActive = false; joyDX = joyDY = 0; joyKnob.style.transform = 'translate(-50%,-50%)'; }
joyZone.addEventListener('pointerdown', e => { joyActive = true; joyZone.setPointerCapture(e.pointerId); getAC(); handleJoyMove(e.clientX, e.clientY); });
joyZone.addEventListener('pointermove', e => { if (joyActive) handleJoyMove(e.clientX, e.clientY); });
joyZone.addEventListener('pointerup', resetJoy);
joyZone.addEventListener('pointercancel', resetJoy);

const fire = document.getElementById('btnFire');
fire.addEventListener('pointerdown', e => { e.preventDefault(); getAC(); touchFire = true; });
fire.addEventListener('pointerup', e => { e.preventDefault(); touchFire = false; });
fire.addEventListener('pointercancel', () => touchFire = false);

function selectBoss(k) { currentBoss = CHARACTERS[k]; startGame(); }

const stars = Array.from({ length: 80 }, () => ({ x: Math.random() * W, y: Math.random() * H, speed: .3 + Math.random() * 1.2, size: Math.random() < .15 ? 2 : 1, bright: Math.random() }));
function updateStars() { stars.forEach(s => { s.y += s.speed; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }); }
function drawStars() { stars.forEach(s => { ctx.fillStyle = `rgba(200,220,255,${.3 + .7 * s.bright})`; ctx.fillRect(s.x, s.y, s.size, s.size); }); }

const player = {
    x: W / 2, y: H - 70, w: 56, h: 56, shootTimer: 0, invTimer: 0, alive: true, boostTimer: 0, shieldTimer: 0, lagTimer: 0, jamTimer: 0,
    reset() { this.x = W / 2; this.y = H - 70; this.invTimer = 120; this.alive = true; this.shootTimer = 0; this.boostTimer = this.shieldTimer = this.lagTimer = this.jamTimer = 0; },
    update() {
        if (!this.alive) return;
        let spd = currentBoss.speed;
        if (this.lagTimer > 0) { spd *= .5; this.lagTimer--; }
        if (joyActive) { this.x += joyDX * spd; this.y += joyDY * spd; }
        else {
            if (keyPressed('ArrowLeft') || keyPressed('KeyA')) this.x -= spd;
            if (keyPressed('ArrowRight') || keyPressed('KeyD')) this.x += spd;
            if (keyPressed('ArrowUp') || keyPressed('KeyW')) this.y -= spd;
            if (keyPressed('ArrowDown') || keyPressed('KeyS')) this.y += spd;
        }
        this.x = Math.max(this.w / 2, Math.min(W - this.w / 2, this.x)); this.y = Math.max(this.h / 2, Math.min(H - this.h / 2, this.y));
        if (this.shootTimer > 0) this.shootTimer--; if (this.invTimer > 0) this.invTimer--; if (this.boostTimer > 0) this.boostTimer--;
        if (this.shieldTimer > 0) { this.shieldTimer--; this.invTimer = Math.max(this.invTimer, 2); } if (this.jamTimer > 0) this.jamTimer--;
        
        let shoot = keyPressed('Space') || keyPressed('KeyZ') || touchFire;
        if (this.jamTimer > 0) shoot = false;
        if (shoot && this.shootTimer === 0) {
            let bw = currentBoss.bulletWidth, cd = this.boostTimer > 0 ? 5 : currentBoss.cooldown;
            if (currentBoss.multiShot || this.boostTimer > 0) {
                playerBullets.push(new Bullet(this.x, this.y - 20, 0, -9, currentBoss.primary, bw, 14), new Bullet(this.x - 14, this.y - 12, -2.5, -8.5, currentBoss.primary, bw, 12), new Bullet(this.x + 14, this.y - 12, 2.5, -8.5, currentBoss.primary, bw, 12));
            } else playerBullets.push(new Bullet(this.x, this.y - 22, 0, -9, currentBoss.primary, bw, 14));
            this.shootTimer = cd; sfxShoot();
        }
    },
    draw() {
        if (!this.alive) return;
        if (this.invTimer > 0 && this.shieldTimer === 0 && Math.floor(this.invTimer / 4) % 2 === 0) return;
        if (this.shieldTimer > 0) { ctx.beginPath(); ctx.arc(this.x, this.y, 36, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,153,255,.25)'; ctx.fill(); ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 2; ctx.stroke(); }
        if (currentBoss.astImg.complete && currentBoss.astImg.naturalWidth) ctx.drawImage(currentBoss.astImg, this.x - this.w / 2, this.y - this.h / 2, this.w, this.h);
        else { ctx.fillStyle = currentBoss.primary; ctx.beginPath(); ctx.moveTo(this.x, this.y - 26); ctx.lineTo(this.x + 24, this.y + 22); ctx.lineTo(this.x, this.y + 10); ctx.lineTo(this.x - 24, this.y + 22); ctx.closePath(); ctx.fill(); }
    }
};

class Drop {
    constructor(x, y, type) { this.x = x; this.y = y; this.type = type; this.w = this.h = 28; this.dead = false; }
    update() { this.y += 2; if (this.y > H + 40) this.dead = true; }
    draw() {
        let c = '#ff0055', l = '⚡';
        if (this.type === 'COFFEE') { c = '#ffcc00'; l = '❤️'; }
        else if (this.type === 'SHIELD') { c = '#ffff00'; l = '🛡️'; }
        else if (this.type === 'LAG') { c = '#ff9900'; l = '🐢'; }
        else if (this.type === 'JAM') l = '🚫';
        ctx.fillStyle = '#101228'; ctx.beginPath(); ctx.roundRect(this.x - 14, this.y - 14, 28, 28, 8); ctx.fill();
        ctx.strokeStyle = c; ctx.lineWidth = 1.5; ctx.stroke(); ctx.font = '14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(l, this.x, this.y + 5);
    }
}
let drops = [];
function spawnDrop(x, y) { let r = Math.random(), t = r < .25 ? 'COFFEE' : r < .45 ? 'BOOST' : r < .65 ? 'SHIELD' : r < .82 ? 'LAG' : 'JAM'; drops.push(new Drop(x, y, t)); }

class Bullet {
    constructor(x, y, vx, vy, color, w, h) { Object.assign(this, { x, y, vx, vy, color, w, h, dead: false }); }
    update() { this.x += this.vx; this.y += this.vy; if (this.x < -10 || this.x > W + 10 || this.y < -20 || this.y > H + 20) this.dead = true; }
    draw() { ctx.fillStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = 6; ctx.fillRect(this.x - this.w / 2, this.y - this.h / 2, this.w, this.h); ctx.shadowBlur = 0; }
}

let playerBullets = [], enemyBullets = [], particles = [];
function spawnExplosion(x, y, color, n) { for (let i = 0; i < n; i++) { let a = Math.random() * Math.PI * 2, s = .5 + Math.random() * 4; particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 25 + Math.random() * 25, maxLife: 50, color, size: 1.5 + Math.random() * 3.5 }); } }
function updateParticles() { for (let i = particles.length - 1; i >= 0; i--) { let p = particles[i]; p.x += p.vx; p.y += p.vy; if (--p.life <= 0) particles.splice(i, 1); } }
function drawParticles() { particles.forEach(p => { ctx.globalAlpha = p.life / p.maxLife; ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }); ctx.globalAlpha = 1; }

class Enemy {
    constructor(x, y, type) {
        Object.assign(this, { x, y, type, dead: false, shootTimer: Math.random() * 60 | 0, t: 0 });
        if (type === 'grunt') Object.assign(this, { hp: 1, maxHp: 1, w: 32, h: 28, points: 100, color: '#ff0055', canShoot: false });
        if (type === 'shooter') Object.assign(this, { hp: 2, maxHp: 2, w: 36, h: 32, points: 200, color: '#ffaa00', canShoot: true });
        if (type === 'tank') Object.assign(this, { hp: 5, maxHp: 5, w: 44, h: 40, points: 500, color: '#aa00ff', canShoot: true });
    }
    update() {
        this.t++; let s = 1 + wave * .12;
        if (this.type === 'grunt') { this.y += s; this.x += Math.sin(this.t * .05) * 1.8; }
        else if (this.type === 'shooter') { this.y += s * .65; this.x += Math.sin(this.t * .04 + this.x) * 2.2; }
        else { this.y += s * .45; this.x += Math.cos(this.t * .03) * 1.5; }
        this.x = Math.max(this.w / 2, Math.min(W - this.w / 2, this.x));
        if (this.y > H + 50) this.dead = true;
        if (this.canShoot && !--this.shootTimer) {
            this.shootTimer = Math.max(25, 75 - wave * 3);
            let dx = player.x - this.x, dy = player.y - this.y, d = Math.hypot(dx, dy), sp = 3.8 + wave * .1;
            enemyBullets.push(new Bullet(this.x, this.y + this.h / 2, dx / d * sp, dy / d * sp, '#ff0055', 6, 6));
        }
    }
    hit() {
        if (--this.hp <= 0) {
            this.dead = true; score += this.points;
            spawnExplosion(this.x, this.y, this.color, 18); sfxEnemyExplode();
            if (Math.random() < .22) spawnDrop(this.x, this.y);
        } else { spawnExplosion(this.x, this.y, '#ffff00', 5); sfxEnemyHit(); }
    }
    draw() {
        let x = this.x, y = this.y;
        ctx.fillStyle = this.color;
        if (this.type === 'grunt') { ctx.fillRect(x - 14, y - 12, 28, 24); ctx.fillStyle = '#fff'; ctx.fillRect(x - 8, y - 10, 12, 8); }
        else if (this.type === 'shooter') { ctx.beginPath(); ctx.moveTo(x, y - 15); ctx.lineTo(x + 16, y + 12); ctx.lineTo(x - 16, y + 12); ctx.closePath(); ctx.fill(); }
        else { ctx.fillRect(x - 18, y - 16, 36, 32); ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 1; ctx.strokeRect(x - 18, y - 16, 36, 32); ctx.fillStyle = '#ff0055'; ctx.fillRect(x - 18, y - 22, 36 * (this.hp / this.maxHp), 4); }
    }
}

// BOSS CLASS (OGNI 10 LIVELLI)
class Boss {
    constructor(waveNum) {
        this.w = 110; this.h = 80;
        this.x = W / 2; this.y = -100;
        this.targetY = 110;
        this.maxHp = 150 + waveNum * 35;
        this.hp = this.maxHp;
        this.dead = false;
        this.timer = 0;
        this.attackCooldown = 50;
        this.name = waveNum === 10 ? "THE CRASH BUG 🐛" : waveNum === 20 ? "MEMORY LEAK 👾" : "SYSTEM OVERLOAD ⚡";
        this.color = waveNum === 10 ? "#ff0055" : waveNum === 20 ? "#00ffcc" : "#ffff00";
    }
    update() {
        this.timer++;
        if (this.y < this.targetY) { this.y += 2; return; }
        
        this.x += Math.sin(this.timer * 0.03) * 3;
        
        if (--this.attackCooldown <= 0) {
            this.attackCooldown = Math.max(30, 70 - wave * 2);
            let pattern = Math.floor(Math.random() * 3);
            
            if (pattern === 0) {
                // Sparo triplo
                for (let a = -0.3; a <= 0.3; a += 0.3) {
                    enemyBullets.push(new Bullet(this.x, this.y + 40, Math.sin(a) * 4, Math.cos(a) * 4, '#ff0055', 8, 8));
                }
            } else if (pattern === 1) {
                // Ventaglio a 5 vie
                for (let a = -0.6; a <= 0.6; a += 0.3) {
                    enemyBullets.push(new Bullet(this.x, this.y + 40, Math.sin(a) * 5, Math.cos(a) * 5, '#ffaa00', 7, 7));
                }
            } else {
                // Raffica mirata veloce
                let dx = player.x - this.x, dy = player.y - this.y, d = Math.hypot(dx, dy);
                enemyBullets.push(new Bullet(this.x, this.y + 40, (dx / d) * 6, (dy / d) * 6, '#ff00ff', 10, 10));
            }
        }
    }
    hit() {
        this.hp--;
        triggerShake(4, 3);
        if (this.hp <= 0) {
            this.dead = true;
            score += 5000 + wave * 500;
            spawnExplosion(this.x, this.y, this.color, 60);
            triggerShake(25, 12);
            sfxEnemyExplode();
            // Drop multipli per vittoria boss
            spawnDrop(this.x - 30, this.y);
            spawnDrop(this.x + 30, this.y);
            spawnDrop(this.x, this.y + 20);
        } else {
            spawnExplosion(this.x + (Math.random() - 0.5) * 60, this.y + (Math.random() - 0.5) * 40, '#ffff00', 4);
            sfxEnemyHit();
        }
    }
    draw() {
        let x = this.x, y = this.y;
        
        // Disegno corpo Boss Arcade
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.roundRect(x - this.w / 2, y - this.h / 2, this.w, this.h, 12);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Dettagli / Occhi
        ctx.fillStyle = '#000000';
        ctx.fillRect(x - 35, y - 15, 22, 16);
        ctx.fillRect(x + 13, y - 15, 22, 16);
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(x - 28 + Math.sin(this.timer * 0.1) * 4, y - 11, 8, 8);
        ctx.fillRect(x + 20 + Math.sin(this.timer * 0.1) * 4, y - 11, 8, 8);

        // Core / Motore
        ctx.fillStyle = (Math.floor(this.timer / 5) % 2 === 0) ? '#ffff00' : '#ff0055';
        ctx.fillRect(x - 15, y + 10, 30, 20);

        // Barra della Vita Boss GUI
        ctx.fillStyle = 'rgba(10, 10, 30, 0.8)';
        ctx.fillRect(W / 2 - 120, 48, 240, 16);
        ctx.fillStyle = this.color;
        ctx.fillRect(W / 2 - 118, 50, (236) * Math.max(0, this.hp / this.maxHp), 12);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(W / 2 - 120, 48, 240, 16);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 10px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(this.name, W / 2, 44);
    }
}

let enemies = [], activeBoss = null, spawnQueue = [];

function buildWave(w) {
    if (w % 10 === 0) {
        // Livello Boss!
        activeBoss = new Boss(w);
        triggerShake(20, 8);
        return [];
    }

    activeBoss = null;
    let q = [], rows = 2 + Math.min(w, 5);
    for (let r = 0; r < rows; r++) {
        let cols = 4 + r % 2;
        for (let c = 0; c < cols; c++) {
            let t = 'grunt';
            if (w >= 2 && r === 0) t = 'shooter';
            if (w >= 3 && r === 0 && c === Math.floor(cols / 2)) t = 'tank';
            q.push({ x: 60 + c * (W - 120) / (cols - 1), y: -40 - r * 60, type: t, delay: r * 18 + c * 4 });
        }
    }
    return q;
}

function spawnWaveEnemies() {
    if (!spawnQueue.length && !enemies.length && (!activeBoss || activeBoss.dead)) {
        if (activeBoss && activeBoss.dead) activeBoss = null;
        wave++;
        spawnQueue = buildWave(wave);
    }
    for (let i = spawnQueue.length - 1; i >= 0; i--) {
        let e = spawnQueue[i];
        if (--e.delay <= 0) {
            enemies.push(new Enemy(e.x, e.y, e.type));
            spawnQueue.splice(i, 1);
        }
    }
}

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) { return Math.abs(ax - bx) < (aw + bw) / 2 && Math.abs(ay - by) < (ah + bh) / 2; }

function checkCollisions() {
    // Proiettili giocatore contro nemici e boss
    playerBullets.forEach(b => {
        if (b.dead) return;
        if (activeBoss && !activeBoss.dead && rectsOverlap(b.x, b.y, b.w, b.h, activeBoss.x, activeBoss.y, activeBoss.w, activeBoss.h)) {
            b.dead = true;
            activeBoss.hit();
            return;
        }
        for (let e of enemies) {
            if (!e.dead && rectsOverlap(b.x, b.y, b.w, b.h, e.x, e.y, e.w, e.h)) {
                b.dead = true; e.hit(); break;
            }
        }
    });

    // Drop
    drops.forEach(d => {
        if (!d.dead && rectsOverlap(player.x, player.y, player.w, player.h, d.x, d.y, d.w, d.h)) {
            d.dead = true;
            if (d.type === 'COFFEE') { lives = Math.min(5, lives + 1); sfxPowerUp(); }
            if (d.type === 'BOOST') { player.boostTimer = 300; sfxPowerUp(); }
            if (d.type === 'SHIELD') { player.shieldTimer = 300; sfxPowerUp(); }
            if (d.type === 'LAG') { player.lagTimer = 240; sfxDebuff(); }
            if (d.type === 'JAM') { player.jamTimer = 150; sfxDebuff(); }
        }
    });

    // Danni al giocatore
    if (player.alive && player.invTimer === 0) {
        enemyBullets.forEach(b => { if (!b.dead && rectsOverlap(b.x, b.y, b.w, b.h, player.x, player.y, 44, 44)) { b.dead = true; hitPlayer(); } });
        enemies.forEach(e => { if (!e.dead && rectsOverlap(player.x, player.y, 48, 48, e.x, e.y, e.w - 6, e.h - 6)) { e.dead = true; spawnExplosion(e.x, e.y, e.color, 20); hitPlayer(); } });
        if (activeBoss && !activeBoss.dead && rectsOverlap(player.x, player.y, 48, 48, activeBoss.x, activeBoss.y, activeBoss.w - 10, activeBoss.h - 10)) { hitPlayer(); }
    }
}

function hitPlayer() {
    lives--;
    spawnExplosion(player.x, player.y, currentBoss.primary, 25);
    sfxPlayerHit();
    if (lives <= 0) { player.alive = false; state = 'dead'; deathTimer = 100; updateMusicState(); }
    else player.invTimer = 120;
}

function drawHUD() {
    ctx.fillStyle = currentBoss.primary; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'left'; ctx.fillText(currentBoss.name, 10, 20);
    ctx.fillStyle = '#ffff00'; ctx.fillText(`PTS ${score}`, 10, 36);
    ctx.textAlign = 'center'; ctx.fillText(`STAGE ${wave}`, W / 2, 22);
    ctx.textAlign = 'right'; ctx.fillText(`REC ${hiScore}`, W - 10, 22);
    for (let i = 0; i < lives; i++) { ctx.fillStyle = currentBoss.primary; ctx.fillRect(W - 20 - i * 18, 34, 12, 12); }
}

function drawScreens() {
    if (state === 'TUTORIAL') {
        ctx.fillStyle = 'rgba(6,6,20,.96)'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#ff0055'; ctx.font = 'bold 26px Courier New'; ctx.textAlign = 'center'; ctx.fillText('COME SI GIOCA 🚀', W / 2, 50);
        ctx.fillStyle = '#101228'; ctx.roundRect(20, 75, 440, 110, 12); ctx.fill(); ctx.strokeStyle = '#ff0055'; ctx.stroke();
        ctx.fillStyle = '#ff0055'; ctx.font = 'bold 16px Courier New'; ctx.textAlign = 'left'; ctx.fillText('DISTRUGGI I BUG & CRASH', 35, 102); ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Courier New'; ctx.fillText('• Elimina i nemici prima che scendano!', 35, 130); ctx.fillText('• Sconfiggi il BOSS ogni 10 livelli!', 35, 152);
        ctx.fillStyle = '#101228'; ctx.roundRect(20, 200, 440, 115, 12); ctx.fill(); ctx.strokeStyle = '#ff0055'; ctx.stroke(); ctx.fillStyle = '#ff0055'; ctx.font = 'bold 16px Courier New'; ctx.fillText('RACCOGLI I POTENZIAMENTI 🎁', 35, 228); ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Courier New'; ctx.fillText('• ❤️ Vita | ⚡ Citronella Boost | 🛡️ Scudo', 35, 256); ctx.fillStyle = '#ff9900'; ctx.fillText('• 🐢 Lag | 🚫 Blocco Sparo (ATTENTO!)', 35, 280);
        ctx.fillStyle = '#101228'; ctx.roundRect(20, 330, 440, 100, 12); ctx.fill(); ctx.strokeStyle = '#ffd700'; ctx.stroke(); ctx.fillStyle = '#ffd700'; ctx.font = 'bold 16px Courier New'; ctx.fillText('CONTROLLI PC & TOUCH 🎮', 35, 358); ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Courier New'; ctx.fillText('• Joystick Touch o Frecce PC per muoverti', 35, 386); ctx.fillText('• Tasto SPARO o SPAZIO per attaccare', 35, 408);
        ctx.fillStyle = '#ffff00'; ctx.font = 'bold 15px Courier New'; ctx.textAlign = 'center'; ctx.fillText(`RECORD ATTUALE: ${hiScore} PTS`, W / 2, 465); ctx.fillStyle = '#ff0055'; ctx.roundRect(30, 510, 420, 60, 12); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = 'bold 17px Courier New'; ctx.fillText('AVANTI: SCEGLI IL TUO CAPO ►', W / 2, 546); return;
    }
    if (state === 'CHAR_SELECT') {
        ctx.fillStyle = 'rgba(6,6,20,.96)'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#ffff00'; ctx.font = 'bold 17px Courier New'; ctx.textAlign = 'center'; ctx.fillText('Scegli il tuo capo in ACTING OUT', W / 2, 42);
        [{ key: 'TOMMI', y: 65, col: '#ff0055' }, { key: 'GIAMPA', y: 220, col: '#ffd700' }, { key: 'BRETTO', y: 375, col: '#ff33aa' }].forEach(b => {
            let c = CHARACTERS[b.key]; ctx.fillStyle = '#101228'; ctx.roundRect(15, b.y, 450, 140, 12); ctx.fill(); ctx.strokeStyle = b.col; ctx.stroke();
            ctx.fillStyle = b.col; ctx.font = 'bold 22px Courier New'; ctx.textAlign = 'left'; ctx.fillText(c.name, 30, b.y + 34); ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Courier New'; ctx.fillText(c.role, 30, b.y + 58);
            ctx.fillStyle = '#ffff00'; ctx.font = 'bold 11px Courier New'; ctx.fillText(c.perkBonus, 30, b.y + 82); ctx.fillStyle = '#ff0055'; ctx.fillText(c.perkMalus, 30, b.y + 100);
            ctx.fillStyle = b.col; ctx.font = 'bold 13px Courier New'; ctx.fillText('GIOCA ►', 30, b.y + 125);
            if (c.portrait.complete && c.portrait.naturalWidth) { ctx.save(); ctx.roundRect(330, b.y + 12, 120, 116, 10); ctx.clip(); ctx.drawImage(c.portrait, 330, b.y + 12, 120, 116); ctx.restore(); }
        }); return;
    }
    if (state === 'PAUSE') {
        ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = '#ffea00'; ctx.font = 'bold 34px Courier New'; ctx.textAlign = 'center'; ctx.fillText('IN PAUSA', W / 2, H / 2 - 20); ctx.fillStyle = '#ff0055'; ctx.font = 'bold 15px Courier New'; ctx.fillText('TOCCA IL GIOCO PER RIPRENDERE', W / 2, H / 2 + 25);
    }
    if (state === 'dead' || state === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,.85)'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = currentBoss.primary; ctx.font = 'bold 36px Courier New'; ctx.textAlign = 'center'; ctx.fillText('GAME OVER', W / 2, H / 2 - 50); ctx.fillStyle = '#ffff00'; ctx.font = 'bold 20px Courier New'; ctx.fillText(`SCORE: ${score}`, W / 2, H / 2 + 10); ctx.fillStyle = '#ff0055'; ctx.font = '14px Courier New'; ctx.fillText(`RECORD: ${hiScore}`, W / 2, H / 2 + 45); ctx.fillStyle = '#fff'; ctx.font = 'bold 15px Courier New'; ctx.fillText('TOCCA PER CAMBIARE / RIPROVARE', W / 2, H / 2 + 110);
    }
}

canvas.addEventListener('pointerdown', e => {
    getAC(); let r = canvas.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
    if (state === 'TUTORIAL') { if (y >= 500) state = 'CHAR_SELECT'; return; }
    if (state === 'CHAR_SELECT') { if (y >= 65 && y <= 205) selectBoss('TOMMI'); else if (y >= 220 && y <= 360) selectBoss('GIAMPA'); else if (y >= 375 && y <= 515) selectBoss('BRETTO'); return; }
    if (state === 'playing') { state = 'PAUSE'; updateMusicState(); return; }
    if (state === 'PAUSE') { state = 'playing'; updateMusicState(); return; }
    if (state === 'gameover') state = 'CHAR_SELECT';
});

function startGame() { score = 0; lives = 3; wave = 1; enemies = []; activeBoss = null; playerBullets = []; enemyBullets = []; drops = []; particles.length = 0; spawnQueue = buildWave(1); player.reset(); state = 'playing'; updateMusicState(); }

function update() {
    frame++; updateStars();
    if (shakeTime > 0) shakeTime--;
    if (state === 'TUTORIAL' || state === 'CHAR_SELECT' || state === 'PAUSE') return;
    if (state === 'dead') { deathTimer--; updateParticles(); if (deathTimer <= 0) { state = 'gameover'; saveScore(score); } return; }
    if (state === 'gameover') return;
    
    player.update();
    spawnWaveEnemies();
    if (activeBoss) activeBoss.update();
    
    playerBullets.forEach(b => b.update()); enemyBullets.forEach(b => b.update()); enemies.forEach(e => e.update()); drops.forEach(d => d.update());
    playerBullets = playerBullets.filter(b => !b.dead); enemyBullets = enemyBullets.filter(b => !b.dead); enemies = enemies.filter(e => !e.dead); drops = drops.filter(d => !d.dead);
    checkCollisions(); updateParticles();
}

function draw() {
    ctx.save();
    if (shakeTime > 0) {
        let sx = (Math.random() - 0.5) * shakeMag, sy = (Math.random() - 0.5) * shakeMag;
        ctx.translate(sx, sy);
    }
    ctx.fillStyle = '#060212'; ctx.fillRect(0, 0, W, H); drawStars();
    if (state === 'TUTORIAL' || state === 'CHAR_SELECT') { drawScreens(); ctx.restore(); return; }
    
    drops.forEach(d => d.draw()); enemyBullets.forEach(b => b.draw()); playerBullets.forEach(b => b.draw()); enemies.forEach(e => e.draw());
    if (activeBoss) activeBoss.draw();
    player.draw(); drawParticles(); drawHUD();
    if (state === 'PAUSE' || state === 'dead' || state === 'gameover') drawScreens();
    ctx.restore();
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
