<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060212">
<title>Feedback Invaders - Agency Arcade</title>
<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent !important;
    -webkit-focus-ring-color: transparent !important;
    outline: none !important;
    touch-action: manipulation;
  }
  html {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #060212 !important;
    overflow: hidden;
  }
  body {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #060212 !important;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Courier New', Courier, monospace;
  }
  #game-wrapper {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100vw;
    height: 100svh;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: max(env(safe-area-inset-top), 6px) 8px max(env(safe-area-inset-bottom), 6px) 8px;
    background: #060212 !important;
    overflow: hidden;
  }

  .top-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 6px;
    margin-bottom: 2px;
    flex-shrink: 0;
  }
  .header-title {
    color: #ff0055 !important;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 0 6px #ff0055 !important;
    letter-spacing: 1px;
  }
  .opt-btn {
    background: #1a0836;
    border: 1.5px solid #ffea00 !important;
    color: #ffea00 !important;
    padding: 5px 10px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(255, 234, 0, 0.4) !important;
  }
  .opt-btn:active { transform: scale(0.92); }

  #canvas-container {
    position: relative;
    width: 100%;
    flex: 1 1 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    min-height: 0;
    margin: 2px 0;
  }
  canvas {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    aspect-ratio: 3 / 4;
    border: 2px solid #ff0055 !important;
    box-shadow: 0 0 15px rgba(255,0,85,0.4) !important;
    image-rendering: pixelated;
    background: #060212;
    cursor: pointer;
    border-radius: 8px;
  }

  .control-deck {
    width: 100%;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 6px 10px;
    background: #160a2c;
    border: 2px solid #ffea00 !important;
    border-radius: 14px;
    box-shadow: 0 0 15px rgba(255, 234, 0, 0.4) !important;
    flex-shrink: 0;
  }

  .joystick-zone {
    position: relative;
    width: 100px;
    height: 100px;
    background: radial-gradient(circle, #1c0b3b 30%, #0a0318 90%);
    border: 2.5px solid #ff0055 !important;
    border-radius: 50%;
    box-shadow: inset 0 0 20px rgba(255, 0, 85, 0.5), 0 0 12px rgba(255, 0, 85, 0.4) !important;
    touch-action: none;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .joystick-knob {
    position: absolute;
    width: 44px;
    height: 44px;
    background: radial-gradient(circle at 35% 35%, #ff007f, #880040);
    border: 2.5px solid #ffffff;
    border-radius: 50%;
    box-shadow: 0 0 15px #ff007f;
    pointer-events: none;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .fire-btn {
    width: 92px;
    height: 92px;
    background: radial-gradient(circle at 35% 35%, #ff3366, #990026);
    border: 3px solid #ffffff;
    color: #ffffff;
    font-size: 13px;
    font-weight: 900;
    border-radius: 50%;
    box-shadow: 0 5px 0 #66001a, 0 0 18px rgba(255, 0, 85, 0.8);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    letter-spacing: 1px;
    text-shadow: 0 2px 4px #000;
    cursor: pointer;
  }
  .fire-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #66001a;
    background: #ff0033;
  }

  .exit-btn {
    width: 100%;
    margin-top: 2px;
    padding: 6px;
    background: #060212;
    border: 1.5px solid #ff007f !important;
    color: #ff007f !important;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    font-size: 11px;
    border-radius: 6px;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 0 10px rgba(255, 0, 127, 0.3) !important;
    flex-shrink: 0;
  }
  .exit-btn:active { transform: scale(0.96); }

  .modal-overlay {
    display: none;
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(6, 2, 18, 0.95);
    z-index: 200;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }
  .modal-box {
    width: 100%;
    max-width: 320px;
    background: #0e051b;
    border: 3px solid #ff0055 !important;
    box-shadow: 0 0 25px rgba(255, 0, 85, 0.5) !important;
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    color: #ffffff;
    text-align: center;
  }
  .modal-title {
    color: #ffea00;
    font-size: 16px;
    font-weight: 900;
    text-shadow: 0 0 8px #ffea00;
    margin-bottom: 2px;
  }
  .option-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: #160a2c;
    padding: 10px;
    border: 1px solid rgba(255,0,127,0.4);
    border-radius: 8px;
  }
  .option-label {
    font-size: 11px;
    font-weight: bold;
    color: #ff0055 !important;
  }
  .toggle-btn {
    width: 100%;
    padding: 8px;
    background: #2a144a;
    border: 2px solid #ff007f;
    color: #ffffff;
    font-weight: bold;
    font-size: 13px;
    border-radius: 6px;
    cursor: pointer;
  }
  .toggle-btn.active {
    border-color: #00ff66;
    color: #00ff66;
    background: #082814;
    box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
  }
  .sens-slider {
    width: 100%;
    accent-color: #ff007f;
    cursor: pointer;
  }
  .close-modal-btn {
    padding: 10px;
    background: linear-gradient(180deg, #ff007f, #a30052);
    border: 2px solid #ffffff;
    color: #ffffff;
    font-weight: bold;
    font-size: 12px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(255, 0, 127, 0.5);
  }
</style>
</head>
<body>

<audio id="bgMusic" src="assets/invaders/music.mp3" loop autoplay playsinline style="display:none;"></audio>

<div id="game-wrapper">
  <div class="top-header">
    <span class="header-title">FEEDBACK INVADERS</span>
    <button class="opt-btn" id="btnOpenSettings">⚙️ OPZIONI</button>
  </div>

  <div id="canvas-container">
    <canvas id="game"></canvas>
  </div>

  <div class="control-deck">
    <div class="joystick-zone" id="joyZone">
      <div class="joystick-knob" id="joyKnob"></div>
    </div>

    <div class="fire-btn" id="btnFire">
      <span>🔥</span>
      <span>SPARO</span>
    </div>
  </div>

  <button class="exit-btn" onclick="exitGame(score)">◄ TORNA ALL'HUB ARCADE</button>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box">
      <div class="modal-title">⚙️ OPZIONI GIOCO</div>

      <div class="option-item">
        <span class="option-label">SENSIBILITÀ JOYSTICK: <span id="sensValText">1.0x</span></span>
        <input type="range" class="sens-slider" id="sensSlider" min="0.5" max="2.0" step="0.25" value="1.0">
      </div>

      <div class="option-item">
        <span class="option-label">MUSICA DI SOTTOFONDO</span>
        <button class="toggle-btn active" id="btnToggleMusic">ON 🎵</button>
      </div>

      <div class="option-item">
        <span class="option-label">EFFETTI SONORI (SFX)</span>
        <button class="toggle-btn active" id="btnToggleSfx">ON 🔊</button>
      </div>

      <button class="close-modal-btn" id="btnCloseSettings">SALVA E CHIUDI ►</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = 480;
const H = 640;
canvas.width = W;
canvas.height = H;

let joySensitivity = parseFloat(localStorage.getItem('invaders_joySens')) || 1.0;
let musicEnabled = localStorage.getItem('invaders_music') !== 'false';
let sfxEnabled = localStorage.getItem('invaders_sfx') !== 'false';

const bgMusic = document.getElementById('bgMusic');
bgMusic.volume = 0.5;

function playBgMusic() {
  if (musicEnabled && bgMusic.paused) {
    let p = bgMusic.play();
    if (p !== undefined) {
      p.catch(() => {});
    }
  }
}

playBgMusic();
window.addEventListener('DOMContentLoaded', playBgMusic);
window.addEventListener('load', playBgMusic);
['pointerdown', 'touchstart', 'mousedown', 'keydown', 'click'].forEach(evt => {
  window.addEventListener(evt, playBgMusic, { once: true, capture: true });
});

function updateMusicState() {
  if (musicEnabled) {
    playBgMusic();
  } else {
    bgMusic.pause();
  }
}

const settingsModal = document.getElementById('settingsModal');
const btnOpenSettings = document.getElementById('btnOpenSettings');
const btnCloseSettings = document.getElementById('btnCloseSettings');
const sensSlider = document.getElementById('sensSlider');
const sensValText = document.getElementById('sensValText');
const btnToggleMusic = document.getElementById('btnToggleMusic');
const btnToggleSfx = document.getElementById('btnToggleSfx');

sensSlider.value = joySensitivity;
sensValText.innerText = joySensitivity.toFixed(2) + 'x';

function renderOptionButtons() {
  btnToggleMusic.className = `toggle-btn ${musicEnabled ? 'active' : ''}`;
  btnToggleMusic.innerText = musicEnabled ? 'ON 🎵' : 'OFF 🔇';

  btnToggleSfx.className = `toggle-btn ${sfxEnabled ? 'active' : ''}`;
  btnToggleSfx.innerText = sfxEnabled ? 'ON 🔊' : 'OFF 🔇';
}
renderOptionButtons();

sensSlider.oninput = () => {
  joySensitivity = parseFloat(sensSlider.value);
  sensValText.innerText = joySensitivity.toFixed(2) + 'x';
  localStorage.setItem('invaders_joySens', joySensitivity);
};

btnToggleMusic.onclick = () => {
  musicEnabled = !musicEnabled;
  localStorage.setItem('invaders_music', musicEnabled);
  renderOptionButtons();
  updateMusicState();
};

btnToggleSfx.onclick = () => {
  sfxEnabled = !sfxEnabled;
  localStorage.setItem('invaders_sfx', sfxEnabled);
  renderOptionButtons();
};

btnOpenSettings.onclick = () => {
  if (state === 'playing') {
    state = 'PAUSE';
    updateMusicState();
  }
  settingsModal.style.display = 'flex';
};

btnCloseSettings.onclick = () => {
  settingsModal.style.display = 'none';
  getAC();
  if (state === 'PAUSE') {
    state = 'playing';
  }
  updateMusicState();
};

// --- PRE-CARICAMENTO ASSETS PNG ---
const ASSETS = {
  COFFEE: new Image(), BOOST: new Image(), SHIELD: new Image(), LAG: new Image(), JAM: new Image(),
  "BRIEF CONFUSO": new Image(), "FEEDBACK EXTRA": new Image(), "LOGO PIÙ GRANDE": new Image(),
  "SCADENZA IERI": new Image(), "RENDER CRASH": new Image(), "FATTURA SCADUTA": new Image(),
  "CALL ALLE 18": new Image(), "BUDGET ZERO": new Image(), "MICRO-MANAGEMENT": new Image(),
  BOSS_1: new Image(), BOSS_2: new Image(), BOSS_3: new Image(), BOSS_4: new Image(), BOSS_5: new Image()
};

ASSETS.COFFEE.src = 'assets/invaders/caffe.png';
ASSETS.BOOST.src = 'assets/invaders/boost.png';
ASSETS.SHIELD.src = 'assets/invaders/scudo.png';
ASSETS.LAG.src = 'assets/invaders/lag.png';
ASSETS.JAM.src = 'assets/invaders/jam.png';

ASSETS["BRIEF CONFUSO"].src = 'assets/invaders/brief.png';
ASSETS["FEEDBACK EXTRA"].src = 'assets/invaders/feedback.png';
ASSETS["LOGO PIÙ GRANDE"].src = 'assets/invaders/logo.png';
ASSETS["SCADENZA IERI"].src = 'assets/invaders/scadenza.png';
ASSETS["RENDER CRASH"].src = 'assets/invaders/render.png';
ASSETS["FATTURA SCADUTA"].src = 'assets/invaders/fattura.png';
ASSETS["CALL ALLE 18"].src = 'assets/invaders/call.png';
ASSETS["BUDGET ZERO"].src = 'assets/invaders/budget.png';
ASSETS["MICRO-MANAGEMENT"].src = 'assets/invaders/micromanagement.png';

ASSETS.BOSS_1.src = 'assets/invaders/boss1.png';
ASSETS.BOSS_2.src = 'assets/invaders/boss2.png';
ASSETS.BOSS_3.src = 'assets/invaders/boss3.png';
ASSETS.BOSS_4.src = 'assets/invaders/boss4.png';
ASSETS.BOSS_5.src = 'assets/invaders/boss5.png';

const imgCover = new Image(); imgCover.src = 'assets/invaders/copertina.png';

const imgTommi = new Image(); imgTommi.src = 'assets/invaders/tommi.png';
const imgGiampa = new Image(); imgGiampa.src = 'assets/invaders/giampa.png';
const imgBretto = new Image(); imgBretto.src = 'assets/invaders/bretto.png';

const astTommi = new Image(); astTommi.src = 'assets/invaders/tommi-ast.png';
const astGiampa = new Image(); astGiampa.src = 'assets/invaders/giampa-ast.png';
const astBretto = new Image(); astBretto.src = 'assets/invaders/bretto-ast.png';

const CHARACTERS = {
  TOMMI: {
    id: 'TOMMI',
    name: "TOMMI",
    role: "Coordinatore Video & Set 🎬",
    perkBonus: "BONUS: Citronella (Sparo Ultra Rapido)",
    perkMalus: "MALUS: Movimento iperattivo",
    primary: "#ff0055",
    bg: "#060a1a",
    portrait: imgTommi,
    astImg: astTommi,
    speed: 6.8,
    cooldown: 9,
    bulletWidth: 5,
    multiShot: false
  },
  GIAMPA: {
    id: 'GIAMPA',
    name: "GIAMPA",
    role: "Coordinatore Grafica 🎨",
    perkBonus: "BONUS: Mega Pennello (Laser Gigante)",
    perkMalus: "MALUS: Movimenti più lenti",
    primary: "#ffd700",
    bg: "#141000",
    portrait: imgGiampa,
    astImg: astGiampa,
    speed: 4.8,
    cooldown: 14,
    bulletWidth: 16,
    multiShot: false
  },
  BRETTO: {
    id: 'BRETTO',
    name: "BRETTO",
    role: "Regista degli Eventi 🎧",
    perkBonus: "BONUS: Regia Multi-Cam (Triplo Sparo)",
    perkMalus: "MALUS: Ricarica leggermente lunga",
    primary: "#ff33aa",
    bg: "#140018",
    portrait: imgBretto,
    astImg: astBretto,
    speed: 5.4,
    cooldown: 18,
    bulletWidth: 6,
    multiShot: true
  }
};

let currentBoss = CHARACTERS.TOMMI;

function saveScore(finalScore) {
  if (finalScore > hiScore) {
    hiScore = finalScore;
    localStorage.setItem('invaders_highScore', hiScore);
  }
  if (finalScore > 0) {
    let curUser = JSON.parse(localStorage.getItem('arcade_current_user'));
    if (curUser) {
      curUser.stats.gamesPlayed = (curUser.stats.gamesPlayed || 0) + 1;
      curUser.stats.feedbackInvaders = (curUser.stats.feedbackInvaders || 0) + finalScore;
      localStorage.setItem('arcade_current_user', JSON.stringify(curUser));

      if (!curUser.username.startsWith("GUEST_")) {
        let users = JSON.parse(localStorage.getItem('arcade_users')) || {};
        if (users[curUser.username]) {
          users[curUser.username].stats = curUser.stats;
          localStorage.setItem('arcade_users', JSON.stringify(users));
        }
      }
    }
  }
}

function exitGame(finalScore) {
  saveScore(finalScore);
  bgMusic.pause();
  window.location.href = 'index.html';
}

let state = 'COVER'; 
let score = 0;
let hiScore = parseInt(localStorage.getItem('invaders_highScore')) || 0;
let lives = 3;
let wave = 1;
let currentTier = 1;
let frame = 0;
let deathTimer = 0;
let bossBannerTimer = 0;
let bossBannerName = "";

let joyDX = 0, joyDY = 0, joyActive = false;
let touchFire = false;
let shakeTime = 0, shakeMag = 0;

function triggerShake(time = 12, mag = 6) { shakeTime = time; shakeMag = mag; }

let audioCtx = null;
function getAC() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  playBgMusic();
  return audioCtx;
}

function sfxShoot() {
  if (!sfxEnabled) return;
  const ac = getAC(), t = ac.currentTime;
  const osc = ac.createOscillator(), gain = ac.createGain();
  osc.connect(gain); gain.connect(ac.destination);
  osc.type = 'square';
  osc.frequency.setValueAtTime(850, t);
  osc.frequency.exponentialRampToValueAtTime(350, t + 0.07);
  gain.gain.setValueAtTime(0.06, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
  osc.start(t); osc.stop(t + 0.07);
}

function sfxPowerUp() {
  if (!sfxEnabled) return;
  const ac = getAC(), t = ac.currentTime;
  const osc = ac.createOscillator(), gain = ac.createGain();
  osc.connect(gain); gain.connect(ac.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(523, t);
  osc.frequency.setValueAtTime(659, t + 0.08);
  osc.frequency.setValueAtTime(783, t + 0.16);
  gain.gain.setValueAtTime(0.15, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
  osc.start(t); osc.stop(t + 0.24);
}

function sfxDebuff() {
  if (!sfxEnabled) return;
  const ac = getAC(), t = ac.currentTime;
  const osc = ac.createOscillator(), gain = ac.createGain();
  osc.connect(gain); gain.connect(ac.destination);
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(220, t);
  osc.frequency.linearRampToValueAtTime(80, t + 0.2);
  gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
  osc.start(t); osc.stop(t + 0.2);
}

function sfxEnemyHit() {
  if (!sfxEnabled) return;
  const ac = getAC(), t = ac.currentTime, dur = 0.06;
  const buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(); src.buffer = buf;
  const filt = ac.createBiquadFilter(); filt.type = 'bandpass'; filt.frequency.value = 1200;
  const gain = ac.createGain();
  gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(filt); filt.connect(gain); gain.connect(ac.destination);
  src.start(t);
}

function sfxEnemyExplode() {
  if (!sfxEnabled) return;
  const ac = getAC(), t = ac.currentTime, dur = 0.35;
  const buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(); src.buffer = buf;
  const filt = ac.createBiquadFilter(); filt.type = 'lowpass';
  filt.frequency.setValueAtTime(900, t); filt.frequency.exponentialRampToValueAtTime(70, t + dur);
  const gain = ac.createGain();
  gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(filt); filt.connect(gain); gain.connect(ac.destination);
  src.start(t);
}

function sfxPlayerHit() {
  if (!sfxEnabled) return;
  const ac = getAC(), t = ac.currentTime;
  const osc = ac.createOscillator(), og = ac.createGain();
  osc.connect(og); og.connect(ac.destination);
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(380, t); osc.frequency.exponentialRampToValueAtTime(50, t + 0.4);
  og.gain.setValueAtTime(0.15, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
  osc.start(t); osc.stop(t + 0.4);
  triggerShake(16, 10);
}

function advanceFromCover() {
  if (state === 'COVER') {
    state = 'TUTORIAL';
  }
}

const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  getAC();
  if (state === 'COVER' && (e.code === 'Space' || e.code === 'Enter')) advanceFromCover();
  else if (state === 'TUTORIAL' && (e.code === 'Space' || e.code === 'Enter')) state = 'CHAR_SELECT';
  else if (state === 'CHAR_SELECT') {
    if (e.key === '1') selectBoss('TOMMI');
    if (e.key === '2') selectBoss('GIAMPA');
    if (e.key === '3') selectBoss('BRETTO');
  }
  else if (state === 'ERA_INTRO' && (e.code === 'Space' || e.code === 'Enter')) {
    state = 'playing';
  }
  else if (state === 'gameover' && (e.code === 'Space' || e.code === 'Enter')) state = 'CHAR_SELECT';
  else if ((e.code === 'KeyP' || e.code === 'Escape') && (state === 'playing' || state === 'PAUSE')) {
    state = state === 'playing' ? 'PAUSE' : 'playing';
    updateMusicState();
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });
function keyPressed(code) { return !!keys[code]; }

const joyZone = document.getElementById('joyZone');
const joyKnob = document.getElementById('joyKnob');

function handleJoyMove(clientX, clientY) {
  const rect = joyZone.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  let dx = clientX - centerX;
  let dy = clientY - centerY;

  const dist = Math.hypot(dx, dy);
  const maxRadius = rect.width / 2 - 12;

  if (dist > maxRadius) {
    dx = (dx / dist) * maxRadius;
    dy = (dy / dist) * maxRadius;
  }

  joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

  joyDX = (dx / maxRadius) * joySensitivity;
  joyDY = (dy / maxRadius) * joySensitivity;
}

function resetJoy() {
  joyActive = false;
  joyDX = 0; joyDY = 0;
  joyKnob.style.transform = `translate(-50%, -50%)`;
}

joyZone.addEventListener('pointerdown', e => {
  joyActive = true;
  joyZone.setPointerCapture(e.pointerId);
  getAC();
  handleJoyMove(e.clientX, e.clientY);
});

joyZone.addEventListener('pointermove', e => {
  if (joyActive) handleJoyMove(e.clientX, e.clientY);
});

joyZone.addEventListener('pointerup', resetJoy);
joyZone.addEventListener('pointercancel', resetJoy);

function bindFireBtn(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const press = (e) => { 
    if (e) e.preventDefault(); 
    getAC(); 
    if (state === 'COVER') {
      advanceFromCover();
      return;
    }
    if (state === 'ERA_INTRO') {
      state = 'playing';
      return;
    }
    touchFire = true; 
  };
  const release = (e) => { if (e) e.preventDefault(); touchFire = false; };
  el.addEventListener('pointerdown', press);
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('pointerup', release);
  el.addEventListener('touchend', release);
}
bindFireBtn('btnFire');

function selectBoss(bossKey) {
  currentBoss = CHARACTERS[bossKey];
  startGame();
}

const stars = Array.from({ length: 80 }, () => ({
  x: Math.random() * W, y: Math.random() * H,
  speed: 0.3 + Math.random() * 1.2, size: Math.random() < 0.15 ? 2 : 1, bright: Math.random()
}));

function updateStars() {
  for (const s of stars) {
    s.y += s.speed;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }
}
function drawStars() {
  for (const s of stars) {
    ctx.fillStyle = `rgba(200,220,255,${0.3 + 0.7 * s.bright})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);

}

const player = {
  x: W / 2, y: H - 70,
  w: 56, h: 56,
  shootTimer: 0, invTimer: 0, alive: true,
  
  boostTimer: 0, shieldTimer: 0, lagTimer: 0, jamTimer: 0,

  reset() {
    this.x = W / 2; this.y = H - 70;
    this.invTimer = 120; this.alive = true; this.shootTimer = 0;
    this.boostTimer = 0; this.shieldTimer = 0; this.lagTimer = 0; this.jamTimer = 0;
  },

  update() {
    if (!this.alive) return;
    
    let spd = currentBoss.speed;
    if (this.lagTimer > 0) { spd *= 0.5; this.lagTimer--; }

    if (joyActive) {
      this.x += joyDX * spd;
      this.y += joyDY * spd;
    } else {
      if (keyPressed('ArrowLeft')  || keyPressed('KeyA')) this.x -= spd;
      if (keyPressed('ArrowRight') || keyPressed('KeyD')) this.x += spd;
      if (keyPressed('ArrowUp')    || keyPressed('KeyW')) this.y -= spd;
      if (keyPressed('ArrowDown')  || keyPressed('KeyS')) this.y += spd;
    }

    this.x = Math.max(this.w / 2, Math.min(W - this.w / 2, this.x));
    this.y = Math.max(this.h / 2, Math.min(H - this.h / 2, this.y));

    if (this.shootTimer > 0) this.shootTimer--;
    if (this.invTimer > 0)   this.invTimer--;
    
    if (this.boostTimer > 0)  this.boostTimer--;
    if (this.shieldTimer > 0) { this.shieldTimer--; this.invTimer = Math.max(this.invTimer, 2); }
    if (this.jamTimer > 0)    this.jamTimer--;

    let wantsToShoot = keyPressed('Space') || keyPressed('KeyZ') || touchFire;
    if (this.jamTimer > 0) wantsToShoot = false;

    if (wantsToShoot && this.shootTimer === 0) {
      let bw = currentBoss.bulletWidth;
      let cd = this.boostTimer > 0 ? 5 : currentBoss.cooldown;

      if (currentBoss.multiShot || this.boostTimer > 0) {
        playerBullets.push(new Bullet(this.x, this.y - 20, 0, -9, currentBoss.primary, bw, 14));
        playerBullets.push(new Bullet(this.x - 14, this.y - 12, -2.5, -8.5, currentBoss.primary, bw, 12));
        playerBullets.push(new Bullet(this.x + 14, this.y - 12, 2.5, -8.5, currentBoss.primary, bw, 12));
      } else {
        playerBullets.push(new Bullet(this.x, this.y - 22, 0, -9, currentBoss.primary, bw, 14));
      }
      this.shootTimer = cd;
      sfxShoot();
    }
  },

  draw() {
    if (!this.alive) return;
    if (this.invTimer > 0 && this.shieldTimer === 0 && Math.floor(this.invTimer / 4) % 2 === 0) return;
    
    if (this.shieldTimer > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(this.x, this.y, 36, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 153, 255, 0.25)'; ctx.fill();
      ctx.strokeStyle = '#00ccff'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.restore();
    }

    if (this.jamTimer > 0 || this.lagTimer > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(this.x, this.y, 34, 0, Math.PI * 2);
      ctx.strokeStyle = this.jamTimer > 0 ? '#ff0055' : '#ff9900';
      ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]); ctx.stroke();
      ctx.restore();
    }

    if (currentBoss.astImg && currentBoss.astImg.complete && currentBoss.astImg.naturalWidth !== 0) {
      ctx.drawImage(currentBoss.astImg, this.x - this.w/2, this.y - this.h/2, this.w, this.h);
    } else {
      ctx.fillStyle = currentBoss.primary;
      ctx.beginPath();
      ctx.moveTo(this.x, this.y - 26);
      ctx.lineTo(this.x + 24, this.y + 22);
      ctx.lineTo(this.x, this.y + 10);
      ctx.lineTo(this.x - 24, this.y + 22);
      ctx.closePath(); ctx.fill();
    }
  }
};

// --- FIX 3: POTENZIAMENTI E DEBUFF INGRANDITI (40x40) E MOLTO PIÙ CHIARI ---
class Drop {
  constructor(x, y, type) {
    this.x = x; this.y = y; this.type = type;
    this.w = 40; this.h = 40; this.dead = false;
    this.speed = 2.0;
  }
  update() {
    this.y += this.speed;
    if (this.y > H + 40) this.dead = true;
  }
  draw() {
    ctx.save();
    let col = '#ff0055';
    let label = '⚡';

    if (this.type === 'COFFEE') { col = '#ffcc00'; label = '☕'; }
    else if (this.type === 'BOOST') { col = '#ff0055'; label = '⚡'; }
    else if (this.type === 'SHIELD') { col = '#00ccff'; label = '🛡️'; }
    else if (this.type === 'LAG') { col = '#ff9900'; label = '🐢'; }
    else if (this.type === 'JAM') { col = '#ff0055'; label = '🚫'; }

    ctx.fillStyle = '#101228';
    ctx.beginPath();
    ctx.roundRect(this.x - 20, this.y - 20, 40, 40, 10);
    ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.stroke();

    const dropImg = ASSETS[this.type];
    if (dropImg && dropImg.complete && dropImg.naturalWidth !== 0) {
      ctx.drawImage(dropImg, this.x - 15, this.y - 15, 30, 30);
    } else {
      ctx.font = '22px "Segoe UI Emoji", "Apple Color Emoji", sans-serif'; 
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(label, Math.round(this.x), Math.round(this.y + 1));
    }
    ctx.restore();
  }
}

let drops = [];

function spawnDrop(x, y) {
  let rand = Math.random();
  let type = 'BOOST';
  if (rand < 0.28) type = 'COFFEE';
  else if (rand < 0.52) type = 'BOOST';
  else if (rand < 0.75) type = 'SHIELD';
  else if (rand < 0.88) type = 'LAG';
  else type = 'JAM';

  drops.push(new Drop(x, y, type));
}

class Bullet {
  constructor(x, y, vx, vy, color, w, h) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.color = color; this.w = w; this.h = h; this.dead = false;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    if (this.x < -10 || this.x > W + 10 || this.y < -20 || this.y > H + 20) this.dead = true;
  }
  draw() {
    ctx.fillStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = 6;
    ctx.fillRect(this.x - this.w / 2, this.y - this.h / 2, this.w, this.h);
    ctx.shadowBlur = 0;
  }
}

let playerBullets = [], enemyBullets = [], particles = [];

function spawnExplosion(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2, speed = 0.5 + Math.random() * 3.5;
    particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 25 + Math.random() * 25, maxLife: 50, color, size: 1.5 + Math.random() * 3.5 });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

class Enemy {
  constructor(x, y, type) {
    this.x = x; this.y = y; this.type = type; this.dead = false;
    this.shootTimer = Math.floor(Math.random() * 60);
    this.t = 0;
    
    this.tier = wave <= 10 ? 1 : wave <= 20 ? 2 : 3;

    switch (type) {
      case 'grunt':   
        this.hp = 1; this.maxHp = 1; this.w = 36; this.h = 36; this.points = 100; 
        this.canShoot = false;
        break;
      case 'shooter': 
        this.hp = 2 + (this.tier > 1 ? 1 : 0); this.maxHp = this.hp; this.w = 40; this.h = 40; this.points = 200; 
        this.canShoot = true;  
        break;
      case 'tank':    
        this.hp = 4 + (this.tier * 2); this.maxHp = this.hp; this.w = 48; this.h = 48; this.points = 500; 
        this.canShoot = true;  
        break;
    }

    this.setupTheme();
  }

  setupTheme() {
    if (this.tier === 1) {
      if (this.type === 'grunt')       { this.name = "BRIEF CONFUSO"; this.icon = "📄"; this.color = "#ff0055"; }
      else if (this.type === 'shooter'){ this.name = "FEEDBACK EXTRA"; this.icon = "💬"; this.color = "#ffaa00"; }
      else if (this.type === 'tank')   { this.name = "LOGO PIÙ GRANDE"; this.icon = "🔍"; this.color = "#aa00ff"; }
    } else if (this.tier === 2) {
      if (this.type === 'grunt')       { this.name = "SCADENZA IERI"; this.icon = "⏰"; this.color = "#00ffcc"; }
      else if (this.type === 'shooter'){ this.name = "RENDER CRASH"; this.icon = "💥"; this.color = "#ff3300"; }
      else if (this.type === 'tank')   { this.name = "FATTURA SCADUTA"; this.icon = "💸"; this.color = "#e60000"; }
    } else {
      if (this.type === 'grunt')       { this.name = "CALL ALLE 18"; this.icon = "📞"; this.color = "#ffff00"; }
      else if (this.type === 'shooter'){ this.name = "BUDGET ZERO"; this.icon = "💰"; this.color = "#ff00aa"; }
      else if (this.type === 'tank')   { this.name = "MICRO-MANAGEMENT"; this.icon = "👁️"; this.color = "#00ff00"; }
    }
  }

  update() {
    this.t++;
    const speed = 1 + wave * 0.1;
    if (this.type === 'grunt')       { this.y += speed;       this.x += Math.sin(this.t * 0.05) * 1.8; }
    else if (this.type === 'shooter') { this.y += speed * 0.65; this.x += Math.sin(this.t * 0.04 + this.x) * 2.2; }
    else if (this.type === 'tank')    { this.y += speed * 0.45; this.x += Math.cos(this.t * 0.03) * 1.5; }
    
    this.x = Math.max(this.w / 2, Math.min(W - this.w / 2, this.x));
    if (this.y > H + 50) this.dead = true;

    if (this.canShoot) {
      this.shootTimer--;
      if (this.shootTimer <= 0) {
        this.shootTimer = Math.max(30, 80 - wave * 2.5);
        const dx = player.x - this.x, dy = player.y - this.y;
        const dist = Math.hypot(dx, dy), spd = 3.5 + wave * 0.1;
        enemyBullets.push(new Bullet(this.x, this.y + this.h / 2, (dx/dist)*spd, (dy/dist)*spd, this.color, 6, 6));
      }
    }
  }

  hit() {
    this.hp--;
    spawnExplosion(this.x, this.y, '#ffff00', 5);
    if (this.hp <= 0) {
      this.dead = true; score += this.points;
      spawnExplosion(this.x, this.y, this.color, 18);
      sfxEnemyExplode();
      if (Math.random() < 0.24) spawnDrop(this.x, this.y);
    } else { sfxEnemyHit(); }
  }

  draw() {
    const x = this.x, y = this.y;
    ctx.save();
    
    const enemyImg = ASSETS[this.name];
    if (enemyImg && enemyImg.complete && enemyImg.naturalWidth !== 0) {
      ctx.drawImage(enemyImg, x - this.w / 2, y - this.h / 2, this.w, this.h);
    } else {
      ctx.font = `${this.w - 4}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.icon, x, y);
    }

    if (this.type === 'tank') {
      ctx.fillStyle = '#111'; ctx.fillRect(x - 18, y - this.h/2 - 4, 36, 4);
      ctx.fillStyle = this.color; ctx.fillRect(x - 18, y - this.h/2 - 4, 36 * (this.hp/this.maxHp), 4);
    }

    ctx.restore();
  }
}

// --- FIX 4 & 6: BOSS NON STRECCIATI (PROPORZIONE 1:1 SQUARE 110x110) E NOMI ACCATTIVANTI ---
class Boss {
  constructor(waveNum) {
    // Dimensioni quadrate per evitare distorsioni su PNG 256x256
    this.w = 110; 
    this.h = 110;
    this.x = W / 2; this.y = -100;
    this.targetY = 110;
    
    this.maxHp = 50 + waveNum * 5; 
    this.hp = this.maxHp;
    this.damageSinceLastDrop = 0;
    this.dropThreshold = Math.max(12, Math.floor(this.maxHp / 4));
    this.dead = false;
    this.timer = 0;
    this.attackCooldown = 65;
    
    this.bossIndex = ((Math.floor(waveNum / 10) - 1) % 5) + 1;
    
    if (this.bossIndex === 1) {
      this.name = "LOOP REVISIONI INFINITE 🔁";
      this.color = "#25D366";
    } else if (this.bossIndex === 2) {
      this.name = "IL CLIENTE IMPOSSIBILE 🤯";
      this.color = "#ff0055";
    } else if (this.bossIndex === 3) {
      this.name = "LE TASSE & F24 KILLER 💸";
      this.color = "#00ffcc";
    } else if (this.bossIndex === 4) {
      this.name = "CALL MARATONA DELLE 18:00 📞";
      this.color = "#ffaa00";
    } else {
      this.name = "SERVER CRASH 500 💥";
      this.color = "#e60000";
    }

    // Trigger dell'annuncio nome boss (senza mettere in pausa)
    bossBannerTimer = 180;
    bossBannerName = this.name;
  }

  update() {
    this.timer++;
    if (this.y < this.targetY) { this.y += 2; return; }
    
    this.x += Math.sin(this.timer * 0.03) * 2.8;
    
    if (--this.attackCooldown <= 0) {
      this.attackCooldown = Math.max(35, 75 - wave * 1.5);
      let pattern = Math.floor(Math.random() * 3);
      
      if (pattern === 0) {
        for (let a = -0.25; a <= 0.25; a += 0.25) {
          enemyBullets.push(new Bullet(this.x, this.y + 45, Math.sin(a) * 3.5, Math.cos(a) * 3.5, this.color, 8, 8));
        }
      } else if (pattern === 1) {
        for (let a = -0.4; a <= 0.4; a += 0.4) {
          enemyBullets.push(new Bullet(this.x, this.y + 45, Math.sin(a) * 4, Math.cos(a) * 4, '#ffaa00', 7, 7));
        }
      } else {
        let dx = player.x - this.x, dy = player.y - this.y, d = Math.hypot(dx, dy);
        enemyBullets.push(new Bullet(this.x, this.y + 45, (dx / d) * 4.5, (dy / d) * 4.5, '#ff00ff', 9, 9));
      }
    }
  }

  hit() {
    this.hp--;
    this.damageSinceLastDrop++;
    triggerShake(4, 3);

    if (this.damageSinceLastDrop >= this.dropThreshold) {
      this.damageSinceLastDrop = 0;
      spawnDrop(this.x + (Math.random() - 0.5) * 60, this.y + 20);
      sfxPowerUp();
    }

    if (this.hp <= 0) {
      this.dead = true;
      score += 3000 + wave * 300;
      spawnExplosion(this.x, this.y, this.color, 60);
      triggerShake(25, 12);
      sfxEnemyExplode();
      spawnDrop(this.x - 30, this.y);
      spawnDrop(this.x + 30, this.y);
      spawnDrop(this.x, this.y + 20);
    } else {
      spawnExplosion(this.x + (Math.random() - 0.5) * 60, this.y + (Math.random() - 0.5) * 40, '#ffff00', 4);
      sfxEnemyHit();
    }
  }

  draw() {
    let x = this.x, y = this.y;
    ctx.save();
    
    const bossImg = ASSETS[`BOSS_${this.bossIndex}`];
    if (bossImg && bossImg.complete && bossImg.naturalWidth !== 0) {
      // Disegna in rapporto 1:1 perfetto senza strecciare l'immagine
      ctx.drawImage(bossImg, x - this.w / 2, y - this.h / 2, this.w, this.h);
    } else {
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.roundRect(x - this.w / 2, y - this.h / 2, this.w, this.h, 12);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = '#000000';
      ctx.fillRect(x - 35, y - 15, 22, 16);
      ctx.fillRect(x + 13, y - 15, 22, 16);
      ctx.fillStyle = '#ff0000';
      ctx.fillRect(x - 28 + Math.sin(this.timer * 0.1) * 4, y - 11, 8, 8);
      ctx.fillRect(x + 20 + Math.sin(this.timer * 0.1) * 4, y - 11, 8, 8);

      ctx.fillStyle = (Math.floor(this.timer / 5) % 2 === 0) ? '#ffff00' : '#ff0055';
      ctx.fillRect(x - 15, y + 10, 30, 20);
    }

    // Barra HP del Boss
    ctx.fillStyle = 'rgba(10, 10, 30, 0.85)';
    ctx.fillRect(W / 2 - 120, 48, 240, 16);
    ctx.fillStyle = this.color;
    ctx.fillRect(W / 2 - 118, 50, (236) * Math.max(0, this.hp / this.maxHp), 12);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(W / 2 - 120, 48, 240, 16);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(this.name, W / 2, 43);
    ctx.restore();
  }
}

let enemies = [];
let activeBoss = null;
let spawnQueue = [];

function buildWave(w) {
  let newTier = w <= 10 ? 1 : w <= 20 ? 2 : 3;
  if (w === 1 || newTier !== currentTier) {
    currentTier = newTier;
    state = 'ERA_INTRO';
  }

  if (w % 10 === 0) {
    activeBoss = new Boss(w);
    triggerShake(20, 8);
    return [];
  }

  activeBoss = null;
  const queue = [];
  const rows = 2 + Math.min(w, 4);
  for (let row = 0; row < rows; row++) {
    const cols = 4 + (row % 2);
    for (let col = 0; col < cols; col++) {
      let type = 'grunt';
      if (w >= 2 && row === 0) type = 'shooter';
      if (w >= 3 && row === 0 && col === Math.floor(cols / 2)) type = 'tank';
      queue.push({ x: 60 + col * (W - 120) / (cols - 1), y: -40 - row * 60, type, delay: row * 18 + col * 4 });
    }
  }
  return queue;
}

function spawnWaveEnemies() {
  if (spawnQueue.length === 0 && enemies.length === 0 && (!activeBoss || activeBoss.dead)) {
    if (activeBoss && activeBoss.dead) activeBoss = null;
    wave++;
    spawnQueue = buildWave(wave);
  }
  for (let i = spawnQueue.length - 1; i >= 0; i--) {
    const e = spawnQueue[i]; e.delay--;
    if (e.delay <= 0) { enemies.push(new Enemy(e.x, e.y, e.type)); spawnQueue.splice(i, 1); }
  }
}

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return Math.abs(ax - bx) < (aw + bw) / 2 && Math.abs(ay - by) < (ah + bh) / 2;
}

function checkCollisions() {
  for (const b of playerBullets) {
    if (b.dead) continue;
    if (activeBoss && !activeBoss.dead && rectsOverlap(b.x, b.y, b.w, b.h, activeBoss.x, activeBoss.y, activeBoss.w, activeBoss.h)) {
      b.dead = true;
      activeBoss.hit();
      continue;
    }
    for (const e of enemies) {
      if (e.dead) continue;
      if (rectsOverlap(b.x, b.y, b.w, b.h, e.x, e.y, e.w, e.h)) { b.dead = true; e.hit(); break; }
    }
  }

  for (const d of drops) {
    if (d.dead) continue;
    if (rectsOverlap(player.x, player.y, player.w, player.h, d.x, d.y, d.w, d.h)) {
      d.dead = true;
      if (d.type === 'COFFEE') {
        lives = Math.min(5, lives + 1);
        sfxPowerUp();
      } else if (d.type === 'BOOST') {
        player.boostTimer = 300;
        sfxPowerUp();
      } else if (d.type === 'SHIELD') {
        player.shieldTimer = 300;
        sfxPowerUp();
      } else if (d.type === 'LAG') {
        player.lagTimer = 240;
        sfxDebuff();
      } else if (d.type === 'JAM') {
        player.jamTimer = 150;
        sfxDebuff();
      }
    }
  }

  if (player.alive && player.invTimer === 0) {
    for (const b of enemyBullets) {
      if (b.dead) continue;
      if (rectsOverlap(b.x, b.y, b.w, b.h, player.x, player.y, player.w - 10, player.h - 10)) { b.dead = true; hitPlayer(); }
    }
    for (const e of enemies) {
      if (e.dead) continue;
      if (rectsOverlap(player.x, player.y, player.w - 6, player.h - 6, e.x, e.y, e.w - 6, e.h - 6)) {
        e.dead = true; spawnExplosion(e.x, e.y, e.color, 20); hitPlayer();
      }
    }
    if (activeBoss && !activeBoss.dead && rectsOverlap(player.x, player.y, player.w - 6, player.h - 6, activeBoss.x, activeBoss.y, activeBoss.w - 10, activeBoss.h - 10)) {
      hitPlayer();
    }
  }
}

function hitPlayer() {
  lives--;
  spawnExplosion(player.x, player.y, currentBoss.primary, 25);
  sfxPlayerHit();
  if (lives <= 0) {
    player.alive = false; state = 'dead'; deathTimer = 100;
    updateMusicState();
  } else { player.invTimer = 120; }
}

function drawHUD() {
  ctx.fillStyle = currentBoss.primary; ctx.font = 'bold 14px Courier New';
  ctx.textAlign = 'left';   ctx.fillText(`${currentBoss.name}`, 10, 22);
  ctx.fillStyle = '#ffff00'; ctx.fillText(`PTS ${score}`, 10, 40);
  ctx.textAlign = 'center'; ctx.font = 'bold 15px Courier New'; ctx.fillText(`STAGE ${wave}`, W / 2, 24);
  ctx.textAlign = 'right';  ctx.font = 'bold 13px Courier New'; ctx.fillText(`REC ${hiScore}`, W - 10, 24);
  
  for (let i = 0; i < lives; i++) {
    ctx.fillStyle = currentBoss.primary;
    ctx.fillRect(W - 22 - (i * 20), 34, 14, 14);
  }

  // --- FIX 5: ANNOUNCER BOSS DINAMICO E NON-BLOCCANTE ---
  if (bossBannerTimer > 0) {
    bossBannerTimer--;
    ctx.save();
    ctx.fillStyle = 'rgba(255, 0, 85, 0.9)';
    ctx.fillRect(0, H / 2 - 45, W, 70);
    ctx.strokeStyle = '#ffea00';
    ctx.lineWidth = 3;
    ctx.strokeRect(0, H / 2 - 45, W, 70);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('⚠️ BOSS IN ARRIVO! ⚠️', W / 2, H / 2 - 20);

    ctx.fillStyle = '#ffea00';
    ctx.font = '900 18px Courier New';
    ctx.fillText(bossBannerName, W / 2, H / 2 + 12);
    ctx.restore();
  }
}

function drawEraLegend() {
  if (state !== 'ERA_INTRO') return;

  ctx.save();
  ctx.fillStyle = 'rgba(6, 2, 18, 0.88)';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#0e051b';
  ctx.beginPath();
  ctx.roundRect(16, 80, 448, 480, 16);
  ctx.fill();
  ctx.strokeStyle = '#ffea00';
  ctx.lineWidth = 3;
  ctx.stroke();

  let title = currentTier === 1 ? "ERA 1: BRIEF & FEEDBACK" : currentTier === 2 ? "ERA 2: RENDER & SCADENZE" : "ERA 3: CAOS CORPORATE";
  ctx.fillStyle = '#ffea00';
  ctx.font = '900 20px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(title, W / 2, 118);

  ctx.fillStyle = '#ff0055';
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillText("ATTENZIONE! NUOVI INCUBI RILEVATI:", W / 2, 145);

  const legendList = currentTier === 1 ? [
    { icon: "📄", name: "BRIEF CONFUSO", desc: "Base - Movimento rapido e incerto", col: "#ff0055" },
    { icon: "💬", name: "FEEDBACK EXTRA", desc: "Attaccante - Spara laser a raffica", col: "#ffaa00" },
    { icon: "🔍", name: "LOGO PIÙ GRANDE", desc: "Tank - Corazzato ad alta resistenza", col: "#aa00ff" }
  ] : currentTier === 2 ? [
    { icon: "⏰", name: "SCADENZA IERI", desc: "Base - Velocità di discesa aumentata", col: "#00ffcc" },
    { icon: "💥", name: "RENDER CRASH", desc: "Attaccante - Sparo diretto mirato", col: "#ff3300" },
    { icon: "💸", name: "FATTURA SCADUTA", desc: "Tank - Super barriera protettiva", col: "#e60000" }
  ] : [
    { icon: "📞", name: "CALL ALLE 18", desc: "Base - Traiettoria a zig-zag", col: "#ffff00" },
    { icon: "💰", name: "BUDGET ZERO", desc: "Attaccante - Sparo rapido incrociato", col: "#ff00aa" },
    { icon: "👁️", name: "MICRO-MANAGEMENT", desc: "Tank - Ultra hp & controllo zona", col: "#00ff00" }
  ];

  legendList.forEach((item, idx) => {
    let boxY = 170 + (idx * 110);

    ctx.fillStyle = '#160a2c';
    ctx.beginPath();
    ctx.roundRect(30, boxY, 420, 95, 12);
    ctx.fill();
    ctx.strokeStyle = item.col;
    ctx.lineWidth = 2.5;
    ctx.stroke();

    const enemyImg = ASSETS[item.name];
    if (enemyImg && enemyImg.complete && enemyImg.naturalWidth !== 0) {
      ctx.drawImage(enemyImg, 45, boxY + 22, 50, 50);
    } else {
      ctx.font = '36px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(item.icon, 70, boxY + 47);
    }

    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = item.col;
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.fillText(item.name, 110, boxY + 36);

    ctx.fillStyle = '#ffffff';
    ctx.font = '13px "Courier New", monospace';
    ctx.fillText(item.desc, 110, boxY + 64);
  });

  ctx.fillStyle = Math.floor(frame / 20) % 2 === 0 ? '#ffffff' : '#ffea00';
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('TOCCA SPARO PER INIZIARE ►', W / 2, 535);

  ctx.restore();
}

function drawScreens() {
  // --- FIX 1: COPERTINA A TUTTO FRAME CON TASTO LAMPEGGIANTE IN BASSO ---
  if (state === 'COVER') {
    if (imgCover && imgCover.complete && imgCover.naturalWidth !== 0) {
      // Prende tutto il canvas del gioco
      ctx.drawImage(imgCover, 0, 0, W, H);
    } else {
      ctx.fillStyle = '#060212'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ff0055';
      ctx.font = '900 32px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('FEEDBACK INVADERS', W / 2, 240);
      ctx.fillStyle = '#ffea00';
      ctx.font = 'bold 18px Courier New';
      ctx.fillText('AGENCY ARCADE', W / 2, 280);
    }

    // Tasto lampeggiante posizionato nella parte bassa dell'immagine
    if (Math.floor(frame / 20) % 2 === 0) {
      ctx.fillStyle = '#101228';
      ctx.beginPath();
      ctx.roundRect(W / 2 - 180, H - 90, 360, 54, 12);
      ctx.fill();
      ctx.strokeStyle = '#ffea00';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = '#ffea00';
      ctx.font = '900 16px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('PREMI SPARO PER COMINCIARE ►', W / 2, H - 56);
    }
    return;
  }

  // --- FIX 2: TUTORIAL CON TESTI MOLTO PIÙ GRANDI E LEGGIBILI ---
  if (state === 'TUTORIAL') {
    ctx.fillStyle = 'rgba(6, 6, 20, 0.98)'; ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#ff0055'; ctx.font = 'bold 24px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('AGENZIA VS INCUBI 🚀', W/2, 42);

    // BOX STORIA
    ctx.beginPath(); ctx.fillStyle = '#120a28'; ctx.roundRect(16, 58, 448, 120, 12); ctx.fill();
    ctx.strokeStyle = '#ffea00'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#ffea00'; ctx.font = 'bold 13px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('📖 LA STORIA DELLO STUDIO CREATIVO:', W/2, 80);
    ctx.fillStyle = '#ffffff'; ctx.font = '13px Courier New';
    ctx.fillText('Tre capi d\'agenzia. Un\'unica grande missione.', W/2, 102);
    ctx.fillText('Tra brief assurdi, scadenze ed indecisioni,', W/2, 122);
    ctx.fillText('il caotico mondo della creatività è sotto attacco!', W/2, 142);
    ctx.fillText('Pilota il tuo capo e salva lo studio dal caos.', W/2, 162);

    // BOX REGOLE
    ctx.beginPath(); ctx.fillStyle = '#101228'; ctx.roundRect(16, 192, 448, 140, 12); ctx.fill();
    ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#ff0055'; ctx.font = 'bold 15px Courier New'; ctx.textAlign = 'left';
    ctx.fillText('DISTRUGGI FEEDBACK & SCADENZE 🎯', 30, 216);
    ctx.fillStyle = '#ffffff'; ctx.font = '13px Courier New';
    ctx.fillText('• Elimina le ondate di nemici prima che scendano', 30, 240);
    ctx.fillText('• I nemici si evolvono e cambiano ogni 10 stadi', 30, 262);
    ctx.fillText('• Sconfiggi i Boss (Clienti e Tasse) ogni 10 stadi', 30, 284);
    ctx.fillText('• Raccogli Caffè ☕, Citronella ⚡ e Scudi 🛡️', 30, 306);

    // BOX CONTROLLI
    ctx.beginPath(); ctx.fillStyle = '#101228'; ctx.roundRect(16, 344, 448, 110, 12); ctx.fill();
    ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#ffd700'; ctx.font = 'bold 15px Courier New';
    ctx.fillText('CONTROLLI DI GIOCO 🎮', 30, 368);
    ctx.fillStyle = '#ffffff'; ctx.font = '13px Courier New';
    ctx.fillText('• Joystick Touch o Frecce PC per muoverti', 30, 392);
    ctx.fillText('• Tasto SPARO o SPAZIO per attaccare', 30, 414);
    ctx.fillText('• Tasto P o ESC per mettere in Pausa', 30, 436);

    ctx.fillStyle = '#ffff00'; ctx.font = 'bold 15px Courier New'; ctx.textAlign = 'center';
    ctx.fillText(`RECORD ATTUALE: ${hiScore} PTS`, W/2, 478);

    ctx.beginPath(); ctx.fillStyle = '#ff0055'; ctx.roundRect(30, 510, 420, 60, 12); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 18px Courier New';
    ctx.fillText('AVANTI: SCEGLI IL TUO CAPO ►', W/2, 546);
    return;
  }

  // --- SELEZIONE PERSONAGGI INGRANDITA ---
  if (state === 'CHAR_SELECT') {
    ctx.fillStyle = 'rgba(6, 6, 20, 0.98)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffff00'; ctx.font = 'bold 20px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('Scegli il tuo capo di agenzia', W/2, 42);

    const bosses = [
      { key: 'TOMMI', y: 65, col: '#ff0055' },
      { key: 'GIAMPA', y: 220, col: '#ffd700' },
      { key: 'BRETTO', y: 375, col: '#ff33aa' }
    ];

    bosses.forEach(b => {
      let c = CHARACTERS[b.key];
      ctx.beginPath(); ctx.fillStyle = '#101228'; ctx.roundRect(15, b.y, 450, 140, 12); ctx.fill();
      ctx.strokeStyle = b.col; ctx.lineWidth = 2.5; ctx.stroke();

      ctx.fillStyle = b.col; ctx.font = 'bold 24px Courier New'; ctx.textAlign = 'left';
      ctx.fillText(c.name, 30, b.y + 34);

      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 13px Courier New';
      ctx.fillText(c.role, 30, b.y + 58);

      ctx.fillStyle = '#ffff00'; ctx.font = 'bold 12px Courier New';
      ctx.fillText(c.perkBonus, 30, b.y + 82);
      ctx.fillStyle = '#ff0055'; ctx.font = 'bold 12px Courier New';
      ctx.fillText(c.perkMalus, 30, b.y + 102);

      ctx.fillStyle = b.col; ctx.font = 'bold 15px Courier New';
      ctx.fillText('GIOCA ►', 30, b.y + 126);

      if (c.portrait && c.portrait.complete && c.portrait.naturalWidth !== 0) {
        ctx.save();
        ctx.beginPath(); ctx.roundRect(330, b.y + 12, 120, 116, 10); ctx.clip();
        ctx.drawImage(c.portrait, 330, b.y + 12, 120, 116);
        ctx.restore();
        ctx.beginPath(); ctx.roundRect(330, b.y + 12, 120, 116, 10);
        ctx.strokeStyle = b.col; ctx.lineWidth = 1.5; ctx.stroke();
      } else {
        ctx.beginPath(); ctx.fillStyle = b.col;
        ctx.roundRect(330, b.y + 12, 120, 116, 10); ctx.fill();
      }
    });
    return;
  }

  if (state === 'PAUSE') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffea00'; ctx.font = 'bold 36px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('IN PAUSA', W/2, H/2 - 20);
    ctx.fillStyle = '#ff0055'; ctx.font = 'bold 16px Courier New';
    ctx.fillText('TOCCA IL GIOCO PER RIPRENDERE', W/2, H/2 + 25);
    return;
  }

  if (state === 'dead' || state === 'gameover') {
    ctx.fillStyle = 'rgba(0,0,0,0.88)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = currentBoss.primary; ctx.font = 'bold 38px Courier New'; ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/2 - 50);
    ctx.fillStyle = '#ffff00'; ctx.font = 'bold 22px Courier New'; ctx.fillText(`SCORE: ${score}`, W/2, H/2 + 10);
    ctx.fillStyle = '#ff0055'; ctx.font = '16px Courier New'; ctx.fillText(`RECORD: ${hiScore}`, W/2, H/2 + 45);
    ctx.fillStyle = Math.floor(frame/30)%2===0 ? '#fff' : currentBoss.primary;
    ctx.font = 'bold 16px Courier New'; ctx.fillText('TOCCA PER CAMBIARE / RIPROVARE', W/2, H/2 + 110);
  }
}

canvas.addEventListener('pointerdown', e => {
  getAC();
  let rect = canvas.getBoundingClientRect();
  let x = (e.clientX - rect.left) * (W / rect.width);
  let y = (e.clientY - rect.top) * (H / rect.height);

  if (state === 'COVER') {
    // Si avanza dal cover esclusivamente tramite tasto SPARO
    return;
  }

  if (state === 'TUTORIAL') {
    if (y >= 500) state = 'CHAR_SELECT';
    return;
  }

  if (state === 'CHAR_SELECT') {
    if (y >= 65 && y <= 205) selectBoss('TOMMI');
    else if (y >= 220 && y <= 360) selectBoss('GIAMPA');
    else if (y >= 375 && y <= 515) selectBoss('BRETTO');
    return;
  }

  if (state === 'ERA_INTRO') {
    state = 'playing';
    return;
  }

  if (state === 'playing') {
    state = 'PAUSE';
    updateMusicState();
    return;
  }

  if (state === 'PAUSE') {
    state = 'playing';
    updateMusicState();
    return;
  }

  if (state === 'gameover') {
    state = 'CHAR_SELECT';
    return;
  }
});

function startGame() {
  score = 0; lives = 3; wave = 1; currentTier = 1;
  enemies = []; activeBoss = null; playerBullets = []; enemyBullets = []; drops = [];
  particles.length = 0; spawnQueue = buildWave(1);
  player.reset();
  updateMusicState();
}

function update() {
  frame++;
  updateStars();

  if (shakeTime > 0) shakeTime--;

  if (state === 'COVER' || state === 'TUTORIAL' || state === 'CHAR_SELECT' || state === 'PAUSE' || state === 'ERA_INTRO') return;

  if (state === 'dead') {
    deathTimer--; updateParticles();
    if (deathTimer <= 0) {
      state = 'gameover';
      saveScore(score);
    }
    return;
  }

  if (state === 'gameover') return;

  player.update();
  spawnWaveEnemies();
  if (activeBoss) activeBoss.update();
  
  for (const b of playerBullets) b.update();
  for (const b of enemyBullets)  b.update();
  for (const e of enemies)       e.update();
  for (const d of drops)         d.update();

  playerBullets = playerBullets.filter(b => !b.dead);
  enemyBullets  = enemyBullets.filter(b => !b.dead);
  enemies       = enemies.filter(e => !e.dead);
  drops         = drops.filter(d => !d.dead);

  checkCollisions();
  updateParticles();
}

function draw() {
  ctx.save();
  if (shakeTime > 0) {
    let sx = (Math.random() - 0.5) * shakeMag;
    let sy = (Math.random() - 0.5) * shakeMag;
    ctx.translate(sx, sy);
  }

  ctx.fillStyle = '#060212'; ctx.fillRect(0, 0, W, H);
  drawStars();
  
  if (state === 'COVER' || state === 'TUTORIAL' || state === 'CHAR_SELECT') {
    drawScreens();
    ctx.restore();
    return;
  }

  for (const d of drops)         d.draw();
  for (const b of enemyBullets)  b.draw();
  for (const b of playerBullets) b.draw();
  for (const e of enemies)       e.draw();
  
  if (activeBoss) activeBoss.draw();

  player.draw();
  drawParticles();
  drawHUD();

  if (state === 'ERA_INTRO') drawEraLegend();
  if (state === 'PAUSE' || state === 'dead' || state === 'gameover') drawScreens();
  ctx.restore();
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
