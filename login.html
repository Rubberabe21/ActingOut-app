<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Login - Agency Arcade</title>
    <style>
        *, *:focus, *:active, button, input, div, a {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            -webkit-focus-ring-color: transparent !important;
            outline: none !important;
            touch-action: manipulation;
            font-family: 'Courier New', Courier, monospace;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030305 !important;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #login-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 360px;
            max-height: 740px;
            box-shadow: none !important;
            background: #060612 !important;
            border: none !important;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .auth-box {
            width: 100%;
            background: #090918;
            border: 2px solid #ff0055 !important;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4) !important;
            border-radius: 14px;
            padding: 24px;
            text-align: center;
            color: #fff;
        }
        .auth-box h2 {
            margin: 0 0 16px 0;
            color: #ffff00;
            font-size: 18px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px #ffff00;
        }
        .auth-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #04040a;
            border: 1px solid #ff0055 !important;
            color: #ffff00 !important;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            text-align: center;
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            background: #ff0055 !important;
            color: #fff !important;
            border: none !important;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.6) !important;
        }
        .auth-btn:active { transform: scale(0.96); }
        .btn-guest {
            background: #222233 !important;
            border: 1px solid #ff0055 !important;
            color: #ffffff !important;
            margin-top: 10px;
        }
        .auth-toggle {
            margin-top: 14px;
            font-size: 11px;
            color: #ff0055 !important;
            cursor: pointer;
            text-decoration: underline;
        }

        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 99;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 4px, 6px 100%;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

<div id="login-wrapper">
    <div class="auth-box">
        <h2 id="auth-title">LOGIN GIOCATORE</h2>
        <input type="text" id="auth-username" class="auth-input" placeholder="NOME UTENTE" maxlength="12">
        <input type="password" id="auth-password" class="auth-input" placeholder="PASSWORD">
        <button id="auth-submit-btn" class="auth-btn">ENTRA</button>
        <button id="auth-guest-btn" class="auth-btn btn-guest">GIOCA COME OSPITE</button>
        <div id="auth-toggle-btn" class="auth-toggle">Non hai un account? Registrati</div>
    </div>
    <div class="crt-overlay"></div>
</div>

<script>
class AuthManagerPage {
    constructor() {
        this.isRegisterMode = false;
        this.initUsers();
    }

    initUsers() {
        if (!localStorage.getItem('arcade_users')) {
            localStorage.setItem('arcade_users', JSON.stringify({}));
        }
    }

    getUsers() {
        return JSON.parse(localStorage.getItem('arcade_users')) || {};
    }

    saveUsers(users) {
        localStorage.setItem('arcade_users', JSON.stringify(users));
    }

    register(username, password) {
        let users = this.getUsers();
        if (users[username]) return { success: false, msg: "Nome utente esistente!" };
        users[username] = {
            password: password,
            stats: { gamesPlayed: 0, feedbackInvaders: 0, cyberRun: 0, pixelPunch: 0, neonBlast: 0 }
        };
        this.saveUsers(users);
        const currentUser = { username: username, stats: users[username].stats };
        localStorage.setItem('arcade_current_user', JSON.stringify(currentUser));
        return { success: true };
    }

    login(username, password) {
        let users = this.getUsers();
        if (!users[username] || users[username].password !== password) {
            return { success: false, msg: "Credenziali errate!" };
        }
        const currentUser = { username: username, stats: users[username].stats };
        localStorage.setItem('arcade_current_user', JSON.stringify(currentUser));
        return { success: true };
    }

    loginAsGuest() {
        const currentUser = {
            username: "GUEST_" + Math.floor(Math.random() * 900 + 100),
            stats: { gamesPlayed: 0, feedbackInvaders: 0, cyberRun: 0, pixelPunch: 0, neonBlast: 0 }
        };
        localStorage.setItem('arcade_current_user', JSON.stringify(currentUser));
    }
}

const authPage = new AuthManagerPage();

const authTitle = document.getElementById('auth-title');
const authUsername = document.getElementById('auth-username');
const authPassword = document.getElementById('auth-password');
const authSubmitBtn = document.getElementById('auth-submit-btn');
const authGuestBtn = document.getElementById('auth-guest-btn');
const authToggleBtn = document.getElementById('auth-toggle-btn');

authToggleBtn.addEventListener('click', () => {
    authPage.isRegisterMode = !authPage.isRegisterMode;
    authTitle.innerText = authPage.isRegisterMode ? "REGISTRAZIONE" : "LOGIN GIOCATORE";
    authSubmitBtn.innerText = authPage.isRegisterMode ? "REGISTRATI" : "ENTRA";
    authToggleBtn.innerText = authPage.isRegisterMode ? "Hai già un account? Accedi" : "Non hai un account? Registrati";
});

authSubmitBtn.addEventListener('click', () => {
    const user = authUsername.value.trim();
    const pass = authPassword.value.trim();

    if (!user || !pass) {
        alert("Inserisci Nome Utente e Password!");
        return;
    }

    let res = authPage.isRegisterMode ? authPage.register(user, pass) : authPage.login(user, pass);
    if (res.success) {
        window.location.href = 'index.html';
    } else {
        alert(res.msg);
    }
});

authGuestBtn.addEventListener('click', () => {
    authPage.loginAsGuest();
    window.location.href = 'index.html';
});
</script>
</body>
</html>
