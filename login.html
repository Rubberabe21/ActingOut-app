<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Login - Agency Arcade</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>

    <style>
        *, *:focus, *:active, button, input, select, div, a {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            -webkit-focus-ring-color: transparent !important;
            outline: none !important;
            touch-action: manipulation;
            font-family: 'Courier New', Courier, monospace;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030308 !important;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #login-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 400px;
            max-height: 760px;
            background: #060612 !important;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .auth-box {
            width: 100%;
            background: #0a0a1a;
            border: 3px solid #ff0055 !important;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.45) !important;
            border-radius: 16px;
            padding: 20px 16px;
            text-align: center;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 95vh;
            overflow-y: auto;
        }

        .auth-box h2 {
            margin: 0;
            color: #ffea00;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(255, 234, 0, 0.6);
            text-transform: uppercase;
        }

        .subtitle-text {
            color: #00ffff;
            font-size: 11px;
            font-weight: bold;
            margin-top: -4px;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }

        .field-label {
            font-size: 10px;
            font-weight: 900;
            color: #00ffff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .auth-input, .auth-select {
            width: 100%;
            padding: 10px 12px;
            background: #04040c;
            border: 2px solid #00ffff !important;
            color: #ffea00 !important;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 900;
            outline: none;
            text-align: center;
            letter-spacing: 0.5px;
            box-shadow: inset 0 0 8px rgba(0, 255, 255, 0.15);
        }

        .auth-select {
            text-align-last: center;
            cursor: pointer;
        }

        .auth-input::placeholder {
            color: #555577;
            font-weight: normal;
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            margin-top: 4px;
            background: linear-gradient(180deg, #ff0055 0%, #a3003b 100%) !important;
            color: #ffffff !important;
            border: 2px solid #ffffff !important;
            border-radius: 8px;
            font-weight: 900;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 0 14px rgba(255, 0, 85, 0.6) !important;
            letter-spacing: 1px;
        }

        .auth-btn:active {
            transform: scale(0.96);
        }

        .btn-guest {
            background: #121224 !important;
            border: 2px solid #00ffff !important;
            color: #00ffff !important;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3) !important;
            font-size: 12px;
            margin-top: 0;
        }

        .auth-toggle {
            font-size: 11px;
            font-weight: bold;
            color: #ff0055 !important;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 2px;
            transition: color 0.2s;
        }

        .auth-toggle:hover {
            color: #ffea00 !important;
        }

        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            background:
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.12) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.01), rgba(0, 255, 0, 0.005), rgba(0, 0, 255, 0.01));
            background-size: 100% 4px, 6px 100%;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.3);
            opacity: 0.5;
        }
    </style>
<script defer src="rotationLock.js"></script>
</head>

<body>

<div id="login-wrapper">

    <div class="auth-box">

        <h2 id="auth-title">LOGIN GIOCATORE</h2>

        <div class="subtitle-text" id="auth-subtitle">
            Inserisci le tue credenziali
        </div>

        <div class="field-group">
            <span class="field-label">NOME UTENTE</span>
            <input
                type="text"
                id="auth-username"
                class="auth-input"
                placeholder="ES. PLAYER1"
                maxlength="12"
                autocomplete="off"
            >
        </div>

        <div class="field-group">
            <span class="field-label">PASSWORD</span>
            <input
                type="password"
                id="auth-password"
                class="auth-input"
                placeholder="••••••••"
                maxlength="20"
                autocomplete="current-password"
            >
        </div>

        <div class="field-group" id="group-activity" style="display: none;">
            <span class="field-label">CHE FAI IN AGENZIA?</span>

            <select id="auth-activity" class="auth-select">
                <option value="Lavoro duramente">Lavoro duramente</option>
                <option value="Mangio continuamente snack">Mangio continuamente snack</option>
                <option value="Fingo di digitare sulla tastiera">Fingo di digitare sulla tastiera</option>
                <option value="Bevo il quinto caffè del giorno">Bevo il quinto caffè del giorno</option>
                <option value="Accumulo 80 schede aperte nel browser">Accumulo 80 schede aperte nel browser</option>
                <option value="Pianifico la conquista del mondo">Pianifico la conquista del mondo</option>
                <option value="Sguardo fisso al monitor per sembrare occupato">Sguardo fisso al monitor</option>
                <option value="Combatto contro uno strano bug">Combatto contro uno strano bug</option>
                <option value="Cerco di capire che lavoro sto facendo">Cerco di capire che lavoro faccio</option>
            </select>
        </div>

        <div class="field-group" id="group-role" style="display: none;">
            <span class="field-label">TU COSA SEI?</span>

            <select id="auth-role" class="auth-select">
                <option value="Un collega">Un collega</option>
                <option value="Un amico">Un amico</option>
                <option value="Un cliente">Un cliente</option>
                <option value="Un conoscente">Un conoscente</option>
                <option value="Uno che Conosce uno che lavora qui">Uno che conosce uno qui</option>
                <option value="Un corriere">Un corriere</option>
                <option value="Un infiltrato">Un infiltrato</option>
                <option value="Un investigatore privato">Un investigatore privato</option>
                <option value="Un alieno sotto copertura">Un alieno sotto copertura</option>
                <option value="Un'IA che ha preso un corpo umano">Un'IA con corpo umano</option>
            </select>
        </div>

        <button id="auth-submit-btn" class="auth-btn">
            ENTRA IN ARCADE ►
        </button>

        <button id="auth-guest-btn" class="auth-btn btn-guest">
            GIOCA COME OSPITE 👾
        </button>

        <div id="auth-toggle-btn" class="auth-toggle">
            Non hai un account? Registrati qui
        </div>

    </div>

    <div class="crt-overlay"></div>

</div>

<script>

const LOGIN_FUNCTION_URL =
    `${SUPABASE_URL}/functions/v1/login-account`;

const DEFAULT_STATS = {
    gamesPlayed: 0,
    feedbackInvaders: 0,
    cyberRun: 0,
    pixelPunch: 0,
    deadlineDrive: 0
};


class AuthManagerPage {

    constructor() {
        this.isRegisterMode = false;
        this.initUsers();
    }


    initUsers() {

        if (!localStorage.getItem("arcade_users")) {
            localStorage.setItem(
                "arcade_users",
                JSON.stringify({})
            );
        }

    }


    getUsers() {

        try {

            return JSON.parse(
                localStorage.getItem("arcade_users")
            ) || {};

        } catch (e) {

            return {};

        }

    }


    saveUsers(users) {

        localStorage.setItem(
            "arcade_users",
            JSON.stringify(users)
        );

    }


    async register(username, password, activity, role) {

        const randomAvatar =
            `assets/avatars/testa${Math.floor(Math.random() * 102) + 1}.png`;

        if (!supabaseClient) {
            return {
                success: false,
                msg: "Connessione a Supabase non disponibile!"
            };
        }

        try {
            const response = await fetch(
                `${SUPABASE_URL}/functions/v1/register-account`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "apikey": SUPABASE_ANON_KEY
                    },
                    body: JSON.stringify({
                        username,
                        password,
                        avatar: randomAvatar,
                        activity,
                        role
                    })
                }
            );

            const result = await response.json();

            if (!response.ok || !result.success || !result.session) {
                return {
                    success: false,
                    msg: result.error || "Registrazione non completata"
                };
            }

            const { error: sessionError } =
                await supabaseClient.auth.setSession({
                    access_token: result.session.access_token,
                    refresh_token: result.session.refresh_token
                });

            if (sessionError) throw sessionError;

            const currentUser = {
                username,
                avatar: randomAvatar,
                activity,
                role,
                stats: { ...DEFAULT_STATS }
            };

            localStorage.setItem(
                "arcade_current_user",
                JSON.stringify(currentUser)
            );

            return { success: true };
        } catch (e) {
            console.warn("Errore registrazione Supabase:", e);
            return {
                success: false,
                msg: "Errore durante la registrazione su Supabase"
            };
        }

    }


    async login(username, password) {

        /*
         * LOGIN SUPABASE
         *
         * Il login non interroga più direttamente
         * profiles.password.
         *
         * Ora passa dalla Edge Function:
         *
         * /functions/v1/login-account
         */

        if (supabaseClient) {

            try {

                const response = await fetch(
                    LOGIN_FUNCTION_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            "apikey": SUPABASE_ANON_KEY
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );


                const result = await response.json();


                if (response.ok && result.success && result.session) {

                    /*
                     * Salviamo la sessione Supabase nel client.
                     * In questo modo le successive query al database
                     * vengono eseguite come utente autenticato.
                     */

                    const {
                        error: sessionError
                    } = await supabaseClient.auth.setSession({

                        access_token:
                            result.session.access_token,

                        refresh_token:
                            result.session.refresh_token

                    });


                    if (sessionError) {

                        console.warn(
                            "Errore salvataggio sessione:",
                            sessionError
                        );

                    }


                    /*
                     * Recuperiamo il profilo vero dal database.
                     */

                    let profile = null;


                    const {
                        data: profileData,
                        error: profileError
                    } = await supabaseClient
                        .from("profiles")
                        .select(
                            "username, avatar, activity, role, stats"
                        )
                        .eq("user_id", result.user.id)
                        .maybeSingle();


                    if (!profileError && profileData) {

                        profile = profileData;

                    }


                    /*
                     * Se il profilo non viene trovato tramite user_id,
                     * proviamo tramite username.
                     */

                    if (!profile) {

                        const {
                            data: fallbackProfile
                        } = await supabaseClient
                            .from("profiles")
                            .select(
                                "username, avatar, activity, role, stats"
                            )
                            .eq("username", username)
                            .maybeSingle();


                        if (fallbackProfile) {

                            profile = fallbackProfile;

                        }

                    }


                    const loggedUser = {

                        username:
                            profile?.username ||
                            result.user.username ||
                            username,

                        avatar:
                            profile?.avatar ||
                            "assets/avatars/testa1.png",

                        activity:
                            profile?.activity ||
                            "",

                        role:
                            profile?.role ||
                            "",

                        stats:
                            profile?.stats ||
                            { ...DEFAULT_STATS }

                    };


                    localStorage.setItem(
                        "arcade_current_user",
                        JSON.stringify(loggedUser)
                    );


                    /*
                     * Login riuscito.
                     */

                    return {
                        success: true
                    };

                }


                /*
                 * La Edge Function ha rifiutato il login.
                 */

                if (response.status === 401) {

                    return {
                        success: false,
                        msg: "Credenziali errate o utente non trovato!"
                    };

                }


                if (response.status === 403) {

                    return {
                        success: false,
                        msg: "Account non ancora migrato."
                    };

                }


                if (result && result.error) {

                    return {
                        success: false,
                        msg: result.error
                    };

                }


            } catch (e) {

                console.warn(
                    "Errore login Edge Function:",
                    e
                );

            }

        }


        /*
         * FALLBACK LOCALE
         *
         * Rimane per eventuali utenti locali già presenti
         * nel browser.
         */

        let users = this.getUsers();


        if (
            users[username] &&
            users[username].password === password
        ) {

            const loggedUser = {

                username: username,

                avatar:
                    users[username].avatar ||
                    "assets/avatars/testa1.png",

                activity:
                    users[username].activity ||
                    "",

                role:
                    users[username].role ||
                    "",

                stats:
                    users[username].stats ||
                    { ...DEFAULT_STATS }

            };


            localStorage.setItem(
                "arcade_current_user",
                JSON.stringify(loggedUser)
            );


            return {
                success: true
            };

        }


        return {
            success: false,
            msg: "Credenziali errate o utente non trovato!"
        };

    }


    loginAsGuest() {

        const guestUser = {

            username:
                "GUEST_" +
                Math.floor(Math.random() * 9000 + 1000),

            avatar:
                "assets/avatars/testa1.png",

            activity:
                "In esplorazione arcade",

            role:
                "Ospite VIP",

            stats:
                { ...DEFAULT_STATS }

        };


        localStorage.setItem(
            "arcade_current_user",
            JSON.stringify(guestUser)
        );

    }

}


const authPage =
    new AuthManagerPage();


const authTitle =
    document.getElementById("auth-title");

const authSubtitle =
    document.getElementById("auth-subtitle");

const authUsername =
    document.getElementById("auth-username");

const authPassword =
    document.getElementById("auth-password");

const authActivity =
    document.getElementById("auth-activity");

const authRole =
    document.getElementById("auth-role");

const groupActivity =
    document.getElementById("group-activity");

const groupRole =
    document.getElementById("group-role");

const authSubmitBtn =
    document.getElementById("auth-submit-btn");

const authGuestBtn =
    document.getElementById("auth-guest-btn");

const authToggleBtn =
    document.getElementById("auth-toggle-btn");


authToggleBtn.addEventListener(
    "click",
    () => {

        authPage.isRegisterMode =
            !authPage.isRegisterMode;


        authTitle.innerText =
            authPage.isRegisterMode
                ? "REGISTRAZIONE"
                : "LOGIN GIOCATORE";


        authSubtitle.innerText =
            authPage.isRegisterMode
                ? "Crea un nuovo profilo Arcade"
                : "Inserisci le tue credenziali";


        authSubmitBtn.innerText =
            authPage.isRegisterMode
                ? "REGISTRATI ORA ►"
                : "ENTRA IN ARCADE ►";


        authToggleBtn.innerText =
            authPage.isRegisterMode
                ? "Hai già un account? Accedi qui"
                : "Non hai un account? Registrati qui";


        groupActivity.style.display =
            authPage.isRegisterMode
                ? "flex"
                : "none";


        groupRole.style.display =
            authPage.isRegisterMode
                ? "flex"
                : "none";

    }
);


authSubmitBtn.addEventListener(
    "click",
    async () => {

        const user =
            authUsername.value.trim();

        const pass =
            authPassword.value.trim();

        const activity =
            authActivity.value;

        const role =
            authRole.value;


        if (!user || !pass) {

            alert(
                "Inserisci Nome Utente e Password!"
            );

            return;

        }


        authSubmitBtn.disabled = true;

        authSubmitBtn.innerText =
            "CARICAMENTO...";


        let res;


        if (authPage.isRegisterMode) {

            res =
                await authPage.register(
                    user,
                    pass,
                    activity,
                    role
                );

        } else {

            res =
                await authPage.login(
                    user,
                    pass
                );

        }


        if (res.success) {

            window.location.href =
                "index.html";

        } else {

            alert(res.msg);

            authSubmitBtn.disabled =
                false;

            authSubmitBtn.innerText =
                authPage.isRegisterMode
                    ? "REGISTRATI ORA ►"
                    : "ENTRA IN ARCADE ►";

        }

    }
);


authGuestBtn.addEventListener(
    "click",
    () => {

        authPage.loginAsGuest();

        window.location.href =
            "index.html";

    }
);

</script>

</body>
</html>
