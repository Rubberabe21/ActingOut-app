<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cyber Run - Grid Bomber</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  font-family: 'Courier New', Courier, monospace;
}
body {
  background-color: #030305;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
}
#game-wrapper {
  position: relative;
  width: 100vw;
  height: 100vh;
  max-width: 380px;
  max-height: 820px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 8px;
  background: #080816;
  border: 2px solid rgba(0, 255, 204, 0.4);
  box-shadow: 0 0 35px rgba(0, 255, 204, 0.2);
  border-radius: 16px;
}
#canvas-container {
  position: relative;
  width: 100%;
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  overflow: hidden;
  min-height: 0;
}
canvas {
  width: 100%;
  height: auto;
  aspect-ratio: 338 / 434;
  object-fit: contain;
  border: 2px solid #00ffcc;
  box-shadow: inset 0 0 15px rgba(0, 255, 204, 0.2), 0 0 20px rgba(0, 255, 204, 0.15);
  border-radius: 10px;
  background: #04040c;
  cursor: pointer;
}

/* PLANCIA CONTROLLI CABINATO ARCADE ANNI '80 */
.control-deck {
  width: 100%;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 10px 8px;
  background: linear-gradient(180deg, #160a2c 0%, #080314 100%);
  border: 3px solid #ffea00;
  box-shadow: inset 0 0 15px rgba(255, 234, 0, 0.2), 0 0 20px rgba(255, 234, 0, 0.3);
  border-radius: 14px;
  margin-top: 6px;
}

/* JOYSTICK RETRO ANNI '80 */
.joystick-zone {
  position: relative;
  width: 120px;
  height: 120px;
  background: radial-gradient(circle, #2a1048 30%, #0c0418 90%);
  border: 3px solid #00ffcc;
  border-radius: 50%;
  box-shadow: inset 0 0 18px rgba(0, 255, 204, 0.5), 0 0 15px rgba(0, 255, 204, 0.4);
  touch-action: none;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
}
.joystick-knob {
  position: absolute;
  width: 52px;
  height: 52px;
  background: radial-gradient(circle at 35% 35%, #ff0055, #88002d);
  border: 3px solid #ffffff;
  border-radius: 50%;
  box-shadow: 0 4px 10px rgba(0,0,0,0.8), 0 0 15px #ff0055;
  pointer-events: none;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* TASTO BOMBA ARCADE XL */
.arcade-action-container {
  display: flex;
  justify-content: center;
  align-items: center;
}
.arcade-push-btn {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: #2b0012;
  border: 3px solid #ff0055;
  padding: 5px;
  box-shadow: 0 0 22px rgba(255, 0, 85, 0.45), inset 0 0 12px rgba(0, 0, 0, 0.9);
  cursor: pointer;
  outline: none;
}
.arcade-push-btn .btn-top {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ff3377, #cc0044 60%, #88002d 100%);
  border: 2px solid #ff77bb;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: #fff;
  font-weight: bold;
  font-size: 11px;
  letter-spacing: 0.5px;
  box-shadow: inset 0 4px 8px rgba(255,255,255,0.4), 0 5px 0 #55001b;
  text-shadow: 0 1px 2px #000;
}
.arcade-push-btn:active .btn-top {
  transform: translateY(4px);
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.6), 0 1px 0 #55001b;
}

.exit-btn {
  width: 100%;
  margin-top: 6px;
  padding: 10px;
  background: #1a1a2e;
  border: 1.5px solid #ff0055;
  color: #ff0055;
  font-weight: bold;
  font-size: 11px;
  border-radius: 8px;
  cursor: pointer;
  text-align: center;
}
.exit-btn:active { transform: scale(0.96); }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="canvas-container">
    <canvas id="game"></canvas>
  </div>

  <div class="control-deck">
    <!-- JOYSTICK VIRTUAL TOUCH ANNI '80 -->
    <div class="joystick-zone" id="joyZone">
      <div class="joystick-knob" id="joyKnob"></div>
    </div>

    <!-- TASTO BOMBA -->
    <div class="arcade-action-container">
      <button class="arcade-push-btn" id="btnBomb">
        <span class="btn-top">💣 BOMBA</span>
      </button>
    </div>
  </div>

  <button class="exit-btn" onclick="exitGame()">◄ TORNA ALL'HUB ARCADE</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const COLS = 13;
const ROWS = 15;
const CELL_SIZE = 26; 
const HUD_HEIGHT = 44;

const CANVAS_W = COLS * CELL_SIZE; // 338px
const CANVAS_H = ROWS * CELL_SIZE + HUD_HEIGHT; // 434px

canvas.width = CANVAS_W;
canvas.height = CANVAS_H;

function drawRoundRect(c, x, y, w, h, r) {
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// Assets Grafici Studio
const imgLaura = new Image(); imgLaura.src = 'assets/pacman/laura.png';
const imgGuido = new Image(); imgGuido.src = 'assets/pacman/guido.png';
const movLaura = new Image(); movLaura.src = 'assets/pacman/mov-laura.png';
const movGuido = new Image(); movGuido.src = 'assets/pacman/mov-guido.png';

// Formati di File Distruttibili
const FILE_BLOCK_TYPES = [
  { key: 'JPG', label: '.JPG', hp: 1, bg: '#1c2838', border: '#2a6090', textCol: '#88c0ff', pts: 20, dropChance: 0.18 },
  { key: 'PNG', label: '.PNG', hp: 1, bg: '#103028', border: '#108050', textCol: '#00ffaa', pts: 30, dropChance: 0.22 },
  { key: 'PSD', label: '.PSD', hp: 2, bg: '#141848', border: '#0055ff', textCol: '#3388ff', pts: 60, dropChance: 0.35 },
  { key: 'AI',  label: '.AI',  hp: 2, bg: '#381800', border: '#ff8800', textCol: '#ffaa00', pts: 80, dropChance: 0.40 },
  { key: 'PDF', label: '.PDF', hp: 3, bg: '#380008', border: '#ff0044', textCol: '#ff5577', pts: 120, dropChance: 0.55 }
];

// Trama & Temi di Livello
const LEVEL_THEMES = [
  { title: "STAGE 1: BOZZE .JPG & .PNG", msg: "Distruggi le bozze raster provvisorie!" },
  { title: "STAGE 2: PROGETTI .PSD & .AI", msg: "I file complessi richiedono 2 colpi!" },
  { title: "STAGE 3: EXPORT .PDF PESANTI", msg: "Attento ai PDF blindati: servono 3 esplosioni!" },
  { title: "STAGE 4: RUSH PRIMA DELLE 18:00", msg: "Caos di formati in studio! Consegna tutto!" }
];

const CHARACTERS = {
  LAURA: {
    id: 'LAURA',
    name: "LAURA",
    subtitle: "Laura, la grafica Senior",
    perkBonus: "BONUS: Render Master (2 Bombe & Raggio +1)",
    perkMalus: "MALUS: Precisione Senior (-5% Velocità)",
    primary: "#00ffcc",
    bg: "#040414",
    wallCol: "#00aaff",
    img: imgLaura,
    movImg: movLaura,
    speed: 2.1,
    baseBombs: 2,
    baseRange: 2,
    scoreMult: 1.0
  },
  GUIDO: {
    id: 'GUIDO',
    name: "GUIDO",
    subtitle: "Guido, il grafico Junior",
    perkBonus: "BONUS: Agilità Junior (+20% Velocità & +15% PTS)",
    perkMalus: "MALUS: Bozza Iniziale (1 Bomba & Raggio Base)",
    primary: "#ffd700",
    bg: "#140e00",
    wallCol: "#ffaa00",
    img: imgGuido,
    movImg: movGuido,
    speed: 2.6,
    baseBombs: 1,
    baseRange: 1,
    scoreMult: 1.15
  }
};

let currentTheme = CHARACTERS.LAURA;
let highScore = parseInt(localStorage.getItem('cyberRun_highScore')) || 0;

// AUDIO SINTETIZZATO RETRO (WEB AUDIO API)
let audioCtx = null;
function getAC() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playSound(type) {
  try {
    const ac = getAC();
    const t = ac.currentTime;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);

    if (type === 'bomb') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, t);
      osc.frequency.exponentialRampToValueAtTime(110, t + 0.12);
      gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      osc.start(t); osc.stop(t + 0.12);
    } else if (type === 'hit_block') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(200, t);
      osc.frequency.exponentialRampToValueAtTime(350, t + 0.08);
      gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      osc.start(t); osc.stop(t + 0.08);
    } else if (type === 'explode') {
      const dur = 0.28;
      const buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource(); src.buffer = buf;
      const filt = ac.createBiquadFilter(); filt.type = 'lowpass';
      filt.frequency.setValueAtTime(800, t); filt.frequency.exponentialRampToValueAtTime(60, t + dur);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(filt); filt.connect(g); g.connect(ac.destination);
      src.start(t);
    } else if (type === 'powerup') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523, t);
      osc.frequency.setValueAtTime(659, t + 0.08);
      osc.frequency.setValueAtTime(783, t + 0.16);
      gain.gain.setValueAtTime(0.18, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
      osc.start(t); osc.stop(t + 0.24);
    } else if (type === 'fail') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(240, t);
      osc.frequency.linearRampToValueAtTime(50, t + 0.35);
      gain.gain.setValueAtTime(0.25, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      osc.start(t); osc.stop(t + 0.35);
    }
  } catch(e) {}
}

let map = [];
let blockData = [];
let bombs = [];
let explosions = [];
let powerups = [];

let gameState = 'TUTORIAL';
let level = 1;
let score = 0;
let lives = 3;
let animTimer = 0;
let gameOverLockTimer = 0; // Protezione da tap accidentali su gameover

let player = {
  x: 1 * CELL_SIZE + CELL_SIZE / 2,
  y: 1 * CELL_SIZE + CELL_SIZE / 2,
  w: 12, h: 12,
  maxBombs: 1,
  bombRange: 1,
  speed: 2.1,
  isMoving: false,
  facingLeft: false,
  invTimer: 0
};

let enemies = [];
let moveUp = false, moveDown = false, moveLeft = false, moveRight = false;

// CONTROLLO JOYSTICK TOUCH (RIGIDEMENTE LIMITATO A 4 DIREZIONI CARDINALI)
const joyZone = document.getElementById('joyZone');
const joyKnob = document.getElementById('joyKnob');
let joyActive = false;

function handleJoyMove(clientX, clientY) {
  const rect = joyZone.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  let dx = clientX - centerX;
  let dy = clientY - centerY;

  const dist = Math.hypot(dx, dy);
  const maxRadius = rect.width / 2 - 10;

  if (dist > maxRadius) {
    dx = (dx / dist) * maxRadius;
    dy = (dy / dist) * maxRadius;
  }

  joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

  moveUp = false; moveDown = false; moveLeft = false; moveRight = false;

  const deadZone = 12;
  if (dist > deadZone) {
    // RIGIDA ESCLUSIONE DELLE DIAGONALI: Prende solo l'asse con lo spostamento maggiore
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) moveLeft = true;
      else moveRight = true;
    } else {
      if (dy < 0) moveUp = true;
      else moveDown = true;
    }
  }
}

function resetJoy() {
  joyActive = false;
  moveUp = false; moveDown = false; moveLeft = false; moveRight = false;
  joyKnob.style.transform = `translate(-50%, -50%)`;
}

joyZone.addEventListener('pointerdown', e => {
  joyActive = true;
  joyZone.setPointerCapture(e.pointerId);
  getAC();
  handleJoyMove(e.clientX, e.clientY);
});

joyZone.addEventListener('pointermove', e => {
  if (joyActive) handleJoyMove(e.clientX, e.clientY);
});

joyZone.addEventListener('pointerup', resetJoy);
joyZone.addEventListener('pointercancel', resetJoy);

function selectCharacter(charKey) {
  currentTheme = CHARACTERS[charKey];
  canvas.style.borderColor = currentTheme.primary;
  canvas.style.boxShadow = `inset 0 0 15px ${currentTheme.primary}`;
  initGame();
  gameState = 'PLAYING';
  playSound('powerup');
}

function initGame() {
  score = 0;
  lives = 3;
  level = 1;
  loadLevel();
}

function loadLevel() {
  player.maxBombs = currentTheme.baseBombs;
  player.bombRange = currentTheme.baseRange;
  player.speed = currentTheme.speed;
  player.x = 1 * CELL_SIZE + CELL_SIZE / 2;
  player.y = 1 * CELL_SIZE + CELL_SIZE / 2;
  player.invTimer = 60;
  player.isMoving = false;
  player.facingLeft = false;

  bombs = [];
  explosions = [];
  powerups = [];
  enemies = [];

  map = [];
  blockData = [];

  for (let r = 0; r < ROWS; r++) {
    map[r] = [];
    blockData[r] = [];
    for (let c = 0; c < COLS; c++) {
      if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1 || (r % 2 === 0 && c % 2 === 0)) {
        map[r][c] = 1;
        blockData[r][c] = null;
      } else if ((r <= 2 && c <= 2) || (r >= ROWS - 3 && c >= COLS - 3)) {
        map[r][c] = 0;
        blockData[r][c] = null;
      } else {
        if (Math.random() < (0.55 + Math.min(level * 0.03, 0.15))) {
          map[r][c] = 2;

          let pool = [];
          if (level === 1) pool = [FILE_BLOCK_TYPES[0], FILE_BLOCK_TYPES[1]];
          else if (level === 2) pool = [FILE_BLOCK_TYPES[0], FILE_BLOCK_TYPES[1], FILE_BLOCK_TYPES[2], FILE_BLOCK_TYPES[3]];
          else pool = FILE_BLOCK_TYPES;

          let selectedType = pool[Math.floor(Math.random() * pool.length)];
          blockData[r][c] = {
            ...selectedType,
            currentHp: selectedType.hp
          };
        } else {
          map[r][c] = 0;
          blockData[r][c] = null;
        }
      }
    }
  }

  let emptyCells = [];
  for (let r = 1; r < ROWS - 1; r++) {
    for (let c = 1; c < COLS - 1; c++) {
      if (map[r][c] === 0 && !(r <= 3 && c <= 3)) {
        emptyCells.push({ r, c });
      }
    }
  }

  let enemyColors = ['#ff0055', '#ff66cc', '#00ffff', '#ffaa00'];
  let enemyCount = 2 + Math.min(level, 5);

  for (let i = 0; i < enemyCount; i++) {
    let er, ec;
    if (emptyCells.length > 0) {
      let idx = Math.floor(Math.random() * emptyCells.length);
      er = emptyCells[idx].r;
      ec = emptyCells[idx].c;
      emptyCells.splice(idx, 1);
    } else {
      er = ROWS - 2;
      ec = COLS - 2;
      map[er][ec] = 0;
      blockData[er][ec] = null;
    }

    enemies.push({
      gx: ec, gy: er,
      x: ec * CELL_SIZE + CELL_SIZE / 2,
      y: er * CELL_SIZE + CELL_SIZE / 2,
      dirX: Math.random() < 0.5 ? 1 : -1,
      dirY: 0,
      color: enemyColors[i % enemyColors.length],
      speed: 1.1 + level * 0.15
    });
  }
}

function placeBomb() {
  if (gameState !== 'PLAYING') return;

  let gx = Math.floor(player.x / CELL_SIZE);
  let gy = Math.floor(player.y / CELL_SIZE);

  if (gx < 0 || gx >= COLS || gy < 0 || gy >= ROWS) return;

  let currentActiveBombs = bombs.filter(b => b && !b.exploded).length;
  if (currentActiveBombs >= player.maxBombs) return;

  let alreadyHasBomb = bombs.some(b => b && b.gx === gx && b.gy === gy && !b.exploded);
  if (alreadyHasBomb) return;

  bombs.push({
    id: Date.now() + Math.random(),
    gx, gy,
    timer: 130,
    range: player.bombRange,
    exploded: false,
    ownerInside: true
  });

  playSound('bomb');
}

// INNESCO SICURO ESPLOSIONI A CATENA (NESSUNA RICORSIONE INFINITA O CRASH)
function triggerExplosion(b) {
  if (!b || b.exploded) return;
  b.exploded = true;
  playSound('explode');

  let fireCells = [{ gx: b.gx, gy: b.gy }];
  let dirs = [{ x: 0, y: -1 }, { x: 0, y: 1 }, { x: -1, y: 0 }, { x: 1, y: 0 }];

  dirs.forEach(d => {
    for (let step = 1; step <= b.range; step++) {
      let cgx = b.gx + d.x * step;
      let cgy = b.gy + d.y * step;

      if (cgx < 0 || cgx >= COLS || cgy < 0 || cgy >= ROWS) break;
      if (map[cgy][cgx] === 1) break;

      fireCells.push({ gx: cgx, gy: cgy });

      let otherBomb = bombs.find(ob => ob && !ob.exploded && ob.gx === cgx && ob.gy === cgy);
      if (otherBomb) {
        triggerExplosion(otherBomb);
      }

      if (map[cgy][cgx] === 2) {
        let blk = blockData[cgy][cgx];
        if (blk) {
          blk.currentHp--;
          if (blk.currentHp <= 0) {
            map[cgy][cgx] = 0;
            blockData[cgy][cgx] = null;
            score += Math.floor(blk.pts * currentTheme.scoreMult);

            if (Math.random() < blk.dropChance) {
              let types = ['BOMB_UP', 'FIRE_UP', 'SPEED_UP', 'COFFEE'];
              powerups.push({
                gx: cgx, gy: cgy,
                type: types[Math.floor(Math.random() * types.length)]
              });
            }
          } else {
            playSound('hit_block');
          }
        }
        break;
      }
    }
  });

  explosions.push({ cells: fireCells, timer: 20 });
}

function overlapsTile(px, py, pw, ph, gx, gy) {
  let pLeft = px - pw / 2;
  let pRight = px + pw / 2;
  let pTop = py - ph / 2;
  let pBottom = py + ph / 2;

  let tLeft = gx * CELL_SIZE;
  let tRight = (gx + 1) * CELL_SIZE;
  let tTop = gy * CELL_SIZE;
  let tBottom = (gy + 1) * CELL_SIZE;

  return (pLeft < tRight && pRight > tLeft && pTop < tBottom && pBottom > tTop);
}

function updateBombPassability() {
  bombs.forEach(b => {
    if (b && b.ownerInside && !b.exploded) {
      if (!overlapsTile(player.x, player.y, player.w, player.h, b.gx, b.gy)) {
        b.ownerInside = false;
      }
    }
  });
}

function isBlocked(nx, ny) {
  let eps = 0.5;
  let left = nx - player.w / 2 + eps;
  let right = nx + player.w / 2 - eps;
  let top = ny - player.h / 2 + eps;
  let bottom = ny + player.h / 2 - eps;

  let c1 = Math.floor(left / CELL_SIZE);
  let c2 = Math.floor(right / CELL_SIZE);
  let r1 = Math.floor(top / CELL_SIZE);
  let r2 = Math.floor(bottom / CELL_SIZE);

  for (let r = r1; r <= r2; r++) {
    for (let c = c1; c <= c2; c++) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return true;
      if (map[r][c] !== 0) return true;

      let hasSolidBomb = bombs.some(b => b && !b.exploded && b.gx === c && b.gy === r && !b.ownerInside);
      if (hasSolidBomb) return true;
    }
  }
  return false;
}

// MOVIMENTO BOMBERMAN COMPLETO: GUIDA RIGIDA AL CENTRO DELLA CORSIA
function updatePlayer() {
  let dx = 0, dy = 0;

  let wantLeft = keyPressed('ArrowLeft') || keyPressed('KeyA') || moveLeft;
  let wantRight = keyPressed('ArrowRight') || keyPressed('KeyD') || moveRight;
  let wantUp = keyPressed('ArrowUp') || keyPressed('KeyW') || moveUp;
  let wantDown = keyPressed('ArrowDown') || keyPressed('KeyS') || moveDown;

  if (wantLeft) { dx = -player.speed; player.facingLeft = true; }
  else if (wantRight) { dx = player.speed; player.facingLeft = false; }
  else if (wantUp) { dy = -player.speed; }
  else if (wantDown) { dy = player.speed; }

  player.isMoving = (dx !== 0 || dy !== 0);
  if (player.isMoving) animTimer++;

  // Movimento orizzontale: blocco perfetto dell'asse Y al centro riga
  if (dx !== 0) {
    let centerY = (Math.floor(player.y / CELL_SIZE) + 0.5) * CELL_SIZE;
    let diffY = centerY - player.y;
    if (Math.abs(diffY) > 0.1) {
      player.y += Math.sign(diffY) * Math.min(Math.abs(diffY), player.speed);
    } else {
      player.y = centerY;
    }

    if (!isBlocked(player.x + dx, player.y)) {
      player.x += dx;
    }
  } 
  // Movimento verticale: blocco perfetto dell'asse X al centro colonna
  else if (dy !== 0) {
    let centerX = (Math.floor(player.x / CELL_SIZE) + 0.5) * CELL_SIZE;
    let diffX = centerX - player.x;
    if (Math.abs(diffX) > 0.1) {
      player.x += Math.sign(diffX) * Math.min(Math.abs(diffX), player.speed);
    } else {
      player.x = centerX;
    }

    if (!isBlocked(player.x, player.y + dy)) {
      player.y += dy;
    }
  }

  updateBombPassability();

  if (player.invTimer > 0) player.invTimer--;

  let pGx = Math.floor(player.x / CELL_SIZE);
  let pGy = Math.floor(player.y / CELL_SIZE);

  for (let i = powerups.length - 1; i >= 0; i--) {
    let pw = powerups[i];
    if (pw && pw.gx === pGx && pw.gy === pGy) {
      playSound('powerup');
      if (pw.type === 'BOMB_UP') player.maxBombs++;
      else if (pw.type === 'FIRE_UP') player.bombRange++;
      else if (pw.type === 'SPEED_UP') player.speed += 0.35;
      else if (pw.type === 'COFFEE') score += Math.floor(300 * currentTheme.scoreMult);

      powerups.splice(i, 1);
    }
  }
}

function updateEnemies() {
  enemies.forEach(e => {
    let targetX = (e.gx + 0.5) * CELL_SIZE;
    let targetY = (e.gy + 0.5) * CELL_SIZE;
    let dist = Math.hypot(targetX - e.x, targetY - e.y);

    if (dist <= e.speed) {
      e.x = targetX;
      e.y = targetY;

      let dirs = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
      let valid = dirs.filter(d => {
        let ngx = e.gx + d.x;
        let ngy = e.gy + d.y;
        if (ngx < 0 || ngx >= COLS || ngy < 0 || ngy >= ROWS) return false;
        if (map[ngy][ngx] !== 0) return false;
        
        let hasActiveBomb = bombs.some(b => b && !b.exploded && b.gx === ngx && b.gy === ngy);
        if (hasActiveBomb) return false;
        
        return true;
      });

      let forwardValid = valid.filter(d => !(d.x === -e.dirX && d.y === -e.dirY));

      let chosenDir;
      if (forwardValid.length > 0) {
        chosenDir = forwardValid[Math.floor(Math.random() * forwardValid.length)];
      } else if (valid.length > 0) {
        chosenDir = valid[Math.floor(Math.random() * valid.length)];
      } else {
        chosenDir = { x: 0, y: 0 };
      }

      e.dirX = chosenDir.x;
      e.dirY = chosenDir.y;
      e.gx += e.dirX;
      e.gy += e.dirY;
    } else {
      e.x += e.dirX * e.speed;
      e.y += e.dirY * e.speed;
    }

    if (player.invTimer <= 0) {
      let pDist = Math.hypot(player.x - e.x, player.y - e.y);
      if (pDist < 12) {
        hitPlayer();
      }
    }
  });
}

function updateBombsAndExplosions() {
  for (let i = 0; i < bombs.length; i++) {
    let b = bombs[i];
    if (b && !b.exploded) {
      b.timer--;
      if (b.timer <= 0) {
        triggerExplosion(b);
      }
    }
  }

  bombs = bombs.filter(b => b && !b.exploded);

  for (let i = explosions.length - 1; i >= 0; i--) {
    let ex = explosions[i];
    if (!ex) continue;
    ex.timer--;

    ex.cells.forEach(cell => {
      for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
        let e = enemies[eIdx];
        if (!e) continue;
        let egx = Math.floor(e.x / CELL_SIZE);
        let egy = Math.floor(e.y / CELL_SIZE);
        
        if (egx === cell.gx && egy === cell.gy) {
          score += Math.floor(200 * currentTheme.scoreMult);
          enemies.splice(eIdx, 1);
        }
      }

      if (player.invTimer <= 0) {
        let pgx = Math.floor(player.x / CELL_SIZE);
        let pgy = Math.floor(player.y / CELL_SIZE);
        if (pgx === cell.gx && pgy === cell.gy) {
          hitPlayer();
        }
      }
    });

    if (ex.timer <= 0) explosions.splice(i, 1);
  }

  if (enemies.length === 0 && gameState === 'PLAYING') {
    score += Math.floor(1000 * level * currentTheme.scoreMult);
    level++;
    gameState = 'LEVEL_CLEAR';
    playSound('powerup');
    setTimeout(() => {
      if (gameState === 'LEVEL_CLEAR') {
        loadLevel();
        gameState = 'PLAYING';
      }
    }, 2000);
  }
}

// PROTEZIONE RIGIDA CONTRO DANNO RIGENERATO O MULTIPLI SULLO STESSO FRAME
function hitPlayer() {
  if (player.invTimer > 0) return; // Se già immune, ignora altri danni sullo stesso frame

  lives--;
  playSound('fail');
  if (lives <= 0) {
    gameState = 'GAME_OVER';
    gameOverLockTimer = 60; // 60 frame di blocco totale per evitare salto menu accidentale
    saveScore();
  } else {
    player.x = 1 * CELL_SIZE + CELL_SIZE / 2;
    player.y = 1 * CELL_SIZE + CELL_SIZE / 2;
    player.invTimer = 90; // 1.5 secondi di invulnerabilità
  }
}

function drawGameWorld() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      let x = c * CELL_SIZE;
      let y = r * CELL_SIZE + HUD_HEIGHT;
      ctx.strokeStyle = '#0d0d22';
      ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);
    }
  }

  let renderList = [];

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (map[r][c] !== 0) {
        renderList.push({
          type: 'block',
          r: r, c: c,
          sortY: (r + 1) * CELL_SIZE + HUD_HEIGHT
        });
      }
    }
  }

  powerups.forEach(pw => {
    renderList.push({
      type: 'powerup',
      pw: pw,
      sortY: (pw.gy + 0.5) * CELL_SIZE + HUD_HEIGHT
    });
  });

  bombs.forEach(b => {
    if (b && !b.exploded) {
      renderList.push({
        type: 'bomb',
        b: b,
        sortY: (b.gy + 0.5) * CELL_SIZE + HUD_HEIGHT
      });
    }
  });

  explosions.forEach(ex => {
    ex.cells.forEach(cell => {
      renderList.push({
        type: 'explosion',
        cell: cell,
        sortY: (cell.gy + 0.5) * CELL_SIZE + HUD_HEIGHT
      });
    });
  });

  enemies.forEach(e => {
    renderList.push({
      type: 'enemy',
      e: e,
      sortY: e.y + HUD_HEIGHT + 6
    });
  });

  renderList.push({
    type: 'player',
    sortY: player.y + HUD_HEIGHT + player.h / 2
  });

  renderList.sort((a, b) => a.sortY - b.sortY);

  renderList.forEach(item => {
    if (item.type === 'block') drawSingleBlock(item.r, item.c);
    else if (item.type === 'powerup') drawSinglePowerup(item.pw);
    else if (item.type === 'bomb') drawSingleBomb(item.b);
    else if (item.type === 'explosion') drawSingleExplosionCell(item.cell);
    else if (item.type === 'enemy') drawSingleEnemy(item.e);
    else if (item.type === 'player') drawSinglePlayer();
  });
}

function drawSingleBlock(r, c) {
  let x = c * CELL_SIZE;
  let y = r * CELL_SIZE + HUD_HEIGHT;

  if (map[r][c] === 1) {
    ctx.fillStyle = '#080820';
    ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
    ctx.strokeStyle = currentTheme.wallCol;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2);
    
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.fillRect(x + 2, y + 2, CELL_SIZE - 4, 3);
  } else if (map[r][c] === 2) {
    let blk = blockData[r][c];
    if (blk) {
      ctx.fillStyle = blk.bg;
      ctx.fillRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2);
      ctx.strokeStyle = blk.border;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x + 1.5, y + 1.5, CELL_SIZE - 3, CELL_SIZE - 3);
      
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.fillRect(x + 2, y + 2, CELL_SIZE - 4, 3);
      
      ctx.fillStyle = blk.textCol;
      ctx.font = 'bold 9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(blk.label, x + CELL_SIZE / 2, y + CELL_SIZE / 2 - (blk.hp > 1 ? 1 : -3));

      if (blk.hp > 1) {
        let barW = CELL_SIZE - 6;
        let barH = 3;
        let barX = x + 3;
        let barY = y + CELL_SIZE - 5;

        ctx.fillStyle = '#080814';
        ctx.fillRect(barX, barY, barW, barH);

        let fillW = barW * (blk.currentHp / blk.hp);
        ctx.fillStyle = blk.currentHp === blk.hp ? '#00ffcc' : (blk.currentHp > 1 ? '#ffcc00' : '#ff0055');
        ctx.fillRect(barX, barY, fillW, barH);

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(barX, barY, barW, barH);
      }
    }
  }
}

function drawSinglePowerup(pw) {
  let px = pw.gx * CELL_SIZE + CELL_SIZE / 2;
  let py = pw.gy * CELL_SIZE + HUD_HEIGHT + CELL_SIZE / 2;

  ctx.fillStyle = '#ffcc00';
  ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
  let icon = '⚡';
  if (pw.type === 'BOMB_UP') icon = '💣';
  else if (pw.type === 'FIRE_UP') icon = '🔥';
  else if (pw.type === 'SPEED_UP') icon = '👟';
  else if (pw.type === 'COFFEE') icon = '☕';

  ctx.fillText(icon, px, py + 4);
}

function drawSingleBomb(b) {
  let bx = b.gx * CELL_SIZE + CELL_SIZE / 2;
  let by = b.gy * CELL_SIZE + HUD_HEIGHT + CELL_SIZE / 2;
  let pulse = Math.sin(Date.now() / 70) * 1.5;

  ctx.save();
  ctx.beginPath();
  ctx.arc(bx, by, 9 + pulse, 0, Math.PI * 2);
  ctx.fillStyle = '#ff0055';
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.font = `${16 + pulse}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = '#ffff00';
  ctx.shadowBlur = 8;
  ctx.fillText('💣', bx, by + 1);
  ctx.restore();
}

function drawSingleExplosionCell(cell) {
  let fx = cell.gx * CELL_SIZE;
  let fy = cell.gy * CELL_SIZE + HUD_HEIGHT;

  ctx.fillStyle = 'rgba(255, 0, 85, 0.85)';
  ctx.fillRect(fx + 2, fy + 2, CELL_SIZE - 4, CELL_SIZE - 4);

  ctx.fillRect(fx + 5, fy + 5, CELL_SIZE - 10, CELL_SIZE - 10);
}

function drawSinglePlayer() {
  let py = player.y + HUD_HEIGHT;
  if (player.invTimer > 0 && Math.floor(player.invTimer / 4) % 2 === 0) return;

  ctx.save();
  if (player.facingLeft) {
    ctx.translate(player.x, py);
    ctx.scale(-1, 1);
    ctx.translate(-player.x, -py);
  }

  let img = currentTheme.movImg;
  if (img && img.complete && img.naturalWidth !== 0) {
    let frameCount = 5;
    let frameW = img.naturalWidth / frameCount;
    let frameH = img.naturalHeight;
    let currentFrame = player.isMoving ? (Math.floor(animTimer / 5) % frameCount) : 0;

    let drawW = 30;
    let drawH = 30;

    ctx.drawImage(
      img,
      currentFrame * frameW, 0, frameW, frameH,
      player.x - drawW / 2, py - drawH / 2 - 2, drawW, drawH
    );
  } else {
    ctx.fillStyle = currentTheme.primary;
    ctx.beginPath();
    ctx.arc(player.x, py, 12, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawSingleEnemy(e) {
  let ex = e.x;
  let ey = e.y + HUD_HEIGHT;
  let r = 11;

  ctx.save();
  ctx.beginPath();
  ctx.fillStyle = e.color;

  ctx.arc(ex, ey - 2, r, Math.PI, 0, false);
  ctx.lineTo(ex + r, ey + r);
  ctx.lineTo(ex + r / 2, ey + r - 3);
  ctx.lineTo(ex, ey + r);
  ctx.lineTo(ex - r / 2, ey + r - 3);
  ctx.lineTo(ex - r, ey + r);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.fillStyle = '#ffffff';
  ctx.arc(ex - 3.5, ey - 3, 2.5, 0, Math.PI * 2);
  ctx.arc(ex + 3.5, ey - 3, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.fillStyle = '#000000';
  ctx.arc(ex - 3.5 + e.dirX * 1.2, ey - 3 + e.dirY * 1.2, 1.2, 0, Math.PI * 2);
  ctx.arc(ex + 3.5 + e.dirX * 1.2, ey - 3 + e.dirY * 1.2, 1.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function gameLoop() {
  try {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameOverLockTimer > 0) gameOverLockTimer--;

    if (gameState === 'TUTORIAL') {
      drawTutorial();
    } else if (gameState === 'CHAR_SELECT') {
      drawCharSelect();
    } else if (gameState === 'PLAYING') {
      updatePlayer();
      updateEnemies();
      updateBombsAndExplosions();
      drawGameWorld();
      drawHUD();
    } else if (gameState === 'LEVEL_CLEAR') {
      drawGameWorld();
      drawLevelClear();
      drawHUD();
    } else if (gameState === 'GAME_OVER') {
      drawGameWorld();
      drawGameOver();
    }
  } catch (err) {
    console.error("Game Loop Error:", err);
  }

  requestAnimationFrame(gameLoop);
}

canvas.addEventListener('pointerdown', (e) => {
  getAC();
  let rect = canvas.getBoundingClientRect();
  let x = (e.clientX - rect.left) * (canvas.width / rect.width);
  let y = (e.clientY - rect.top) * (canvas.height / rect.height);

  if (gameState === 'TUTORIAL') {
    if (y >= 330) {
      gameState = 'CHAR_SELECT';
      playSound('powerup');
    }
    return;
  }

  if (gameState === 'CHAR_SELECT') {
    if (y >= 44 && y <= 204) selectCharacter('LAURA');
    else if (y >= 216 && y <= 376) selectCharacter('GUIDO');
    return;
  }

  if (gameState === 'GAME_OVER') {
    if (gameOverLockTimer <= 0) {
      gameState = 'CHAR_SELECT';
    }
    return;
  }
});

// TASTO BOMBA
function bindBombBtn(id) {
  let btn = document.getElementById(id);
  if (!btn) return;
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    getAC();
    if (gameState === 'TUTORIAL') {
      gameState = 'CHAR_SELECT';
    } else if (gameState === 'GAME_OVER') {
      if (gameOverLockTimer <= 0) gameState = 'CHAR_SELECT';
    } else if (gameState === 'PLAYING') {
      placeBomb();
    }
  });
}
bindBombBtn('btnBomb');

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  getAC();
  if (gameState === 'TUTORIAL') {
    if (e.code === 'Space' || e.code === 'Enter') gameState = 'CHAR_SELECT';
    return;
  }
  if (gameState === 'CHAR_SELECT') {
    if (e.key === '1') selectCharacter('LAURA');
    if (e.key === '2') selectCharacter('GUIDO');
    return;
  }
  if (gameState === 'GAME_OVER') {
    if (gameOverLockTimer <= 0 && (e.code === 'Space' || e.code === 'Enter')) {
      gameState = 'CHAR_SELECT';
    }
    return;
  }

  if (e.code === 'Space' || e.code === 'KeyZ' || e.code === 'Enter') placeBomb();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function keyPressed(code) { return !!keys[code]; }

function saveScore() {
  try {
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('cyberRun_highScore', highScore.toString());
    }

    if (score <= 0) return;
    let rawUser = localStorage.getItem('arcade_current_user');
    if (!rawUser) return;
    let curUser = JSON.parse(rawUser);
    if (curUser && curUser.stats) {
      curUser.stats.gamesPlayed = (curUser.stats.gamesPlayed || 0) + 1;
      curUser.stats.cyberRun = (curUser.stats.cyberRun || 0) + score;
      localStorage.setItem('arcade_current_user', JSON.stringify(curUser));

      if (curUser.username && !curUser.username.startsWith("GUEST_")) {
        let rawUsers = localStorage.getItem('arcade_users');
        let users = rawUsers ? JSON.parse(rawUsers) : {};
        if (users[curUser.username]) {
          users[curUser.username].stats = curUser.stats;
          localStorage.setItem('arcade_users', JSON.stringify(users));
        }
      }
    }
  } catch (e) {
    console.warn("Save score error:", e);
  }
}

function exitGame() {
  saveScore();
  window.location.href = 'index.html';
}

gameLoop();
</script>
