<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cyber Run - Grid Bomber</title>
<style>
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none !important;
    font-family: 'Courier New', Courier, monospace;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #030305;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #game-wrapper {
    position: relative;
    width: 100vw;
    height: 100dvh;
    max-width: 440px;
    max-height: 860px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: max(env(safe-area-inset-top), 6px) 8px max(env(safe-area-inset-bottom), 6px) 8px;
    background: #0e051b;
    border: 3px solid #ff007f;
    box-shadow: 0 0 25px #ff007f, inset 0 0 20px #00f0ff;
    border-radius: 16px;
  }

  /* TOP BAR CON TASTO OPZIONI */
  .top-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 4px;
    margin-bottom: 2px;
    flex-shrink: 0;
  }
  .header-title {
    color: #00f0ff;
    font-size: 11px;
    font-weight: bold;
    text-shadow: 0 0 6px #00f0ff;
    letter-spacing: 1px;
  }
  .opt-btn {
    background: #1a0836;
    border: 1.5px solid #ffea00;
    color: #ffea00;
    padding: 3px 6px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(255, 234, 0, 0.4);
  }
  .opt-btn:active { transform: scale(0.92); }

  #canvas-container {
    position: relative;
    width: 100%;
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    min-height: 0;
  }
  canvas {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    aspect-ratio: 338 / 434;
    border: 3px solid #00f0ff;
    box-shadow: 0 0 15px #00f0ff;
    image-rendering: pixelated;
    background: #060212;
    cursor: pointer;
    border-radius: 8px;
  }

  /* DECK DI CONTROLLO CENTRATO CON ELEMENTI GRANDI E DISSOCIATI */
  .control-deck {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 24px;
    padding: 8px 12px;
    background: #160a2c;
    border: 2.5px solid #ffea00;
    border-radius: 14px;
    margin-top: 4px;
    box-shadow: 0 0 12px rgba(255, 234, 0, 0.3);
    flex-shrink: 0;
  }

  /* BASE DEL JOYSTICK VIRTUAL TOUCH INGRANDITO */
  .joystick-zone {
    position: relative;
    width: 110px;
    height: 110px;
    background: radial-gradient(circle, #1c0b3b 30%, #0a0318 90%);
    border: 3px solid #00f0ff;
    border-radius: 50%;
    box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.5), 0 0 12px rgba(0, 240, 255, 0.4);
    touch-action: none;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
  }

  .joystick-knob {
    position: absolute;
    width: 48px;
    height: 48px;
    background: radial-gradient(circle at 35% 35%, #ff007f, #880040);
    border: 2.5px solid #ffffff;
    border-radius: 50%;
    box-shadow: 0 0 12px #ff007f;
    pointer-events: none;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  /* PULSANTE ROSSO ARCADE PER LA BOMBA INGRANDITO */
  .fire-btn {
    width: 100px;
    height: 100px;
    background: radial-gradient(circle at 35% 35%, #ff3366, #990026);
    border: 3px solid #ffffff;
    color: #ffffff;
    font-size: 14px;
    font-weight: 900;
    border-radius: 50%;
    box-shadow: 0 5px 0 #66001a, 0 0 16px rgba(255, 0, 85, 0.8);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 4px #000;
    cursor: pointer;
    flex-shrink: 0;
  }
  .fire-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #66001a;
    background: #ff0033;
  }

  .exit-btn {
    width: 100%;
    margin-top: 4px;
    padding: 6px;
    background: #100826;
    border: 1.5px solid #ff007f;
    color: #ff007f;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    font-size: 10px;
    border-radius: 6px;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 0 8px rgba(255, 0, 127, 0.3);
    flex-shrink: 0;
  }
  .exit-btn:active { transform: scale(0.96); }

  /* OVERLAY MODALE OPZIONI */
  .modal-overlay {
    display: none;
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(5, 2, 10, 0.94);
    z-index: 200;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }
  .modal-box {
    width: 100%;
    max-width: 300px;
    background: #0e051b;
    border: 3px solid #00f0ff;
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    color: #ffffff;
    text-align: center;
  }
  .modal-title {
    color: #ffea00;
    font-size: 15px;
    font-weight: 900;
    text-shadow: 0 0 8px #ffea00;
  }
  .option-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: #160a2c;
    padding: 8px;
    border: 1px solid rgba(255,0,127,0.4);
    border-radius: 8px;
  }
  .option-label {
    font-size: 11px;
    font-weight: bold;
    color: #00f0ff;
  }
  .toggle-btn {
    width: 100%;
    padding: 8px;
    background: #2a144a;
    border: 2px solid #ff007f;
    color: #ffffff;
    font-weight: bold;
    font-size: 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  .toggle-btn.active {
    border-color: #00ff66;
    color: #00ff66;
    background: #082814;
    box-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
  }
  .sens-slider {
    width: 100%;
    accent-color: #ff007f;
    cursor: pointer;
  }
  .close-modal-btn {
    padding: 10px;
    background: linear-gradient(180deg, #ff007f, #a30052);
    border: 2px solid #ffffff;
    color: #ffffff;
    font-weight: bold;
    font-size: 12px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(255, 0, 127, 0.5);
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <!-- TOP BAR CON PULSANTE OPZIONI -->
  <div class="top-header">
    <span class="header-title">CYBER RUN - GRID BOMBER</span>
    <button class="opt-btn" id="btnOpenSettings">⚙️ OPZIONI</button>
  </div>

  <div id="canvas-container">
    <canvas id="game"></canvas>
  </div>

  <div class="control-deck">
    <!-- JOYSTICK VIRTUAL TOUCH -->
    <div class="joystick-zone" id="joyZone">
      <div class="joystick-knob" id="joyKnob"></div>
    </div>

    <!-- TASTO BOMBA TONDO ARCADE -->
    <div class="fire-btn" id="btnBomb">
      <span>💣</span>
      <span>BOMBA</span>
    </div>
  </div>

  <button class="exit-btn" onclick="exitGame()">◄ TORNA ALL'HUB ARCADE</button>

  <!-- MODALE OPZIONI -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box">
      <div class="modal-title">⚙️ OPZIONI GIOCO</div>

      <div class="option-item">
        <span class="option-label">SENSIBILITÀ JOYSTICK: <span id="sensValText">1.0x</span></span>
        <input type="range" class="sens-slider" id="sensSlider" min="0.5" max="2.0" step="0.25" value="1.0">
      </div>

      <div class="option-item">
        <span class="option-label">MUSICA DI SOTTOFONDO</span>
        <button class="toggle-btn active" id="btnToggleMusic">ON 🎵</button>
      </div>

      <div class="option-item">
        <span class="option-label">EFFETTI SONORI (SFX)</span>
        <button class="toggle-btn active" id="btnToggleSfx">ON 🔊</button>
      </div>

      <button class="close-modal-btn" id="btnCloseSettings">SALVA E CHIUDI ►</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const COLS = 13;
const ROWS = 15;
const CELL_SIZE = 26; 
const HUD_HEIGHT = 44;

const CANVAS_W = COLS * CELL_SIZE; // 338px
const CANVAS_H = ROWS * CELL_SIZE + HUD_HEIGHT; // 434px

canvas.width = CANVAS_W;
canvas.height = CANVAS_H;

function drawRoundRect(c, x, y, w, h, r) {
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// --- CONFIGURAZIONE E SALVATAGGIO OPZIONI ---
let joySensitivity = parseFloat(localStorage.getItem('cyberRun_joySens')) || 1.0;
let musicEnabled = localStorage.getItem('cyberRun_music') !== 'false';
let sfxEnabled = localStorage.getItem('cyberRun_sfx') !== 'false';

// Caricamento Audio Musica di Sottofondo Pacman
const bgMusic = new Audio('assets/pacman/music_pacman.mp3');
bgMusic.loop = true;
bgMusic.volume = 0.4;

function playBgMusic() {
  if (musicEnabled && bgMusic.paused) {
    bgMusic.play().catch(() => {});
  }
}

// AVVIO IMMEDIATO MUSICA ALL'INGRESSO E SBLOCCO AUTOMATICO PRIMA INTERAZIONE
playBgMusic();
['pointerdown', 'touchstart', 'click', 'keydown'].forEach(evt => {
  window.addEventListener(evt, () => playBgMusic(), { once: true });
});

function updateMusicState() {
  if (musicEnabled) {
    playBgMusic();
  } else {
    bgMusic.pause();
  }
}

const settingsModal = document.getElementById('settingsModal');
const btnOpenSettings = document.getElementById('btnOpenSettings');
const btnCloseSettings = document.getElementById('btnCloseSettings');
const sensSlider = document.getElementById('sensSlider');
const sensValText = document.getElementById('sensValText');
const btnToggleMusic = document.getElementById('btnToggleMusic');
const btnToggleSfx = document.getElementById('btnToggleSfx');

sensSlider.value = joySensitivity;
sensValText.innerText = joySensitivity.toFixed(2) + 'x';

function renderOptionButtons() {
  btnToggleMusic.className = `toggle-btn ${musicEnabled ? 'active' : ''}`;
  btnToggleMusic.innerText = musicEnabled ? 'ON 🎵' : 'OFF 🔇';

  btnToggleSfx.className = `toggle-btn ${sfxEnabled ? 'active' : ''}`;
  btnToggleSfx.innerText = sfxEnabled ? 'ON 🔊' : 'OFF 🔇';
}
renderOptionButtons();

sensSlider.oninput = () => {
  joySensitivity = parseFloat(sensSlider.value);
  sensValText.innerText = joySensitivity.toFixed(2) + 'x';
  localStorage.setItem('cyberRun_joySens', joySensitivity);
};

btnToggleMusic.onclick = () => {
  musicEnabled = !musicEnabled;
  localStorage.setItem('cyberRun_music', musicEnabled);
  renderOptionButtons();
  updateMusicState();
};

btnToggleSfx.onclick = () => {
  sfxEnabled = !sfxEnabled;
  localStorage.setItem('cyberRun_sfx', sfxEnabled);
  renderOptionButtons();
};

btnOpenSettings.onclick = () => {
  if (gameState === 'PLAYING') {
    gameState = 'PAUSE';
  }
  settingsModal.style.display = 'flex';
};

btnCloseSettings.onclick = () => {
  settingsModal.style.display = 'none';
  getAC();
  if (gameState === 'PAUSE') {
    gameState = 'PLAYING';
  }
  updateMusicState();
};

// AUDIO SINTETIZZATO RETRO CON BUFFER SICURO SU MOBILE
let audioCtx = null;
let noiseBuffer = null;

function getAC() {
  try {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        audioCtx = new AudioContextClass();
        const bufferSize = Math.floor(audioCtx.sampleRate * 0.25);
        noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  } catch(e) {}
  playBgMusic();
  return audioCtx;
}

function playSound(type) {
  if (!sfxEnabled) return;
  try {
    const ac = getAC();
    if (!ac) return;
    const t = ac.currentTime;

    if (type === 'explode') {
      if (!noiseBuffer) return;
      const dur = 0.22;
      const src = ac.createBufferSource();
      src.buffer = noiseBuffer;
      const filt = ac.createBiquadFilter();
      filt.type = 'lowpass';
      filt.frequency.setValueAtTime(800, t);
      filt.frequency.exponentialRampToValueAtTime(Math.max(1, 50), t + dur);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.2, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(filt); filt.connect(g); g.connect(ac.destination);
      src.start(t); src.stop(t + dur);
      return;
    }

    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);

    if (type === 'bomb') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, t);
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, 110), t + 0.12);
      gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      osc.start(t); osc.stop(t + 0.12);
    } else if (type === 'hit_block') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(200, t);
      osc.frequency.exponentialRampToValueAtTime(Math.max(1, 350), t + 0.08);
      gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
      osc.start(t); osc.stop(t + 0.08);
    } else if (type === 'powerup') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523, t);
      osc.frequency.setValueAtTime(659, t + 0.08);
      osc.frequency.setValueAtTime(783, t + 0.16);
      gain.gain.setValueAtTime(0.18, t); gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
      osc.start(t); osc.stop(t + 0.24);
    } else if (type === 'fail') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(240, t);
      osc.frequency.linearRampToValueAtTime(50, t + 0.35);
      gain.gain.setValueAtTime(0.25, t); gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      osc.start(t); osc.stop(t + 0.35);
    }
  } catch(e) {}
}

// Assets Grafici Studio
const imgLaura = new Image(); imgLaura.src = 'assets/pacman/laura.png';
const imgGuido = new Image(); imgGuido.src = 'assets/pacman/guido.png';
const movLaura = new Image(); movLaura.src = 'assets/pacman/mov-laura.png';
const movGuido = new Image(); movGuido.src = 'assets/pacman/mov-guido.png';

// Formati di File Distruttibili
const FILE_BLOCK_TYPES = [
  { key: 'JPG', label: '.JPG', hp: 1, bg: '#1c2838', border: '#2a6090', textCol: '#88c0ff', pts: 20, dropChance: 0.18 },
  { key: 'PNG', label: '.PNG', hp: 1, bg: '#103028', border: '#108050', textCol: '#00ffaa', pts: 30, dropChance: 0.22 },
  { key: 'PSD', label: '.PSD', hp: 2, bg: '#141848', border: '#0055ff', textCol: '#3388ff', pts: 60, dropChance: 0.35 },
  { key: 'AI',  label: '.AI',  hp: 2, bg: '#381800', border: '#ff8800', textCol: '#ffaa00', pts: 80, dropChance: 0.40 },
  { key: 'PDF', label: '.PDF', hp: 3, bg: '#380008', border: '#ff0044', textCol: '#ff5577', pts: 120, dropChance: 0.55 }
];

// Trama & Temi di Livello
const LEVEL_THEMES = [
  { title: "STAGE 1: BOZZE .JPG & .PNG", msg: "Distruggi le bozze raster provvisorie!" },
  { title: "STAGE 2: PROGETTI .PSD & .AI", msg: "I file complessi richiedono 2 colpi!" },
  { title: "STAGE 3: EXPORT .PDF PESANTI", msg: "Attento ai PDF blindati: servono 3 esplosioni!" },
  { title: "STAGE 4: RUSH PRIMA DELLE 18:00", msg: "Caos di formati in studio! Consegna tutto!" }
];

const CHARACTERS = {
  LAURA: {
    id: 'LAURA',
    name: "LAURA",
    subtitle: "Laura, la grafica Senior",
    perkBonus: "BONUS: Render Master (2 Bombe & Raggio +1)",
    perkMalus: "MALUS: Precisione Senior (-5% Velocità)",
    primary: "#00ffcc",
    bg: "#040414",
    wallCol: "#00aaff",
    img: imgLaura,
    movImg: movLaura,
    speed: 2.1,
    baseBombs: 2,
    baseRange: 2,
    scoreMult: 1.0
  },
  GUIDO: {
    id: 'GUIDO',
    name: "GUIDO",
    subtitle: "Guido, il grafico Junior",
    perkBonus: "BONUS: Agilità Junior (+20% Velocità & +15% PTS)",
    perkMalus: "MALUS: Bozza Iniziale (1 Bomba & Raggio Base)",
    primary: "#ffd700",
    bg: "#140e00",
    wallCol: "#ffaa00",
    img: imgGuido,
    movImg: movGuido,
    speed: 2.6,
    baseBombs: 1,
    baseRange: 1,
    scoreMult: 1.15
  }
};

let map = [];
let blockData = [];
let bombs = [];
let explosions = [];
let powerups = [];

let gameState = 'TUTORIAL';
let level = 1;
let score = 0;
let lives = 3;
let animTimer = 0;
let gameOverLockTimer = 0;

let player = {
  x: 1 * CELL_SIZE + CELL_SIZE / 2,
  y: 1 * CELL_SIZE + CELL_SIZE / 2,
  w: 12, h: 12,
  maxBombs: 1,
  bombRange: 1,
  speed: 2.1,
  isMoving: false,
  facingLeft: false,
  invTimer: 0
};

let enemies = [];
let moveUp = false, moveDown = false, moveLeft = false, moveRight = false;

// JOYSTICK MOBILE CON PREVENZIONE SCORRIMENTO PAGINA
const joyZone = document.getElementById('joyZone');
const joyKnob = document.getElementById('joyKnob');
let joyActive = false;

function handleJoyMove(clientX, clientY) {
  const rect = joyZone.getBoundingClientRect();
  if (!rect || rect.width === 0) return;

  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  let dx = clientX - centerX;
  let dy = clientY - centerY;

  const dist = Math.hypot(dx, dy);
  const maxRadius = Math.max(10, rect.width / 2 - 10);

  if (dist > maxRadius && dist > 0) {
    dx = (dx / dist) * maxRadius;
    dy = (dy / dist) * maxRadius;
  }

  joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

  moveUp = false; moveDown = false; moveLeft = false; moveRight = false;

  const deadZone = 10 / joySensitivity;
  if (dist > deadZone) {
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) moveLeft = true;
      else moveRight = true;
    } else {
      if (dy < 0) moveUp = true;
      else moveDown = true;
    }
  }
}

function resetJoy() {
  joyActive = false;
  moveUp = false; moveDown = false; moveLeft = false; moveRight = false;
  joyKnob.style.transform = `translate(-50%, -50%)`;
}

joyZone.addEventListener('pointerdown', e => {
  if (e.cancelable) e.preventDefault();
  joyActive = true;
  try { joyZone.setPointerCapture(e.pointerId); } catch(err) {}
  getAC();
  handleJoyMove(e.clientX, e.clientY);
}, { passive: false });

joyZone.addEventListener('pointermove', e => {
  if (e.cancelable) e.preventDefault();
  if (joyActive) handleJoyMove(e.clientX, e.clientY);
}, { passive: false });

joyZone.addEventListener('pointerup', e => {
  if (e.cancelable) e.preventDefault();
  resetJoy();
}, { passive: false });

joyZone.addEventListener('pointercancel', e => {
  if (e.cancelable) e.preventDefault();
  resetJoy();
}, { passive: false });

function selectCharacter(charKey) {
  currentTheme = CHARACTERS[charKey];
  canvas.style.borderColor = currentTheme.primary;
  canvas.style.boxShadow = `inset 0 0 15px ${currentTheme.primary}`;
  initGame();
  gameState = 'PLAYING';
  playSound('powerup');
}

function initGame() {
  score = 0;
  lives = 3;
  level = 1;
  loadLevel();
}

function loadLevel() {
  player.maxBombs = currentTheme.baseBombs;
  player.bombRange = currentTheme.baseRange;
  player.speed = currentTheme.speed;
  player.x = 1 * CELL_SIZE + CELL_SIZE / 2;
  player.y = 1 * CELL_SIZE + CELL_SIZE / 2;
  player.invTimer = 60;
  player.isMoving = false;
  player.facingLeft = false;

  bombs = [];
  explosions = [];
  powerups = [];
  enemies = [];

  map = [];
  blockData = [];

  for (let r = 0; r < ROWS; r++) {
    map[r] = [];
    blockData[r] = [];
    for (let c = 0; c < COLS; c++) {
      if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1 || (r % 2 === 0 && c % 2 === 0)) {
        map[r][c] = 1;
        blockData[r][c] = null;
      } else if ((r <= 2 && c <= 2) || (r >= ROWS - 3 && c >= COLS - 3)) {
        map[r][c] = 0;
        blockData[r][c] = null;
      } else {
        if (Math.random() < (0.55 + Math.min(level * 0.03, 0.15))) {
          map[r][c] = 2;

          let pool = [];
          if (level === 1) pool = [FILE_BLOCK_TYPES[0], FILE_BLOCK_TYPES[1]];
          else if (level === 2) pool = [FILE_BLOCK_TYPES[0], FILE_BLOCK_TYPES[1], FILE_BLOCK_TYPES[2], FILE_BLOCK_TYPES[3]];
          else pool = FILE_BLOCK_TYPES;

          let selectedType = pool[Math.floor(Math.random() * pool.length)];
          blockData[r][c] = {
            ...selectedType,
            currentHp: selectedType.hp
          };
        } else {
          map[r][c] = 0;
          blockData[r][c] = null;
        }
      }
    }
  }

  let emptyCells = [];
  for (let r = 1; r < ROWS - 1; r++) {
    for (let c = 1; c < COLS - 1; c++) {
      if (map[r][c] === 0 && !(r <= 3 && c <= 3)) {
        emptyCells.push({ r, c });
      }
    }
  }

  let enemyColors = ['#ff0055', '#ff66cc', '#00ffff', '#ffaa00'];
  let enemyCount = 2 + Math.min(level, 5);

  for (let i = 0; i < enemyCount; i++) {
    let er, ec;
    if (emptyCells.length > 0) {
      let idx = Math.floor(Math.random() * emptyCells.length);
      er = emptyCells[idx].r;
      ec = emptyCells[idx].c;
      emptyCells.splice(idx, 1);
    } else {
      er = ROWS - 2;
      ec = COLS - 2;
      map[er][ec] = 0;
      blockData[er][ec] = null;
    }

    enemies.push({
      gx: ec, gy: er,
      x: ec * CELL_SIZE + CELL_SIZE / 2,
      y: er * CELL_SIZE + CELL_SIZE / 2,
      dirX: Math.random() < 0.5 ? 1 : -1,
      dirY: 0,
      color: enemyColors[i % enemyColors.length],
      speed: 1.1 + level * 0.15
    });
  }
}

function placeBomb() {
  if (gameState !== 'PLAYING') return;

  let gx = Math.floor(player.x / CELL_SIZE);
  let gy = Math.floor(player.y / CELL_SIZE);

  if (gx < 0 || gx >= COLS || gy < 0 || gy >= ROWS) return;

  let currentActiveBombs = bombs.filter(b => b && !b.exploded).length;
  if (currentActiveBombs >= player.maxBombs) return;

  let alreadyHasBomb = bombs.some(b => b && b.gx === gx && b.gy === gy && !b.exploded);
  if (alreadyHasBomb) return;

  bombs.push({
    id: Date.now() + Math.random(),
    gx, gy,
    timer: 130,
    range: player.bombRange,
    exploded: false
  });

  playSound('bomb');
}

function triggerExplosion(b) {
  if (!b || b.exploded) return;
  b.exploded = true;
  playSound('explode');

  let fireCells = [{ gx: b.gx, gy: b.gy }];
  let dirs = [{ x: 0, y: -1 }, { x: 0, y: 1 }, { x: -1, y: 0 }, { x: 1, y: 0 }];

  dirs.forEach(d => {
    for (let step = 1; step <= b.range; step++) {
      let cgx = b.gx + d.x * step;
      let cgy = b.gy + d.y * step;

      if (cgx < 0 || cgx >= COLS || cgy < 0 || cgy >= ROWS) break;
      if (map[cgy][cgx] === 1) break;

      fireCells.push({ gx: cgx, gy: cgy });

      let otherBomb = bombs.find(ob => ob && !ob.exploded && ob.gx === cgx && ob.gy === cgy);
      if (otherBomb) {
        triggerExplosion(otherBomb);
      }

      if (map[cgy][cgx] === 2) {
        let blk = blockData[cgy][cgx];
        if (blk) {
          blk.currentHp--;
          if (blk.currentHp <= 0) {
            map[cgy][cgx] = 0;
            blockData[cgy][cgx] = null;
            score += Math.floor(blk.pts * currentTheme.scoreMult);

            if (Math.random() < blk.dropChance) {
              let types = ['BOMB_UP', 'FIRE_UP', 'SPEED_UP', 'COFFEE'];
              powerups.push({
                gx: cgx, gy: cgy,
                type: types[Math.floor(Math.random() * types.length)]
              });
            }
          } else {
            playSound('hit_block');
          }
        }
        break;
      }
    }
  });

  explosions.push({ cells: fireCells, timer: 20 });
}

function overlapsTile(px, py, pw, ph, gx, gy) {
  let pLeft = px - pw / 2;
  let pRight = px + pw / 2;
  let pTop = py - ph / 2;
  let pBottom = py + ph / 2;

  let tLeft = gx * CELL_SIZE;
  let tRight = (gx + 1) * CELL_SIZE;
  let tTop = gy * CELL_SIZE;
  let tBottom = (gy + 1) * CELL_SIZE;

  return (pLeft < tRight && pRight > tLeft && pTop < tBottom && pBottom > tTop);
}

function isBlocked(nx, ny) {
  let eps = 0.5;
  let left = nx - player.w / 2 + eps;
  let right = nx + player.w / 2 - eps;
  let top = ny - player.h / 2 + eps;
  let bottom = ny + player.h / 2 - eps;

  let c1 = Math.floor(left / CELL_SIZE);
  let c2 = Math.floor(right / CELL_SIZE);
  let r1 = Math.floor(top / CELL_SIZE);
  let r2 = Math.floor(bottom / CELL_SIZE);

  for (let r = r1; r <= r2; r++) {
    for (let c = c1; c <= c2; c++) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return true;
      if (map[r][c] !== 0) return true;

      for (let i = 0; i < bombs.length; i++) {
        let b = bombs[i];
        if (b && !b.exploded && b.gx === c && b.gy === r) {
          let currentlyInside = overlapsTile(player.x, player.y, player.w, player.h, b.gx, b.gy);
          if (!currentlyInside) {
            return true;
          }
        }
      }
    }
  }
  return false;
}

function updatePlayer() {
  let dx = 0, dy = 0;

  let wantLeft = keyPressed('ArrowLeft') || keyPressed('KeyA') || moveLeft;
  let wantRight = keyPressed('ArrowRight') || keyPressed('KeyD') || moveRight;
  let wantUp = keyPressed('ArrowUp') || keyPressed('KeyW') || moveUp;
  let wantDown = keyPressed('ArrowDown') || keyPressed('KeyS') || moveDown;

  if (wantLeft) { dx = -player.speed; player.facingLeft = true; }
  else if (wantRight) { dx = player.speed; player.facingLeft = false; }
  else if (wantUp) { dy = -player.speed; }
  else if (wantDown) { dy = player.speed; }

  player.isMoving = (dx !== 0 || dy !== 0);
  if (player.isMoving) animTimer++;

  if (dx !== 0) {
    let centerY = (Math.floor(player.y / CELL_SIZE) + 0.5) * CELL_SIZE;
    let diffY = centerY - player.y;
    let targetY = player.y;
    if (Math.abs(diffY) > 0.1) {
      targetY += Math.sign(diffY) * Math.min(Math.abs(diffY), player.speed);
    } else {
      targetY = centerY;
    }

    if (!isBlocked(player.x + dx, targetY)) {
      player.x += dx;
      player.y = targetY;
    }
  } else if (dy !== 0) {
    let centerX = (Math.floor(player.x / CELL_SIZE) + 0.5) * CELL_SIZE;
    let diffX = centerX - player.x;
    let targetX = player.x;
    if (Math.abs(diffX) > 0.1) {
      targetX += Math.sign(diffX) * Math.min(Math.abs(diffX), player.speed);
    } else {
      targetX = centerX;
    }

    if (!isBlocked(targetX, player.y + dy)) {
      player.x = targetX;
      player.y += dy;
    }
  }

  if (player.invTimer > 0) player.invTimer--;

  let pGx = Math.floor(player.x / CELL_SIZE);
  let pGy = Math.floor(player.y / CELL_SIZE);

  for (let i = powerups.length - 1; i >= 0; i--) {
    let pw = powerups[i];
    if (pw && pw.gx === pGx && pw.gy === pGy) {
      playSound('powerup');
      if (pw.type === 'BOMB_UP') player.maxBombs++;
      else if (pw.type === 'FIRE_UP') player.bombRange++;
      else if (pw.type === 'SPEED_UP') player.speed += 0.35;
      else if (pw.type === 'COFFEE') score += Math.floor(300 * currentTheme.scoreMult);

      powerups.splice(i, 1);
    }
  }
}

function updateEnemies() {
  enemies.forEach(e => {
    let targetX = (e.gx + 0.5) * CELL_SIZE;
    let targetY = (e.gy + 0.5) * CELL_SIZE;
    let dist = Math.hypot(targetX - e.x, targetY - e.y);

    if (dist <= e.speed) {
      e.x = targetX;
      e.y = targetY;

      let dirs = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
      let valid = dirs.filter(d => {
        let ngx = e.gx + d.x;
        let ngy = e.gy + d.y;
        if (ngx < 0 || ngx >= COLS || ngy < 0 || ngy >= ROWS) return false;
        if (map[ngy][ngx] !== 0) return false;
        
        let hasActiveBomb = bombs.some(b => b && !b.exploded && b.gx === ngx && b.gy === ngy);
        if (hasActiveBomb) return false;
        
        return true;
      });

      let forwardValid = valid.filter(d => !(d.x === -e.dirX && d.y === -e.dirY));

      let chosenDir;
      if (forwardValid.length > 0) {
        chosenDir = forwardValid[Math.floor(Math.random() * forwardValid.length)];
      } else if (valid.length > 0) {
        chosenDir = valid[Math.floor(Math.random() * valid.length)];
      } else {
        chosenDir = { x: 0, y: 0 };
      }

      e.dirX = chosenDir.x;
      e.dirY = chosenDir.y;
      e.gx += e.dirX;
      e.gy += e.dirY;
    } else {
      e.x += e.dirX * e.speed;
      e.y += e.dirY * e.speed;
    }

    if (player.invTimer <= 0 && gameState === 'PLAYING') {
      let pDist = Math.hypot(player.x - e.x, player.y - e.y);
      if (pDist < 12) {
        hitPlayer();
      }
    }
  });
}

function updateBombsAndExplosions() {
  for (let i = 0; i < bombs.length; i++) {
    let b = bombs[i];
    if (b && !b.exploded) {
      b.timer--;
      if (b.timer <= 0) {
        triggerExplosion(b);
      }
    }
  }

  bombs = bombs.filter(b => b && !b.exploded);

  for (let i = explosions.length - 1; i >= 0; i--) {
    let ex = explosions[i];
    if (!ex) continue;
    ex.timer--;

    for (let cIdx = 0; cIdx < ex.cells.length; cIdx++) {
      let cell = ex.cells[cIdx];

      for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
        let e = enemies[eIdx];
        if (!e) continue;
        let egx = Math.floor(e.x / CELL_SIZE);
        let egy = Math.floor(e.y / CELL_SIZE);
        
        if (egx === cell.gx && egy === cell.gy) {
          score += Math.floor(200 * currentTheme.scoreMult);
          enemies.splice(eIdx, 1);
        }
      }

      if (gameState === 'PLAYING' && player.invTimer <= 0) {
        let pgx = Math.floor(player.x / CELL_SIZE);
        let pgy = Math.floor(player.y / CELL_SIZE);
        if (pgx === cell.gx && pgy === cell.gy) {
          hitPlayer();
          break;
        }
      }
    }

    if (ex.timer <= 0) explosions.splice(i, 1);
  }

  if (enemies.length === 0 && gameState === 'PLAYING') {
    score += Math.floor(1000 * level * currentTheme.scoreMult);
    level++;
    gameState = 'LEVEL_CLEAR';
    playSound('powerup');
    setTimeout(() => {
      if (gameState === 'LEVEL_CLEAR') {
        loadLevel();
        gameState = 'PLAYING';
      }
    }, 2000);
  }
}

function hitPlayer() {
  if (gameState !== 'PLAYING' || player.invTimer > 0) return;

  lives--;
  player.invTimer = 90;
  playSound('fail');

  if (lives <= 0) {
    gameState = 'GAME_OVER';
    gameOverLockTimer = 60;
    saveScore();
  } else {
    player.x = 1 * CELL_SIZE + CELL_SIZE / 2;
    player.y = 1 * CELL_SIZE + CELL_SIZE / 2;
  }
}

function drawGameWorld() {
  ctx.strokeStyle = '#0d0d22';
  ctx.lineWidth = 1;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      ctx.strokeRect(c * CELL_SIZE, r * CELL_SIZE + HUD_HEIGHT, CELL_SIZE, CELL_SIZE);
    }
  }

  for (let i = 0; i < powerups.length; i++) {
    drawSinglePowerup(powerups[i]);
  }

  for (let i = 0; i < explosions.length; i++) {
    let ex = explosions[i];
    if (ex && ex.cells) {
      for (let j = 0; j < ex.cells.length; j++) {
        drawSingleExplosionCell(ex.cells[j]);
      }
    }
  }

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (map[r][c] !== 0) {
        drawSingleBlock(r, c);
      }
    }

    for (let i = 0; i < bombs.length; i++) {
      let b = bombs[i];
      if (b && !b.exploded && b.gy === r) {
        drawSingleBomb(b);
      }
    }

    for (let i = 0; i < enemies.length; i++) {
      let e = enemies[i];
      if (e && Math.floor(e.y / CELL_SIZE) === r) {
        drawSingleEnemy(e);
      }
    }

    if (Math.floor(player.y / CELL_SIZE) === r) {
      drawSinglePlayer();
    }
  }
}

function drawSingleBlock(r, c) {
  let x = c * CELL_SIZE;
  let y = r * CELL_SIZE + HUD_HEIGHT;

  if (map[r][c] === 1) {
    ctx.fillStyle = '#080820';
    ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
    ctx.strokeStyle = currentTheme.wallCol;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2);
    
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.fillRect(x + 2, y + 2, CELL_SIZE - 4, 3);
  } else if (map[r][c] === 2) {
    let blk = blockData[r][c];
    if (blk) {
      ctx.fillStyle = blk.bg;
      ctx.fillRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2);
      ctx.strokeStyle = blk.border;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x + 1.5, y + 1.5, CELL_SIZE - 3, CELL_SIZE - 3);
      
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.fillRect(x + 2, y + 2, CELL_SIZE - 4, 3);
      
      ctx.fillStyle = blk.textCol;
      ctx.font = 'bold 9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(blk.label, x + CELL_SIZE / 2, y + CELL_SIZE / 2 - (blk.hp > 1 ? 1 : -3));

      if (blk.hp > 1) {
        let barW = CELL_SIZE - 6;
        let barH = 3;
        let barX = x + 3;
        let barY = y + CELL_SIZE - 5;

        ctx.fillStyle = '#080814';
        ctx.fillRect(barX, barY, barW, barH);

        let fillW = barW * (blk.currentHp / blk.hp);
        ctx.fillStyle = blk.currentHp === blk.hp ? '#00ffcc' : (blk.currentHp > 1 ? '#ffcc00' : '#ff0055');
        ctx.fillRect(barX, barY, fillW, barH);

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(barX, barY, barW, barH);
      }
    }
  }
}

function drawSinglePowerup(pw) {
  if (!pw) return;
  let px = pw.gx * CELL_SIZE + CELL_SIZE / 2;
  let py = pw.gy * CELL_SIZE + HUD_HEIGHT + CELL_SIZE / 2;

  ctx.fillStyle = '#ffcc00';
  ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
  let icon = '⚡';
  if (pw.type === 'BOMB_UP') icon = '💣';
  else if (pw.type === 'FIRE_UP') icon = '🔥';
  else if (pw.type === 'SPEED_UP') icon = '👟';
  else if (pw.type === 'COFFEE') icon = '☕';

  ctx.fillText(icon, px, py + 4);
}

function drawSingleBomb(b) {
  if (!b) return;
  let bx = b.gx * CELL_SIZE + CELL_SIZE / 2;
  let by = b.gy * CELL_SIZE + HUD_HEIGHT + CELL_SIZE / 2;
  let pulse = Math.sin(Date.now() / 70) * 1.5;

  ctx.save();
  ctx.beginPath();
  ctx.arc(bx, by, 9 + pulse, 0, Math.PI * 2);
  ctx.fillStyle = '#ff0055';
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.font = `${16 + pulse}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = '#ffff00';
  ctx.shadowBlur = 8;
  ctx.fillText('💣', bx, by + 1);
  ctx.restore();
}

function drawSingleExplosionCell(cell) {
  if (!cell) return;
  let fx = cell.gx * CELL_SIZE;
  let fy = cell.gy * CELL_SIZE + HUD_HEIGHT;

  ctx.fillStyle = 'rgba(255, 0, 85, 0.85)';
  ctx.fillRect(fx + 2, fy + 2, CELL_SIZE - 4, CELL_SIZE - 4);
  ctx.fillStyle = '#ffff00';
  ctx.fillRect(fx + 5, fy + 5, CELL_SIZE - 10, CELL_SIZE - 10);
}

function drawSinglePlayer() {
  let py = player.y + HUD_HEIGHT;
  if (player.invTimer > 0 && Math.floor(player.invTimer / 4) % 2 === 0) return;

  ctx.save();
  if (player.facingLeft) {
    ctx.translate(player.x, py);
    ctx.scale(-1, 1);
    ctx.translate(-player.x, -py);
  }

  let img = currentTheme.movImg;
  if (img && img.complete && img.naturalWidth !== 0) {
    let frameCount = 5;
    let frameW = img.naturalWidth / frameCount;
    let frameH = img.naturalHeight;
    let currentFrame = player.isMoving ? (Math.floor(animTimer / 5) % frameCount) : 0;

    let drawW = 30;
    let drawH = 30;

    ctx.drawImage(
      img,
      currentFrame * frameW, 0, frameW, frameH,
      player.x - drawW / 2, py - drawH / 2 - 2, drawW, drawH
    );
  } else {
    ctx.fillStyle = currentTheme.primary;
    ctx.beginPath();
    ctx.arc(player.x, py, 12, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawSingleEnemy(e) {
  if (!e) return;
  let ex = e.x;
  let ey = e.y + HUD_HEIGHT;
  let r = 11;

  ctx.save();
  ctx.beginPath();
  ctx.fillStyle = e.color || '#ff0055';

  ctx.arc(ex, ey - 2, r, Math.PI, 0, false);
  ctx.lineTo(ex + r, ey + r);
  ctx.lineTo(ex + r / 2, ey + r - 3);
  ctx.lineTo(ex, ey + r);
  ctx.lineTo(ex - r / 2, ey + r - 3);
  ctx.lineTo(ex - r, ey + r);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.fillStyle = '#ffffff';
  ctx.arc(ex - 3.5, ey - 3, 2.5, 0, Math.PI * 2);
  ctx.arc(ex + 3.5, ey - 3, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.fillStyle = '#000000';
  ctx.arc(ex - 3.5 + (e.dirX || 0) * 1.2, ey - 3 + (e.dirY || 0) * 1.2, 1.2, 0, Math.PI * 2);
  ctx.arc(ex + 3.5 + (e.dirX || 0) * 1.2, ey - 3 + (e.dirY || 0) * 1.2, 1.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

}

function drawCharSelect() {
  ctx.fillStyle = 'rgba(4, 4, 18, 0.96)'; ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#ffff00'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
  ctx.fillText('Scegli il tuo creativo in ACTING OUT', canvas.width / 2, 30);

  const chars = [
    { key: 'LAURA', y: 44, col: '#00ffcc' },
    { key: 'GUIDO', y: 216, col: '#ffd700' }
  ];

  chars.forEach(b => {
    let c = CHARACTERS[b.key];
    drawRoundRect(ctx, 12, b.y, 314, 160, 12);
    ctx.fillStyle = '#101228'; ctx.fill();
    ctx.strokeStyle = b.col; ctx.lineWidth = 2.5; ctx.stroke();

    if (c.img && c.img.complete && c.img.naturalWidth !== 0) {
      ctx.save();
      drawRoundRect(ctx, 137, b.y + 8, 64, 64, 10);
      ctx.clip();
      ctx.drawImage(c.img, 137, b.y + 8, 64, 64);
      ctx.restore();
      drawRoundRect(ctx, 137, b.y + 8, 64, 64, 10);
      ctx.strokeStyle = b.col; ctx.lineWidth = 1.5; ctx.stroke();
    } else {
      drawRoundRect(ctx, 137, b.y + 8, 64, 64, 10);
      ctx.fillStyle = b.col; ctx.fill();
    }

    ctx.fillStyle = b.col; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
    ctx.fillText(c.name, canvas.width / 2, b.y + 90);

    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 10px monospace';
    ctx.fillText(c.subtitle, canvas.width / 2, b.y + 106);

    ctx.fillStyle = '#ffff00'; ctx.font = '9px monospace';
    ctx.fillText(c.perkBonus, canvas.width / 2, b.y + 122);
    ctx.fillStyle = '#ff0055';
    ctx.fillText(c.perkMalus, canvas.width / 2, b.y + 136);

    ctx.fillStyle = b.col; ctx.font = 'bold 10px monospace';
    ctx.fillText('► TOCCA PER SCEGLIERE ◄', canvas.width / 2, b.y + 150);
  });
}

function drawLevelClear() {
  ctx.fillStyle = 'rgba(4, 4, 18, 0.92)'; ctx.fillRect(0, 0, canvas.width, canvas.height);

  let tIdx = Math.max(0, Math.min(level - 2, LEVEL_THEMES.length - 1));
  let tData = LEVEL_THEMES[tIdx] || { title: "STAGE " + (level - 1), msg: "Livello Completato!" };

  ctx.fillStyle = currentTheme.primary; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
  ctx.fillText(`STAGE ${level - 1} COMPLETATO! 🎉`, canvas.width / 2, canvas.height / 2 - 40);

  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 11px monospace';
  ctx.fillText(tData.title, canvas.width / 2, canvas.height / 2 - 10);

  ctx.fillStyle = '#00ffcc'; ctx.font = '10px monospace';
  ctx.fillText(tData.msg, canvas.width / 2, canvas.height / 2 + 10);

  ctx.fillStyle = '#ffff00'; ctx.font = 'bold 12px monospace';
  ctx.fillText(`BONUS STAGE: +${Math.floor(1000 * (level - 1) * currentTheme.scoreMult)}`, canvas.width / 2, canvas.height / 2 + 40);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(4, 4, 18, 0.94)'; ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#ff0055'; ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center';
  ctx.fillText('GAME OVER 💀', canvas.width / 2, canvas.height / 2 - 40);

  ctx.fillStyle = '#ffff00'; ctx.font = 'bold 15px monospace';
  ctx.fillText(`PUNTEGGIO: ${score}`, canvas.width / 2, canvas.height / 2 + 5);

  ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 11px monospace';
  ctx.fillText(`RECORD ATTUALE: ${highScore}`, canvas.width / 2, canvas.height / 2 + 35);

  ctx.fillStyle = Math.floor(Date.now() / 400) % 2 === 0 ? '#ffffff' : currentTheme.primary;
  ctx.font = 'bold 11px monospace';
  ctx.fillText('► TOCCA PER GIOCARE ANCORA ◄', canvas.width / 2, canvas.height / 2 + 80);
}

function drawPause() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.75)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#ffea00'; ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center';
  ctx.fillText('IN PAUSA', canvas.width / 2, canvas.height / 2 - 10);
  ctx.fillStyle = '#00f0ff'; ctx.font = 'bold 11px monospace';
  ctx.fillText('TOCCA IL GIOCO PER RIPRENDERE', canvas.width / 2, canvas.height / 2 + 20);
}

function gameLoop() {
  try {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameOverLockTimer > 0) gameOverLockTimer--;

    if (gameState === 'TUTORIAL') {
      drawTutorial();
    } else if (gameState === 'CHAR_SELECT') {
      drawCharSelect();
    } else if (gameState === 'PLAYING') {
      updatePlayer();
      updateEnemies();
      updateBombsAndExplosions();
      drawGameWorld();
      drawHUD();
    } else if (gameState === 'PAUSE') {
      drawGameWorld();
      drawHUD();
      drawPause();
    } else if (gameState === 'LEVEL_CLEAR') {
      drawGameWorld();
      drawLevelClear();
      drawHUD();
    } else if (gameState === 'GAME_OVER') {
      drawGameWorld();
      drawGameOver();
    }
  } catch (err) {
    console.error("Game Loop Error:", err);
  }

  requestAnimationFrame(gameLoop);
}

canvas.addEventListener('pointerdown', (e) => {
  if (e.cancelable) e.preventDefault();
  getAC();
  let rect = canvas.getBoundingClientRect();
  let x = (e.clientX - rect.left) * (canvas.width / rect.width);
  let y = (e.clientY - rect.top) * (canvas.height / rect.height);

  if (gameState === 'TUTORIAL') {
    if (y >= 330) {
      gameState = 'CHAR_SELECT';
      playSound('powerup');
    }
    return;
  }

  if (gameState === 'CHAR_SELECT') {
    if (y >= 44 && y <= 204) selectCharacter('LAURA');
    else if (y >= 216 && y <= 376) selectCharacter('GUIDO');
    return;
  }

  if (gameState === 'PLAYING') {
    gameState = 'PAUSE';
    return;
  }

  if (gameState === 'PAUSE') {
    gameState = 'PLAYING';
    return;
  }

  if (gameState === 'GAME_OVER') {
    if (gameOverLockTimer <= 0) {
      gameState = 'CHAR_SELECT';
    }
    return;
  }
}, { passive: false });

// TASTO BOMBA
function bindBombBtn(id) {
  let btn = document.getElementById(id);
  if (!btn) return;
  btn.addEventListener('pointerdown', (e) => {
    if (e.cancelable) e.preventDefault();
    getAC();
    if (gameState === 'TUTORIAL') {
      gameState = 'CHAR_SELECT';
    } else if (gameState === 'GAME_OVER') {
      if (gameOverLockTimer <= 0) gameState = 'CHAR_SELECT';
    } else if (gameState === 'PLAYING') {
      placeBomb();
    }
  }, { passive: false });
}
bindBombBtn('btnBomb');

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  getAC();
  if (gameState === 'TUTORIAL') {
    if (e.code === 'Space' || e.code === 'Enter') gameState = 'CHAR_SELECT';
    return;
  }
  if (gameState === 'CHAR_SELECT') {
    if (e.key === '1') selectCharacter('LAURA');
    if (e.key === '2') selectCharacter('GUIDO');
    return;
  }
  if (gameState === 'GAME_OVER') {
    if (gameOverLockTimer <= 0 && (e.code === 'Space' || e.code === 'Enter')) {
      gameState = 'CHAR_SELECT';
    }
    return;
  }

  if (e.code === 'Space' || e.code === 'KeyZ' || e.code === 'Enter') placeBomb();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function keyPressed(code) { return !!keys[code]; }

function saveScore() {
  try {
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('cyberRun_highScore', highScore.toString());
    }

    if (score <= 0) return;
    let rawUser = localStorage.getItem('arcade_current_user');
    if (!rawUser) return;
    let curUser = JSON.parse(rawUser);
    if (curUser && curUser.stats) {
      curUser.stats.gamesPlayed = (curUser.stats.gamesPlayed || 0) + 1;
      curUser.stats.cyberRun = (curUser.stats.cyberRun || 0) + score;
      localStorage.setItem('arcade_current_user', JSON.stringify(curUser));

      if (curUser.username && !curUser.username.startsWith("GUEST_")) {
        let rawUsers = localStorage.getItem('arcade_users');
        let users = rawUsers ? JSON.parse(rawUsers) : {};
        if (users[curUser.username]) {
          users[curUser.username].stats = curUser.stats;
          localStorage.setItem('arcade_users', JSON.stringify(users));
        }
      }
    }
  } catch (e) {
    console.warn("Save score error:", e);
  }
}

function exitGame() {
  saveScore();
  bgMusic.pause();
  window.location.href = 'index.html';
}

gameLoop();
</script>
