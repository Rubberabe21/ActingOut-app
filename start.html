<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Agency Arcade - Benvenuto</title>

    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="apple-touch-icon" href="assets/icon.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">

    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="audioManager.js"></script>

    <link rel="stylesheet" href="start.css">
</head>

<body>

<div id="app-wrapper">

    <button id="home-menu-btn" class="top-home-btn">X</button>

    <div id="landing-screen">

        <video
            id="logo-video"
            src="assets/hub/logoanimation.mp4"
            autoplay
            muted
            playsinline
            style="display:none;">
        </video>

        <canvas id="logo-canvas" class="main-logo"></canvas>

        <div
            id="action-buttons-container"
            style="width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;">
        </div>

    </div>

    <!-- LOGIN USATO DIRETTAMENTE DALLA START PAGE -->
    <div id="login-modal">

        <div class="login-box">

            <h3 style="color:#ffff00;font-size:15px;margin-bottom:4px;">
                LOGIN GIOCATORE
            </h3>

            <input
                type="text"
                id="login-username-input"
                class="arcade-input"
                placeholder="NOME UTENTE"
                maxlength="12"
                autocomplete="off">

            <input
                type="password"
                id="login-password-input"
                class="arcade-input"
                placeholder="PASSWORD"
                autocomplete="off">

            <button
                id="login-submit-btn"
                class="arcade-main-btn"
                style="width:100%;padding:10px;">
                ACCEDI
            </button>

            <button
                id="login-cancel-btn"
                class="arcade-secondary-btn"
                style="width:100%;">
                ANNULLA
            </button>

        </div>

    </div>

    <div id="onboarding-screen">

        <div class="center-stage" id="center-stage-box">

            <div class="speech-bubble" id="speech-bubble-box">

                <div class="npc-title">GIOVANNONE</div>

                <div id="dialogue-text" class="dialogue-text"></div>

            </div>

            <div class="npc-stage" id="npc-stage-box">

                <video
                    id="giovannone-video"
                    src="assets/hub/personaggio.mp4"
                    autoplay
                    loop
                    muted
                    playsinline
                    style="display:none;">
                </video>

                <canvas id="npc-canvas"></canvas>

            </div>

        </div>

        <div
            id="full-cover-box"
            class="full-cover-container"
            style="display:none;">

            <div
                class="list-info-header"
                id="list-info-title">
                SELEZIONA UN'OPZIONE
            </div>

            <div
                id="choice-grid"
                class="choice-grid"
                style="display:none;">
            </div>

            <div
                id="avatar-grid"
                class="avatar-grid"
                style="display:none;">
            </div>

        </div>

        <div id="input-group" class="input-group">

            <input
                type="text"
                id="arcade-input-field"
                class="arcade-input"
                autocomplete="off"
                placeholder=""
                style="display:none;">

            <button
                id="step-btn"
                class="arcade-next-btn">
                AVANTI ►
            </button>

        </div>

    </div>

    <div class="crt-overlay"></div>

</div>

<script src="start.js"></script>

</body>
</html>
