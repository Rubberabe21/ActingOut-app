<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Agency Arcade - Benvenuto</title>

    <!-- ICONA WEB APP E PWA -->
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="apple-touch-icon" href="assets/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- SDK SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: 'Courier New', Courier, monospace;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #060612; /* Sfondo identico all'app per evitare bordi neri */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #app-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 360px;
            max-height: 740px;
            background: #060612;
            box-shadow: 0 0 35px rgba(255, 0, 85, 0.25);
            border: 1px solid rgba(255, 0, 85, 0.25);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* FIX DEFINTIVO FULLSCREEN MOBILE SENZA BARRE NERE */
        @media (max-width: 600px) {
            #app-wrapper {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100vw;
                height: 100%;
                max-width: 100vw;
                max-height: 100%;
                border: none;
                box-shadow: none;
            }
        }

        #landing-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: max(env(safe-area-inset-top), 24px) 24px max(env(safe-area-inset-bottom), 24px) 24px;
            text-align: center;
            gap: 12px;
        }
        .main-logo {
            width: 250px;
            height: auto;
            margin-bottom: 24px;
            filter: drop-shadow(0 0 15px rgba(0, 255, 204, 0.4));
            animation: floatLogo 2s ease-in-out infinite alternate;
        }
        @keyframes floatLogo {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-8px) scale(1.02); }
        }
        .arcade-main-btn {
            width: 85%;
            padding: 14px;
            background: linear-gradient(180deg, #ff0055 0%, #b3003b 100%);
            border: 2px solid #ffffff;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1.2px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(255, 0, 85, 0.5), inset 0 1px 0 rgba(255,255,255,0.4);
            transition: transform 0.1s;
        }
        .arcade-main-btn:active { transform: scale(0.95); }
        .arcade-secondary-btn {
            width: 85%;
            padding: 12px;
            background: #101528;
            border: 1.5px solid #00ffcc;
            color: #00ffcc;
            font-size: 13px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }
        .arcade-secondary-btn:active { transform: scale(0.95); }

        #login-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 10, 0.95);
            z-index: 180;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-box {
            width: 100%;
            max-width: 310px;
            background: #090918;
            border: 2px solid #ff0055;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #onboarding-screen {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: max(env(safe-area-inset-top), 20px) 16px max(env(safe-area-inset-bottom), 16px) 16px;
            background-color: #060612;
        }

        .center-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            gap: 12px;
        }

        .speech-bubble {
            position: relative;
            background: #ffffff;
            border: 3px solid #00ffcc;
            border-radius: 16px;
            padding: 14px 16px;
            color: #000000;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            width: 100%;
            z-index: 10;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -13px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 13px 11px 0;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
            z-index: 2;
        }
        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -17px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 16px 13px 0;
            border-style: solid;
            border-color: #00ffcc transparent;
            display: block;
            width: 0;
            z-index: 1;
        }
        .npc-title {
            color: #ff0055;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-align: left;
        }
        
        .dialogue-text {
            color: #000000;
            font-size: 14px;
            line-height: 1.4;
            font-weight: 800;
            min-height: 52px;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .npc-stage {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            overflow: hidden;
        }
        
        .npc-video {
            width: 230px;
            max-width: 80vw;
            height: auto;
            object-fit: contain;
            mix-blend-mode: screen;
            background: transparent;
        }

        .input-group {
            margin-top: 6px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .arcade-input {
            width: 100%;
            padding: 12px;
            background: #04040a;
            border: 2px solid #ff0055;
            color: #00ffcc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            text-align: center;
            font-weight: bold;
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            max-height: 460px;
            overflow-y: auto;
            padding: 6px;
            background: #04040a;
            border: 2px solid #00ffcc;
            box-shadow: inset 0 0 15px rgba(0, 255, 204, 0.2), 0 0 15px rgba(0, 255, 204, 0.3);
            border-radius: 12px;
            margin-bottom: 4px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .avatar-grid::-webkit-scrollbar {
            width: 6px;
        }
        .avatar-grid::-webkit-scrollbar-track {
            background: #060612;
            border-radius: 4px;
        }
        .avatar-grid::-webkit-scrollbar-thumb {
            background: #00ffcc;
            border-radius: 4px;
            box-shadow: 0 0 8px #00ffcc;
        }

        .avatar-option {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 8px;
            border: 2px solid #1a1a3a;
            background: #0c0c20;
            cursor: pointer;
            object-fit: cover;
            transition: all 0.15s ease-in-out;
        }
        .avatar-option.selected {
            border-color: #00ffcc;
            box-shadow: 0 0 12px #00ffcc;
            transform: scale(1.08);
            z-index: 5;
        }

        .arcade-next-btn {
            width: 100%;
            padding: 13px;
            background: #00ffcc;
            border: none;
            color: #000000;
            font-size: 14px;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.5);
            transition: opacity 0.2s ease, transform 0.1s ease;
        }
        .arcade-next-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
            transform: none !important;
        }
        .arcade-next-btn:active:not(:disabled) { transform: scale(0.96); }

        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 99;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 4px, 6px 100%;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<script>

const AVATAR_LIST = Array.from({ length: 102 }, (_, i) => `assets/avatars/testa${i + 1}.png`);

    { text: "anche se è un po come se lo fosse", type: "none", btn: "AVANTI ►" },
    { text: "...", type: "none", btn: "AVANTI ►" },
    { text: "Ora torno a lavoro, buon lavoro anche a te.", type: "finish", btn: "ENTRA NELLO STUDIO 🚀" }
];

function getSavedUser() {
    try {
        const u = localStorage.getItem('arcade_current_user');
        return u ? JSON.parse(u) : null;
    } catch(e) { return null; }
}

function getUsers() {
    try {
        return JSON.parse(localStorage.getItem('arcade_users')) || {};
    } catch(e) { return {}; }
}

const landingScreen = document.getElementById('landing-screen');
const onboardingScreen = document.getElementById('onboarding-screen');
const loginModal = document.getElementById('login-modal');
const actionButtonsContainer = document.getElementById('action-buttons-container');
const npcStageBox = document.getElementById('npc-stage-box');

const dialogueText = document.getElementById('dialogue-text');
const inputField = document.getElementById('arcade-input-field');
const avatarGrid = document.getElementById('avatar-grid');
const stepBtn = document.getElementById('step-btn');

function renderLandingButtons() {
    const currentUser = getSavedUser();
    const isLoggedIn = currentUser && currentUser.username && !currentUser.username.startsWith("GUEST_");

    actionButtonsContainer.innerHTML = "";

    if (isLoggedIn) {
        const btnContinue = document.createElement('button');
        btnContinue.className = "arcade-main-btn";
        btnContinue.innerText = "CONTINUA ►";
        btnContinue.onclick = () => {
            sessionStorage.setItem('arcade_session_active', 'true');
            window.location.href = "index.html";
        };

        const btnLogout = document.createElement('button');
        btnLogout.className = "arcade-secondary-btn";
        btnLogout.innerText = "ESCI 🚪";
        btnLogout.onclick = () => {
            localStorage.removeItem('arcade_current_user');
            renderLandingButtons();
        };

        actionButtonsContainer.appendChild(btnContinue);
        actionButtonsContainer.appendChild(btnLogout);
    } else {
        const btnStart = document.createElement('button');
        btnStart.className = "arcade-main-btn";
        btnStart.innerText = "INIZIA 🕹️";
        btnStart.onclick = () => { startOnboarding(); };

        const btnLogin = document.createElement('button');
        btnLogin.className = "arcade-secondary-btn";
        btnLogin.innerText = "ACCEDI / LOGIN 👤";
        btnLogin.onclick = () => { loginModal.style.display = "flex"; };

        actionButtonsContainer.appendChild(btnStart);
        actionButtonsContainer.appendChild(btnLogin);
    }
}

renderLandingButtons();

document.getElementById('login-cancel-btn').onclick = () => {
    loginModal.style.display = "none";
};

document.getElementById('login-submit-btn').onclick = async () => {
    const uVal = document.getElementById('login-username-input').value.trim();
    const pVal = document.getElementById('login-password-input').value.trim();

    if (!uVal || !pVal) { alert("Inserisci Nome Utente e Password!"); return; }

    const defaultStats = { gamesPlayed: 0, feedbackInvaders: 0, cyberRun: 0, pixelPunch: 0, deadlineDrive: 0 };
    let loggedUser = null;

    if (supabaseClient) {
        try {
            let { data, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('username', uVal)
                .eq('password', pVal)
                .maybeSingle();

            if (data) {
                loggedUser = {
                    username: data.username,
                    avatar: data.avatar || "assets/avatars/testa1.png",
                    stats: data.stats || defaultStats
                };
            }
        } catch (e) { console.warn("Errore login Supabase:", e); }
    }

    if (!loggedUser) {
        let users = getUsers();
        if (users[uVal] && users[uVal].password === pVal) {
            loggedUser = {
                username: uVal,
                avatar: users[uVal].avatar || "assets/avatars/testa1.png",
                stats: users[uVal].stats || defaultStats
            };
        }
    }

    if (loggedUser) {
        localStorage.setItem('arcade_current_user', JSON.stringify(loggedUser));
        sessionStorage.setItem('arcade_session_active', 'true');
        window.location.href = "index.html";
    } else {
        alert("Credenziali errate o utente non trovato!");
    }
};

let currentStepIdx = 0;
let tempUsername = "";
let tempPassword = "";
let tempAvatar = AVATAR_LIST[0];
let isTyping = false;

function startOnboarding() {
    landingScreen.style.display = "none";
    onboardingScreen.style.display = "flex";
    currentStepIdx = 0;
    renderStep();
}

function renderStep() {
    const stepData = DIALOGUE_STEPS[currentStepIdx];
    inputField.style.display = "none";
    avatarGrid.style.display = "none";
    inputField.value = "";

    stepBtn.innerText = stepData.btn || "AVANTI ►";

    if (stepData.type === "avatar") {
        npcStageBox.style.display = "none";
    } else {
        npcStageBox.style.display = "flex";
    }

    typeWriter(stepData.text, () => {
        if (stepData.type === "username") {
            inputField.style.display = "block";
            inputField.type = "text";
            inputField.placeholder = stepData.placeholder;
            inputField.maxLength = 12;
            inputField.focus();
        } else if (stepData.type === "password") {
            inputField.style.display = "block";
            inputField.type = "password";
            inputField.placeholder = stepData.placeholder;
            inputField.maxLength = 20;
            inputField.focus();
        } else if (stepData.type === "avatar") {
            renderAvatarGrid();
            avatarGrid.style.display = "grid";
        }
    });
}

function renderAvatarGrid() {
    avatarGrid.innerHTML = "";
    AVATAR_LIST.forEach((src) => {
        const img = document.createElement('img');
        img.src = src;
        img.loading = "lazy";
        img.className = `avatar-option ${src === tempAvatar ? 'selected' : ''}`;
        img.onerror = () => { img.style.display = 'none'; };

        img.onclick = () => {
            tempAvatar = src;
            document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
            img.classList.add('selected');
        };
        avatarGrid.appendChild(img);
    });
}

stepBtn.onclick = async () => {
    if (isTyping) return;

    const stepData = DIALOGUE_STEPS[currentStepIdx];

    if (stepData.type === "username") {
        const val = inputField.value.trim();
        if (!val) { alert("Inserisci un nome utente!"); return; }

        if (supabaseClient) {
            try {
                let { data } = await supabaseClient.from('profiles').select('username').eq('username', val).maybeSingle();
                if (data) { alert("Nome utente già esistente!"); return; }
            } catch (e) {}
        }

        let users = getUsers();
        if (users[val]) { alert("Nome utente già esistente!"); return; }
        tempUsername = val;

    } else if (stepData.type === "password") {
        const pass = inputField.value.trim();
        if (!pass) { alert("Inserisci una password!"); return; }
        tempPassword = pass;

        const defaultStats = { gamesPlayed: 0, feedbackInvaders: 0, cyberRun: 0, pixelPunch: 0, deadlineDrive: 0 };

        if (supabaseClient) {
            try {
                const { error } = await supabaseClient.from('profiles').upsert({
                    username: tempUsername,
                    password: tempPassword,
                    avatar: tempAvatar,
                    stats: defaultStats
                });

                if (error) {
                    alert("Errore registrazione Supabase: " + error.message);
                    return;
                }
            } catch (e) {
                alert("Errore durante il salvataggio su Supabase!");
                return;
            }
        }

        let users = getUsers();
        users[tempUsername] = { password: tempPassword, avatar: tempAvatar, stats: defaultStats };
        localStorage.setItem('arcade_users', JSON.stringify(users));

        const newUser = { username: tempUsername, avatar: tempAvatar, stats: defaultStats };
        localStorage.setItem('arcade_current_user', JSON.stringify(newUser));

    } else if (stepData.type === "finish") {
        sessionStorage.setItem('arcade_session_active', 'true');
        window.location.href = "index.html";
        return;
    }

    currentStepIdx++;
    if (currentStepIdx < DIALOGUE_STEPS.length) {
        renderStep();
    } else {
        sessionStorage.setItem('arcade_session_active', 'true');
        window.location.href = "index.html";
    }
};

function typeWriter(text, onComplete) {
    isTyping = true;
    stepBtn.disabled = true;

    dialogueText.textContent = "";
    let i = 0;
    const speed = 18;

    function type() {
        if (i < text.length) {
            dialogueText.textContent += text.charAt(i);
            i++;
            setTimeout(type, speed);
        } else {
            isTyping = false;
            stepBtn.disabled = false;
            if (onComplete) onComplete();
        }
    }
    type();
}
</script>
