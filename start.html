const logoVideo = document.getElementById('logo-video');
const logoCanvas = document.getElementById('logo-canvas');
const logoCtx = logoCanvas.getContext('2d', { willReadFrequently: true });

function processLogoFrame() {
    if (!logoVideo) return;

    if (logoVideo.videoWidth && logoVideo.videoHeight) {
        if (logoCanvas.width !== logoVideo.videoWidth) {
            logoCanvas.width = logoVideo.videoWidth;
            logoCanvas.height = logoVideo.videoHeight;
        }
        logoCtx.drawImage(logoVideo, 0, 0, logoCanvas.width, logoCanvas.height);
        
        try {
            let frame = logoCtx.getImageData(0, 0, logoCanvas.width, logoCanvas.height);
            let data = frame.data;
            
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];
                
                let dist = Math.sqrt((r - 61) * (r - 61) + (g - 255) * (g - 255) + (b - 3) * (b - 3));
                if (dist < 165 || (g > 100 && g > r * 1.25 && g > b * 1.25)) {
                    data[i + 3] = 0;
                }
            }
            logoCtx.putImageData(frame, 0, 0);
        } catch (e) {
            console.error("Errore lettura Canvas:", e);
        }
    }
    
    if (!logoVideo.ended && !logoVideo.paused) {
        requestAnimationFrame(processLogoFrame);
    }
}

if (logoVideo) {
    logoVideo.onloadedmetadata = () => {
        logoVideo.play().catch(err => console.log("Autoplay impedito:", err));
    };
    logoVideo.addEventListener('play', () => {
        requestAnimationFrame(processLogoFrame);
    });
    logoVideo.addEventListener('ended', () => {
        processLogoFrame();
    });
    logoVideo.play().catch(() => {});
}

const npcVideo = document.getElementById('giovannone-video');
const npcCanvas = document.getElementById('npc-canvas');
const npcCtx = npcCanvas.getContext('2d', { willReadFrequently: true });

function processNpcFrame() {
    if (npcVideo && !npcVideo.paused && !npcVideo.ended) {
        if (npcVideo.videoWidth && npcVideo.videoHeight) {
            if (npcCanvas.width !== npcVideo.videoWidth || npcCanvas.height !== npcVideo.videoHeight) {
                npcCanvas.width = npcVideo.videoWidth;
                npcCanvas.height = npcVideo.videoHeight;
            }

            npcCtx.drawImage(npcVideo, 0, 0, npcCanvas.width, npcCanvas.height);
            try {
                let frame = npcCtx.getImageData(0, 0, npcCanvas.width, npcCanvas.height);
                let data = frame.data;
                let len = data.length;

                for (let i = 0; i < len; i += 4) {
                    let r = data[i];
                    let g = data[i + 1];
                    let b = data[i + 2];

                    let dist = Math.hypot(r - 61, g - 255, b - 3);

                    if (dist < 145 || (g > 110 && g > r * 1.15 && g > b * 1.15)) {
                        data[i + 3] = 0;
                    } else {
                        let maxRB = Math.max(r, b);
                        if (g > maxRB) {
                            data[i + 1] = maxRB;
                        }
                    }
                }
                npcCtx.putImageData(frame, 0, 0);
            } catch (e) {}
        }
    }
    requestAnimationFrame(processNpcFrame);
}

npcVideo.addEventListener('play', () => {
    requestAnimationFrame(processNpcFrame);
});

function getSavedUser() {
    try {
        const u = localStorage.getItem('arcade_current_user');
        return u ? JSON.parse(u) : null;
    } catch(e) { return null; }
}

const landingScreen = document.getElementById('landing-screen');
const onboardingScreen = document.getElementById('onboarding-screen');
const loginModal = document.getElementById('login-modal');
const actionButtonsContainer = document.getElementById('action-buttons-container');
const centerStageBox = document.getElementById('center-stage-box');
const speechBubbleBox = document.getElementById('speech-bubble-box');
const npcStageBox = document.getElementById('npc-stage-box');
const homeMenuBtn = document.getElementById('home-menu-btn');

const fullCoverBox = document.getElementById('full-cover-box');
const listInfoTitle = document.getElementById('list-info-title');
const dialogueText = document.getElementById('dialogue-text');
const inputField = document.getElementById('arcade-input-field');
const choiceGrid = document.getElementById('choice-grid');
const avatarGrid = document.getElementById('avatar-grid');
const stepBtn = document.getElementById('step-btn');

function renderLandingButtons() {
    const currentUser = getSavedUser();
    const isLoggedIn = currentUser && currentUser.username && !currentUser.username.startsWith("GUEST_");

    actionButtonsContainer.innerHTML = "";
    homeMenuBtn.style.display = "none";

    if (isLoggedIn) {
        const btnContinue = document.createElement('button');
        btnContinue.className = "arcade-main-btn";
        btnContinue.innerText = "CONTINUA ►";
        btnContinue.onclick = () => {
            sessionStorage.setItem('arcade_session_active', 'true');
            localStorage.setItem('arcade_player_x', '200');
            window.location.replace("index.html");
        };

        const btnLogout = document.createElement('button');
        btnLogout.className = "arcade-secondary-btn";
        btnLogout.innerText = "ESCI";
        btnLogout.onclick = () => {
            localStorage.removeItem('arcade_current_user');
            renderLandingButtons();
        };

        actionButtonsContainer.appendChild(btnContinue);
        actionButtonsContainer.appendChild(btnLogout);
    } else {
        const btnStart = document.createElement('button');
        btnStart.className = "arcade-main-btn";
        btnStart.innerText = "INIZIA";
        btnStart.onclick = () => { startOnboarding(); };

        const btnLogin = document.createElement('button');
        btnLogin.className = "arcade-secondary-btn";
        btnLogin.innerText = "ACCEDI / LOGIN";
        btnLogin.onclick = () => { loginModal.style.display = "flex"; };

        actionButtonsContainer.appendChild(btnStart);
        actionButtonsContainer.appendChild(btnLogin);
    }
}

renderLandingButtons();

homeMenuBtn.onclick = () => {
    onboardingScreen.style.display = "none";
    landingScreen.style.display = "flex";
    homeMenuBtn.style.display = "none";
    currentStepIdx = 0;
};

document.getElementById('login-cancel-btn').onclick = () => {
    loginModal.style.display = "none";
};

document.getElementById('login-submit-btn').onclick = async () => {
    const uVal = document.getElementById('login-username-input').value.trim();
    const pVal = document.getElementById('login-password-input').value.trim();

    if (!uVal || !pVal) { alert("Inserisci Nome Utente e Password!"); return; }

    const defaultStats = { gamesPlayed: 0, feedbackInvaders: 0, cyberRun: 0, pixelPunch: 0, deadlineDrive: 0 };
    let loggedUser = null;

    if (supabaseClient) {
        try {
            let { data, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('username', uVal)
                .eq('password', pVal)
                .maybeSingle();

            if (data && !error) {
                loggedUser = {
                    username: data.username,
                    avatar: data.avatar || "assets/avatars/testa1.png",
                    activity: data.activity || "",
                    role: data.role || "",
                    stats: data.stats || defaultStats
                };
            }
        } catch (e) { console.warn("Errore login Supabase:", e); }
    }

    if (loggedUser) {
        localStorage.setItem('arcade_current_user', JSON.stringify(loggedUser));
        localStorage.setItem('arcade_player_x', '200');
        sessionStorage.setItem('arcade_session_active', 'true');
        window.location.replace("index.html");
    } else {
        alert("Credenziali errate o utente non trovato su Supabase!");
    }
};

let currentStepIdx = 0;
let stepPhase = 'dialogue'; // 'dialogue' oppure 'input'
let tempUsername = "";
let tempPassword = "";
let tempAvatar = AVATAR_LIST[0];
let tempActivity = "";
let tempRole = "";
let isTyping = false;
let currentTypeSpeed = 18;
let autoAdvanceTimeout = null;

// TAP SU AREA VUOTA PER VELOCIZZARE LA DIGITAZIONE DEL TESTO (FAST-FORWARD)
document.getElementById('onboarding-screen').addEventListener('pointerdown', (e) => {
    if (e.target.closest('button, input, .choice-btn, .avatar-option, .choice-grid, .avatar-grid')) {
        return;
    }
    if (isTyping) {
        currentTypeSpeed = 2; // Velocità ultra-rapida al tocco
    }
});

function startOnboarding() {
    landingScreen.style.display = "none";
    onboardingScreen.style.display = "flex";
    homeMenuBtn.style.display = "flex";
    currentStepIdx = 0;
    stepPhase = 'dialogue';

    if (npcVideo.paused) {
        npcVideo.play().catch(() => {});
    }

    renderStep();
}

function renderStep() {
    if (autoAdvanceTimeout) {
        clearTimeout(autoAdvanceTimeout);
        autoAdvanceTimeout = null;
    }

    stepPhase = 'dialogue';
    const stepData = DIALOGUE_STEPS[currentStepIdx];
    inputField.style.display = "none";
    fullCoverBox.style.display = "none";
    choiceGrid.style.display = "none";
    avatarGrid.style.display = "none";
    inputField.value = "";

    centerStageBox.style.display = "flex";
    npcStageBox.style.display = "flex";

    // Testo del bottone durante o subito dopo la battuta parlata
    if (stepData.type === "username" || stepData.type === "password" || stepData.type === "choice_activity" || stepData.type === "choice_role" || stepData.type === "avatar") {
        stepBtn.innerText = stepData.promptBtn || "CONTINUA ►";
    } else {
        stepBtn.innerText = stepData.btn || "AVANTI ►";
    }

    const isDotsOnly = /^\.+$|^\s*$/.test(stepData.text.trim().replace(/\s/g, ''));

    typeWriter(stepData.text, () => {
        if (isDotsOnly && stepData.type === "none") {
            stepBtn.disabled = true;
            autoAdvanceTimeout = setTimeout(() => {
                advanceStep();
            }, 500);
            return;
        }
    }, isDotsOnly);
}

function renderChoiceGrid(options, onSelectCallback) {
    choiceGrid.innerHTML = "";
    let selectedVal = "";

    options.forEach((optText, index) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = optText;

        if (index === 0) {
            btn.classList.add('selected');
            selectedVal = optText;
            onSelectCallback(selectedVal);
        }

        btn.onclick = () => {
            document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedVal = optText;
            onSelectCallback(selectedVal);
        };

        choiceGrid.appendChild(btn);
    });

    requestAnimationFrame(() => {
        choiceGrid.scrollTop = 0;
    });
    setTimeout(() => {
        choiceGrid.scrollTop = 0;
    }, 10);
}

function renderAvatarGrid() {
    avatarGrid.innerHTML = "";
    const fragment = document.createDocumentFragment();

    AVATAR_LIST.forEach((src) => {
        const img = document.createElement('img');
        img.src = src;
        img.loading = "lazy";
        img.className = `avatar-option ${src === tempAvatar ? 'selected' : ''}`;
        img.onerror = function() { this.style.display = 'none'; };

        img.onclick = function() {
            tempAvatar = src;
            const allAvatars = avatarGrid.querySelectorAll('.avatar-option');
            allAvatars.forEach(el => el.classList.remove('selected'));
            this.classList.add('selected');
        };
        fragment.appendChild(img);
    });

    avatarGrid.appendChild(fragment);

    requestAnimationFrame(() => {
        avatarGrid.scrollTop = 0;
    });
    setTimeout(() => {
        avatarGrid.scrollTop = 0;
    }, 10);
}

async function advanceStep() {
    if (autoAdvanceTimeout) {
        clearTimeout(autoAdvanceTimeout);
        autoAdvanceTimeout = null;
    }

    if (isTyping) return;

    const stepData = DIALOGUE_STEPS[currentStepIdx];

    // FASE 1: Il personaggio ha parlato, l'utente clicca il bottone per far uscire l'input o la lista
    if (stepPhase === 'dialogue' && ["username", "password", "choice_activity", "choice_role", "avatar"].includes(stepData.type)) {
        stepPhase = 'input';

        if (stepData.type === "username") {
            centerStageBox.appendChild(inputField);
            inputField.style.display = "block";
            inputField.className = "arcade-input arcade-input-bottom";
            inputField.type = "text";
            inputField.placeholder = stepData.placeholder;
            inputField.maxLength = 20;
            inputField.focus();
            stepBtn.innerText = stepData.btn || "CONFERMA NOME ►";
        } else if (stepData.type === "password") {
            centerStageBox.appendChild(inputField);
            inputField.style.display = "block";
            inputField.className = "arcade-input arcade-input-bottom";
            inputField.type = "password";
            inputField.placeholder = stepData.placeholder;
            inputField.maxLength = 100;
            inputField.focus();
            stepBtn.innerText = stepData.btn || "SALVA PASSWORD ►";
        } else if (stepData.type === "choice_activity") {
            fullCoverBox.style.display = "flex";
            listInfoTitle.innerText = stepData.infoText || "qualcosa che ti rappresenta";
            renderChoiceGrid(stepData.options, (val) => { tempActivity = val; });
            choiceGrid.style.display = "flex";
            choiceGrid.scrollTop = 0;
            setTimeout(() => { choiceGrid.scrollTop = 0; }, 10);
            stepBtn.innerText = stepData.btn || "CONFERMA SCELTA ►";
        } else if (stepData.type === "choice_role") {
            fullCoverBox.style.display = "flex";
            listInfoTitle.innerText = stepData.infoText || "chi sei tu veramente?";
            renderChoiceGrid(stepData.options, (val) => { tempRole = val; });
            choiceGrid.style.display = "flex";
            choiceGrid.scrollTop = 0;
            setTimeout(() => { choiceGrid.scrollTop = 0; }, 10);
            stepBtn.innerText = stepData.btn || "CONFERMA SCELTA ►";
        } else if (stepData.type === "avatar") {
            fullCoverBox.style.display = "flex";
            listInfoTitle.innerText = stepData.infoText || "che faccia hai?";
            renderAvatarGrid();
            avatarGrid.style.display = "grid";
            avatarGrid.scrollTop = 0;
            setTimeout(() => { avatarGrid.scrollTop = 0; }, 10);
            stepBtn.innerText = stepData.btn || "SCEGLI QUESTA TESTA ►";
        }
        return;
    }

    // FASE 2: L'utente conferma l'input/scelta e salva o avanza al prossimo passo
    if (stepData.type === "username") {
        const val = inputField.value.trim();
        if (!val) { alert("Inserisci un nome utente!"); return; }

        stepBtn.disabled = true;
        stepBtn.innerText = "VERIFICA IN CORSO...";

        if (supabaseClient) {
            try {
                let { data } = await supabaseClient.from('profiles').select('username').eq('username', val).maybeSingle();
                if (data) { 
                    alert("Nome utente già esistente sul Cloud!"); 
                    stepBtn.disabled = false;
                    stepBtn.innerText = stepData.btn || "CONFERMA NOME ►";
                    return; 
                }
            } catch (e) {
                console.warn("Errore verifica username Supabase:", e);
            }
        } else {
            alert("Connessione a Supabase non disponibile!");
            stepBtn.disabled = false;
            stepBtn.innerText = stepData.btn || "CONFERMA NOME ►";
            return;
        }

        stepBtn.disabled = false;
        tempUsername = val;

    } else if (stepData.type === "choice_activity") {
        if (!tempActivity) { alert("Seleziona un'opzione!"); return; }
    } else if (stepData.type === "choice_role") {
        if (!tempRole) { alert("Seleziona chi sei!"); return; }
    } else if (stepData.type === "password") {
        const pass = inputField.value;
        if (!pass || pass.trim().length === 0) { alert("Inserisci una password valida!"); return; }

        tempPassword = pass;
        stepBtn.disabled = true;
        stepBtn.innerText = "SALVATAGGIO...";

        const defaultStats = { gamesPlayed: 0, feedbackInvaders: 0, cyberRun: 0, pixelPunch: 0, deadlineDrive: 0 };

        if (supabaseClient) {
            try {
                const { error } = await supabaseClient.from('profiles').upsert({
                    username: tempUsername,
                    password: tempPassword,
                    avatar: tempAvatar,
                    activity: tempActivity,
                    role: tempRole,
                    stats: defaultStats
                });

                if (error) {
                    alert("Errore registrazione Supabase: " + error.message);
                    stepBtn.disabled = false;
                    stepBtn.innerText = stepData.btn || "SALVA PASSWORD ►";
                    return;
                }
            } catch (e) {
                alert("Errore durante il salvataggio su Supabase!");
                stepBtn.disabled = false;
                stepBtn.innerText = stepData.btn || "SALVA PASSWORD ►";
                return;
            }
        } else {
            alert("Connessione a Supabase non disponibile!");
            stepBtn.disabled = false;
            stepBtn.innerText = stepData.btn || "SALVA PASSWORD ►";
            return;
        }

        const newUser = { 
            username: tempUsername, 
            avatar: tempAvatar, 
            activity: tempActivity,
            role: tempRole,
            stats: defaultStats 
        };
        localStorage.setItem('arcade_current_user', JSON.stringify(newUser));
        localStorage.setItem('arcade_player_x', '200');
        stepBtn.disabled = false;

    } else if (stepData.type === "finish") {
        sessionStorage.setItem('arcade_session_active', 'true');
        localStorage.setItem('arcade_player_x', '200');
        window.location.replace("index.html"); 
        return;
    }

    currentStepIdx++;
    stepPhase = 'dialogue';

    if (currentStepIdx < DIALOGUE_STEPS.length) {
        renderStep();
    } else {
        sessionStorage.setItem('arcade_session_active', 'true');
        localStorage.setItem('arcade_player_x', '200');
        window.location.replace("index.html"); 
    }
}

stepBtn.onclick = advanceStep;

function typeWriter(text, onComplete, isDotsOnly = false) {
    isTyping = true;
    stepBtn.disabled = true;
    currentTypeSpeed = 18; // Reset velocità standard per ogni nuova frase

    dialogueText.textContent = "";
    let i = 0;

    function type() {
        if (i < text.length) {
            dialogueText.textContent += text.charAt(i);
            i++;
            setTimeout(type, currentTypeSpeed);
        } else {
            if (onComplete) onComplete();
            if (!isDotsOnly) {
                setTimeout(() => {
                    isTyping = false;
                    stepBtn.disabled = false;
                }, 300);
            } else {
                isTyping = false;
            }
        }
    }
    type();
}
</script>
