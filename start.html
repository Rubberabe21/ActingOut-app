// Logo Animation with Chroma Key Green Screen Removal (#3DFF03)
const logoVideo = document.getElementById('logo-video');
const logoCanvas = document.getElementById('logo-canvas');
const logoCtx = logoCanvas.getContext('2d', { willReadFrequently: true });

function processLogoFrame() {
    if (!logoVideo) return;

    if (logoVideo.videoWidth && logoVideo.videoHeight) {
        if (logoCanvas.width !== logoVideo.videoWidth) {
            logoCanvas.width = logoVideo.videoWidth;
            logoCanvas.height = logoVideo.videoHeight;
        }
        logoCtx.drawImage(logoVideo, 0, 0, logoCanvas.width, logoCanvas.height);
        
        try {
            let frame = logoCtx.getImageData(0, 0, logoCanvas.width, logoCanvas.height);
            let data = frame.data;
            
            // Rimuove lo sfondo verde #3DFF03 (R:61, G:255, B:3)
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];
                
                let dist = Math.sqrt((r - 61) * (r - 61) + (g - 255) * (g - 255) + (b - 3) * (b - 3));
                if (dist < 165 || (g > 100 && g > r * 1.25 && g > b * 1.25)) {
                    data[i + 3] = 0;
                }
            }
            logoCtx.putImageData(frame, 0, 0);
        } catch (e) {
            console.error("Errore lettura Canvas (verificare protocollo server locale):", e);
        }
    }
    
    if (!logoVideo.ended && !logoVideo.paused) {
        requestAnimationFrame(processLogoFrame);
    }
}

if (logoVideo) {
    logoVideo.onloadedmetadata = () => {
        logoVideo.play().catch(err => console.log("Autoplay impedito:", err));
    };
    logoVideo.addEventListener('play', () => {
        requestAnimationFrame(processLogoFrame);
    });
    logoVideo.addEventListener('ended', () => {
        processLogoFrame();
    });
    logoVideo.play().catch(() => {});
}

        btnContinue.className = "arcade-main-btn";
        btnContinue.innerText = "CONTINUA ►";
        btnContinue.onclick = () => {
            sessionStorage.setItem('arcade_session_active', 'true');
            window.location.replace("index.html");
        };

        const btnLogout = document.createElement('button');
        btnLogout.className = "arcade-secondary-btn";
        btnLogout.innerText = "ESCI";
        btnLogout.onclick = () => {
            localStorage.removeItem('arcade_current_user');
            renderLandingButtons();
        };

        actionButtonsContainer.appendChild(btnContinue);
        actionButtonsContainer.appendChild(btnLogout);
    } else {
        const btnStart = document.createElement('button');
        btnStart.className = "arcade-main-btn";
        btnStart.innerText = "INIZIA";
        btnStart.onclick = () => { startOnboarding(); };

        const btnLogin = document.createElement('button');
        btnLogin.className = "arcade-secondary-btn";
        btnLogin.innerText = "ACCEDI / LOGIN";
        btnLogin.onclick = () => { loginModal.style.display = "flex"; };

        actionButtonsContainer.appendChild(btnStart);
        actionButtonsContainer.appendChild(btnLogin);
    }
}

renderLandingButtons();

homeMenuBtn.onclick = () => {
    onboardingScreen.style.display = "none";
    landingScreen.style.display = "flex";
    homeMenuBtn.style.display = "none";
    currentStepIdx = 0;
};

document.getElementById('login-cancel-btn').onclick = () => {
    loginModal.style.display = "none";
};

document.getElementById('login-submit-btn').onclick = async () => {
    const uVal = document.getElementById('login-username-input').value.trim();
    const pVal = document.getElementById('login-password-input').value.trim();

    if (!uVal || !pVal) { alert("Inserisci Nome Utente e Password!"); return; }

    const defaultStats = { gamesPlayed: 0, feedbackInvaders: 0, cyberRun: 0, pixelPunch: 0, deadlineDrive: 0 };
    let loggedUser = null;

    if (supabaseClient) {
        try {
            let { data, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('username', uVal)
                .eq('password', pVal)
                .maybeSingle();

            if (data) {
                loggedUser = {
                    username: data.username,
                    avatar: data.avatar || "assets/avatars/testa1.png",
                    stats: data.stats || defaultStats
                };
            }
        } catch (e) { console.warn("Errore login Supabase:", e); }
    }

    if (!loggedUser) {
        let users = getUsers();
        if (users[uVal] && users[uVal].password === pVal) {
            loggedUser = {
                username: uVal,
                avatar: users[uVal].avatar || "assets/avatars/testa1.png",
                stats: users[uVal].stats || defaultStats
            };
        }
    }

    if (loggedUser) {
        localStorage.setItem('arcade_current_user', JSON.stringify(loggedUser));
        sessionStorage.setItem('arcade_session_active', 'true');
        window.location.replace("index.html");
    } else {
        alert("Credenziali errate o utente non trovato!");
    }
};

let currentStepIdx = 0;
let tempUsername = "";
let tempPassword = "";
let tempAvatar = AVATAR_LIST[0];
let tempActivity = "";
let tempRole = "";
let isTyping = false;
let autoAdvanceTimeout = null;

function startOnboarding() {
    landingScreen.style.display = "none";
    onboardingScreen.style.display = "flex";
    homeMenuBtn.style.display = "flex";
    currentStepIdx = 0;
    renderStep();
}

function renderStep() {
    if (autoAdvanceTimeout) {
        clearTimeout(autoAdvanceTimeout);
        autoAdvanceTimeout = null;
    }

    const stepData = DIALOGUE_STEPS[currentStepIdx];
    inputField.style.display = "none";
    choiceGrid.style.display = "none";
    avatarGrid.style.display = "none";
    inputField.value = "";

    // Ripristina la visibilità del video di Giovannone per i dialoghi standard
    npcStageBox.style.display = "flex";

    // Posizionamento del campo Input in Alto (sotto al fumetto) per Nome e Password
    if (stepData.type === "username" || stepData.type === "password") {
        document.querySelector('.center-stage').appendChild(inputField);
    } else {
        document.getElementById('input-group').insertBefore(inputField, stepBtn);
    }

    stepBtn.innerText = stepData.btn || "AVANTI ►";

    typeWriter(stepData.text, () => {
        // Verifica se il testo contiene solo puntini (es. "...", "... ...")
        const isDotsOnly = /^\.+$|^\s*$/.test(stepData.text.trim().replace(/\s/g, ''));

        if (isDotsOnly && stepData.type === "none") {
            autoAdvanceTimeout = setTimeout(() => {
                advanceStep();
            }, 1000); // Avanza in automatico dopo 1 secondo
            return;
        }

        setTimeout(() => {
            if (stepData.type === "username") {
                inputField.style.display = "block";
                inputField.className = "arcade-input arcade-input-top";
                inputField.type = "text";
                inputField.placeholder = stepData.placeholder;
                inputField.maxLength = 12;
                inputField.focus();
            } else if (stepData.type === "password") {
                inputField.style.display = "block";
                inputField.className = "arcade-input arcade-input-top";
                inputField.type = "password";
                inputField.placeholder = stepData.placeholder;
                inputField.maxLength = 20;
                inputField.focus();
            } else if (stepData.type === "choice_activity") {
                npcStageBox.style.display = "none"; // Nasconde il video per dare spazio all'elenco
                renderChoiceGrid(stepData.options, (val) => { tempActivity = val; });
                choiceGrid.style.display = "flex";
            } else if (stepData.type === "choice_role") {
                npcStageBox.style.display = "none"; // Nasconde il video per dare spazio all'elenco
                renderChoiceGrid(stepData.options, (val) => { tempRole = val; });
                choiceGrid.style.display = "flex";
            } else if (stepData.type === "avatar") {
                npcStageBox.style.display = "none"; // Nasconde il video per dare spazio alle teste
                renderAvatarGrid();
                avatarGrid.style.display = "grid";
            }
        }, 300);
    });
}

function renderChoiceGrid(options, onSelectCallback) {
    choiceGrid.innerHTML = "";
    let selectedVal = "";

    options.forEach((optText, index) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = optText;

        if (index === 0) {
            btn.classList.add('selected');
            selectedVal = optText;
            onSelectCallback(selectedVal);
        }

        btn.onclick = () => {
            document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedVal = optText;
            onSelectCallback(selectedVal);
        };

        choiceGrid.appendChild(btn);
    });
}

function renderAvatarGrid() {
    avatarGrid.innerHTML = "";
    const fragment = document.createDocumentFragment();

    AVATAR_LIST.forEach((src) => {
        const img = document.createElement('img');
        img.src = src;
        img.loading = "lazy";
        img.className = `avatar-option ${src === tempAvatar ? 'selected' : ''}`;
        img.onerror = function() { this.style.display = 'none'; };

        img.onclick = function() {
            tempAvatar = src;
            const allAvatars = avatarGrid.querySelectorAll('.avatar-option');
            allAvatars.forEach(el => el.classList.remove('selected'));
            this.classList.add('selected');
        };
        fragment.appendChild(img);
    });

    avatarGrid.appendChild(fragment);
}

async function advanceStep() {
    if (autoAdvanceTimeout) {
        clearTimeout(autoAdvanceTimeout);
        autoAdvanceTimeout = null;
    }

    if (isTyping) return;

    const stepData = DIALOGUE_STEPS[currentStepIdx];

    if (stepData.type === "username") {
        const val = inputField.value.trim();
        if (!val) { alert("Inserisci un nome utente!"); return; }

        if (supabaseClient) {
            try {
                let { data } = await supabaseClient.from('profiles').select('username').eq('username', val).maybeSingle();
                if (data) { alert("Nome utente già esistente!"); return; }
            } catch (e) {}
        }

        let users = getUsers();
        if (users[val]) { alert("Nome utente già esistente!"); return; }
        tempUsername = val;

    } else if (stepData.type === "choice_activity") {
        if (!tempActivity) { alert("Seleziona un'opzione!"); return; }
    } else if (stepData.type === "choice_role") {
        if (!tempRole) { alert("Seleziona chi sei!"); return; }
    } else if (stepData.type === "password") {
        const pass = inputField.value.trim();
        if (!pass) { alert("Inserisci una password!"); return; }
        tempPassword = pass;

        const defaultStats = { gamesPlayed: 0, feedbackInvaders: 0, cyberRun: 0, pixelPunch: 0, deadlineDrive: 0 };

        if (supabaseClient) {
            try {
                const { error } = await supabaseClient.from('profiles').upsert({
                    username: tempUsername,
                    password: tempPassword,
                    avatar: tempAvatar,
                    activity: tempActivity,
                    role: tempRole,
                    stats: defaultStats
                });

                if (error) {
                    alert("Errore registrazione Supabase: " + error.message);
                    return;
                }
            } catch (e) {
                alert("Errore durante il salvataggio su Supabase!");
                return;
            }
        }

        let users = getUsers();
        users[tempUsername] = { 
            password: tempPassword, 
            avatar: tempAvatar, 
            activity: tempActivity,
            role: tempRole,
            stats: defaultStats 
        };
        localStorage.setItem('arcade_users', JSON.stringify(users));

        const newUser = { 
            username: tempUsername, 
            avatar: tempAvatar, 
            activity: tempActivity,
            role: tempRole,
            stats: defaultStats 
        };
        localStorage.setItem('arcade_current_user', JSON.stringify(newUser));

    } else if (stepData.type === "finish") {
        sessionStorage.setItem('arcade_session_active', 'true');
        window.location.replace("index.html"); 
        return;
    }

    currentStepIdx++;
    if (currentStepIdx < DIALOGUE_STEPS.length) {
        renderStep();
    } else {
        sessionStorage.setItem('arcade_session_active', 'true');
        window.location.replace("index.html"); 
    }
}

stepBtn.onclick = advanceStep;

function typeWriter(text, onComplete) {
    isTyping = true;
    stepBtn.disabled = true;

    dialogueText.textContent = "";
    let i = 0;
    const speed = 18;

    function type() {
        if (i < text.length) {
            dialogueText.textContent += text.charAt(i);
            i++;
            setTimeout(type, speed);
        } else {
            if (onComplete) onComplete();
            setTimeout(() => {
                isTyping = false;
                stepBtn.disabled = false;
            }, 300);
        }
    }
    type();
}
</script>
